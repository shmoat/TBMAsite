                              ))}
                            </div>

                            {currentUser && (
                              <div className="space-y-1.5 pt-1">
                                {repComm[post.id] && <div className="flex justify-between px-3 py-1 rounded bg-sky-950/60 text-[11px] text-sky-200"><span>↩️ ตอบกลับ {repComm[post.id].labelNum || getAuthor(repComm[post.id].authorId).displayName}</span><button onClick={() => setRepComm({ ...repComm, [post.id]: null })}>✕</button></div>}
                                <div className="flex flex-col gap-2">
                                    <div className="flex gap-2 items-end">
                                        <textarea rows={1} value={cInputs[post.id] || ''} onChange={(e) => setCInputs({ ...cInputs, [post.id]: e.target.value })} onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleAddComment(post.id, null); } }} placeholder="แสดงความคิดเห็น..." className="flex-1 inp text-xs resize-none max-h-24" />
                                        <button onClick={() => handleAddComment(post.id, null)} className="btn-b text-xs">ส่ง</button>
                                    </div>
                                    <div className="flex items-center gap-1.5">
                                      <input type="file" multiple id={`file-upload-${post.id}`} onChange={async (e) => { const fl = Array.from(e.target.files || []); e.target.value = ''; for (const f of fl) { try { const a = await uploadChunked(f); handleAddComment(post.id, a); } catch (err) { alert(err.message); } } }} className="hidden" />
                                      <button type="button" onClick={() => document.getElementById(`file-upload-${post.id}`)?.click()} className="btn-d py-1 text-[10px]"><UpIcon />แนบไฟล์</button>
                                      <button type="button" onClick={() => { const u = prompt("ใส่ลิงก์รูปภาพ หรือ วิดีโอ"); if(u) { handleAddComment(post.id, { id: 'att-' + Date.now(), name: 'Link', type: 'image', url: u, size: 'URL' }); } }} className="btn-d py-1 text-[10px]">🔗 แนบลิงก์</button>
                                    </div>
                                </div>
                              </div>
                            )}
                          </div>
                        </article>
                  );
                })}
                
                {posts.filter(p => p.id === sharedPostId).length === 0 && (
                  <div className="card p-10 text-center space-y-4">
                     <div className="text-4xl">❌</div>
                     <div className="font-bold text-lg text-slate-300">ไม่พบโพสต์ที่อ้างอิง หรือโพสต์นี้ถูกลบไปแล้ว</div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ASSOCIATION TOOLS VIEW */}
          {currentView === 'tools' && (() => {
              
              const CATEGORY_STYLES = {
                  'ALL': { icon: '🌟', textClass: 'text-slate-100', borderClass: 'border-slate-500' },
                  'Music & Audio': { icon: '🎵', textClass: 'text-fuchsia-400', borderClass: 'border-fuchsia-500/50' },
                  'Civil Engineering': { icon: '🏗️', textClass: 'text-amber-400', borderClass: 'border-amber-500/50' },
                  'Geotechnical': { icon: '🌍', textClass: 'text-emerald-400', borderClass: 'border-emerald-500/50' },
                  'Calculate & Academic': { icon: '🧮', textClass: 'text-sky-400', borderClass: 'border-sky-500/50' },
                  'Community Utilities': { icon: '👥', textClass: 'text-purple-400', borderClass: 'border-purple-500/50' }
              };

              const TOOLS = [
                  { id: 'bpm', category: 'Music & Audio', name: 'Advanced Metronome', icon: '⏱️', desc: 'เคาะความเร็ว ปรับ Time Signature และ Rhythm Subdivision' },
                  { id: 'chords', category: 'Music & Audio', name: 'Chord Studio', icon: '🎹', desc: 'วงล้อ Circle of 5ths และสุ่มคอร์ดตามอารมณ์ (Mood Progression)' },
                  { id: 'tuner', category: 'Music & Audio', name: 'Guitar Tuner', icon: '🎸', desc: 'เทียบเสียงสายกีตาร์และเบส ด้วยการจับคลื่นเสียงไมโครโฟน' },
                  { id: 'transposer', category: 'Music & Audio', name: 'Chord Transposer', icon: '🎼', desc: 'เครื่องมือทดคีย์เพลง แปลงคอร์ดยกแผง' },
                  { id: 'rhyme', category: 'Music & Audio', name: 'Rhyme Finder', icon: '✍️', desc: 'ตัวช่วยนักแต่งเพลง หาคำคล้องจองสระ-ตัวสะกด ทั้งไทยและอังกฤษ' },
                  { id: 'beam', category: 'Civil Engineering', name: 'Beam Calculator', icon: '🏗️', desc: 'คำนวณโมเมนต์และแรงเฉือนสูงสุดของคานแบบง่าย' },
                  { id: 'rc_design', category: 'Civil Engineering', name: 'RC Beam Design', icon: '📏', desc: 'ออกแบบและคำนวณปริมาณเหล็กเสริมคาน (USD)' },
                  { id: 'steel_table', category: 'Civil Engineering', name: 'Steel Table', icon: '🏭', desc: 'ตารางคุณสมบัติเหล็กรูปพรรณ (H-Beam)' },
                  { id: 'concrete', category: 'Civil Engineering', name: 'Concrete Mix', icon: '🧱', desc: 'คำนวณปริมาตรคอนกรีตเผื่อ SF และประเมินวัสดุ' },
		  { id: 'soil_phase', category: 'Geotechnical', name: '3-Phase Diagram', icon: '🌍', desc: 'คำนวณความสัมพันธ์มวลดิน (Void ratio, Saturation)' },
                  { id: 'mohr_circle', category: 'Geotechnical', name: 'Soil Strength', icon: '📉', desc: 'วิเคราะห์หากำลังรับแรงเฉือนดิน (c, φ) และ Mohr Circle' },
                  { id: 'converter', category: 'Calculate & Academic', name: 'Unit Converter', icon: '⚖️', desc: 'แปลงหน่วยทางวิศวกรรม (แรง, ความดัน, อุณหภูมิ)' },
                  { id: 'solver', category: 'Calculate & Academic', name: 'Equation Solver', icon: '🧮', desc: 'เครื่องมือแก้ระบบสมการ 2 ตัวแปร' },
                  { id: 'resistor', category: 'Calculate & Academic', name: 'Resistor Calc', icon: '🔌', desc: 'คำนวณค่าความต้านทานจาก 4 แถบสี' },
                  { id: 'splitter', category: 'Community Utilities', name: 'Lunar Splitter', icon: '💸', desc: 'หารบิลคำนวณ VAT/Service Charge อย่างยุติธรรม' },
                  { id: 'randomizer', category: 'Community Utilities', name: 'Randomizer', icon: '🎲', desc: 'สุ่มรายชื่อสมาชิกหรือหัวข้อสนทนา' },
              ];
              
              const toolCategories = ['ALL', ...Array.from(new Set(TOOLS.map(t => t.category)))];

              const filteredTools = TOOLS.filter(t => {
                  const matchSearch = t.name.toLowerCase().includes(toolSearchQ.toLowerCase()) || 
                                      t.desc.toLowerCase().includes(toolSearchQ.toLowerCase()) ||
                                      t.category.toLowerCase().includes(toolSearchQ.toLowerCase());
                  const matchCategory = activeCategory === 'ALL' || t.category === activeCategory;
                  return matchSearch && matchCategory;
              });

              return (
                  <div className="max-w-7xl mx-auto w-full px-4 py-6 space-y-5 flex-1 overflow-y-auto">
                      {!activeTool ? (
                          <>
                              <div className="text-center">
                                  <h2 className="text-2xl font-bold text-sky-400">🛠️ Association Tools</h2>
                                  <p className="text-xs text-slate-400 mt-1">เครื่องมือและสาธารณูปโภคสำหรับสมาชิก</p>
                              </div>

                              <div className="max-w-md mx-auto relative mt-4">
                                  <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">🔍</span>
                                  <input 
                                      type="text" 
                                      placeholder="ค้นหาเครื่องมือ..." 
                                      value={toolSearchQ}
                                      onChange={(e) => setToolSearchQ(e.target.value)}
                                      className="w-full bg-[#0B1325] border border-[#1E3A5F] rounded-full py-2.5 pl-9 pr-4 text-sm text-white focus:outline-none focus:border-sky-500 transition-colors shadow-inner"
                                  />
                              </div>

                              <div className="flex gap-2 overflow-x-auto no-scrollbar py-2 mt-4 px-1">
                                  {toolCategories.map(cat => {
                                      const style = CATEGORY_STYLES[cat] || { icon: '🔧', textClass: 'text-sky-300', borderClass: 'border-sky-500/50' };
                                      const isSelected = activeCategory === cat;
                                      
                                      return (
                                          <button 
                                              key={cat}
                                              onClick={() => setActiveCategory(cat)}
                                              className={`px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-all flex items-center gap-1.5 shadow-sm border ${isSelected ? `bg-[#0B1325] ${style.borderClass} ${style.textClass} scale-105 shadow-[0_0_10px_rgba(255,255,255,0.1)]` : 'bg-[#050811] border-[#1E3A5F] text-slate-400 hover:bg-[#0F2547] hover:border-slate-500'}`}
                                          >
                                              <span className="text-sm">{style.icon}</span>
                                              {cat === 'ALL' ? 'ทั้งหมด (All)' : cat}
                                          </button>
                                      );
                                  })}
                              </div>

                              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 pb-10 mt-2">
                                  {filteredTools.map(tool => {
                     	                 // ดึงสไตล์ของหมวดหมู่มาใช้
                                      const catStyle = CATEGORY_STYLES[tool.category] || { textClass: 'text-sky-400' };
                                      
                                      return (
                                          <button 
                                              key={tool.id} 
                                              onClick={() => setActiveTool(tool.id)}
                                              className={`card p-4 flex flex-col items-start text-left hover:bg-[#0F2547] border border-[#1E3A5F] hover:${catStyle.borderClass} transition-all group`}
                                          >
                                              <div className="flex items-center gap-3 mb-2 w-full">
                                                  <div className="text-3xl bg-[#050811] p-2 rounded-lg border border-[#1E3A5F] group-hover:scale-110 transition-transform">
                                                      {tool.icon}
                                                  </div>
                                                  <div>
                                	                      {/* นำคลาสสีมาปรับใช้กับป้ายกำกับหมวดหมู่ */}
                                                      <div className={`text-[10px] ${catStyle.textClass} font-bold uppercase tracking-wider`}>
                                                          {tool.category}
                                                      </div>
                                                      <h3 className="font-bold text-white text-base">{tool.name}</h3>
                                                  </div>
                                              </div>
                                              <p className="text-xs text-slate-400 line-clamp-2 mt-1 leading-relaxed">{tool.desc}</p>
                                          </button>
                                      );
                                  })}
                                  {filteredTools.length === 0 && (
                                      <div className="col-span-full text-center py-10 text-slate-500 text-sm font-bold bg-[#0B1325] border border-dashed border-[#1E3A5F] rounded-xl">
                                          ❌ ไม่พบเครื่องมือที่ค้นหา
                                      </div>
                                  )}
                              </div>
                          </>
                      ) : (
                          <div className="flex flex-col h-full min-h-0 space-y-4">
                              <div className="flex items-center gap-3 shrink-0 bg-[#0B1325] p-3 rounded-xl border border-[#1E3A5F] shadow-md">
                                  <button 
                                      onClick={() => setActiveTool(null)}
                                      className="btn-d px-4 py-1.5 text-xs font-bold flex items-center gap-1.5 hover:bg-white hover:text-[#050811] transition-colors"
                                  >
                                      ◀ กลับหน้าเมนู
                                  </button>
                                  <h2 className="text-base sm:text-lg font-bold text-sky-300 flex items-center gap-2 border-l border-[#1E3A5F] pl-3">
                                      {TOOLS.find(t => t.id === activeTool)?.icon} 
                                      {TOOLS.find(t => t.id === activeTool)?.name}
                                  </h2>
                              </div>

                              <div className="flex-1 w-full card p-4 sm:p-6 overflow-y-auto bg-[#050811]/50 shadow-inner">
                                  {activeTool === 'bpm' && <BPMTapper />}
                                  {activeTool === 'chords' && <AdvancedChordStudio />}
                                  {activeTool === 'tuner' && <GuitarTuner />}
                                  {activeTool === 'transposer' && <ChordTransposer />}
                                  {activeTool === 'rhyme' && <RhymeFinder />}
                                  {activeTool === 'beam' && <BeamCalculator />}
                                  {activeTool === 'rc_design' && <RCBeamDesign />}
                                  {activeTool === 'steel_table' && <SteelSectionViewer />}
                                  {activeTool === 'concrete' && <ConcreteCalculator />}
				  {activeTool === 'soil_phase' && <SoilPhaseCalculator />}
                                  {activeTool === 'mohr_circle' && <SoilStrengthCalculator />}
                                  {activeTool === 'converter' && <AdvancedUnitConverter />}
                                  {activeTool === 'solver' && <MatrixSolver />}
                                  {activeTool === 'resistor' && <ResistorCalcReal />}
                                  {activeTool === 'splitter' && <LunarSplitter />}
                                  {activeTool === 'randomizer' && <Randomizer />}
                              </div>
                          </div>
                      )}
                  </div>
              );
          })()}

          {/* MAIN POST BOARD / BOOKMARKS / ADMIN VIEW */}
          {(currentView === 'feed' || currentView === 'bookmarks' || currentView === 'admin') && (
            <div className="max-w-7xl mx-auto w-full px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1 min-h-0">
    
              <aside className="lg:col-span-4 xl:col-span-3 space-y-4 overflow-y-auto h-full pr-2">
                {!currentUser ? (
                  <div className="card p-4 text-xs text-slate-300 bg-[#0B1325] border-[#1E3A5F]">
                    <div className="font-bold text-white mb-1">👁️ โหมดผู้มาเยือน (Guest)</div>
                    แสดงเฉพาะโพสต์ที่อนุญาตให้อ่านได้
                  </div>
                ) : (
                  <div className="card p-5 flex flex-col items-center text-center space-y-3 relative overflow-hidden bg-[#0B1325] border-[#1E3A5F]">
                    <div className="absolute top-0 left-0 w-full h-24 bg-gradient-to-b from-[#1E3A5F]/80 via-[#0F2547]/50 to-transparent opacity-80"></div>
                    <div className="relative z-10 mt-2"><Avatar user={currentUser} size="lg" showStatus={true} /></div>
                    <div className="relative z-10">
                      <h3 className="font-bold text-base flex items-center justify-center gap-1.5">{currentUser.displayName} <RoleBadge role={currentUser.role} /></h3>
                      <p className="text-[11px] font-mono text-slate-400 mt-0.5">@{currentUser.username} • {currentUser.id}</p>
                    </div>
                    <div className="relative z-10 w-full pt-3 border-t border-[#1E3A5F] flex justify-center">
                      <TagBadges user={currentUser} />
                    </div>
                  </div>
                )}
                
                <div className="card p-2 space-y-1 text-xs">
                  {currentView === 'admin' ? (
                    <button className="w-full flex justify-between items-center px-4 py-2.5 rounded-xl font-bold bg-white text-[#050811] shadow-md cursor-default">
                      <span>👑 หน้าจัดการสมาชิก (Owner)</span>
                    </button>
                  ) : (
                    <>
                      <button onClick={() => { setSearchQ(''); setCurrentView('feed'); }} className={currentView === 'feed' && searchQ !== currentUser?.id ? 'w-full flex justify-between items-center px-4 py-2.5 rounded-xl font-bold bg-white text-[#050811] shadow-md' : 'w-full flex justify-between items-center px-4 py-2.5 rounded-xl hover:bg-[#0F2547] text-slate-300 hover:text-white transition-colors'}>
                        <span>📝 กระดานโพสต์รวม</span>
                      </button>
                      
                      {currentUser && (
                        <button onClick={() => { setSearchQ(currentUser.id); setCurrentView('feed'); }} className={currentView === 'feed' && searchQ === currentUser.id ? 'w-full flex justify-between items-center px-4 py-2.5 rounded-xl font-bold bg-sky-500 text-white shadow-lg' : 'w-full flex justify-between items-center px-4 py-2.5 rounded-xl hover:bg-[#0F2547] text-slate-300 hover:text-white transition-colors'}>
                          <span>👤 โพสต์ของฉัน</span>
                          <span className="bg-[#050811] px-2 py-0.5 rounded-full border border-[#1E3A5F] font-mono">{posts.filter((p) => p.authorId === currentUser.id).length}</span>
                        </button>
                      )}
                      
                      {currentUser && (
                        <div className="flex flex-col gap-1.5 w-full mt-3 pt-3 border-t border-[#1E3A5F]/50">
                            <button onClick={() => { setCurrentView('feed'); setFilterType('ALL'); setFilterLatestOnly(false); setTagFilter('ALL'); setSearchQ(''); }} className={`w-full flex justify-start items-center px-4 py-2.5 rounded-xl font-bold transition-colors ${currentView === 'feed' && filterType === 'ALL' && !filterLatestOnly && tagFilter === 'ALL' && searchQ === '' ? 'bg-white text-[#050811] shadow-md' : 'hover:bg-[#0F2547] text-slate-300 hover:text-white'}`}>
                                📖 โพสต์ทั้งหมด
                            </button>
                      
                            <button onClick={() => setCurrentView('bookmarks')} className={`w-full flex justify-start items-center px-4 py-2.5 rounded-xl font-bold transition-colors ${currentView === 'bookmarks' ? 'bg-amber-400 text-[#050811] shadow-md' : 'hover:bg-[#0F2547] text-slate-300 hover:text-white'}`}>
                                ⭐ โพสต์ที่บันทึก
                            </button>
                      
                            <button onClick={() => setShowCalendar(true)} className="w-full flex justify-start items-center px-4 py-2.5 rounded-xl font-bold border border-sky-500/50 bg-sky-950/30 text-sky-300 hover:bg-sky-600 hover:text-white hover:border-sky-400 transition-colors shadow-sm mt-1">
                                📅 ปฏิทินสมาคม
                            </button>
                        </div>
                      )}
                    </>
                  )}
                </div>
              </aside>

              <main 
                onScroll={(e) => { 
                  const { scrollTop, scrollHeight, clientHeight } = e.target; 
                  if (scrollHeight - scrollTop <= clientHeight + 200 && visiblePosts < filteredPosts.length) { 
                    setVisiblePosts(v => v + 10); 
                  } 
                }} 
                className="lg:col-span-8 xl:col-span-9 space-y-4 pb-10 overflow-y-auto h-full pr-2 custom-scrollbar"
              >
                {/* ใช้งานคอมโพเนนต์ที่แยกออกมา */}
                {currentView === 'admin' && currentUser?.role === 'admin' ? (
  		  <OwnerPage 
		    users={users} 
		    posts={posts} 
		    chatMessages={chatMessages} 
		    groups={groups} 
		    bmaEvents={bmaEvents} 
		    allTags={allTags} 
		    db={db} 
		    getTags={getTags} 
		    setMemberModal={setMemberModal} 
		  />
		) : (
		  <BoardPage 
                    currentUser={currentUser} searchQ={searchQ} setSearchQ={setSearchQ} 
                    setVisiblePosts={setVisiblePosts} setCreatePost={setCreatePost}
                    filterMenuOpen={filterMenuOpen} setFilterMenuOpen={setFilterMenuOpen} 
                    tagFilter={tagFilter} setTagFilter={setTagFilter} allTags={allTags} 
                    filterType={filterType} setFilterType={setFilterType} 
                    filterLatestOnly={filterLatestOnly} setFilterLatestOnly={setFilterLatestOnly} 
                    filteredPosts={filteredPosts} visiblePosts={visiblePosts} hiPostId={hiPostId} 
                    getAuthor={getAuthor} setMemberModal={setMemberModal} postMenu={postMenu} 
                    setPostMenu={setPostMenu} db={db} handleEditPostReq={handleEditPostReq} 
                    setCurrentView={setCurrentView} setActiveGameTab={setActiveGameTab} 
                    GAMES={GAMES} fmtTime={fmtTime} toggleCommLike={toggleCommLike} 
                    repComm={repComm} setRepComm={setRepComm} setCommMenu={setCommMenu} 
                    cInputs={cInputs} setCInputs={setCInputs} handleAddComment={handleAddComment}
                  />
                )}
              </main>
            </div>
          )}

          {/* ADMIN AND GROUPS MODALS */}
          {addMemOpen && activeGrp && (
            <Modal title={'👥 แก้ไขสมาชิกกลุ่ม: ' + activeGrp.name} onClose={() => setAddMemOpen(false)}>
              <div className="space-y-4 max-h-80 overflow-y-auto text-xs custom-scrollbar">
                <div>
                  <h4 className="font-bold text-sky-300 mb-2">สมาชิกในกลุ่ม ({(activeGrp.members || []).length})</h4>
                  <div className="space-y-2">
                    {activeMembers.filter((m) => (activeGrp.members || []).includes(m.id)).map((m) => (
                      <div key={m.id} className="p-2.5 rounded-xl bg-[#050811] border border-[#1E3A5F] flex justify-between items-center">
                        <div className="flex items-center gap-2"><Avatar user={m} size="xs" /><span>{m.displayName} ({m.id})</span></div>
                        <div className="flex gap-2">
                          {m.id === activeGrp.createdBy && <span className="text-amber-400 text-[10px] self-center font-bold">👑 ผู้สร้าง</span>}
                          {m.id !== activeGrp.createdBy && m.id !== currentUser?.id && (
                            <button onClick={() => db.collection('bma_groups').doc(activeGrp.id).update({ members: (activeGrp.members || []).filter(id => id !== m.id) })} className="text-red-400 font-bold bg-red-950/50 px-2 py-1 rounded hover:bg-red-900 transition-colors">ลบออก</button>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
                <div>
                  <h4 className="font-bold text-emerald-300 mb-2">เพิ่มสมาชิกใหม่</h4>
                  <div className="space-y-2">
                    {activeMembers.filter((m) => !(activeGrp.members || []).includes(m.id)).map((m) => (
                      <div key={m.id} className="p-2.5 rounded-xl bg-[#050811] border border-[#1E3A5F] flex justify-between items-center">
                        <div className="flex items-center gap-2"><Avatar user={m} size="xs" /><span>{m.displayName} ({m.id})</span></div>
                        <button onClick={() => db.collection('bma_groups').doc(activeGrp.id).update({ members: Array.from(new Set([...(activeGrp.members || []), m.id])) })} className="btn-w py-1 text-[10px] hover:scale-105 transition-transform">+ ดึงเข้ากลุ่ม</button>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </Modal>
          )}

          {cGrpOpen && (
            <Modal title="👥 สร้างกลุ่มแชตใหม่" onClose={() => { setCGrpOpen(false); setGrpName(''); setGrpMems([]); }}>
              <form onSubmit={async (e) => { e.preventDefault(); if(!grpName.trim() || grpMems.length === 0) return alert('กรุณาตั้งชื่อกลุ่มและเลือกสมาชิกอย่างน้อย 1 คน'); const id = 'grp-' + Date.now(); await db.collection('bma_groups').doc(id).set({ id, name: grpName.trim(), members: [currentUser.id, ...grpMems], createdBy: currentUser.id, isArchived: false, timestamp: Date.now(), serverCreatedAt: svrTs() }); setCGrpOpen(false); setGrpName(''); setGrpMems([]); setActiveRoom({type: 'group', id}); }} className="space-y-3 text-xs">
                <input type="text" value={grpName} onChange={(e) => setGrpName(e.target.value)} placeholder="ตั้งชื่อกลุ่ม..." className="w-full inp" required />
                <div className="card p-2 max-h-48 overflow-y-auto space-y-1">
                   <div className="text-slate-400 mb-1 px-1">เลือกสมาชิก:</div>
                   {activeMembers.filter(m => m.id !== currentUser.id).map(m => (
                     <label key={m.id} className="flex items-center gap-2 p-1.5 hover:bg-[#0F2547] rounded cursor-pointer">
                       <input type="checkbox" checked={grpMems.includes(m.id)} onChange={(e) => { if(e.target.checked) setGrpMems([...grpMems, m.id]); else setGrpMems(grpMems.filter(x => x !== m.id)); }} />
                       <Avatar user={m} size="xs" /> <span>{m.displayName} ({m.id})</span>
                     </label>
                   ))}
                </div>
                <button type="submit" className="w-full btn-w py-2">สร้างกลุ่มแชต</button>
              </form>
            </Modal>
          )}

          {cChOpen && isModOrAdmin && (
            <Modal title="💬 สร้างห้องแชตรวมใหม่" onClose={() => { setCChOpen(false); setChName(''); setChIcon('💬'); setChDesc(''); }}>
              <form onSubmit={async (e) => { e.preventDefault(); if(!chName.trim()) return; const id = 'ch-' + Date.now(); await db.collection('bma_channels').doc(id).set({ id, name: chName.trim().replace(/\s+/g, '-').toLowerCase(), icon: chIcon, desc: chDesc.trim(), createdBy: currentUser.id, isProtected: false, isSystemReadOnly: false, timestamp: Date.now(), serverCreatedAt: svrTs() }); setCChOpen(false); setChName(''); setChIcon('💬'); setChDesc(''); setActiveRoom({type: 'channel', id}); }} className="space-y-3 text-xs">
                <div className="flex gap-2">
                   <input type="text" value={chIcon} onChange={(e) => setChIcon(e.target.value)} className="inp w-16 text-center text-lg" placeholder="อีโมจิ" required />
                   <input type="text" value={chName} onChange={(e) => setChName(e.target.value)} placeholder="ชื่อห้องแชต (เช่น general-talk)..." className="flex-1 inp font-mono" required />
                </div>
                <input type="text" value={chDesc} onChange={(e) => setChDesc(e.target.value)} placeholder="คำอธิบายห้องแชตสั้น ๆ ..." className="w-full inp" />
                <button type="submit" className="w-full btn-w py-2">สร้างห้องแชต</button>
              </form>
            </Modal>
          )}

          {fwdMsg && (
            <Modal title="↪️ ส่งต่อข้อความ / ไฟล์" onClose={() => setFwdMsg(null)}>
              <div className="max-h-64 overflow-y-auto space-y-1.5 text-xs">
                {channels.filter((c) => !c.isSystemReadOnly).map((c) => <button key={c.id} onClick={async () => { const now = Date.now(), id = 'msg-' + now; await db.collection('bma_messages').doc(id).set({ id, roomKey: c.id, senderId: currentUser.id, text: fwdMsg.mediaItem ? '↪️ [ส่งต่อไฟล์]' : '↪️ ' + fwdMsg.message.text, attachments: fwdMsg.mediaItem ? [fwdMsg.mediaItem] : (fwdMsg.message.attachments || []), likes: [], readBy: [currentUser.id], time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }), timestamp: now, serverCreatedAt: svrTs() }); setFwdMsg(null); setActiveRoom({ type: 'channel', id: c.id }); }} className="w-full flex justify-between p-2 rounded-xl bg-[#050811] border border-[#1E3A5F]"><span>{c.icon} # {c.name}</span><span className="font-bold">ส่งต่อ</span></button>)}
                {activeMembers.filter((m) => m.id !== currentUser?.id).map((m) => <button key={m.id} onClick={async () => { const now = Date.now(), id = 'msg-' + now; await db.collection('bma_messages').doc(id).set({ id, roomKey: dmKey(currentUser.id, m.id), senderId: currentUser.id, receiverId: m.id, text: fwdMsg.mediaItem ? '↪️ [ส่งต่อไฟล์]' : '↪️ ' + fwdMsg.message.text, attachments: fwdMsg.mediaItem ? [fwdMsg.mediaItem] : (fwdMsg.message.attachments || []), likes: [], readBy: [currentUser.id], time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }), timestamp: now, serverCreatedAt: svrTs() }); setFwdMsg(null); setActiveRoom({ type: 'dm', id: m.id }); }} className="w-full flex justify-between p-2 rounded-xl bg-[#050811] border border-[#1E3A5F]"><span>{m.displayName} ({m.id})</span><span className="font-bold">ส่งต่อ</span></button>)}
              </div>
            </Modal>
          )}

          {notifOpen && currentUser && (
            <Modal title="🔔 การแจ้งเตือน" onClose={() => setNotifOpen(false)} maxW="max-w-lg">
              <div className="space-y-3 text-xs">
                <div className="flex justify-between items-center p-2.5 rounded-xl bg-[#050811] border border-[#1E3A5F]"><span>📱 แจ้งเตือนอุปกรณ์: {pushPerm === 'granted' ? '✓ เปิดแล้ว' : 'ยังไม่เปิด'}</span>{pushPerm !== 'granted' && <button onClick={async () => { if (typeof Notification !== 'undefined') setPushPerm(await Notification.requestPermission()); }} className="btn-w py-1">ขออนุญาต</button>}</div>
                <div className="flex justify-between">
                  <div className="flex gap-1 overflow-x-auto no-scrollbar">{[['posts', '📝 โพสต์'], ['messages', '💬 ข้อความ'], ['members', '👥 สมาชิกใหม่'], ['settings', '🔕 ตั้งค่า']].map(([k, l]) => <button key={k} onClick={() => setNotifTab(k)} className={notifTab === k ? 'px-2.5 py-1 rounded-lg font-bold bg-white text-[#050811] shrink-0' : 'px-2.5 py-1 rounded-lg bg-[#050811] shrink-0'}>{l}</button>)}</div>
                  {notifTab !== 'settings' && <button onClick={() => unreadNotifs.forEach((n) => db.collection('bma_notifications').doc(n.id).update({ readBy: Array.from(new Set([...(n.readBy || []), currentUser.id])) }))} className="text-sky-300 font-bold">✓ อ่านแล้วทั้งหมด</button>}
                </div>
                {notifTab === 'settings' ? (
                  <div className="space-y-2">{[['muteOwnPosts', 'ปิดแจ้งเตือนโพสต์ตนเอง'], ['muteGlobalChat', 'ปิดแจ้งเตือนช่องหลัก'], ['mutePrivateChat', 'ปิดแจ้งเตือนแชตกลุ่ม/ส่วนตัว']].map(([k, l]) => <div key={k} className="p-2.5 rounded-xl bg-[#050811] border border-[#1E3A5F] flex justify-between items-center"><span>{l}</span><button onClick={() => db.collection('bma_users').doc(currentUser.id).update({ notifPrefs: { ...(currentUser.notifPrefs || {}), [k]: !currentUser.notifPrefs?.[k] } })} className={currentUser.notifPrefs?.[k] ? 'px-2.5 py-1 rounded bg-red-600 font-bold' : 'btn-b py-1'}>{currentUser.notifPrefs?.[k] ? '🔕 ปิดอยู่' : '🔔 เปิดอยู่'}</button></div>)}</div>
                ) : (
                  <div className="max-h-64 overflow-y-auto space-y-1.5 custom-scrollbar">
                    {myNotifs.filter((n) => n.category === notifTab).map((n) => {
                      const rd = (n.readBy || []).includes(currentUser.id);
                      return <div key={n.id} onClick={() => { db.collection('bma_notifications').doc(n.id).update({ readBy: Array.from(new Set([...(n.readBy || []), currentUser.id])) }); setNotifOpen(false); if (n.targetPostId) jumpToPost(n.targetPostId); else if (n.targetRoomType) { setActiveRoom({ type: n.targetRoomType, id: n.targetRoomId }); setCurrentView('chat'); } else if (n.targetView === 'members') { setCurrentView('members'); setMemberModal(users.find(u => u.id === n.targetRoomId) || null); } }} className={'p-2.5 rounded-xl border cursor-pointer flex justify-between items-center ' + (rd ? 'bg-[#050811] border-[#1E3A5F] opacity-60' : 'bg-[#0F2547]/70 border-sky-400')}><div><div className="font-bold">{!rd && '● '}{n.title}</div><div className="text-slate-300">{n.body}</div></div><div className="flex items-center gap-2"><span className="text-sky-400 shrink-0">ดู →</span>{rd && <button onClick={(e) => { e.stopPropagation(); db.collection('bma_notifications').doc(n.id).delete(); }} className="text-red-400 px-2 py-1 bg-red-950/50 rounded hover:bg-red-900 font-bold ml-1">🗑️ ลบ</button>}</div></div>;
                    })}
                  </div>
                )}
              </div>
            </Modal>
          )}

          {memberModal && (
            <Modal title="โปรไฟล์สมาชิก" onClose={() => setMemberModal(null)}>
              <div className="flex flex-col items-center text-center space-y-3">
                <Avatar user={memberModal} size="xl" showStatus={true} />
                <div>
                  <h3 className="text-lg font-bold flex justify-center items-center gap-1.5">{memberModal.displayName} <RoleBadge role={memberModal.role} /></h3>
                  <p className="text-sm font-mono text-slate-400">@{memberModal.username} • {memberModal.id}</p>
                </div>
                <TagBadges user={memberModal} />
                
                {memberModal.birthDate && (
                   <div className="px-3 py-1.5 bg-[#0F2547] border border-[#1E3A5F] rounded-full text-xs font-bold text-sky-300 shadow-md">
                     🎂 วันเกิด: {new Date(memberModal.birthDate).toLocaleDateString('th-TH', { day: 'numeric', month: 'long' })}
                   </div>
                )}
                
                <div className="w-full bg-[#050811] p-3 rounded-xl border border-[#1E3A5F] text-sm text-slate-200 mt-2">
                  {memberModal.bio || 'ยังไม่มีคำแนะนำตัว'}
                </div>
                <div className="flex gap-2 w-full mt-2">
                  {currentUser && currentUser.id !== memberModal.id && (
                     <button onClick={() => { setActiveRoom({ type: 'dm', id: memberModal.id }); setCurrentView('chat'); setMemberModal(null); }} className="flex-1 btn-b py-2 shadow hover:scale-105 transition-transform">💬 ส่งข้อความส่วนตัว</button>
                  )}
                </div>
              </div>
            </Modal>
          )}

          {editProf && currentUser && (
            <Modal title="ตั้งค่าโปรไฟล์ & โซเชียล" onClose={() => setEditProf(false)} maxW="max-w-lg">
              <form onSubmit={handleSaveProfile} className="space-y-3 text-xs">
                <div className="flex items-center gap-3 p-2.5 rounded-xl bg-[#050811] border border-[#1E3A5F]">
                    <Avatar user={{ ...currentUser, displayName: eName, avatarUrl: eAv }} size="md" />
                    <input type="file" accept="image/*" ref={avRef} onChange={(e) => { 
                        const f = e.target.files?.[0]; 
                        if (f) {
                            const r = new FileReader();
                            r.onload = (ev) => {
                                const img = new Image();
                                img.onload = () => setCropState({ img, zoom: 1, rot: 0, x: 50, y: 50 });
                                img.src = ev.target.result;
                            };
                            r.readAsDataURL(f);
                        }
                        e.target.value = '';
                    }} className="hidden" />
                    <button type="button" onClick={() => avRef.current?.click()} className="btn-w py-1.5"><UpIcon />เปลี่ยนรูปโปรไฟล์</button>
                </div>
                
                <div className="grid grid-cols-2 gap-2">
                  <div><label className="block mb-1 text-slate-400 font-bold">ชื่อที่แสดง *</label><input type="text" value={eName} onChange={(e) => setEName(e.target.value)} className="w-full inp" required /></div>
                  <div><label className="block mb-1 text-slate-400 font-bold">Username ({Math.max(0, 2 - recentChg(currentUser).length)}/2 ใน 14 วัน)</label><input type="text" value={eUser} onChange={(e) => setEUser(e.target.value)} className="w-full inp font-mono" required /></div>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                      <label className="block mb-1 text-slate-400 font-bold">รหัสผ่าน *</label>
                      <div className="relative flex items-center"><input type={showPass ? 'text' : 'password'} value={ePass} onChange={(e) => setEPass(e.target.value)} className="w-full inp pr-16 font-mono" required /><button type="button" onClick={() => setShowPass(!showPass)} className="absolute right-2 px-2 py-0.5 rounded bg-[#0B1325] text-[10px]">{showPass ? '🙈 ซ่อน' : '👁️ ดู'}</button></div>
                  </div>
                  <div><label className="block mb-1 text-slate-400 font-bold">วันเกิด</label><input type="date" value={eBd} onChange={(e) => setEBd(e.target.value)} className="w-full inp font-mono text-slate-300" /></div>
                </div>
                <div><label className="block mb-1 text-slate-400 font-bold">คำแนะนำตัว (Bio)</label><textarea rows={2} value={eBio} onChange={(e) => setEBio(e.target.value)} placeholder="เขียนคำอธิบายตัวเองสั้นๆ..." className="w-full inp" /></div>
                
                <div className="p-2.5 rounded-xl bg-[#050811] border border-[#1E3A5F] space-y-2 mt-2">
                  <label className="block text-slate-400 font-bold mb-1">🔗 ช่องทางการติดตาม (Social Links)</label>
                  <div className="flex gap-1"><select value={sPlat} onChange={(e) => setSPlat(e.target.value)} className="bg-[#0B1325] border border-[#1E3A5F] rounded px-1.5 py-1 shrink-0">{SOCIALS.map((s) => <option key={s.id} value={s.id}>{s.icon} {s.id}</option>)}</select><input type="text" value={sLbl} onChange={(e) => setSLbl(e.target.value)} placeholder="ชื่อปุ่ม..." className="w-20 sm:w-24 min-w-0 bg-[#0B1325] border border-[#1E3A5F] rounded px-2 py-1 shrink-0 outline-none focus:border-sky-500" /><input type="text" value={sUrl} onChange={(e) => setSUrl(e.target.value)} placeholder="URL..." className="flex-1 min-w-0 bg-[#0B1325] border border-[#1E3A5F] rounded px-2 py-1 outline-none focus:border-sky-500" /><button type="button" onClick={() => { if (sUrl.trim()) { setESocs([...eSocs, { id: 's-' + Date.now(), platform: sPlat, label: sLbl.trim() || sPlat, url: safeUrl(sUrl) }]); setSUrl(''); setSLbl(''); } }} className="btn-w py-1 shrink-0">เพิ่ม</button></div>
                  {eSocs.map((s) => <div key={s.id} className="flex justify-between px-2 py-1.5 rounded-lg bg-[#0B1325] border border-white/5"><span>{s.label}: <a href={s.url} target="_blank" className="text-sky-400 hover:underline">{s.url}</a></span><button type="button" onClick={() => setESocs(eSocs.filter((x) => x.id !== s.id))} className="text-red-400 font-bold px-2 hover:bg-red-950/50 rounded">ลบ</button></div>)}
                </div>
                {profErr && <div className="p-2 rounded bg-red-950 text-red-200 font-bold">{profErr}</div>}
        	    <div className="pt-3 border-t border-[#1E3A5F] mt-4">
         	      <button type="submit" className="w-full btn-w py-2.5 shadow-lg">💾 บันทึกโปรไฟล์</button>
	            </div>
	          </form>
	        </Modal>
          )}

          {/* CROPPER MODAL */}
          {cropState && (
              <Modal title="✂️ ปรับแต่งรูปโปรไฟล์" onClose={() => setCropState(null)} maxW="max-w-md">
                  <div className="flex flex-col items-center space-y-5">
                      <div className="relative w-48 h-48 sm:w-64 sm:h-64 border-4 border-sky-500/50 rounded-full overflow-hidden bg-black shadow-[0_0_20px_rgba(0,0,0,0.8)] cursor-crosshair">
                          <img src={cropState.img.src} alt="crop-preview" className="absolute pointer-events-none" style={{
                              width: `${cropState.zoom * 100}%`,
                              height: 'auto',
                              minHeight: `${cropState.zoom * 100}%`,
                              objectFit: 'cover',
                              transform: `translate(-50%, -50%) rotate(${cropState.rot}deg)`,
                              left: `${cropState.x}%`,
                              top: `${cropState.y}%`
                          }} />
                          <div className="absolute inset-0 bg-black/20 pointer-events-none rounded-full shadow-[inset_0_0_20px_rgba(0,0,0,0.8)]"></div>
                      </div>
                      
                      <div className="w-full space-y-3.5 text-xs bg-[#050811] p-4 rounded-2xl border border-[#1E3A5F] shadow-inner">
                          <div className="flex items-center gap-3">
                              <span className="w-12 text-slate-400 font-bold">🔍 ซูม:</span>
                              <input type="range" min="0.5" max="3" step="0.1" value={cropState.zoom} onChange={e=>setCropState({...cropState, zoom: parseFloat(e.target.value)})} className="flex-1 accent-sky-500" />
                          </div>
                          <div className="flex items-center gap-3">
                              <span className="w-12 text-slate-400 font-bold">↔️ แกน X:</span>
                              <input type="range" min="0" max="100" value={cropState.x} onChange={e=>setCropState({...cropState, x: parseInt(e.target.value)})} className="flex-1 accent-sky-500" />
                          </div>
                          <div className="flex items-center gap-3">
                              <span className="w-12 text-slate-400 font-bold">↕️ แกน Y:</span>
                              <input type="range" min="0" max="100" value={cropState.y} onChange={e=>setCropState({...cropState, y: parseInt(e.target.value)})} className="flex-1 accent-sky-500" />
                          </div>
                          <div className="flex justify-center gap-2 pt-3 border-t border-[#1E3A5F]">
                              <button onClick={() => setCropState({...cropState, rot: (cropState.rot - 90) % 360})} className="btn-d py-1.5 px-4 flex-1 font-bold text-sky-200">↺ หมุนซ้าย</button>
                              <button onClick={() => setCropState({...cropState, rot: (cropState.rot + 90) % 360})} className="btn-d py-1.5 px-4 flex-1 font-bold text-sky-200">หมุนขวา ↻</button>
                          </div>
                      </div>
                      <button onClick={() => {
                          // ประมวลผลและสร้างรูปภาพใหม่จากค่าที่ตั้งไว้
                          const canvas = document.createElement('canvas');
                          const size = 500; // ขนาดรูป Avatar คุณภาพสูง
                          canvas.width = size; canvas.height = size;
                          const ctx = canvas.getContext('2d');
                          
                          // พื้นหลัง
                          ctx.fillStyle = '#0F2547';
                          ctx.fillRect(0, 0, size, size);
                          
                          ctx.translate(size/2, size/2);
                          ctx.rotate((cropState.rot * Math.PI) / 180);
                          
                          const scale = cropState.zoom;
                          const minDim = Math.min(cropState.img.width, cropState.img.height);
                          const drawW = (cropState.img.width / minDim) * size * scale;
                          const drawH = (cropState.img.height / minDim) * size * scale;
                          
                          const offsetX = ((cropState.x - 50) / 100) * drawW;
                          const offsetY = ((cropState.y - 50) / 100) * drawH;

                          ctx.drawImage(cropState.img, -drawW/2 + offsetX, -drawH/2 + offsetY, drawW, drawH);
                          
                          setEAv(canvas.toDataURL('image/jpeg', 0.9));
                          setCropState(null);
                      }} className="w-full btn-w py-3 font-bold shadow-lg hover:bg-sky-500 hover:text-white transition-colors text-sm">✅ ยืนยันรูปโปรไฟล์</button>
                  </div>
              </Modal>
          )}

          {createPost && (
            <Modal title={editPostData ? "✎ แก้ไขโพสต์" : "เขียนโพสต์ใหม่ / สร้างโพลล์"} onClose={() => { setCreatePost(false); setEditPostData(null); }} maxW="max-w-xl">
              <form onSubmit={handleCreatePost} className="space-y-3 text-xs text-left">
                <input type="text" value={pTitle} onChange={(e) => setPTitle(e.target.value)} placeholder="หัวข้อเรื่อง (ไม่บังคับ)..." className="w-full inp text-sm" />
                <textarea rows={3} value={pCont} onChange={(e) => setPCont(e.target.value)} placeholder="เนื้อหาโพสต์..." className="w-full inp text-sm" />
                <label className="flex items-center justify-between p-2.5 rounded-xl bg-[#050811] border border-[#1E3A5F] cursor-pointer">
                  <span>🌐 อนุญาตให้ผู้มาเยือน (Guest) มองเห็นโพสต์นี้ได้ (ค่าเริ่มต้นเป็นความลับเฉพาะสมาชิก)</span>
                  <input type="checkbox" checked={pGuest} onChange={(e) => setPGuest(e.target.checked)} />
                </label>
                {(currentUser?.role === 'admin' || currentUser?.role === 'mod') && (
                  <label className="flex items-center justify-between p-2.5 rounded-xl bg-[#050811] border border-[#1E3A5F] cursor-pointer mt-2">
                    <span className="font-bold text-amber-300">📌 ปักหมุดโพสต์ไว้บนสุด</span>
                    <input type="checkbox" checked={pPinned} onChange={(e) => setPPinned(e.target.checked)} />
                  </label>
                )}
                <div className="p-3 rounded-xl bg-[#050811] border border-[#1E3A5F] space-y-2 relative">
                  <div className="font-bold">🏷️ เพิ่มแท็กให้โพสต์</div>
                  <div className="flex gap-2">
                      <input type="text" value={tagInput} onChange={e => setTagInput(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); if (tagInput.trim() && !pTags.includes(tagInput.trim())) { setPTags([...pTags, tagInput.trim()]); setTagInput(''); } } }} placeholder="พิมพ์ชื่อแท็ก (เช่น ข่าวสาร, อัปเดต)..." className="flex-1 inp text-xs" />
                      <button type="button" onClick={() => { if(tagInput.trim() && !pTags.includes(tagInput.trim())) { setPTags([...pTags, tagInput.trim()]); setTagInput(''); } }} className="btn-b text-xs px-4 font-bold">+ เพิ่ม</button>
                  </div>
                  {tagInput.trim() && allPostTags.filter(t => t.toLowerCase().includes(tagInput.toLowerCase()) && !pTags.includes(t)).length > 0 && (
                      <div className="absolute top-16 left-3 right-3 bg-[#0B1325] border border-sky-500/50 rounded-lg p-2 z-50 flex flex-wrap gap-1.5 shadow-2xl max-h-32 overflow-y-auto">
                          <div className="w-full text-[10px] text-slate-400 mb-1">แท็กที่มีคนใช้แล้ว (คลิกเพื่อเลือก):</div>
                          {allPostTags.filter(t => t.toLowerCase().includes(tagInput.toLowerCase()) && !pTags.includes(t)).map(t => (
                              <button key={t} type="button" onClick={() => { setPTags([...pTags, t]); setTagInput(''); }} className="px-2 py-1 bg-sky-900/50 hover:bg-sky-600 text-sky-200 rounded text-xs transition-colors border border-sky-800/50">#{t}</button>
                          ))}
                      </div>
                  )}
                  {pTags.length > 0 && (
                      <div className="flex flex-wrap gap-1.5 mt-2 pt-2 border-t border-[#1E3A5F]/50">
                          {pTags.map(t => (
                              <span key={t} className="px-2 py-1 bg-[#1E3A5F] text-white rounded-md text-xs flex items-center gap-1.5 shadow-sm">
                                  #{t} <button type="button" onClick={() => setPTags(pTags.filter(x => x !== t))} className="text-red-400 hover:text-red-300 font-bold bg-black/20 rounded-full w-4 h-4 flex items-center justify-center">✕</button>
                              </span>
                          ))}
                      </div>
                  )}
                </div>
                <div className="p-3 rounded-xl bg-[#050811] border border-[#1E3A5F] space-y-2">
                  <div className="flex justify-between items-center"><span className="font-bold">📊 โพลล์สำรวจความคิดเห็น</span><button type="button" onClick={() => setHasPoll(!hasPoll)} className="btn-b py-1">{hasPoll ? '✓ เปิดโพลล์แล้ว' : '+ เพิ่มโพลล์'}</button></div>
                  {hasPoll && (
                    <div className="space-y-1.5 pt-1.5 border-t border-[#1E3A5F]">
                      <input type="text" value={pollQ} onChange={(e) => setPollQ(e.target.value)} placeholder="คำถามโพลล์ *" className="w-full inp py-1.5" />
                      {pollOpts.map((o, i) => <input key={i} type="text" value={o} onChange={(e) => { const n = [...pollOpts]; n[i] = e.target.value; setPollOpts(n); }} placeholder={'ตัวเลือกที่ ' + (i + 1)} className="w-full inp py-1" />)}
                      <button type="button" onClick={() => setPollOpts([...pollOpts, ''])} className="btn-b py-0.5">+ เพิ่มตัวเลือก</button>
                      <div className="flex justify-between items-center pt-1"><input type="datetime-local" value={pollClose} onChange={(e) => setPollClose(e.target.value)} className="inp py-1" /><label className="flex items-center gap-1 cursor-pointer"><input type="checkbox" checked={pollAnon} onChange={(e) => setPollAnon(e.target.checked)} /> 🕵️ โหวตไม่แสดงชื่อ</label></div>
                    </div>
                  )}
                </div>
                <div className="p-3 rounded-xl bg-[#050811] border border-[#1E3A5F] space-y-2">
                  <div className="flex justify-between items-center">
                    <span>อัปโหลดไฟล์ (สูงสุด 10MB) หรือแนบลิงก์</span>
                    <input type="file" multiple ref={pFileRef} onChange={async (e) => { const fl = Array.from(e.target.files || []); e.target.value = ''; setUploading(true); for (const f of fl) { try { const a = await uploadChunked(f); setPAtts((p) => [...p, a]); } catch (err) { alert(err.message); } } setUploading(false); }} className="hidden" />
                    <button type="button" onClick={() => pFileRef.current?.click()} className="btn-b py-1 font-bold"><UpIcon />อัปโหลดไฟล์</button>
                  </div>
                  {uploading && <div className="text-sky-300 animate-pulse">⏳ กำลังอัปโหลด...</div>}
                  <div className="flex gap-1.5"><select value={aType} onChange={(e) => setAType(e.target.value)} className="inp py-1"><option value="image">รูปภาพ/GIF</option><option value="video">วิดีโอ (Drive/YouTube)</option><option value="audio">เสียง (Audio)</option><option value="file">ไฟล์</option></select><input type="text" value={aUrl} onChange={(e) => setAUrl(e.target.value)} placeholder="วางลิงก์เว็บ, .gif, .mp4..." className="flex-1 inp py-1" /><button type="button" onClick={() => { if (aUrl.trim()) { setPAtts([...pAtts, { id: 'att-' + Date.now(), name: 'Link', type: aType, url: aUrl.trim(), size: 'URL' }]); setAUrl(''); } }} className="btn-w py-1">🔗 แนบลิงก์</button></div>
                  {pAtts.map((a) => <div key={a.id} className="flex justify-between px-2 py-1 rounded bg-[#0B1325]"><span>{a.name}</span><button type="button" onClick={() => setPAtts(pAtts.filter((x) => x.id !== a.id))} className="text-red-400">ลบ</button></div>)}
                </div>
                <button type="submit" className="w-full btn-w py-2.5">{editPostData ? 'บันทึกการแก้ไข' : 'เผยแพร่โพสต์'}</button>
              </form>
            </Modal>
          )}

          {/* HALLOWEEN OVERLAYS */}
          {IS_HALLOWEEN && ghosts.map(g => (
             <div key={g.id} onClick={() => catchGhost(g.id)} className="ghost-hunt" style={{ left: g.x + 'vw', top: g.y + 'vh' }} title="จับผี!">👻</div>
          ))}
          {scareTriggered && (
             <div className="jump-scare-overlay">
                <div className="scare-img">👻</div>
             </div>
          )}

          {/* CHAT GAME / CALENDAR MODALS */}
          {activeChatGameId && (
              <ChatGameModal 
                  gameId={activeChatGameId} 
                  currentUser={currentUser} 
                  onClose={() => setActiveChatGameId(null)} 
                  getAuthor={getAuthor} 
                  db={db} 
                  activeRoom={activeRoom} 
                  roomKey={roomKey} 
              />
          )}

          <AssociationCalendar 
              isOpen={showCalendar} 
              onClose={() => setShowCalendar(false)} 
              events={bmaEvents} 
              currentUser={currentUser} 
              db={db} 
              users={users} 
          />

        </div>
      );
    } // End of App()

    // ==========================================
    // RENDER APPLICATION
    // ==========================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
