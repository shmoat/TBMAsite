        const stone = (totalVol * 1.04).toFixed(2);
        const water = (totalVol * adjWaterPerCube).toFixed(0);

        return (
            <div className="flex flex-col gap-4 py-2 w-full max-w-2xl mx-auto">
                {/* Section 1: Dimensions */}
                <div className="grid grid-cols-3 sm:grid-cols-4 gap-2 bg-[#0B1325] p-4 rounded-xl border border-[#1E3A5F] shadow-inner">
                    <div className="col-span-1"><label className="text-[10px] text-slate-400 font-bold">กว้าง (m)</label><input type="number" min="0" step="0.1" value={w} onChange={e=>setW(parseFloat(e.target.value)||0)} className="w-full inp text-sm font-mono" /></div>
                    <div className="col-span-1"><label className="text-[10px] text-slate-400 font-bold">ยาว (m)</label><input type="number" min="0" step="0.1" value={l} onChange={e=>setL(parseFloat(e.target.value)||0)} className="w-full inp text-sm font-mono" /></div>
                    <div className="col-span-1"><label className="text-[10px] text-slate-400 font-bold">หนา (m)</label><input type="number" min="0" step="0.05" value={t} onChange={e=>setT(parseFloat(e.target.value)||0)} className="w-full inp text-sm font-mono" /></div>
                    <div className="col-span-3 sm:col-span-1"><label className="text-[10px] text-amber-400 font-bold">เผื่อเหลือ (SF %)</label><input type="number" min="0" max="50" value={sf} onChange={e=>setSf(parseFloat(e.target.value)||0)} className="w-full inp text-sm font-mono border-amber-500/50 bg-amber-950/20 text-amber-300" /></div>
                </div>

                {/* Section 2: Concrete Mix Conditions */}
                <div className="bg-[#0B1325] p-4 rounded-xl border border-[#1E3A5F] shadow-inner space-y-3">
                    <div>
                        <label className="text-[10px] text-sky-400 font-bold mb-1 block">สภาพแวดล้อมไซต์งาน (Environment)</label>
                        <select value={env} onChange={e=>setEnv(e.target.value)} className="w-full inp text-sm bg-[#050811]">
                            <option value="normal">สภาวะปกติ (Normal Environment)</option>
                            <option value="marine">สภาวะรุนแรง / ใกล้ทะเล / แช่น้ำ (Marine / High Sulfate)</option>
                        </select>
                        <div className="text-[10px] text-emerald-400 mt-1.5 font-bold">💡 แนะนำ: {cementType}</div>
                    </div>
                    
                    <div className="grid grid-cols-2 gap-4 border-t border-[#1E3A5F] pt-3">
                        <div className="space-y-2">
                            <label className="text-[10px] text-amber-300 font-bold">สภาพทราย (Fine Agg.)</label>
                            <div className="flex items-center gap-2 text-xs">
                                <span className="w-16 text-slate-400">ชื้น (MC%)</span>
                                <input type="number" step="0.1" value={sandMoist} onChange={e=>setSandMoist(parseFloat(e.target.value)||0)} className="flex-1 inp font-mono py-1 px-2" />
                            </div>
                            <div className="flex items-center gap-2 text-xs">
                                <span className="w-16 text-slate-400">ดูดซึม (Abs%)</span>
                                <input type="number" step="0.1" value={sandAbsorp} onChange={e=>setSandAbsorp(parseFloat(e.target.value)||0)} className="flex-1 inp font-mono py-1 px-2" />
                            </div>
                        </div>
                        <div className="space-y-2">
                            <label className="text-[10px] text-slate-300 font-bold">สภาพหิน (Coarse Agg.)</label>
                            <div className="flex items-center gap-2 text-xs">
                                <span className="w-16 text-slate-400">ชื้น (MC%)</span>
                                <input type="number" step="0.1" value={stoneMoist} onChange={e=>setStoneMoist(parseFloat(e.target.value)||0)} className="flex-1 inp font-mono py-1 px-2" />
                            </div>
                            <div className="flex items-center gap-2 text-xs">
                                <span className="w-16 text-slate-400">ดูดซึม (Abs%)</span>
                                <input type="number" step="0.1" value={stoneAbsorp} onChange={e=>setStoneAbsorp(parseFloat(e.target.value)||0)} className="flex-1 inp font-mono py-1 px-2" />
                            </div>
                        </div>
                    </div>
                </div>

                {/* Section 3: Results */}
                <div className="bg-[#050811] rounded-xl border border-[#1E3A5F] overflow-hidden shadow-lg">
                    <div className="p-4 border-b border-[#1E3A5F] bg-gradient-to-r from-emerald-900/40 to-transparent flex justify-between items-center">
                        <div>
                            <div className="text-[10px] text-emerald-400 font-bold uppercase tracking-wider">ปริมาตรคอนกรีตที่ต้องใช้</div>
                            <div className="text-2xl font-bold font-mono mt-1 text-white">{totalVol.toFixed(2)} <span className="text-sm text-slate-400">คิว (m³)</span></div>
                        </div>
                        <div className="text-right text-[10px] text-slate-400">
                            ปริมาตรสุทธิ: <span className="font-mono text-slate-200">{baseVol.toFixed(2)}</span> คิว<br/>
                            เผื่อสูญเสีย ({sf}%): <span className="font-mono text-amber-300">+{(totalVol - baseVol).toFixed(2)}</span> คิว
                        </div>
                    </div>
                    
                    <div className="p-4">
                        <div className="text-xs text-slate-300 mb-3 font-bold flex justify-between items-center">
                            <span>🛒 ประเมินวัสดุผสมหน้างาน (สัดส่วน 1:2:4)</span>
                            {(sandFreeWater + stoneFreeWater) > 0 && <span className="text-[10px] text-sky-400 bg-sky-950/40 px-2 py-0.5 rounded border border-sky-900/50">💧 ลดน้ำลงจากการปรับแก้ความชื้นแล้ว</span>}
                        </div>
                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs text-center">
                            <div className="bg-[#0B1325] p-3 rounded-lg border border-[#1E3A5F]">
                                <div className="text-2xl mb-1">🧱</div><div className="text-[10px] text-slate-400">ปูนซีเมนต์ (50kg)</div>
                                <div className="font-bold font-mono text-sm text-white mt-1">{cementBags} <span className="text-[10px]">ถุง</span></div>
                            </div>
                            <div className="bg-[#0B1325] p-3 rounded-lg border border-[#1E3A5F]">
                                <div className="text-2xl mb-1">🏖️</div><div className="text-[10px] text-slate-400">ทรายหยาบ</div>
                                <div className="font-bold font-mono text-sm text-white mt-1">{sand} <span className="text-[10px]">คิว</span></div>
                            </div>
                            <div className="bg-[#0B1325] p-3 rounded-lg border border-[#1E3A5F]">
                                <div className="text-2xl mb-1">🪨</div><div className="text-[10px] text-slate-400">หิน (เบอร์ 1,2)</div>
                                <div className="font-bold font-mono text-sm text-white mt-1">{stone} <span className="text-[10px]">คิว</span></div>
                            </div>
                            <div className="bg-[#0B1325] p-3 rounded-lg border border-[#1E3A5F]">
                                <div className="text-2xl mb-1">💧</div><div className="text-[10px] text-slate-400">น้ำสะอาด (ปรับแก้แล้ว)</div>
                                <div className="font-bold font-mono text-sm text-sky-300 mt-1">{water} <span className="text-[10px]">ลิตร</span></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        );
    };

    const SoilPhaseCalculator = () => {
        const [mode, setMode] = useState('w_Gs_bulk');
        const [Gs, setGs] = useState(2.65);
        const [w, setW] = useState(15); // %
        const [bulk, setBulk] = useState(1.95); // t/m3
        const [eInput, setEInput] = useState(0.65); 

        let V_s = 1, V_w = 0, V_a = 0, V_v = 0, V_t = 0;
        let W_s = 0, W_w = 0, W_a = 0, W_t = 0;
        let S = 0, n = 0, gamma_d = 0, e = 0, error = '';

        try {
            W_s = Gs * 1; // สมมติให้น้ำหนักจำเพาะของน้ำ = 1 t/m³

            if (mode === 'w_Gs_bulk') {
                e = (Gs * (1 + w / 100)) / bulk - 1;
                if (e < 0) error = '⚠️ ข้อมูลไม่สอดคล้องกัน (e < 0)';
            } else if (mode === 'w_Gs_e') {
                e = eInput;
            }

            if (!error) {
                V_v = e;
                V_t = 1 + e;
                n = e / V_t;
                
                W_w = (w / 100) * W_s;
                V_w = W_w / 1; 
                V_a = V_v - V_w;
                
                if (V_a < -0.001) error = '⚠️ ข้อมูลเป็นไปไม่ได้ (น้ำล้นช่องว่าง S > 100%)';
                if (V_a < 0) V_a = 0; 
                
                S = (V_w / V_v) * 100;
                W_t = W_s + W_w;
                gamma_d = W_s / V_t;
            }
        } catch(err) { error = 'เกิดข้อผิดพลาดในการคำนวณ'; }

        // คำนวณ % ความสูงสำหรับการวาดกราฟิก
        const h_a = (V_a / V_t) * 100;
        const h_w = (V_w / V_t) * 100;
        const h_s = (V_s / V_t) * 100;

        return (
            <div className="flex flex-col gap-4 py-2 w-full max-w-2xl mx-auto">
                <div className="bg-[#0B1325] p-4 rounded-xl border border-[#1E3A5F] shadow-inner space-y-4">
                    <div>
                        <label className="text-xs text-sky-400 font-bold">ข้อมูลที่ทราบค่า (Known Parameters)</label>
                        <select value={mode} onChange={e=>setMode(e.target.value)} className="w-full inp mt-1 text-sm bg-[#050811]">
                            <option value="w_Gs_bulk">ทราบ w, Gs, และ γ (Bulk Unit Weight)</option>
                            <option value="w_Gs_e">ทราบ w, Gs, และ e (Void Ratio)</option>
                        </select>
                    </div>
                    
                    <div className="grid grid-cols-3 gap-3">
                        <div>
                            <label className="text-[10px] text-slate-400 font-bold">Gs (Specific Gravity)</label>
                            <input type="number" min="1" step="0.01" value={Gs} onChange={e=>setGs(parseFloat(e.target.value)||0)} className="w-full inp mt-1 text-sm font-mono" />
                        </div>
                        <div>
                            <label className="text-[10px] text-slate-400 font-bold">w (Water Content, %)</label>
                            <input type="number" min="0" step="0.1" value={w} onChange={e=>setW(parseFloat(e.target.value)||0)} className="w-full inp mt-1 text-sm font-mono" />
                        </div>
                        {mode === 'w_Gs_bulk' ? (
                            <div>
                                <label className="text-[10px] text-slate-400 font-bold">γ (Bulk, t/m³)</label>
                                <input type="number" min="0.1" step="0.01" value={bulk} onChange={e=>setBulk(parseFloat(e.target.value)||0)} className="w-full inp mt-1 text-sm font-mono border-amber-500/50 bg-amber-950/20" />
                            </div>
                        ) : (
                            <div>
                                <label className="text-[10px] text-slate-400 font-bold">e (Void Ratio)</label>
                                <input type="number" min="0.1" step="0.01" value={eInput} onChange={e=>setEInput(parseFloat(e.target.value)||0)} className="w-full inp mt-1 text-sm font-mono border-amber-500/50 bg-amber-950/20" />
                            </div>
                        )}
                    </div>
                </div>

                <div className="bg-[#050811] border border-[#1E3A5F] rounded-xl p-6 relative overflow-hidden flex flex-col items-center shadow-lg">
                    {error ? (
                        <div className="text-red-400 font-bold bg-red-950/50 p-4 rounded-xl border border-red-900/50 w-full text-center">{error}</div>
                    ) : (
                        <div className="flex flex-col md:flex-row w-full gap-8 items-center justify-center">
                            {/* Phase Diagram Graphic */}
                            <div className="relative w-48 h-64 flex shrink-0 font-mono text-[10px] font-bold">
                                {/* Volumes (Left) */}
                                <div className="w-16 h-full flex flex-col pr-2 text-right">
                                    <div className="w-full border-b border-slate-600 border-t" style={{height: `${h_a}%`}}><span className="relative top-1/2 -translate-y-1/2 block text-sky-200">Va={V_a.toFixed(3)}</span></div>
                                    <div className="w-full border-b border-slate-600" style={{height: `${h_w}%`}}><span className="relative top-1/2 -translate-y-1/2 block text-blue-300">Vw={V_w.toFixed(3)}</span></div>
                                    <div className="w-full border-b border-slate-600" style={{height: `${h_s}%`}}><span className="relative top-1/2 -translate-y-1/2 block text-amber-600">Vs={V_s.toFixed(3)}</span></div>
                                </div>
                                
                                {/* Diagram Boxes */}
                                <div className="flex-1 h-full border-2 border-slate-500 rounded-sm overflow-hidden flex flex-col shadow-2xl">
                                    <div className="w-full bg-transparent flex items-center justify-center text-slate-400 tracking-widest" style={{height: `${h_a}%`}}>AIR</div>
                                    <div className="w-full bg-blue-900/60 border-t-2 border-slate-500 flex items-center justify-center text-blue-200 tracking-widest" style={{height: `${h_w}%`}}>WATER</div>
                                    <div className="w-full bg-amber-900/80 border-t-2 border-slate-500 flex items-center justify-center text-amber-400 tracking-widest bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]" style={{height: `${h_s}%`}}>SOLID</div>
                                </div>

                                {/* Weights (Right) */}
                                <div className="w-16 h-full flex flex-col pl-2 text-left">
                                    <div className="w-full border-b border-slate-600 border-t" style={{height: `${h_a}%`}}><span className="relative top-1/2 -translate-y-1/2 block text-slate-500">Wa=0</span></div>
                                    <div className="w-full border-b border-slate-600" style={{height: `${h_w}%`}}><span className="relative top-1/2 -translate-y-1/2 block text-blue-300">Ww={W_w.toFixed(3)}</span></div>
                                    <div className="w-full border-b border-slate-600" style={{height: `${h_s}%`}}><span className="relative top-1/2 -translate-y-1/2 block text-amber-600">Ws={W_s.toFixed(3)}</span></div>

    const SoilStrengthCalculator = () => {
        const [testMode, setTestMode] = useState('direct'); // direct, triaxial, uct
        const [d1, setD1] = useState({ s: 50, t: 65 });
        const [d2, setD2] = useState({ s: 100, t: 90 });
        const [d3, setD3] = useState({ s: 200, t: 140 });
        const [t1, setT1] = useState({ s3: 50, s1: 150 });
        const [t2, setT2] = useState({ s3: 100, s1: 300 });
        const [t3, setT3] = useState({ s3: 200, s1: 600 }); // ใช้ข้อมูลพื้นฐานตามรหัสนักศึกษา/ตัวเลขเชิงวิชาการ
        const [qu, setQu] = useState(120); // UCT
        const [useThreePts, setUseThreePts] = useState(true);

        let c = 0, phi = 0, circles = [], maxS = 100, error = '';

        const linReg = (pts) => {
            let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0, n = pts.length;
            pts.forEach(p => { sumX += p.x; sumY += p.y; sumXY += p.x*p.y; sumXX += p.x*p.x; });
            const m = (n*sumXY - sumX*sumY) / (n*sumXX - sumX*sumX);
            const b = (sumY - m*sumX) / n;
            return {m, b};
        };

        try {
            if (testMode === 'direct') {
                const pts = [d1, d2];
                if (useThreePts) pts.push(d3);
                const {m, b} = linReg(pts.map(d => ({x: d.s, y: d.t})));
                phi = Math.atan(m) * (180 / Math.PI);
                c = b;
                maxS = Math.max(...pts.map(d => d.s)) * 1.2;
            } else if (testMode === 'triaxial') {
                const pts = [t1, t2];
                if (useThreePts) pts.push(t3);
                const reg = linReg(pts.map(d => ({x: d.s3, y: d.s1})));
                if (reg.m <= 0) { error = 'ข้อมูลไม่สามารถหาจุดตัดความวิบัติได้'; }
                else {
                    phi = 2 * (Math.atan(Math.sqrt(reg.m)) * (180 / Math.PI) - 45);
                    c = reg.b / (2 * Math.sqrt(reg.m));
                    circles = pts.map(d => ({ cx: (d.s1 + d.s3)/2, r: (d.s1 - d.s3)/2 }));
                    maxS = Math.max(...pts.map(d => d.s1)) * 1.1;
                }
            } else if (testMode === 'uct') {
                c = qu / 2;
                phi = 0;
                circles = [{ cx: qu/2, r: qu/2 }];
                maxS = qu * 1.2;
            }
        } catch(e) { error = 'เกิดข้อผิดพลาดในการคำนวณ'; }

        // สเกลสำหรับการวาด SVG (แปลงค่าหน่วยแรงเป็น Pixel)
        if (maxS <= 0) maxS = 100;
        const svgW = 400; const svgH = 220;
        const scale = (svgW - 50) / maxS;

        return (
            <div className="flex flex-col gap-4 py-2 w-full max-w-2xl mx-auto">
                <div className="bg-[#0B1325] p-4 rounded-xl border border-[#1E3A5F] shadow-inner space-y-3 text-xs">
                    <div className="flex justify-between items-center mb-2">
                        <label className="text-sky-400 font-bold">เลือกวิธีทดสอบ (Test Type)</label>
                        <select value={testMode} onChange={e=>setTestMode(e.target.value)} className="inp py-1 bg-[#050811]">
                            <option value="direct">Direct Shear Test</option>
                            <option value="triaxial">Triaxial Test</option>
                            <option value="uct">Unconfined Compression Test (UCT)</option>
                        </select>
                    </div>

                    {testMode === 'direct' && (
                        <div className="space-y-2">
                            <div className="grid grid-cols-2 gap-2 text-center text-slate-400 font-bold"><span className="border-b border-[#1E3A5F] pb-1">Normal Stress (σ)</span><span className="border-b border-[#1E3A5F] pb-1">Shear Stress (τ)</span></div>
                            <div className="grid grid-cols-2 gap-2"><input type="number" value={d1.s} onChange={e=>setD1({...d1, s:parseFloat(e.target.value)||0})} className="inp text-center font-mono" /><input type="number" value={d1.t} onChange={e=>setD1({...d1, t:parseFloat(e.target.value)||0})} className="inp text-center font-mono" /></div>
                            <div className="grid grid-cols-2 gap-2"><input type="number" value={d2.s} onChange={e=>setD2({...d2, s:parseFloat(e.target.value)||0})} className="inp text-center font-mono" /><input type="number" value={d2.t} onChange={e=>setD2({...d2, t:parseFloat(e.target.value)||0})} className="inp text-center font-mono" /></div>
                            {useThreePts && <div className="grid grid-cols-2 gap-2"><input type="number" value={d3.s} onChange={e=>setD3({...d3, s:parseFloat(e.target.value)||0})} className="inp text-center font-mono" /><input type="number" value={d3.t} onChange={e=>setD3({...d3, t:parseFloat(e.target.value)||0})} className="inp text-center font-mono" /></div>}
                            <label className="flex items-center gap-2 mt-2 text-sky-300 font-bold cursor-pointer"><input type="checkbox" checked={useThreePts} onChange={e=>setUseThreePts(e.target.checked)} className="accent-sky-500" /> ใช้ข้อมูล 3 จุดประเมินค่า</label>
                        </div>
                    )}

                    {testMode === 'triaxial' && (
                        <div className="space-y-2">
                            <div className="grid grid-cols-2 gap-2 text-center text-slate-400 font-bold"><span className="border-b border-[#1E3A5F] pb-1">Confining Stress (σ3)</span><span className="border-b border-[#1E3A5F] pb-1">Major Principal (σ1)</span></div>
                            <div className="grid grid-cols-2 gap-2"><input type="number" value={t1.s3} onChange={e=>setT1({...t1, s3:parseFloat(e.target.value)||0})} className="inp text-center font-mono" /><input type="number" value={t1.s1} onChange={e=>setT1({...t1, s1:parseFloat(e.target.value)||0})} className="inp text-center font-mono" /></div>
                            <div className="grid grid-cols-2 gap-2"><input type="number" value={t2.s3} onChange={e=>setT2({...t2, s3:parseFloat(e.target.value)||0})} className="inp text-center font-mono" /><input type="number" value={t2.s1} onChange={e=>setT2({...t2, s1:parseFloat(e.target.value)||0})} className="inp text-center font-mono" /></div>
                            {useThreePts && <div className="grid grid-cols-2 gap-2"><input type="number" value={t3.s3} onChange={e=>setT3({...t3, s3:parseFloat(e.target.value)||0})} className="inp text-center font-mono" /><input type="number" value={t3.s1} onChange={e=>setT3({...t3, s1:parseFloat(e.target.value)||0})} className="inp text-center font-mono" /></div>}
                            <label className="flex items-center gap-2 mt-2 text-sky-300 font-bold cursor-pointer"><input type="checkbox" checked={useThreePts} onChange={e=>setUseThreePts(e.target.checked)} className="accent-sky-500" /> ใช้ข้อมูล 3 จุดประเมินค่า</label>
                        </div>
                    )}

                    {testMode === 'uct' && (
                        <div className="flex gap-4 items-center">
                            <label className="text-slate-400 font-bold">Unconfined Compressive Strength (qu)</label>
                            <input type="number" value={qu} onChange={e=>setQu(parseFloat(e.target.value)||0)} className="flex-1 inp text-center font-mono" />
                        </div>
                    )}
                </div>

                <div className="bg-[#050811] border border-[#1E3A5F] rounded-xl p-4 sm:p-6 overflow-hidden flex flex-col shadow-lg">
                    {error ? <div className="text-red-400 font-bold bg-red-950/50 p-4 rounded-xl border border-red-900/50 w-full text-center">{error}</div> : (
                        <>
                            <div className="grid grid-cols-2 gap-3 text-center mb-6">
                                <div className="bg-[#0B1325] p-3 rounded-lg border border-[#1E3A5F]">
                                    <div className="text-[10px] text-amber-400 font-bold uppercase mb-1">Cohesion (c)</div>
                                    <div className="text-xl sm:text-2xl font-bold font-mono text-white">{c.toFixed(2)}</div>
                                </div>
                                <div className="bg-[#0B1325] p-3 rounded-lg border border-[#1E3A5F]">
                                    <div className="text-[10px] text-sky-400 font-bold uppercase mb-1">Friction Angle (φ)</div>
                                    <div className="text-xl sm:text-2xl font-bold font-mono text-white">{phi.toFixed(2)}°</div>
                                </div>
                            </div>

                            {/* วาดกราฟ Mohr's Circle และ Failure Envelope ด้วย SVG */}
                            <div className="w-full bg-[#0a101f] border border-slate-700 rounded-xl p-2 relative shadow-inner overflow-x-auto no-scrollbar">
                                <div className="text-[9px] text-slate-500 absolute top-2 right-4 font-mono font-bold">Mohr-Coulomb Failure Envelope</div>
                                <svg viewBox={`0 0 ${svgW} ${svgH}`} className="w-full min-w-[300px] h-auto drop-shadow-md">
                                    {/* กริดและแกน */}
                                    <g transform={`translate(20, ${svgH - 20}) scale(1, -1)`}>
                                        <line x1="0" y1="0" x2={svgW-30} y2="0" stroke="#475569" strokeWidth="2" />
                                        <line x1="0" y1="0" x2="0" y2={svgH-40} stroke="#475569" strokeWidth="2" />
                                        
                                        {/* Failure Envelope (τ = c + σ tan φ) */}
                                        <line x1="0" y1={c * scale} x2={maxS * scale} y2={(c + maxS * Math.tan(phi * Math.PI / 180)) * scale} stroke="#F59E0B" strokeWidth="2.5" />
                                        
                                        {/* วาด Mohr's Circles สำหรับ Triaxial / UCT */}
                                        {(testMode === 'triaxial' || testMode === 'uct') && circles.map((cir, idx) => (
                                            <circle key={idx} cx={cir.cx * scale} cy="0" r={cir.r * scale} fill="none" stroke="#38BDF8" strokeWidth="1.5" strokeDasharray="4 2" />
                                        ))}

                                        {/* จุดข้อมูล สำหรับ Direct Shear */}
                                        {testMode === 'direct' && [d1, d2, useThreePts ? d3 : null].filter(Boolean).map((pt, idx) => (
                                            <circle key={idx} cx={pt.s * scale} cy={pt.t * scale} r="4" fill="#38BDF8" />
                                        ))}
                                    </g>
                                    <text x="25" y="15" fill="#94A3B8" fontSize="10" fontWeight="bold">τ</text>
                                    <text x={svgW-15} y={svgH-5} fill="#94A3B8" fontSize="10" fontWeight="bold">σ</text>
                                </svg>
                            </div>
                        </>
                    )}
                </div>
            </div>
        );
    };

    const LunarSplitter = () => {

    const Randomizer = () => {
        const [names, setNames] = useState("สมาชิก A\nสมาชิก B\nสมาชิก C\nสมาชิก D"); const [result, setResult] = useState(null); const [spinning, setSpinning] = useState(false);

          setSpinning(true); setResult(null); let count = 0;

    // ==========================================
    // 7. 📅 ASSOCIATION CALENDAR COMPONENT 📅
    // ==========================================
    const AssociationCalendar = ({ isOpen, onClose, events, currentUser, db, users }) => {
        const [currentDate, setCurrentDate] = useState(new Date());
        const [selectedDate, setSelectedDate] = useState(null);
        const [showCreateForm, setShowCreateForm] = useState(false);
        const [viewMode, setViewMode] = useState('month'); 
        
        const [invitees, setInvitees] = useState([]);
        const [inviteSearch, setInviteSearch] = useState('');
    
        const daysInMonth = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0).getDate();
        const firstDay = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1).getDay();
        const monthNames = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];

        const getDayEvents = (dateStr) => events.filter(e => e.date === dateStr);
        const getAuthor = (id) => users.find(u => u.id === id) || { displayName: id };

        const EVENT_TYPES = {
            official: { color: 'bg-red-500', icon: '🔴', label: 'Official' },
            gathering: { color: 'bg-emerald-500', icon: '🟢', label: 'Gathering' },
            music: { color: 'bg-sky-500', icon: '🔵', label: 'Music Jam' }
        };

        // 🌟 อัลกอริทึมคำนวณดาราศาสตร์อัตโนมัติ (Moon Phases, Eclipses, Supermoons, Blue Moons)
        const getAstroInfo = (year, month, day) => {
            let y = year, m = month + 1;
            if (m <= 2) { y -= 1; m += 12; }
            const A = Math.floor(y / 100);
            const B = 2 - A + Math.floor(A / 4);
            const jd = Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + day + B - 1524.5;
            
            const synodic = 29.530588; // รอบดิถีดวงจันทร์
            const getPhaseAge = (d) => {
                const diff = (d - 2451550.1) % synodic;
                return diff < 0 ? diff + synodic : diff;
            };
            
            const phaseAge = getPhaseAge(jd);
            const phaseAgePrev = getPhaseAge(jd - 1);
            const phaseAgeNext = getPhaseAge(jd + 1);
            
            // หาจุดที่ตรงกับ Peak พอดีในวันนั้น (ป้องกันการแสดงซ้ำ 2 วันติดกัน)
            const isPeak = (target) => {
                const d0 = Math.abs(phaseAgePrev - target);
                const d1 = Math.abs(phaseAge - target);
                const d2 = Math.abs(phaseAgeNext - target);
                return d1 < d0 && d1 <= d2;
            };
            
            const isFullMoon = isPeak(synodic / 2);
            const isNewMoon = isPeak(0) || isPeak(synodic);
            const isFirstQ = isPeak(synodic / 4);
            const isLastQ = isPeak(synodic * 0.75);
            
            // Anomalistic month (เช็กระยะใกล้-ไกลโลก สำหรับ Supermoon)
            const anomalistic = 27.55455;
            const periDiff = (jd - 2451541.16) % anomalistic;
            const periAge = periDiff < 0 ? periDiff + anomalistic : periDiff;
            
            // Draconic month (เช็กจุดตัดระนาบวงโคจร สำหรับจันทรุปราคา)
            const draconic = 27.21222;
            const nodeDiff = (jd - 2451563.8) % draconic;
            const nodeAge = nodeDiff < 0 ? nodeDiff + draconic : nodeDiff;
            
            let phaseIdx = Math.round((phaseAge / synodic) * 8) % 8;
            if (isFullMoon) phaseIdx = 4;
            else if (isNewMoon) phaseIdx = 0;
            
            let event = null;
            if (isFullMoon) {
                const distToPeri = Math.min(periAge, anomalistic - periAge);
                const isSupermoon = distToPeri < 1.5; // อยู่ใกล้จุด Perigee
                
                const distToNode = Math.min(nodeAge, draconic - nodeAge, Math.abs(nodeAge - draconic/2));
                const isEclipse = distToNode < 1.2; // อยู่ใกล้จุด Node
                
                if (isEclipse) {
                    event = { type: 'Eclipse', label: '🔴 จันทรุปราคาเต็มดวง (Lunar Eclipse)', style: 'drop-shadow-[0_0_8px_rgba(239,68,68,0.9)] scale-110', emoji: '🔴' };
                } else if (isSupermoon) {
                    event = { type: 'Supermoon', label: '🌕 ซูเปอร์มูน (Supermoon)', style: 'drop-shadow-[0_0_12px_rgba(253,230,138,1)] scale-125', emoji: '🌕' };
                } else if (day >= 30) {
                    // หากเกิดพระจันทร์เต็มดวงในช่วงปลายเดือน (วันที่ 30,31) จะเป็นครั้งที่ 2 ของเดือนแน่นอน
                    event = { type: 'Blue Moon', label: '🔵 บลูมูน (Blue Moon)', style: 'drop-shadow-[0_0_8px_rgba(56,189,248,0.9)] scale-110', emoji: '🔵' };
                } else {
                    event = { type: 'Full Moon', label: '🌕 จันทร์เต็มดวง (Full Moon)', style: 'drop-shadow-[0_0_5px_rgba(254,240,138,0.4)]', emoji: '🌕' };
                }
            }
            
            const phases = [
                { idx: 0, emoji: '🌑', label: 'จันทร์ดับ (New Moon)' }, { idx: 1, emoji: '🌒', label: 'จันทร์เสี้ยว (Waxing Crescent)' },
                { idx: 2, emoji: '🌓', label: 'จันทร์ครึ่งดวง (First Qtr)' }, { idx: 3, emoji: '🌔', label: 'จันทร์ค่อนดวง (Waxing Gibbous)' },
                { idx: 4, emoji: '🌕', label: 'จันทร์เต็มดวง (Full Moon)' }, { idx: 5, emoji: '🌖', label: 'จันทร์แรม (Waning Gibbous)' },
                { idx: 6, emoji: '🌗', label: 'จันทร์ครึ่งดวง (Last Qtr)' }, { idx: 7, emoji: '🌘', label: 'จันทร์เสี้ยว (Waning Crescent)' }
            ];
            
            return { 
                phase: phases[phaseIdx], 
                event, 
                isMainPhase: isFullMoon || isNewMoon || isFirstQ || isLastQ 
            };
        };

        const goToToday = () => {
            const today = new Date();
            setCurrentDate(today);
            const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
            setSelectedDate(todayStr);
        };

        const exportToICS = (event) => {
            const d = event.date.replace(/-/g, '');
            const t = event.time.replace(/:/g, '') + '00';
            const icsContent = `BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nSUMMARY:${event.title}\nDTSTART:${d}T${t}\nDESCRIPTION:สร้างโดย: ${getAuthor(event.createdBy).displayName}\\nจำนวนคนที่รับ: ${event.max}\\n\\nเข้าร่วมผ่าน The Blue Moon Association\nEND:VEVENT\nEND:VCALENDAR`;
            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `${event.title}.ics`; a.click();
            window.URL.revokeObjectURL(url);
        };

        const handleCreateEvent = async (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            const title = fd.get('title'), date = fd.get('date'), time = fd.get('time');
            const type = fd.get('type'), max = parseInt(fd.get('max')), isPromo = fd.get('promo') === 'on';
        
            const id = 'evt-' + Date.now();
            
            await db.collection('bma_events').doc(id).set({
                id, title, date, time, type, max, createdBy: currentUser.id,
                going: [currentUser.id], maybe: [], timestamp: Date.now()
            });

            for (const invId of invitees) {
                const dmRm = 'dm_' + [currentUser.id, invId].sort().join('_');
                const mId = 'msg-' + Date.now() + Math.random().toString(36).substr(2,5);
                await db.collection('bma_messages').doc(mId).set({
                    id: mId, roomKey: dmRm, senderId: currentUser.id, receiverId: invId,
                    text: '📅 ขอเชิญเข้าร่วมกิจกรรม: ' + title,
                    isEventInvite: true, eventId: id, eventName: title, eventDate: date, eventTime: time,
                    readBy: [currentUser.id], time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }), 
                    timestamp: Date.now(), serverCreatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            }

            if (isPromo) {
                const postId = 'post-' + Date.now();
                await db.collection('bma_posts').doc(postId).set({
                    id: postId, authorId: currentUser.id, title: `🗓️ เชิญร่วมกิจกรรม: ${title}`,
                    content: `ขอเชิญสมาชิกเข้าร่วมกิจกรรม\n\n**วันที่:** ${date}\n**เวลา:** ${time} น.\n**รายละเอียด:** สามารถดูจำนวนคนและกดเข้าร่วมได้ที่ 📅 ปฏิทินสมาคมครับ!`,
                    isGuestAllowed: false, attachments: [], tags: ['Event'], mutedBy: [],
                    createdAt: new Date().toLocaleDateString('th-TH', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }),
                    timestamp: Date.now(), serverCreatedAt: firebase.firestore.FieldValue.serverTimestamp(), likes: [], bookmarks: [], comments: []
                });
            }
            setShowCreateForm(false);
            setInvitees([]);
            setInviteSearch('');
        };

        const handleRSVP = async (event, status) => {
            const isGoing = status === 'going';
            let newGoing = event.going || []; let newMaybe = event.maybe || [];
            newGoing = newGoing.filter(id => id !== currentUser.id);
            newMaybe = newMaybe.filter(id => id !== currentUser.id);
            if (isGoing) newGoing.push(currentUser.id);
            else newMaybe.push(currentUser.id);
        
            await db.collection('bma_events').doc(event.id).update({ going: newGoing, maybe: newMaybe });
        };

        if (!isOpen) return null;

        return (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 text-white">
                <div className="bg-[#0B1325] border border-[#1E3A5F] w-full max-w-5xl h-[85vh] rounded-2xl shadow-2xl flex flex-col overflow-hidden animate-fade-in relative">
                
                    {/* Header */}
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center p-4 border-b border-[#1E3A5F] bg-[#070C18] gap-3 relative">
                        <div className="flex items-center gap-3 pr-8 w-full sm:w-auto">
                            <h2 className="text-lg sm:text-xl font-bold text-sky-400 flex items-center gap-1.5 sm:gap-2">📅 <span className="hidden sm:inline">Association Calendar</span><span className="sm:hidden">Calendar</span></h2>
                            <button onClick={goToToday} className="btn-d text-[10px] py-1 px-2 border-sky-500/50 hover:bg-sky-900/30 text-sky-300 shrink-0 ml-auto sm:ml-0">กลับไปวันนี้</button>
                        </div>
                        <div className="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
                            <div className="bg-[#050811] p-1 rounded-lg border border-[#1E3A5F] flex gap-1 w-full sm:w-auto">
                                <button onClick={() => setViewMode('month')} className={`flex-1 sm:flex-none px-3 py-1.5 sm:py-1 rounded text-xs font-bold transition-colors ${viewMode === 'month' ? 'bg-sky-600 text-white' : 'text-slate-400 hover:text-white'}`}>ตารางเดือน</button>
                                <button onClick={() => setViewMode('list')} className={`flex-1 sm:flex-none px-3 py-1.5 sm:py-1 rounded text-xs font-bold transition-colors ${viewMode === 'list' ? 'bg-sky-600 text-white' : 'text-slate-400 hover:text-white'}`}>แบบรายการ</button>
                            </div>
                        </div>
                        <button onClick={onClose} className="absolute top-3 right-4 text-slate-400 hover:text-white font-bold text-2xl leading-none p-1">✕</button>
                    </div>

                    <div className="flex flex-col md:flex-row flex-1 min-h-0 overflow-hidden">
                        {/* ปฏิทิน */}
                        <div className="w-full md:w-2/3 flex flex-col p-4 border-r border-[#1E3A5F] overflow-y-auto bg-gradient-to-b from-[#070C18] to-[#050811] custom-scrollbar">
                            <div className="flex justify-between items-center mb-4 bg-[#0B1325] p-2 rounded-xl border border-[#1E3A5F]">
                                <button onClick={() => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1))} className="text-xl hover:text-sky-400 px-4">◀</button>
                                <h3 className="text-lg font-bold text-sky-200">{monthNames[currentDate.getMonth()]} {currentDate.getFullYear()}</h3>
                                <button onClick={() => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1))} className="text-xl hover:text-sky-400 px-4">▶</button>
                            </div>
                        
                            {viewMode === 'month' ? (
                                <div className="grid grid-cols-7 gap-1 flex-1">
                                    {['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'].map(d => <div key={d} className="text-center text-xs font-bold text-slate-400 mb-2">{d}</div>)}
                                    {Array(firstDay).fill(null).map((_, i) => <div key={`empty-${i}`} className="p-2 border border-transparent"></div>)}

                                    {Array(daysInMonth).fill(null).map((_, i) => {
                                        const dateNum = i + 1;
                                        const dateStr = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}-${String(dateNum).padStart(2, '0')}`;
                                        const isSelected = selectedDate === dateStr;
                                        
                                        const { phase, event, isMainPhase } = getAstroInfo(currentDate.getFullYear(), currentDate.getMonth(), dateNum);
                                        const dayEvents = getDayEvents(dateStr);

                                        return (
                                            <div key={dateNum} onClick={() => setSelectedDate(dateStr)} className={`min-h-[85px] border rounded-xl p-1.5 cursor-pointer transition-all relative flex flex-col items-start ${isSelected ? 'border-sky-400 bg-sky-900/30 shadow-[0_0_15px_rgba(56,189,248,0.2)]' : 'border-[#1E3A5F] hover:bg-[#0F2547]'}`}>
                                                <span className={`text-sm font-bold ${event ? 'text-sky-200' : 'text-slate-300'}`}>{dateNum}</span>
                                                
                                                {/* เรนเดอร์พระจันทร์ หรือ ปรากฏการณ์พิเศษ */}
                                                {event ? (
                                                    <span className={`absolute top-1 right-1 text-xs transition-all ${event.style}`} title={event.label}>{event.emoji}</span>
                                                ) : isMainPhase && (
                                                    <span className="absolute top-1 right-1 text-xs opacity-70" title={phase.label}>{phase.emoji}</span>
                                                )}

                                                <div className="mt-auto flex flex-wrap gap-1.5 w-full justify-start relative">
                                                    {dayEvents.map(e => (
                                                        <div key={e.id} className="relative group flex items-center justify-center">
                                                            <div className={`w-2.5 h-2.5 rounded-full ${EVENT_TYPES[e.type].color} shadow-sm`}></div>
                                                            <div className="absolute bottom-full left-1/2 -translate-x-1/2 mb-1.5 hidden group-hover:flex flex-col items-center z-[100] w-max max-w-[160px] bg-[#0B1325] border border-[#1E3A5F] p-2 rounded-xl shadow-[0_0_20px_rgba(0,0,0,0.8)] pointer-events-none">
                                                                <div className="flex items-center gap-1.5 mb-1 w-full">
                                                                    <Avatar user={getAuthor(e.createdBy)} size="xs" />
                                                                    <span className="text-[10px] font-bold text-sky-300 truncate w-full">{e.title}</span>
                                                                </div>
                                                                <div className="text-[9px] text-slate-300 font-mono bg-[#050811] px-1.5 py-0.5 rounded w-full text-center">🕒 {e.time} น.</div>
                                                                <div className="absolute top-full left-1/2 -translate-x-1/2 border-4 border-transparent border-t-[#1E3A5F]"></div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            ) : (
                                <div className="flex-1 overflow-y-auto space-y-3 pr-2">
                                    {Array(daysInMonth).fill(null).map((_, i) => {
                                        const dateNum = i + 1;
                                        const dateStr = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}-${String(dateNum).padStart(2, '0')}`;
                                        const dayEvents = getDayEvents(dateStr);
                                        const { phase, event, isMainPhase } = getAstroInfo(currentDate.getFullYear(), currentDate.getMonth(), dateNum);
                                        
                                        if (dayEvents.length === 0 && !isMainPhase && !event) return null;

                                        return (
                                            <div key={dateNum} onClick={() => setSelectedDate(dateStr)} className={`p-3 rounded-xl border flex gap-3 cursor-pointer transition-colors ${selectedDate === dateStr ? 'border-sky-400 bg-sky-900/20' : 'border-[#1E3A5F] bg-[#0B1325] hover:border-slate-500'}`}>
                                                <div className="flex flex-col items-center justify-center w-14 shrink-0 bg-[#050811] rounded-lg border border-[#1E3A5F] py-2">
                                                    <span className="text-2xl font-bold text-white leading-none mb-1">{dateNum}</span>
                                                    <span className="text-[9px] text-slate-400">{monthNames[currentDate.getMonth()].slice(0,3)}</span>
                                                </div>
                                                <div className="flex-1 space-y-2">
                                                    {(event || isMainPhase) && (
                                                        <div className={`text-[10px] font-bold border-b border-[#1E3A5F] pb-1 inline-block ${event ? 'text-amber-300' : 'text-slate-400'}`}>
                                                            {event ? `${event.label}` : `${phase.emoji} ${phase.label}`}
                                                        </div>
                                                    )}
                                                    {dayEvents.map(e => (
                                                        <div key={e.id} className="flex flex-col bg-[#050811] p-2.5 rounded-lg border border-[#1E3A5F]">
                                                            <div className="font-bold text-xs text-sky-200 mb-1 flex items-center gap-1.5"><span className="text-[10px]">{EVENT_TYPES[e.type].icon}</span> {e.title}</div>
                                                            <div className="flex items-center gap-2">
                                                                <Avatar user={getAuthor(e.createdBy)} size="xs" />
                                                                <span className="text-[10px] text-slate-400">🕒 {e.time} • โฮสต์: {getAuthor(e.createdBy).displayName}</span>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>

                        {/* รายละเอียด / ฟอร์ม (ด้านขวา) */}
                        <div className="w-full md:w-1/3 bg-[#0B1325] p-4 flex flex-col min-h-0 overflow-y-auto">
                            {!showCreateForm ? (
                                <>
                                    <div className="flex justify-between items-center mb-4 pb-2 border-b border-[#1E3A5F]">
                                        <h3 className="font-bold text-amber-300 text-sm flex items-center gap-1.5">
                                            {selectedDate ? <>📍 {selectedDate}</> : '🔍 เลือกวันที่เพื่อดูรายละเอียด'}
                                        </h3>
                                        {selectedDate && currentUser && <button onClick={() => setShowCreateForm(true)} className="bg-sky-600 hover:bg-sky-500 text-white text-[10px] font-bold px-3 py-1.5 rounded-lg shadow-md transition-colors">+ สร้างกิจกรรม</button>}
                                    </div>
                                    
                                    {selectedDate && (() => {
                                        const dNum = parseInt(selectedDate.split('-')[2]);
                                        const dMonth = parseInt(selectedDate.split('-')[1]) - 1;
                                        const dYear = parseInt(selectedDate.split('-')[0]);
                                        const { phase, event } = getAstroInfo(dYear, dMonth, dNum);

                                        return (
                                            <div className="bg-gradient-to-br from-[#050811] to-[#0F2547] border border-amber-500/50 p-3 rounded-xl mb-4 text-xs shadow-lg">
                                                <div className="font-bold text-amber-300 mb-1.5 flex items-center gap-1.5">✨ ข้อมูลดาราศาสตร์</div>
                                                <div className="text-slate-200">{event ? `${event.emoji} ${event.label}` : `${phase.emoji} ${phase.label}`}</div>
                                            </div>
                                        );
                                    })()}
                                    
                                    {selectedDate ? (
                                        <div className="space-y-3 flex-1 overflow-y-auto pr-1 custom-scrollbar">
                                            {getDayEvents(selectedDate).length === 0 ? <div className="text-slate-500 text-xs text-center py-10 border border-dashed border-[#1E3A5F] rounded-xl">ยังไม่มีกิจกรรมในวันนี้</div> : (
                                                getDayEvents(selectedDate).map(e => (
                                                    <div key={e.id} className="bg-[#050811] border border-[#1E3A5F] p-3.5 rounded-xl hover:border-sky-500/50 transition-colors shadow-md">
                                                        <div className="flex items-start justify-between mb-3 border-b border-[#1E3A5F] pb-2">
                                                            <div className="flex items-center gap-2">
                                                                <span className="text-sm bg-[#0B1325] p-1.5 rounded-lg border border-[#1E3A5F]">{EVENT_TYPES[e.type].icon}</span>
                                                                <div className="flex flex-col">
                                                                    <span className="font-bold text-sm text-sky-100">{e.title}</span>
                                                                    <span className="text-[9px] text-sky-400 font-mono uppercase tracking-wider">{EVENT_TYPES[e.type].label}</span>
                                                                </div>
                                                            </div>
                                                            <button onClick={() => exportToICS(e)} className="text-[10px] bg-sky-900/50 text-sky-300 px-2 py-1 rounded border border-sky-700/50 hover:bg-sky-600 hover:text-white transition-colors" title="เพิ่มลงปฏิทินในเครื่อง">🗓️ ICS</button>
                                                        </div>
                                                        
                                                        <div className="flex items-center gap-2 mb-3 bg-[#0B1325] p-2 rounded-lg border border-[#1E3A5F]">
                                                            <Avatar user={getAuthor(e.createdBy)} size="xs" />
                                                            <div className="flex flex-col">
                                                                <div className="text-[10px] text-slate-400">🕒 เวลา: <span className="text-white font-bold">{e.time} น.</span></div>
                                                                <div className="text-[9px] text-slate-500">สร้างโดย: {getAuthor(e.createdBy).displayName}</div>
                                                            </div>
                                                        </div>
                                                        
                                                        <div className="text-[10px] text-slate-400 mb-2 font-bold flex justify-between px-1">
                                                            <span>👥 สถานะผู้เข้าร่วม</span>
                                                            <span className="text-emerald-400">{(e.going || []).length} / {e.max} คน</span>
                                                        </div>
                                                    
                                                        {currentUser ? (
                                                            <div className="flex gap-2 mt-2">
                                                                <button onClick={() => handleRSVP(e, 'going')} className={`flex-1 text-[10px] py-2 rounded-lg font-bold transition-colors ${(e.going||[]).includes(currentUser.id) ? 'bg-emerald-600 text-white shadow-[0_0_10px_rgba(5,150,105,0.4)]' : 'bg-emerald-950 border border-emerald-900 text-emerald-400 hover:bg-emerald-900'}`}>✓ ยืนยันเข้าร่วม</button>
                                                                <button onClick={() => handleRSVP(e, 'maybe')} className={`flex-1 text-[10px] py-2 rounded-lg transition-colors font-bold ${(e.maybe||[]).includes(currentUser.id) ? 'bg-amber-600 text-white shadow-[0_0_10px_rgba(217,119,6,0.4)]' : 'bg-[#050811] border border-[#1E3A5F] text-slate-400 hover:text-amber-300'}`}>🤷 อาจจะไป</button>
                                                            </div>
                                                        ) : (
                                                            <div className="text-[10px] text-slate-500 text-center mt-3 bg-red-950/30 p-2 rounded border border-red-900/30">กรุณาล็อกอินเพื่อตอบรับเข้าร่วมกิจกรรม</div>
                                                        )}
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    ) : <div className="text-slate-500 text-xs text-center py-10 flex flex-col items-center gap-2 opacity-50"><span className="text-4xl">👆</span>คลิกเลือกวันที่บนปฏิทิน</div>}
                                </>
                            ) : (
                                <div className="flex flex-col h-full">
                                    <div className="flex justify-between items-center mb-4 border-b border-[#1E3A5F] pb-2">
                                        <h3 className="font-bold text-sky-300 text-sm flex items-center gap-1.5">📝 สร้างกิจกรรมใหม่</h3>
                                        <button onClick={() => { setShowCreateForm(false); setInvitees([]); setInviteSearch(''); }} className="text-slate-400 text-xs hover:text-white bg-[#050811] px-2 py-1 rounded border border-[#1E3A5F]">ยกเลิก</button>
                                    </div>
                                    <form onSubmit={handleCreateEvent} className="space-y-3.5 flex-1 overflow-y-auto pr-1 custom-scrollbar">
                                        <div>
                                            <label className="text-[10px] text-slate-400 font-bold mb-1 block">ชื่อกิจกรรม <span className="text-red-400">*</span></label>
                                            <input name="title" type="text" required className="w-full bg-[#050811] border border-[#1E3A5F] rounded-lg p-2 text-xs outline-none focus:border-sky-500 transition-colors" placeholder="ระบุชื่อกิจกรรม..." />
                                        </div>
                                        <div className="flex gap-2">
                                            <div className="flex-1">
                                                <label className="text-[10px] text-slate-400 font-bold mb-1 block">วันที่ <span className="text-red-400">*</span></label>
                                                <input name="date" type="date" defaultValue={selectedDate} required className="w-full bg-[#050811] border border-[#1E3A5F] rounded-lg p-2 text-xs outline-none focus:border-sky-500 transition-colors text-slate-200" />
                                            </div>
                                            <div className="flex-1">
                                                <label className="text-[10px] text-slate-400 font-bold mb-1 block">เวลา <span className="text-red-400">*</span></label>
                                                <input name="time" type="time" required className="w-full bg-[#050811] border border-[#1E3A5F] rounded-lg p-2 text-xs outline-none focus:border-sky-500 transition-colors text-slate-200" />
                                            </div>
                                        </div>
                                        <div className="flex gap-2">
                                            <div className="flex-[2]">
                                                <label className="text-[10px] text-slate-400 font-bold mb-1 block">ประเภทกิจกรรม <span className="text-red-400">*</span></label>
                                                <select name="type" className="w-full bg-[#050811] border border-[#1E3A5F] rounded-lg p-2 text-xs outline-none focus:border-sky-500 text-slate-200">
                                                    <option value="official">🔴 Official Event</option>
                                                    <option value="gathering">🟢 Member Gathering</option>
                                                    <option value="music">🔵 Music Jam</option>
                                                </select>
                                            </div>
                                            <div className="flex-1">
                                                <label className="text-[10px] text-slate-400 font-bold mb-1 block">รับกี่คน <span className="text-red-400">*</span></label>
                                                <input name="max" type="number" min="2" defaultValue="10" required className="w-full bg-[#050811] border border-[#1E3A5F] rounded-lg p-2 text-xs outline-none focus:border-sky-500 text-slate-200" />
                                            </div>
                                        </div>
                                        
                                        <div className="p-3 bg-[#050811] border border-[#1E3A5F] rounded-xl space-y-2 mt-2">
                                            <div className="flex justify-between items-center">
                                                <label className="text-xs font-bold text-amber-300">✉️ ส่งคำเชิญ (Direct Message)</label>
                                                <span className="text-[9px] text-slate-400 bg-[#0B1325] px-1.5 py-0.5 rounded">เลือกได้หลายคน</span>
                                            </div>
                                            <div className="relative">
                                                <span className="absolute left-2.5 top-1/2 -translate-y-1/2 text-[10px] text-slate-500">🔍</span>
                                                <input type="text" value={inviteSearch} onChange={e => setInviteSearch(e.target.value)} placeholder="ค้นหาชื่อ, ID, หมวดหมู่ (Tag)..." className="w-full bg-[#0B1325] border border-[#1E3A5F] rounded-lg py-1.5 pl-7 pr-2 text-[10px] text-white outline-none focus:border-amber-500 transition-colors" />
                                            </div>
                                            
                                            <div className="max-h-32 overflow-y-auto space-y-1 custom-scrollbar pr-1 border border-white/5 rounded-md p-1 bg-[#070C18]">
                                                {users.filter(u => u.isActivated && u.id !== currentUser.id && (u.displayName.toLowerCase().includes(inviteSearch.toLowerCase()) || u.id.toLowerCase().includes(inviteSearch.toLowerCase()) || getTags(u).some(t => t.toLowerCase().includes(inviteSearch.toLowerCase())))).map(u => (
                                                    <label key={u.id} className="flex items-center gap-2 p-1.5 hover:bg-[#0F2547] rounded-lg cursor-pointer transition-colors border border-transparent hover:border-[#1E3A5F]">
                                                        <input type="checkbox" checked={invitees.includes(u.id)} onChange={(e) => { if (e.target.checked) setInvitees([...invitees, u.id]); else setInvitees(invitees.filter(id => id !== u.id)); }} className="accent-amber-500 w-3 h-3" />
                                                        <Avatar user={u} size="xs" />
                                                        <div className="flex flex-col min-w-0">
                                                            <span className="text-[10px] font-bold text-slate-200 truncate">{u.displayName}</span>
                                                            <span className="text-[9px] text-slate-500 font-mono">{u.id}</span>
                                                        </div>
                                                    </label>
                                                ))}
                                            </div>
                                            {invitees.length > 0 && <div className="text-[10px] font-bold text-amber-400 text-right mt-1">เลือกผู้รับคำเชิญแล้ว {invitees.length} คน</div>}
                                        </div>

                                        <label className="flex items-center gap-2 cursor-pointer text-[11px] mt-2 p-2.5 bg-sky-950/30 rounded-xl border border-sky-900/50 hover:bg-sky-900/50 transition-colors">
                                            <input type="checkbox" name="promo" defaultChecked className="accent-sky-500 w-4 h-4" />
                                            <span className="text-sky-200 font-bold">ประกาศโปรโมตลง Board อัตโนมัติ</span>
                                        </label>

                                        <button type="submit" className="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-3 rounded-xl text-sm mt-4 shadow-lg hover:shadow-sky-500/20 transition-all">✅ ยืนยันสร้างกิจกรรม</button>
                                    </form>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            </div>
        );
    };

    // ==========================================
    // 👑 OWNER DASHBOARD & MANAGEMENT COMPONENT 👑
    // ==========================================
    function OwnerPage({ 
      users, posts, chatMessages, groups, bmaEvents, 
      allTags, db, getTags, setMemberModal 
    }) {
      const [subTab, setSubTab] = useState('dashboard'); // 'dashboard' | 'members'
  
      // States สำหรับระบบออกรหัสใหม่
      const [idType, setIdType] = useState('M'); // 'M' | 'F'
      const [newMId, setNewMId] = useState('');
      const [hostMemberId, setHostMemberId] = useState('');
      const [newMTags, setNewMTags] = useState(['LCs & Pal']);
      const [cTag, setCTag] = useState('');
      const [lastCreatedUser, setLastCreatedUser] = useState(null);
      const [copiedId, setCopiedId] = useState(null);

      // States สำหรับค้นหาและกรองสมาชิก
      const [searchMember, setSearchMember] = useState('');
      const [statusFilter, setStatusFilter] = useState('ALL'); // 'ALL' | 'ACTIVE' | 'PENDING' | 'VICE' | 'FOLLOWER'
      const [tagFilter, setTagFilter] = useState('ALL');

      // States สำหรับ Modal แก้ไขข้อมูลสมาชิก
      const [editTagU, setEditTagU] = useState(null);
      const [editTagL, setEditTagL] = useState([]);
      const [resetPassU, setResetPassU] = useState(null);
      const [newPassVal, setNewPassVal] = useState('');

      // คำนวณรหัส M ถัดไปอัตโนมัติ
      const getNextMId = useCallback(() => {
        const max = users.reduce((m, u) => {
          const r = String(u.id).match(/^M(\d+)$/i);
          return r ? Math.max(m, parseInt(r[1], 10)) : m;
        }, 0);
        return 'M' + String(max + 1).padStart(3, '0');
      }, [users]);

      // คำนวณรหัส F ถัดไปอัตโนมัติ
      const getNextFId = useCallback(() => {
        const max = users.reduce((m, u) => {
          const r = String(u.id).match(/^F(\d+)$/i);
          return r ? Math.max(m, parseInt(r[1], 10)) : m;
        }, 0);
        return 'F' + String(max + 1).padStart(3, '0');
      }, [users]);

      useEffect(() => {
        if (idType === 'M') {
          setNewMId(getNextMId());
        } else {
          if (hostMemberId) {
            const suffix = hostMemberId.substring(1);
            setNewMId('F' + suffix);
          } else {
            setNewMId(getNextFId());
          }
        }
      }, [idType, hostMemberId, getNextMId, getNextFId]);

      // ข้อมูลสถิติสำหรับ Dashboard
      const activeUsers = users.filter(u => u.isActivated);
      const pendingUsers = users.filter(u => !u.isActivated);
      const onlineNow = activeUsers.filter(u => u.isOnline && (Date.now() - (u.lastActive || 0) < 300000));
      const active24h = activeUsers.filter(u => (Date.now() - (u.lastActive || 0) < 86400000));
      const followersCount = users.filter(u => String(u.id).startsWith('F')).length;
      const totalComments = posts.reduce((sum, p) => sum + (p.comments?.length || 0), 0);

      // คัดลอกข้อความเชิญเข้าสมาคม
      const handleCopyInvite = (id) => {
        const link = window.location.origin + window.location.pathname;
        const msg = `ยินดีต้อนรับสู่ The Blue Moon Association 🪐\n\nลิงก์เข้าสู่เว็บไซต์: ${link}\n\nรหัสประจำตัวของคุณคือ: ${id}\nกรุณากดที่ "เปิดใช้งาน Member ID" ในหน้าเข้าสู่ระบบเพื่อตั้งชื่อ Username และรหัสผ่านสำหรับการเข้าใช้งานครับ`;
        navigator.clipboard.writeText(msg);
        setCopiedId(id);
        setTimeout(() => setCopiedId(null), 2500);
      };

  // สร้างรหัสสมาชิกใหม่
      const handleCreateId = async (e) => {
        e.preventDefault();
        const id = newMId.trim().toUpperCase();
        if (!id) return;
        if (users.some(u => String(u.id).toUpperCase() === id)) {
          return alert(`รหัส ${id} มีอยู่ในระบบแล้ว!`);
        }

        const newUserObj = {
          id,
          memberTag: newMTags[0] || 'Others',
          memberTags: newMTags.length ? newMTags : ['Others'],
          role: 'member',
          isActivated: false,
          isOnline: false,
          lastActive: 0,
          username: '',
          password: '',
          displayName: `รออนุมัติ (${id})`,
          bio: hostMemberId ? `ผู้ติดตามของสมาชิก ${hostMemberId}` : '',
          avatarUrl: '',
          socialLinks: [],
          usernameChangeHistory: [],
          joinedAt: new Date().toISOString().split('T')[0]
        };

        await db.collection('bma_users').doc(id).set(newUserObj);
        setLastCreatedUser(newUserObj);
        if (idType === 'M') setNewMId(getNextMId());
        else setHostMemberId('');
      };

      // กรองรายชื่อสมาชิกในตาราง
      const filteredMembers = users.filter(u => {
        if (statusFilter === 'ACTIVE' && !u.isActivated) return false;
        if (statusFilter === 'PENDING' && u.isActivated) return false;
        if (statusFilter === 'VICE' && u.role !== 'mod' && u.role !== 'admin') return false;
        if (statusFilter === 'FOLLOWER' && !String(u.id).startsWith('F')) return false;
        if (tagFilter !== 'ALL' && !getTags(u).includes(tagFilter)) return false;
        if (searchMember.trim()) {
          const q = searchMember.toLowerCase();
          const matchId = String(u.id).toLowerCase().includes(q);
          const matchName = (u.displayName || '').toLowerCase().includes(q);
          const matchUser = (u.username || '').toLowerCase().includes(q);
          if (!matchId && !matchName && !matchUser) return false;
        }
        return true;
      });

      return (
        <div className="space-y-5 text-xs pb-10">
          {/* แถบสลับหน้าย่อยของ Owner */}
          <div className="card p-3 flex flex-wrap items-center justify-between gap-3 bg-[#0B1325] border-[#1E3A5F]">
            <div className="flex items-center gap-2.5">
              <div className="w-9 h-9 rounded-xl bg-amber-400/20 border border-amber-400/50 flex items-center justify-center text-lg">👑</div>
              <div>
                <h2 className="text-sm font-bold text-white">Owner Control Center</h2>
                <p className="text-[10px] text-slate-400">ระบบจัดการและสถิติภาพรวม The Blue Moon Association</p>
              </div>
            </div>
            <div className="flex bg-[#050811] p-1 rounded-xl border border-[#1E3A5F] gap-1">
              <button 
                onClick={() => setSubTab('dashboard')} 
                className={`px-3.5 py-1.5 rounded-lg font-bold transition-all ${subTab === 'dashboard' ? 'bg-amber-400 text-[#050811] shadow' : 'text-slate-400 hover:text-white'}`}
              >
                📊 ภาพรวม & ออกรหัสด่วน
              </button>
              <button 
                onClick={() => setSubTab('members')} 
                className={`px-3.5 py-1.5 rounded-lg font-bold transition-all flex items-center gap-1.5 ${subTab === 'members' ? 'bg-amber-400 text-[#050811] shadow' : 'text-slate-400 hover:text-white'}`}
              >
                <span>👥 จัดการสมาชิก</span>
                <span className={`px-1.5 py-0.2 rounded-full text-[10px] font-mono ${subTab === 'members' ? 'bg-[#050811] text-amber-400' : 'bg-[#0F2547] text-sky-300'}`}>{users.length}</span>
              </button>
            </div>
          </div>

          {/* ========================================== */}
          {/* TAB 1: DASHBOARD & SMART ID GENERATOR      */}
          {/* ========================================== */}
          {subTab === 'dashboard' && (
            <div className="space-y-5 animate-fade-in">
              {/* การ์ดสรุปสถิติ 4 ช่อง */}
              <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                <div className="card p-4 bg-gradient-to-br from-[#0B1325] to-[#070C18] border-[#1E3A5F] relative overflow-hidden">
                  <div className="text-[10px] text-sky-400 font-bold uppercase tracking-wider">สมาชิกที่เปิดใช้งาน</div>
                  <div className="text-2xl font-bold font-mono text-white mt-1">
                    {activeUsers.length} <span className="text-xs text-slate-400 font-normal">/ {users.length}</span>
                  </div>
                  <div className="text-[10px] text-slate-400 mt-2 flex justify-between">
                    <span>รออนุมัติ: <strong className="text-amber-300">{pendingUsers.length}</strong></span>
                    <span>ผู้ติดตาม: <strong className="text-sky-300">{followersCount}</strong></span>
                  </div>
                </div>

                <div className="card p-4 bg-gradient-to-br from-[#0B1325] to-[#070C18] border-[#1E3A5F]">
                  <div className="text-[10px] text-emerald-400 font-bold uppercase tracking-wider">สถานะการออนไลน์</div>
                  <div className="text-2xl font-bold font-mono text-emerald-400 mt-1 flex items-center gap-2">
                    <span>{onlineNow.length}</span>
                    <span className="text-[10px] px-2 py-0.5 rounded-full bg-emerald-950 border border-emerald-700 text-emerald-300 font-sans">Online</span>
                  </div>
                  <div className="text-[10px] text-slate-400 mt-2">
                    แอคทีฟใน 24 ชม.: <strong className="text-white">{active24h.length} คน</strong>
                  </div>
                </div>

                <div className="card p-4 bg-gradient-to-br from-[#0B1325] to-[#070C18] border-[#1E3A5F]">
                  <div className="text-[10px] text-amber-400 font-bold uppercase tracking-wider">กระดานโพสต์ (Board)</div>
                  <div className="text-2xl font-bold font-mono text-white mt-1">{posts.length}</div>
                  <div className="text-[10px] text-slate-400 mt-2">
                    ความคิดเห็นรวม: <strong className="text-amber-300">{totalComments} รายการ</strong>
                  </div>
                </div>

                <div className="card p-4 bg-gradient-to-br from-[#0B1325] to-[#070C18] border-[#1E3A5F]">
                  <div className="text-[10px] text-purple-400 font-bold uppercase tracking-wider">ระบบแชต & กิจกรรม</div>
                  <div className="text-2xl font-bold font-mono text-white mt-1">{chatMessages.length}</div>
                  <div className="text-[10px] text-slate-400 mt-2 flex justify-between">
                    <span>กลุ่มแชต: <strong className="text-purple-300">{groups?.length || 0}</strong></span>
                    <span>อีเวนต์: <strong className="text-sky-300">{bmaEvents?.length || 0}</strong></span>
                  </div>
                </div>
              </div>

              {/* โซนออกรหัสสมาชิกใหม่ (Revamped ID Generator) */}
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
                <div className="lg:col-span-7 card p-5 space-y-4 border-sky-500/40 shadow-xl">
                  <div className="flex items-center justify-between border-b border-[#1E3A5F] pb-3">
                    <div>
                      <h3 className="text-sm font-bold text-amber-300 flex items-center gap-1.5">✨ ออกรหัสประจำตัวใหม่ (ID Generator)</h3>
                      <p className="text-[10px] text-slate-400 mt-0.5">เลือกประเภทสมาชิกและหมวดหมู่เพื่อสร้างรหัสเข้าใช้งาน</p>
                    </div>
                    <div className="flex bg-[#050811] p-1 rounded-xl border border-[#1E3A5F] gap-1">
                      <button 
                        type="button" 
                        onClick={() => setIdType('M')} 
                        className={`px-3 py-1 rounded-lg font-bold text-[11px] transition-all ${idType === 'M' ? 'bg-white text-[#050811]' : 'text-slate-400 hover:text-white'}`}
                      >
                        🪐 Member (M)
                      </button>
                      <button 
                        type="button" 
                        onClick={() => setIdType('F')} 
                        className={`px-3 py-1 rounded-lg font-bold text-[11px] transition-all ${idType === 'F' ? 'bg-sky-400 text-[#050811]' : 'text-slate-400 hover:text-white'}`}
                      >
                        🛰️ Follower (F)
                      </button>
                    </div>
                  </div>

                  <form onSubmit={handleCreateId} className="space-y-4">
                    {idType === 'F' && (
                      <div className="p-3 rounded-xl bg-[#050811] border border-sky-500/40 space-y-2">
                        <label className="block text-[11px] font-bold text-sky-300">🔗 เลือกสมาชิกหลักที่พาผู้ติดตามมา (1 คนต่อ 1 ผู้ติดตาม)</label>
                        <select 
                          value={hostMemberId} 
                          onChange={(e) => {
                            const mId = e.target.value;
                            setHostMemberId(mId);
                            const hostUser = users.find(u => u.id === mId);
                            if (hostUser) setNewMTags(getTags(hostUser));
                          }} 
                          className="w-full inp py-1.5 text-xs bg-[#0B1325]"
                        >
                          <option value="">-- กำหนดรหัส F เองโดยไม่ผูกเลข --</option>
                          {users.filter(u => String(u.id).startsWith('M')).map(m => {
                            const fId = 'F' + String(m.id).substring(1);
                            const hasFollower = users.some(x => x.id === fId);
                            return (
                              <option key={m.id} value={m.id} disabled={hasFollower}>
                                {m.id} - {m.displayName} {hasFollower ? `(มีผู้ติดตาม ${fId} แล้ว)` : `(จะได้รับรหัส ${fId})`}
                              </option>
                            );
                          })}
                        </select>
                      </div>
                    )}

                    <div className="flex flex-col sm:flex-row gap-3">
                      <div className="sm:w-40">
                        <label className="block text-[10px] text-slate-400 font-bold mb-1">รหัสที่จะออก (แก้ไขได้)</label>
                        <input 
                          type="text" 
                          value={newMId} 
                          onChange={(e) => setNewMId(e.target.value)} 
                          className={`w-full inp font-mono font-bold text-base text-center uppercase ${idType === 'F' ? 'text-sky-300 border-sky-500/50' : 'text-amber-300 border-amber-500/50'}`} 
                          required 
                        />
                      </div>
                      <div className="flex-1">
                        <label className="block text-[10px] text-slate-400 font-bold mb-1">สร้างหมวดหมู่ (Tag) ใหม่เพิ่มเติม</label>
                        <div className="flex gap-2">
                          <input 
                            type="text" 
                            value={cTag} 
                            onChange={(e) => setCTag(e.target.value)} 
                            placeholder="พิมพ์ชื่อหมวดหมู่ใหม่..." 
                            className="flex-1 inp" 
                          />
                          <button 
                            type="button" 
                            onClick={() => { 
                              if (cTag.trim() && !newMTags.includes(cTag.trim())) setNewMTags([...newMTags, cTag.trim()]); 
                              setCTag(''); 
                            }} 
                            className="btn-b shrink-0"
                          >
                            + เพิ่มแท็ก
                          </button>
                        </div>
                      </div>
                    </div>

                    <div>
                      <label className="block text-[10px] text-slate-400 font-bold mb-1.5">เลือกหมวดหมู่ของสมาชิกนี้ (เลือกได้มากกว่า 1)</label>
