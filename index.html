    // ------------------------------------------
    function CheckersInner({ gameData, isPlayer1, isPlayer2, isSpectator, gameId, db, currentUser }) {
        const [selected, setSelected] = useState(null);
        const [validMoves, setValidMoves] = useState([]);
        const flatBoard = gameData.gameState?.board || Array(64).fill(null);
        const board = [];
        for(let i=0; i<8; i++) board.push([...flatBoard.slice(i*8, i*8+8)]);
        const turn = gameData.gameState?.turn || 1;
        const myP = isPlayer1 ? 1 : 2;

        const getMoves = (r, c, p, k) => {
            const dirs = k ? [[-1,-1],[-1,1],[1,-1],[1,1]] : p===1 ? [[-1,-1],[-1,1]] : [[1,-1],[1,1]];
            const moves = [];
            dirs.forEach(([dr,dc]) => {
                let nr=r+dr, nc=c+dc;
                if(nr>=0&&nr<8&&nc>=0&&nc<8) {
                    if(!board[nr][nc]) moves.push({r:nr, c:nc, cap:null});
                    else if(board[nr][nc].p !== p) {
                        let nnr=nr+dr, nnc=nc+dc;
                        if(nnr>=0&&nnr<8&&nnc>=0&&nnc<8 && !board[nnr][nnc]) {
                            moves.push({r:nnr, c:nnc, cap:{r:nr, c:nc}});
                        }
                    }
                }
            });
            return moves;
        };

        const onClick = async (r, c) => {
            if(gameData.status !== 'playing' || isSpectator || turn !== myP) return;
            
            const actualR = isPlayer2 ? 7-r : r;
            const actualC = isPlayer2 ? 7-c : c;

            if(!selected) {
                const piece = board[actualR][actualC];
                if(piece && piece.p === myP) {
                    setSelected({r: actualR, c: actualC});
                    setValidMoves(getMoves(actualR, actualC, piece.p, piece.k));
                }
            } else {
                if(actualR===selected.r && actualC===selected.c) { setSelected(null); setValidMoves([]); return; }
                const move = validMoves.find(m => m.r===actualR && m.c===actualC);
                if(move) {
                    let newB = board.map(row=>[...row]);
                    const piece = newB[selected.r][selected.c];
                    newB[selected.r][selected.c] = null;
                    if((myP===1 && actualR===0) || (myP===2 && actualR===7)) piece.k = true;
                    newB[actualR][actualC] = piece;
                    if(move.cap) newB[move.cap.r][move.cap.c] = null;
                    
                    let eCnt = 0; newB.forEach(row=>row.forEach(cell=>{if(cell&&cell.p!==myP)eCnt++;}));
                    let st = eCnt===0 ? 'ended' : 'playing';
                    
                    await db.collection('bma_chat_games').doc(gameId).update({
                        'gameState.board': newB.reduce((a,b)=>a.concat(b), []), 'gameState.turn': myP===1?2:1, status: st, winner: st==='ended' ? currentUser.id : null
                    });
                }
                setSelected(null); setValidMoves([]);
            }
        };

        return (
            <div className="border-4 border-[#0F2547] p-1 bg-[#050811] rounded-lg w-full flex justify-center">
                <div className="grid grid-cols-8 grid-rows-8 w-64 h-64 sm:w-80 sm:h-80">
                    {board.map((row, visualR) => row.map((cell, visualC) => {
                        const r = isPlayer2 ? 7-visualR : visualR;
                        const c = isPlayer2 ? 7-visualC : visualC;
                        const isDark = (r+c)%2===1;
                        let bg = isDark ? '#8B4513' : '#DEB887';
                        const isSel = selected?.r===r && selected?.c===c;
                        const isMove = validMoves.some(m=>m.r===r&&m.c===c);
                        if(isSel) bg = '#F59E0B'; else if(isMove) bg = '#34D399';
                        
                        const renderCell = board[r][c];

                        return (
                            <div key={`${r}-${c}`} onClick={()=>onClick(visualR,visualC)} style={{backgroundColor: bg}} className="flex items-center justify-center">
                                {renderCell && <div className={`w-[80%] h-[80%] rounded-full shadow-md flex items-center justify-center ${renderCell.p===1?'bg-red-600':'bg-slate-800 border-2 border-slate-600'}`}>{renderCell.k && <span className="text-white text-xs">♚</span>}</div>}
                            </div>
                        );
                    }))}
                </div>
            </div>
        );
    }

    // ------------------------------------------
    // 5.3 บันไดงู (Snakes & Ladders)
    // ------------------------------------------
    function SnlInner({ gameData, isPlayer1, isPlayer2, isSpectator, gameId, db, getAuthor, currentUser }) {
        const pNum = gameData.players.length;
        const p1 = gameData.gameState?.p1 || 1;
        const p2 = gameData.gameState?.p2 || 1;
        const p3 = gameData.gameState?.p3 || 1;
        const p4 = gameData.gameState?.p4 || 1;
        const positions = [p1, p2, p3, p4];
        const turn = gameData.gameState?.turn || 1;
        const myPIdx = gameData.players.indexOf(currentUser?.id);
        const myP = myPIdx !== -1 ? myPIdx + 1 : turn;

        const snakes = { 16:6, 47:26, 49:11, 56:53, 62:19, 64:60, 87:24, 93:73, 95:75, 98:78 };
        const ladders = { 1:38, 4:14, 9:31, 21:42, 28:84, 36:44, 51:67, 71:91, 80:100 };

        const playDiceSound = () => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                for(let i=0; i<3; i++) {
                    setTimeout(() => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(400 + Math.random()*200, ctx.currentTime);
                        gain.gain.setValueAtTime(0.1, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
                        osc.connect(gain); gain.connect(ctx.destination);
                        osc.start(); osc.stop(ctx.currentTime + 0.05);
                    }, i*80);
                }
            } catch(e) {}
        };

        const rollDice = async () => {
            if(gameData.status !== 'playing' || isSpectator || turn !== myP) return;
            playDiceSound();
            const roll = Math.floor(Math.random() * 6) + 1;
            let nPos = positions[myP-1] + roll;
            if(nPos > 100) nPos = 100 - (nPos - 100);
            if(snakes[nPos]) nPos = snakes[nPos];
            if(ladders[nPos]) nPos = ladders[nPos];

            let nextTurn = turn + 1;
            if(nextTurn > pNum) nextTurn = 1;

            const upd = { [`gameState.p${myP}`]: nPos, 'gameState.lastRoll': roll, 'gameState.turn': nextTurn };
            if(nPos === 100) { upd.status = 'ended'; upd.winner = gameData.players[myP-1]; }
            await db.collection('bma_chat_games').doc(gameId).update(upd);
        };

        const getPos = (num) => {
            const r = 9 - Math.floor((num-1)/10);
            const c = Math.floor((num-1)/10) % 2 === 0 ? (num-1)%10 : 9 - ((num-1)%10);
            return { x: c*10+5, y: r*10+5 };
        };

        const renderCells = () => {
            let cells = [];
            const bgColors = ['bg-blue-600', 'bg-red-600', 'bg-yellow-500', 'bg-purple-600'];
            for(let r=9; r>=0; r--) {
                for(let c=0; c<10; c++) {
                    let num = r%2===0 ? r*10+c+1 : r*10+(9-c)+1;
                    cells.push(
                        <div key={num} className={`relative flex items-center justify-center text-[10px] font-bold border border-black/20 ${ladders[num]?'bg-sky-200 text-sky-900':snakes[num]?'bg-red-200 text-red-900':num%2===0?'bg-emerald-100 text-emerald-900':'bg-emerald-50 text-emerald-800'}`}>
                            {num}
                            <div className="absolute inset-0 flex flex-wrap items-center justify-center gap-[1px] pointer-events-none z-20 p-0.5">
                                {gameData.players.map((pid, idx) => {
                                    if(positions[idx] !== num) return null;
                                    const u = getAuthor(pid);
                                    if (u && u.avatarUrl) {
                                        return <img key={idx} src={u.avatarUrl} className={`w-3.5 h-3.5 sm:w-4 sm:h-4 rounded-full border border-white shadow-lg object-cover z-20`} alt="" />;
                                    }
                                    return <div key={idx} className={`w-3.5 h-3.5 sm:w-4 sm:h-4 rounded-full ${bgColors[idx]} border border-white shadow-lg z-20 flex items-center justify-center text-[6px] text-white`}>{idx+1}</div>;
                                })}
                            </div>
                        </div>
                    );
                }
            }
            return cells;
        };

        return (
            <div className="flex flex-col items-center space-y-4 w-full">
                <div className="relative w-64 h-64 sm:w-80 sm:h-80 border-4 border-[#0F2547] rounded-lg bg-emerald-50 overflow-hidden">
                    <svg className="absolute inset-0 w-full h-full pointer-events-none z-10 drop-shadow-md">
                        {Object.entries(ladders).map(([start, end]) => {
                            const s = getPos(Number(start)), e = getPos(end);
                            return <line key={`l-${start}`} x1={`${s.x}%`} y1={`${s.y}%`} x2={`${e.x}%`} y2={`${e.y}%`} stroke="#059669" strokeWidth="6" strokeDasharray="6 4" opacity="0.8" />;
                        })}
                        {Object.entries(snakes).map(([start, end]) => {
                            const s = getPos(Number(start)), e = getPos(end);
                            return <line key={`s-${start}`} x1={`${s.x}%`} y1={`${s.y}%`} x2={`${e.x}%`} y2={`${e.y}%`} stroke="#DC2626" strokeWidth="4" opacity="0.9" />;
                        })}
                    </svg>
                    <div className="grid grid-cols-10 grid-rows-10 w-full h-full absolute inset-0 z-0">
                        {renderCells()}
                    </div>
                </div>
                <div className="flex items-center gap-4">
                    <div className="text-xl w-8">🎲 {gameData.gameState?.lastRoll || '-'}</div>
                    <button onClick={rollDice} disabled={gameData.status!=='playing' || isSpectator || turn!==myP} className="btn-w text-sm py-2 px-6 shadow-xl disabled:opacity-50">
                        {turn===myP ? 'ทอยลูกเต๋า' : 'รอคู่แข่ง...'}
                    </button>
                </div>
                <div className="text-[10px] text-slate-400 flex flex-wrap justify-center gap-2">
                   {gameData.players.map((pid, i) => (
                      <span key={pid}>ผู้เล่น {i+1} ({getAuthor(pid).displayName})</span>
                   ))}
                </div>
            </div>
        );
    }

    // ------------------------------------------
    // 5.4 Connect 4
    // ------------------------------------------
    function Connect4Inner({ gameData, isPlayer1, isPlayer2, isSpectator, gameId, db, currentUser }) {
        const rawB = gameData.gameState?.board; 
        const board = rawB ? (rawB[0]?.cols ? rawB.map(r => r.cols) : rawB) : Array(6).fill(null).map(()=>Array(7).fill(0));
        const turn = gameData.gameState?.turn || 1;
        const myP = isPlayer1 ? 1 : 2;

        const checkWin = (b, p) => {
            for(let r=0; r<6; r++) {
                for(let c=0; c<7; c++) {
                    if(b[r][c] !== p) continue;
                    if(c+3 < 7 && b[r][c+1]===p && b[r][c+2]===p && b[r][c+3]===p) return true;
                    if(r+3 < 6 && b[r+1][c]===p && b[r+2][c]===p && b[r+3][c]===p) return true;
                    if(c+3 < 7 && r+3 < 6 && b[r+1][c+1]===p && b[r+2][c+2]===p && b[r+3][c+3]===p) return true;
                    if(c-3 >= 0 && r+3 < 6 && b[r+1][c-1]===p && b[r+2][c-2]===p && b[r+3][c-3]===p) return true;
                }
            }
            return false;
        };

        const dropPiece = async (col) => {
            if(gameData.status !== 'playing' || isSpectator || turn !== myP) return;
            let newB = board.map(row => [...row]);
            let placedRow = -1;
            for(let r=5; r>=0; r--) {
                if(newB[r][col] === 0) {
                    newB[r][col] = myP;
                    placedRow = r;
                    break;
                }
            }
            if(placedRow === -1) return;

            let st = 'playing'; let w = null;
            if(checkWin(newB, myP)) {
                st = 'ended'; w = currentUser.id;
            } else if(newB[0].every(c => c !== 0)) {
                st = 'ended'; w = 'draw';
            }

            await db.collection('bma_chat_games').doc(gameId).update({
                'gameState.board': newB.map(row => ({cols: row})), 'gameState.turn': myP===1?2:1, status: st, winner: w
            });
        };

        return (
            <div className="bg-blue-700 p-2 sm:p-3 rounded-xl flex gap-1 sm:gap-2 cursor-pointer w-full max-w-[360px] mx-auto shadow-2xl border-4 border-blue-900">
                {Array(7).fill(0).map((_, c) => (
                    <div key={c} className="flex flex-col gap-1 sm:gap-2 flex-1 hover:bg-white/10 rounded-full transition-colors pb-1" onClick={() => dropPiece(c)}>
                        {board.map((row, r) => (
                            <div key={r} className="aspect-square rounded-full bg-[#050811] flex items-center justify-center border-[3px] border-blue-800 shadow-inner">
                                {row[c] === 1 && <div className="w-[85%] h-[85%] rounded-full bg-red-500 shadow-[inset_0_-4px_6px_rgba(0,0,0,0.4)]"></div>}
                                {row[c] === 2 && <div className="w-[85%] h-[85%] rounded-full bg-yellow-400 shadow-[inset_0_-4px_6px_rgba(0,0,0,0.4)]"></div>}
                            </div>
                        ))}
                    </div>
                ))}
            </div>
        );
    }

    // ------------------------------------------
    // 5.5 โดมิโน (Domino)
    // ------------------------------------------
    function DominoInner({ gameData, isPlayer1, isPlayer2, isSpectator, gameId, db, currentUser }) {
        const gs = gameData.gameState || {};
        const turn = gs.turn || 1;
        const myP = isPlayer1 ? 1 : 2;
        const myHand = myP === 1 ? (gs.p1Hand||[]) : (gs.p2Hand||[]);
        const oppHandLen = myP === 1 ? (gs.p2Hand||[]).length : (gs.p1Hand||[]).length;
        const boardPieces = gs.boardPieces || [];
        const deck = gs.deck || [];
        const hasDrawn = gs.hasDrawn || false;

        const [selIdx, setSelIdx] = useState(null);
        const boardRef = useRef(null);

        const leftEnd = boardPieces.length > 0 ? boardPieces[0].l : null;
        const rightEnd = boardPieces.length > 0 ? boardPieces[boardPieces.length-1].r : null;

        const canPlayLeft = (d) => d.l === leftEnd || d.r === leftEnd;
        const canPlayRight = (d) => d.l === rightEnd || d.r === rightEnd;
        const hasAnyMove = myHand.some(d => canPlayLeft(d) || canPlayRight(d));

        useEffect(() => {
            if (boardRef.current) {
                boardRef.current.scrollTo({ left: boardRef.current.scrollWidth, behavior: 'smooth' });
            }
        }, [boardPieces.length]);

        const playDomino = async (idx, side) => {
            if(gameData.status !== 'playing' || isSpectator || turn !== myP) return;
            const d = myHand[idx];
            let newBoard = [...boardPieces];
            let newHand = [...myHand];
            newHand.splice(idx, 1);

            if(side === 'left') {
                if(d.r === leftEnd) newBoard.unshift({l: d.l, r: d.r});
                else newBoard.unshift({l: d.r, r: d.l});
            } else {
                if(d.l === rightEnd) newBoard.push({l: d.l, r: d.r});
                else newBoard.push({l: d.r, r: d.l});
            }

            let st = 'playing'; let w = null;
            if(newHand.length === 0) {
                st = 'ended'; w = currentUser.id;
            }

            const upd = { 
                [`gameState.p${myP}Hand`]: newHand, 
                'gameState.boardPieces': newBoard, 
                'gameState.turn': myP===1?2:1, 
                'gameState.hasDrawn': false,
                'gameState.passCount': 0,
                status: st, 
                winner: w 
            };
            await db.collection('bma_chat_games').doc(gameId).update(upd);
            setSelIdx(null);
            
            setTimeout(() => {
                if (boardRef.current) {
                    if (side === 'left') boardRef.current.scrollTo({ left: 0, behavior: 'smooth' });
                    else boardRef.current.scrollTo({ left: boardRef.current.scrollWidth, behavior: 'smooth' });
                }
            }, 100);
        };

        const drawDomino = async () => {
            if(gameData.status !== 'playing' || isSpectator || turn !== myP || hasAnyMove || deck.length === 0) return;
            const newDeck = [...deck];
            const newPiece = newDeck.pop();
            const newHand = [...myHand, newPiece];
            await db.collection('bma_chat_games').doc(gameId).update({
                [`gameState.p${myP}Hand`]: newHand,
                'gameState.deck': newDeck
            });
        };

        const passTurn = async () => {
            if(gameData.status !== 'playing' || isSpectator || turn !== myP || hasAnyMove || deck.length > 0) return;

            const newPassCount = (gs.passCount || 0) + 1;
            let st = 'playing'; let w = null;
            if(newPassCount >= 2) {
                st = 'ended'; w = 'draw';
            }

            await db.collection('bma_chat_games').doc(gameId).update({
                'gameState.turn': myP===1?2:1,
                'gameState.passCount': newPassCount,
                status: st, winner: w
            });
        };

        const DmTile = ({d, isH, onClick, sel}) => {
            const Pip = () => <div className="w-[6px] h-[6px] sm:w-[7px] sm:h-[7px] bg-slate-800 rounded-full drop-shadow-sm" />;
            const renderPips = (num) => {
                const pips = Array(9).fill(null);
                if(num === 1) pips[4] = <Pip/>;
                if(num === 2) { pips[0] = <Pip/>; pips[8] = <Pip/>; }
                if(num === 3) { pips[0] = <Pip/>; pips[4] = <Pip/>; pips[8] = <Pip/>; }
                if(num === 4) { pips[0] = <Pip/>; pips[2] = <Pip/>; pips[6] = <Pip/>; pips[8] = <Pip/>; }
                if(num === 5) { pips[0] = <Pip/>; pips[2] = <Pip/>; pips[4] = <Pip/>; pips[6] = <Pip/>; pips[8] = <Pip/>; }
                if(num === 6) { pips[0] = <Pip/>; pips[2] = <Pip/>; pips[3] = <Pip/>; pips[5] = <Pip/>; pips[6] = <Pip/>; pips[8] = <Pip/>; }
                
                return (
                    <div className="grid grid-cols-3 grid-rows-3 w-full h-full p-[3px] place-items-center gap-[1px]">
                        {pips.map((p, i) => <div key={i} className="flex items-center justify-center w-full h-full">{p}</div>)}
                    </div>
                );
            };

            return (
                <div onClick={onClick} className={`flex ${isH?'flex-row w-[56px] h-[28px] sm:w-[72px] sm:h-[36px]':'flex-col w-[28px] h-[56px] sm:w-[36px] sm:h-[72px]'} bg-white rounded shadow-[0_2px_4px_rgba(0,0,0,0.4)] cursor-pointer border-[1px] border-slate-300 items-center justify-center shrink-0 ${sel?'ring-4 ring-amber-400 scale-110 -translate-y-2':''} transition-all overflow-hidden`}>
                    <div className="flex-1 w-full h-full relative">{renderPips(isH ? d.l : d.l)}</div>
                    <div className={`${isH?'w-[1.5px] h-full':'w-full h-[1.5px]'} bg-slate-300 shadow-sm z-10`} />
                    <div className="flex-1 w-full h-full relative">{renderPips(isH ? d.r : d.r)}</div>
                </div>
            );
        };

        return (
            <div className="flex flex-col items-center w-full space-y-4">
                <div className="text-xs text-slate-400 font-bold px-4 py-1.5 bg-[#0F2547] rounded-full border border-[#1E3A5F] shadow-sm">ไพ่คู่แข่ง: {oppHandLen} ใบ | กองจั่ว: {deck.length} ใบ</div>
                
                <div ref={boardRef} className="w-full h-44 sm:h-56 bg-[#166534] rounded-xl border-[6px] border-amber-950 overflow-auto shadow-[inset_0_10px_20px_rgba(0,0,0,0.6)] relative custom-scrollbar">
                    <div className="flex flex-wrap content-start items-center gap-[1px] p-6 min-w-max h-full">
                        {boardPieces.length === 0 ? (
                            <div className="text-emerald-900/60 font-bold text-2xl w-full text-center tracking-wider pt-10">🀱 กระดานว่างเปล่า</div>
                        ) : (
                            boardPieces.map((p, i) => <DmTile key={i} d={p} isH={true} />)
                        )}
                    </div>
                </div>

                {selIdx !== null && turn === myP && !isSpectator && (
                    <div className="flex gap-2">
                        {canPlayLeft(myHand[selIdx]) && <button onClick={()=>playDomino(selIdx, 'left')} className="btn-b py-2 px-4 text-xs bg-sky-600 border-sky-400 shadow-lg hover:scale-105 transition-transform">👈 ต่อฝั่งซ้าย</button>}
                        {canPlayRight(myHand[selIdx]) && <button onClick={()=>playDomino(selIdx, 'right')} className="btn-b py-2 px-4 text-xs bg-emerald-600 border-emerald-400 shadow-lg hover:scale-105 transition-transform">ต่อฝั่งขวา 👉</button>}
                        {!canPlayLeft(myHand[selIdx]) && !canPlayRight(myHand[selIdx]) && <div className="text-red-400 text-xs py-2 px-2 font-bold animate-pulse">ต่อไม่ได้!</div>}
                        <button onClick={()=>setSelIdx(null)} className="btn-d py-2 px-4 text-xs border-red-900/50 hover:bg-red-950 transition-colors">ยกเลิก</button>
                    </div>
                )}

                {turn === myP && !isSpectator && (
                    <div className="flex gap-2 items-center bg-[#0F2547] p-2 rounded-xl border border-[#1E3A5F] justify-center mt-2 shadow-lg">
                        {!hasAnyMove && <div className="text-amber-400 text-xs font-bold px-2">ไม่มีไพ่ลงได้!</div>}
                        {(!hasAnyMove && deck.length > 0) && (
                            <button onClick={drawDomino} className="btn-w py-1.5 px-4 text-xs border-amber-500 shadow hover:scale-105 transition-transform">🃏 จั่วไพ่</button>
                        )}
                        {(!hasAnyMove && deck.length === 0) && (
                            <button onClick={passTurn} className="btn-b py-1.5 px-4 text-xs text-red-300 border-red-500/50 hover:bg-red-950 transition-colors">⏭️ ข้ามตา</button>
                        )}
                    </div>
                )}

                <div className="w-full pt-2">
                    <div className="text-xs font-bold mb-3 text-center text-sky-300 tracking-widest uppercase">ไพ่ในมือของคุณ</div>
                    <div className="flex flex-wrap justify-center gap-2 sm:gap-3 p-3 border border-dashed border-[#1E3A5F] rounded-xl bg-[#0B1325]/50 shadow-inner">
                        {!isSpectator ? (myHand.length > 0 ? myHand.map((d, i) => (
                            <DmTile key={i} d={d} isH={false} onClick={()=>setSelIdx(i)} sel={selIdx===i} />
                        )) : <div className="text-emerald-400 py-4 font-bold animate-pulse">🎉 ไพ่หมดมือแล้ว!</div>) : <div className="text-xs text-slate-500 py-4 font-bold">👀 คุณเป็นผู้ชม</div>}
                    </div>
                </div>
            </div>
        );
    }

    // ------------------------------------------
    // 5.6 Super Tic-Tac-Toe
    // ------------------------------------------
    function StttInner({ gameData, isPlayer1, isPlayer2, isSpectator, gameId, db, currentUser }) {
        const gs = gameData.gameState || {};
        const board = gs.board || Array(9).fill().map(()=>Array(9).fill(0));
        const wonBoards = gs.wonBoards || Array(9).fill(0);
        const activeBoard = gs.activeBoard ?? -1;
        const turn = gs.turn || 1;
        const myP = isPlayer1 ? 1 : 2;

        const checkWin3x3 = (b, p) => {
            const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for(let l of lines) if(b[l[0]]===p && b[l[1]]===p && b[l[2]]===p) return true;
            return false;
        };

        const onClick = async (bIdx, cIdx) => {
            if(gameData.status !== 'playing' || isSpectator || turn !== myP) return;
            if(activeBoard !== bIdx && activeBoard !== -1) return;
            if(wonBoards[bIdx] !== 0 || board[bIdx][cIdx] !== 0) return;

            let newB = board.map(r => [...r]);
            newB[bIdx][cIdx] = myP;

            let newW = [...wonBoards];
            if(checkWin3x3(newB[bIdx], myP)) newW[bIdx] = myP;
            else if(newB[bIdx].every(c => c !== 0)) newW[bIdx] = 3;

            let st = 'playing'; let w = null;
            if(checkWin3x3(newW, myP)) { st = 'ended'; w = currentUser.id; }
            else if(newW.every(b => b !== 0)) { st = 'ended'; w = 'draw'; }

            let nextActive = -1;
            if (st === 'playing') {
                const available = [];
                for(let i=0; i<9; i++) if(newW[i] === 0) available.push(i);
                if(available.length > 0) nextActive = available[Math.floor(Math.random() * available.length)];
            }

            await db.collection('bma_chat_games').doc(gameId).update({
                'gameState.board': newB, 'gameState.wonBoards': newW, 'gameState.activeBoard': nextActive,
                'gameState.turn': myP===1?2:1, status: st, winner: w
            });
        };

        return (
            <div className="flex flex-col items-center space-y-4 w-full text-center">
                <div className="text-xs font-bold px-4 py-1.5 rounded-full bg-[#0F2547] border border-[#1E3A5F]">
                   {activeBoard !== -1 ? <span className="text-amber-300">กระดานที่สุ่มได้: บล็อกที่ {activeBoard+1}</span> : <span className="text-emerald-300">เลือกวางบล็อกไหนก็ได้</span>}
                </div>
                <div className="grid grid-cols-3 gap-1.5 sm:gap-2 bg-slate-600 p-1.5 sm:p-2 rounded-lg shadow-xl w-64 h-64 sm:w-80 sm:h-80 mx-auto border-4 border-slate-700">
                    {board.map((sub, bIdx) => {
                        const isAct = activeBoard === bIdx || activeBoard === -1;
                        const isWon = wonBoards[bIdx];
                        return (
                            <div key={bIdx} className={`grid grid-cols-3 gap-0.5 p-0.5 rounded ${isAct && isWon === 0 ? 'bg-amber-400 ring-2 ring-amber-400' : 'bg-slate-800'} relative`}>
                                {isWon !== 0 && (
                                    <div className="absolute inset-0 flex items-center justify-center z-10 bg-black/70 rounded backdrop-blur-[1px]">
                                        {isWon === 1 && <span className="text-4xl text-blue-500 font-bold drop-shadow-[0_0_5px_rgba(59,130,246,0.8)]">O</span>}
                                        {isWon === 2 && <span className="text-4xl text-red-500 font-bold drop-shadow-[0_0_5px_rgba(239,68,68,0.8)]">X</span>}
                                        {isWon === 3 && <span className="text-4xl text-slate-400 font-bold">-</span>}
                                    </div>
                                )}
                                {sub.map((cell, cIdx) => (
                                    <div key={cIdx} onClick={()=>onClick(bIdx, cIdx)} className="bg-[#050811] flex items-center justify-center cursor-pointer text-sm sm:text-lg font-bold">
                                        {cell === 1 && <span className="text-blue-500">O</span>}
                                        {cell === 2 && <span className="text-red-500">X</span>}
                                    </div>
                                ))}
                            </div>
                        )
                    })}
                </div>
                <div className="text-[10px] text-slate-400 mt-2 text-center px-4">
                  ผู้เล่น 1 (สีน้ำเงิน O), ผู้เล่น 2 (สีแดง X)
                </div>
            </div>
        )
    }

    // ------------------------------------------
    // 5.7 หน้าต่างแสดงผลเกม (Chat Game Modal)
    // ------------------------------------------
    function ChatGameModal({ gameId, currentUser, onClose, getAuthor, db, activeRoom, roomKey }) {
        const [gameData, setGameData] = useState(null);
        const [rematchTimer, setRematchTimer] = useState(15);

        useEffect(() => {
            const unsub = db.collection('bma_chat_games').doc(gameId).onSnapshot(s => {
                if(s.exists) {
                    const data = s.data();
                    if(data.status === 'waiting' && !data.players.includes(currentUser.id)) {
                        const isSnl = data.type === 'snl';
                        const maxP = isSnl ? 4 : 2;
                        if(data.players.length < maxP) {
                            const newPlayers = [...data.players, currentUser.id];
                            if(!isSnl && newPlayers.length === 2) {
                                db.collection('bma_chat_games').doc(gameId).update({
                                    players: newPlayers, status: 'playing', gameState: getInitState(data.type, data.timerSetting)
                                });
                            } else {
                                db.collection('bma_chat_games').doc(gameId).update({ players: newPlayers });
                            }
                        }
                    }
                    setGameData(data);
                }
            });
            return () => unsub();
        }, [gameId, currentUser.id, db]);

        useEffect(() => {
            if(gameData?.status === 'ended') {
                const interval = setInterval(() => {
                    setRematchTimer(t => t > 0 ? t - 1 : 0);
                }, 1000);
                return () => clearInterval(interval);
            } else {
                setRematchTimer(15);
            }
        }, [gameData?.status]);

        const getInitState = (type, timerSetting) => {
            if(type === 'chess') return { fen: 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1', wTime: timerSetting, bTime: timerSetting, lastMoveAt: Date.now() };
            if(type === 'checkers') {
                let board = Array(64).fill(null);
                for(let r=0;r<8;r++) for(let c=0;c<8;c++) {
                    if((r+c)%2!==0) {
                        if(r<3) board[r*8+c] = {p:2, k:false};
                        if(r>4) board[r*8+c] = {p:1, k:false};
                    }
                }
                return { board, turn: 1 };
            }
            if(type === 'snl') return { p1: 1, p2: 1, p3: 1, p4: 1, turn: 1, lastRoll: null };
            if(type === 'connect4') return { board: Array(6).fill(null).map(()=>({cols: Array(7).fill(0)})), turn: 1 };
            if(type === 'domino') {
                const all = [];
                for(let i=0; i<=6; i++) for(let j=i; j<=6; j++) all.push({l: i, r: j});
                for(let i=all.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1)); [all[i], all[j]] = [all[j], all[i]]; }
                return { p1Hand: all.slice(0,7), p2Hand: all.slice(7,14), boardPieces: [all[14]], deck: all.slice(15), turn: 1, hasDrawn: false, passCount: 0 };
            }
            if(type === 'sttt') return { board: Array(9).fill(null).map(()=>Array(9).fill(0)), wonBoards: Array(9).fill(0), activeBoard: -1, turn: 1 };
            return {};
        };

        if(!gameData) return <Modal title="Loading..." onClose={onClose}><div className="animate-pulse">Loading Game...</div></Modal>;

        const isPlayer1 = gameData.players[0] === currentUser.id;
        const isPlayer2 = gameData.players[1] === currentUser.id;
        const isSpectator = !isPlayer1 && !isPlayer2;

        const handleRematch = async () => {
            const rm = [...(gameData.rematch||[])];
            if(!rm.includes(currentUser.id)) {
                rm.push(currentUser.id);
                if(rm.length === 2) {
                    await db.collection('bma_chat_games').doc(gameId).update({ status: 'playing', gameState: getInitState(gameData.type, gameData.timerSetting), rematch: [], winner: null });
                } else {
                    await db.collection('bma_chat_games').doc(gameId).update({ rematch: rm });
                }

        };

        const handleShare = async () => {
            const mid = 'msg-' + Date.now() + Math.floor(Math.random()*1000);
            await db.collection('bma_messages').doc(mid).set({
                id: mid, roomKey, senderId: currentUser.id, receiverId: activeRoom.type==='dm'?activeRoom.id:null,
                text: '🏆 แชร์ผลการแข่งขัน: ' + (gameData.name || CHAT_GAMES_LIST[gameData.type]),
                isGameResult: true, gameId, gameType: gameData.type, gameName: gameData.name || CHAT_GAMES_LIST[gameData.type],
                gameResultData: { winner: gameData.winner },
                readBy: [currentUser.id], isDeleted: false, time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }), timestamp: Date.now(), serverCreatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });

        return (
            <Modal title={"🎮 " + (gameData.name || CHAT_GAMES_LIST[gameData.type])} onClose={onClose} maxW="max-w-3xl">
                <div className="flex flex-col gap-2 bg-[#0B1325] p-3 rounded-lg border border-[#1E3A5F] mb-4">
                    <div className="flex flex-wrap justify-center items-center gap-4">
                        {Array.from({length: gameData.type === 'snl' ? 4 : 2}).map((_, i) => {
                            const pId = gameData.players[i];
                            const isTurn = gameData.status === 'playing' && (gameData.gameState?.turn === i+1 || (i===0 && gameData.gameState?.turn==='w') || (i===1 && gameData.gameState?.turn==='b'));
                            if(!pId && gameData.type !== 'snl') return <div key={i} className="text-slate-500">รอผู้เล่น...</div>;
                            if(!pId) return null;
                            return (
                                <div key={i} className="flex items-center gap-2 bg-[#050811] px-3 py-1.5 rounded-full border border-white/10">
                                    <Avatar size="sm" user={getAuthor(pId)} />
                                    <span className={isTurn ? 'font-bold text-amber-300 text-xs' : 'text-slate-300 text-xs'}>{getAuthor(pId).displayName}</span>
                                </div>
                            );
                        })}
                    </div>
                    {gameData.status === 'waiting' && gameData.type === 'snl' && isPlayer1 && gameData.players.length >= 2 && (
                        <button onClick={() => db.collection('bma_chat_games').doc(gameId).update({ status: 'playing', gameState: getInitState('snl', null) })} className="btn-w text-xs py-1.5 px-6 self-center animate-pulse mt-2">▶ เริ่มเลย ({gameData.players.length}/4 คน)</button>
                    )}
                </div>

                {gameData.status === 'ended' && (
                    <div className="bg-amber-950/40 border border-amber-500/50 p-4 rounded-lg text-center mb-4">
                        <h2 className="text-xl font-bold text-amber-400 mb-2">เกมจบแล้ว!</h2>
                        <p className="mb-4 text-sm font-bold">ผู้ชนะ: {gameData.winner === 'draw' ? 'เสมอ' : getAuthor(gameData.winner)?.displayName}</p>
                        <div className="flex gap-2 justify-center">
                            {!isSpectator && rematchTimer > 0 && (
                                <button onClick={handleRematch} disabled={(gameData.rematch||[]).includes(currentUser.id)} className="btn-w text-xs px-3">
                                    {(gameData.rematch||[]).includes(currentUser.id) ? 'รอคู่แข่งยืนยัน...' : `เล่นอีกครั้ง (${rematchTimer}s)`}
                                </button>
                            )}
                            <button onClick={handleShare} className="btn-b text-sky-300 border-sky-400/50 text-xs">📤 แชร์ผลลัพธ์ลงแชต</button>
                        </div>
                    </div>
                )}

                <div className="flex flex-col md:flex-row gap-4">
                    <div className="w-full md:w-1/3 bg-[#0B1325] p-4 rounded-xl border border-[#1E3A5F] text-xs h-fit max-h-48 md:max-h-full overflow-y-auto">
                        <h3 className="font-bold text-amber-300 mb-3 text-sm">📜 กติกาและวิธีเล่น</h3>
                        {gameData.type === 'chess' && <ul className="space-y-2 text-slate-300 list-disc pl-4"><li>ผลัดกันเดินหมากตามกฎมาตรฐานสากล</li><li>คลิกที่หมากของตนเอง ระบบจะไฮไลต์ช่องที่เดินได้</li><li>หากเปิดโหมดจับเวลา เวลาจะเริ่มเดินอัตโนมัติ และสลับฝั่งเมื่อวางหมากสำเร็จ</li><li>ฝ่ายใดรุกฆาต (Checkmate) หรือคู่แข่งเวลาหมด จะเป็นผู้ชนะ</li></ul>}
                        {gameData.type === 'checkers' && <ul className="space-y-2 text-slate-300 list-disc pl-4"><li>เดินเฉียงไปข้างหน้าทีละ 1 ช่อง</li><li>เข้าฮอส (ไปถึงขอบสุดฝั่งตรงข้าม) จะสามารถเดินหน้า-หลังได้ทีละ 1 ช่อง</li><li>ต้องกระโดดกินหมากฝ่ายตรงข้ามหากมีโอกาส</li><li>ฝ่ายไหนถูกกินจนหมด หรือไม่มีตาเดิน จะเป็นผู้แพ้</li></ul>}
                        {gameData.type === 'snl' && <ul className="space-y-2 text-slate-300 list-disc pl-4"><li>ผลัดกันกดปุ่มทอยลูกเต๋า</li><li>หากตกที่โคนบันได จะได้เลื่อนขึ้นไปจุดสูงสุดของบันได</li><li>หากตกที่หัวงู จะต้องลื่นลงมาที่หางงู</li><li>ใครเดินทางไปถึงช่อง 100 ได้ก่อน จะเป็นผู้ชนะ</li></ul>}
                        {gameData.type === 'connect4' && <ul className="space-y-2 text-slate-300 list-disc pl-4"><li>ผลัดกันหยอดเหรียญลงในช่อง</li><li>ใครเรียงสีตัวเองให้ติดกันครบ 4 อัน (แนวตั้ง แนวนอน หรือแนวทแยง) ก่อน จะเป็นผู้ชนะ</li></ul>}
                        {gameData.type === 'domino' && <ul className="space-y-2 text-slate-300 list-disc pl-4"><li>ผลัดกันต่อโดมิโนให้แต้มตรงกับปลายด้านใดด้านหนึ่ง</li><li>หากไม่มีไพ่ให้ลง ต้องจั่วไพ่ 1 ครั้ง</li><li>ถ้าจั่วแล้วยังลงไม่ได้ (หรือไพ่กองกลางหมด) ให้กดข้ามตา</li><li>ใครไพ่หมดมือคนแรกชนะ! (ถ้าข้ามตาทั้งคู่เกมจะจบลงแบบเสมอ)</li></ul>}
                        {gameData.type === 'sttt' && <ul className="space-y-2 text-slate-300 list-disc pl-4"><li>ระบบจะสุ่มกระดานย่อยให้คุณเล่นในแต่ละตา</li><li>กระดานไหนที่มีคนชนะแล้วจะถูกล็อกไว้</li><li>ใครชนะกระดานย่อยเรียงติดกัน 3 แนว (เหมือน XO ปกติ) จะเป็นผู้ชนะ!</li></ul>}
                    </div>

                    <div className="w-full md:w-2/3 flex justify-center items-center flex-col relative select-none touch-none bg-[#050811] rounded-xl p-2 py-4 border border-[#1E3A5F]">
                        {gameData.type === 'chess' && <ChessInner gameData={gameData} isPlayer1={isPlayer1} isPlayer2={isPlayer2} isSpectator={isSpectator} gameId={gameId} db={db} currentUser={currentUser} />}
                        {gameData.type === 'checkers' && <CheckersInner gameData={gameData} isPlayer1={isPlayer1} isPlayer2={isPlayer2} isSpectator={isSpectator} gameId={gameId} db={db} currentUser={currentUser} />}
                        {gameData.type === 'snl' && <SnlInner gameData={gameData} isPlayer1={isPlayer1} isPlayer2={isPlayer2} isSpectator={isSpectator} gameId={gameId} db={db} getAuthor={getAuthor} currentUser={currentUser} />}
                        {gameData.type === 'connect4' && <Connect4Inner gameData={gameData} isPlayer1={isPlayer1} isPlayer2={isPlayer2} isSpectator={isSpectator} gameId={gameId} db={db} currentUser={currentUser} />}
                        {gameData.type === 'domino' && <DominoInner gameData={gameData} isPlayer1={isPlayer1} isPlayer2={isPlayer2} isSpectator={isSpectator} gameId={gameId} db={db} currentUser={currentUser} />}
                        {gameData.type === 'sttt' && <StttInner gameData={gameData} isPlayer1={isPlayer1} isPlayer2={isPlayer2} isSpectator={isSpectator} gameId={gameId} db={db} currentUser={currentUser} />}
                    </div>
                </div>
            </Modal>
        );
    }
    // ==========================================
    // 6. 🛠️ ASSOCIATION TOOLS COMPONENTS 🛠️
    // ==========================================

    const BPMTapper = () => {
        const [bpm, setBpm] = useState(120);
        const [taps, setTaps] = useState([]);
        const [isPlaying, setIsPlaying] = useState(false);
        const [beats, setBeats] = useState(4); // Time Signature (3/4, 4/4, 6/8)
        const [subdiv, setSubdiv] = useState(1); // 1=Quarter, 2=Eighth, 3=Triplet, 4=16th
        const [activeBeat, setActiveBeat] = useState(-1);

        const audioCtxRef = useRef(null);
        const nextNoteTimeRef = useRef(0);
        const currentNoteRef = useRef(0);
        const timerIDRef = useRef(null);

        const handleTap = () => {
            const now = Date.now();
            const newTaps = [...taps, now].slice(-5);
            setTaps(newTaps);
            if (newTaps.length > 1) {
                const diffs = [];
                for (let i = 1; i < newTaps.length; i++) diffs.push(newTaps[i] - newTaps[i-1]);
                const avg = diffs.reduce((a, b) => a + b, 0) / diffs.length;
                const calcBpm = Math.round(60000 / avg);
                if (calcBpm > 30 && calcBpm < 300) setBpm(calcBpm);
            }
        };

        const scheduleNote = (beatNumber, time) => {
            if (!audioCtxRef.current) return;
            const osc = audioCtxRef.current.createOscillator();
            const gain = audioCtxRef.current.createGain();
            osc.connect(gain); gain.connect(audioCtxRef.current.destination);
            
            const isAccent = beatNumber === 0;
            const isMainBeat = beatNumber % subdiv === 0;

            if (isAccent) { osc.frequency.value = 1200; gain.gain.setValueAtTime(1, time); }
            else if (isMainBeat) { osc.frequency.value = 800; gain.gain.setValueAtTime(0.7, time); }
            else { osc.frequency.value = 400; gain.gain.setValueAtTime(0.2, time); }

            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
            osc.start(time);
            osc.stop(time + 0.05);

            if (isMainBeat) {
                requestAnimationFrame(() => setActiveBeat(Math.floor(beatNumber / subdiv)));
            }
        };

        const scheduler = () => {
            while (nextNoteTimeRef.current < audioCtxRef.current.currentTime + 0.1) {
                scheduleNote(currentNoteRef.current, nextNoteTimeRef.current);
                nextNoteTimeRef.current += (60.0 / bpm) / subdiv;
                currentNoteRef.current = (currentNoteRef.current + 1) % (beats * subdiv);
            }
            timerIDRef.current = requestAnimationFrame(scheduler);
        };

        useEffect(() => {
            if (isPlaying) {
                if (!audioCtxRef.current || audioCtxRef.current.state === 'closed') {
                    audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtxRef.current.state === 'suspended') audioCtxRef.current.resume();
                currentNoteRef.current = 0;
                nextNoteTimeRef.current = audioCtxRef.current.currentTime + 0.05;
                scheduler();
            } else {
                cancelAnimationFrame(timerIDRef.current);
                setActiveBeat(-1);
            }
            return () => cancelAnimationFrame(timerIDRef.current);
        }, [isPlaying, bpm, beats, subdiv]);

        return (
          <div className="flex flex-col items-center gap-6 py-2 w-full max-w-md mx-auto">
            {/* Visualizer */}
            <div className="flex justify-center gap-2 mb-2 w-full h-12">
                {Array(beats).fill(0).map((_, i) => (
                    <div key={i} className={`flex-1 rounded-xl transition-all duration-75 border-2 ${activeBeat === i ? (i === 0 ? 'bg-red-500 border-red-400 shadow-[0_0_20px_rgba(239,68,68,0.8)]' : 'bg-emerald-400 border-emerald-300 shadow-[0_0_20px_rgba(52,211,153,0.8)]') : 'bg-[#0B1325] border-[#1E3A5F]'}`} />
                ))}
            </div>

            <div className="text-center bg-[#0B1325] w-full p-6 rounded-2xl border border-[#1E3A5F] shadow-inner relative">
                <div className="text-6xl font-bold font-mono text-sky-400 drop-shadow-[0_0_10px_rgba(56,189,248,0.5)]">{bpm} <span className="text-xl text-slate-400 font-sans">BPM</span></div>
                <input type="range" min="30" max="250" value={bpm} onChange={(e) => { setBpm(parseInt(e.target.value)); setTaps([]); }} className="w-full mt-4 accent-sky-500" />
            </div>

            <div className="grid grid-cols-2 gap-3 w-full">
                <div className="bg-[#0B1325] p-3 rounded-xl border border-[#1E3A5F]">
                    <label className="text-[10px] text-slate-400 font-bold uppercase mb-1 block">จังหวะ (Time Signature)</label>
                    <select value={beats} onChange={e=>setBeats(parseInt(e.target.value))} className="w-full inp text-sm font-bold text-sky-200 text-center">
                        <option value="2">2/4 (March)</option>
                        <option value="3">3/4 (Waltz)</option>
                        <option value="4">4/4 (Standard)</option>
                        <option value="6">6/8 (Slow Rock)</option>
                        <option value="7">7/8 (Odd Time)</option>
                    </select>
                </div>
                <div className="bg-[#0B1325] p-3 rounded-xl border border-[#1E3A5F]">
                    <label className="text-[10px] text-slate-400 font-bold uppercase mb-1 block">การตีย่อย (Subdivision)</label>
                    <select value={subdiv} onChange={e=>setSubdiv(parseInt(e.target.value))} className="w-full inp text-sm font-bold text-amber-200 text-center">
                        <option value="1">♩ (Quarter)</option>
                        <option value="2">♫ (Eighth)</option>
                        <option value="3">3 (Triplet)</option>
                        <option value="4">♬ (16th)</option>
                    </select>
                </div>
            </div>

            <div className="flex gap-4 w-full mt-2">
                <button onClick={handleTap} className="flex-1 py-4 rounded-xl bg-[#0F2547] border-2 border-sky-500 shadow-[0_0_15px_rgba(14,165,233,0.3)] active:scale-95 transition-transform text-lg font-bold text-sky-100 flex flex-col items-center justify-center leading-none">
                    <span>👆 TAP</span>
                    <span className="text-[10px] text-sky-300 font-normal mt-1">เคาะหาความเร็ว</span>
                </button>
                <button onClick={() => setIsPlaying(!isPlaying)} className={`flex-1 py-4 rounded-xl border-2 font-bold text-lg transition-all shadow-lg ${isPlaying ? 'bg-red-500 border-red-400 text-white shadow-[0_0_20px_rgba(239,68,68,0.5)]' : 'bg-emerald-600 border-emerald-400 text-white'}`}>
                    {isPlaying ? '⏹ STOP' : '▶ PLAY'}
                </button>
            </div>
          </div>
        );
    };

    const GuitarTuner = () => {
        const [instrument, setInstrument] = useState('guitar');
        const [isMicActive, setIsMicActive] = useState(false);
        const [pitchData, setPitchData] = useState({ freq: 0, note: '--', cents: 0 });
        const [activeNote, setActiveNote] = useState(null);

        const audioCtxRef = useRef(null);
        const oscRef = useRef(null);
        const analyserRef = useRef(null);
        const streamRef = useRef(null);
        const rafIdRef = useRef(null);

        const TUNINGS = {
            guitar: [
                { note: 'E4', freq: 329.63, str: 'สาย 1 (e)' }, { note: 'B3', freq: 246.94, str: 'สาย 2 (B)' },
                { note: 'G3', freq: 196.00, str: 'สาย 3 (G)' }, { note: 'D3', freq: 146.83, str: 'สาย 4 (D)' },
                { note: 'A2', freq: 110.00, str: 'สาย 5 (A)' }, { note: 'E2', freq: 82.41, str: 'สาย 6 (E)' }
            ],
            bass: [
                { note: 'G2', freq: 98.00, str: 'สาย 1 (G)' }, { note: 'D2', freq: 73.42, str: 'สาย 2 (D)' },
                { note: 'A1', freq: 55.00, str: 'สาย 3 (A)' }, { note: 'E1', freq: 41.20, str: 'สาย 4 (E)' }
            ]
        };

        const NOTES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

        const autoCorrelate = (buf, sampleRate) => {
            let SIZE = buf.length;
            let rms = 0;
            for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
            rms = Math.sqrt(rms / SIZE);
            if (rms < 0.01) return -1;

            let r1 = 0, r2 = SIZE - 1, thres = 0.2;
            for (let i = 0; i < SIZE / 2; i++) if (Math.abs(buf[i]) < thres) { r1 = i; break; }
            for (let i = 1; i < SIZE / 2; i++) if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }

            buf = buf.slice(r1, r2); SIZE = buf.length;
            let c = new Array(SIZE).fill(0);
            for (let i = 0; i < SIZE; i++)
                for (let j = 0; j < SIZE - i; j++)
                    c[i] = c[i] + buf[j] * buf[j + i];

            let d = 0; while (c[d] > c[d + 1]) d++;
            let maxval = -1, maxpos = -1;
            for (let i = d; i < SIZE; i++) {
                if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
            }
            let T0 = maxpos;
            let x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
            let a = (x1 + x3 - 2 * x2) / 2, b = (x3 - x1) / 2;
            if (a) T0 = T0 - b / (2 * a);
            return sampleRate / T0;
        };

        const updatePitch = () => {
            if (!analyserRef.current) return;
            const buf = new Float32Array(analyserRef.current.fftSize);
            analyserRef.current.getFloatTimeDomainData(buf);
            const ac = autoCorrelate(buf, audioCtxRef.current.sampleRate);
        
            if (ac !== -1) {
                const noteNum = Math.round(12 * (Math.log(ac / 440) / Math.log(2))) + 69;
                const noteStr = NOTES[noteNum % 12];
                const expectedFreq = 440 * Math.pow(2, (noteNum - 69) / 12);
                const cents = Math.floor(1200 * Math.log(ac / expectedFreq) / Math.log(2));
                setPitchData({ freq: Math.round(ac), note: noteStr, cents: cents });
            }
        
            rafIdRef.current = requestAnimationFrame(updatePitch);
        };

        const toggleMic = async () => {
            if (isMicActive) {
                stopMic();
            } else {
                stopTone();
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    streamRef.current = stream;
                    audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
                    const source = audioCtxRef.current.createMediaStreamSource(stream);
                    analyserRef.current = audioCtxRef.current.createAnalyser();
                    analyserRef.current.fftSize = 2048;
                    source.connect(analyserRef.current);
                    setIsMicActive(true);
                    updatePitch();
                } catch (err) {
                    alert("ไม่สามารถเข้าถึงไมโครโฟนได้ กรุณาอนุญาตให้ใช้งานไมค์ก่อนครับ");
                }
            }
        };

        const stopMic = () => {
            if (rafIdRef.current) cancelAnimationFrame(rafIdRef.current);
            if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
            setIsMicActive(false);
            setPitchData({ freq: 0, note: '--', cents: 0 });
        };

        const playTone = (freq, note) => {
            stopMic();
            stopTone();
            audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
            oscRef.current = audioCtxRef.current.createOscillator();
            const gain = audioCtxRef.current.createGain();
            oscRef.current.type = 'triangle';
            oscRef.current.connect(gain); gain.connect(audioCtxRef.current.destination);
            oscRef.current.frequency.setValueAtTime(freq, audioCtxRef.current.currentTime);
            gain.gain.setValueAtTime(0, audioCtxRef.current.currentTime);
            gain.gain.linearRampToValueAtTime(0.8, audioCtxRef.current.currentTime + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtxRef.current.currentTime + 3);
            oscRef.current.start();
            setActiveNote(note);
            setTimeout(() => { if(activeNote === note) setActiveNote(null); }, 3000);
        };

        const stopTone = () => {
            if(oscRef.current) { try { oscRef.current.stop(); } catch(e){} oscRef.current = null; }
            setActiveNote(null);
        };

        useEffect(() => {
            return () => { stopMic(); stopTone(); };
        }, []);

        const renderMeter = () => {
            const { note, cents, freq } = pitchData;
            const isActive = freq > 0;
            const isPerfect = isActive && Math.abs(cents) < 5;
            const pointerRot = isActive ? (cents * 0.9) : 0;
        
            return (

    const ChordTransposer = () => {
        const [inputText, setInputText] = useState("C                  G\nWhen I find myself in times of trouble\nAm                 F\nMother Mary comes to me");
        const [step, setStep] = useState(0);

        const transpose = (chord, stp) => {
            const NOTES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
            const FLAT_TO_SHARP = { 'Db':'C#', 'Eb':'D#', 'Gb':'F#', 'Ab':'G#', 'Bb':'A#' };
            const transposeNote = (note, s) => {
                let n = FLAT_TO_SHARP[note] || note; let idx = NOTES.indexOf(n);
                if(idx === -1) return note;
                let newIdx = (idx + s) % 12; if (newIdx < 0) newIdx += 12;
                return NOTES[newIdx];
            };
            const match = chord.match(/^([CDEFGAB][#b]?)(.*)$/);
            if(!match) return chord;
            let root = match[1]; let modifier = match[2] || '';
            if (modifier.includes('/')) {
                const parts = modifier.split('/');
                return transposeNote(root, stp) + parts[0] + '/' + transposeNote(parts[1], stp);
            }
            return transposeNote(root, stp) + modifier;
        };

        const getTransposedText = () => {
            if(step === 0) return inputText;
            const chordRegex = /\b([CDEFGAB][#b]?(?:m|M|maj|min|aug|dim|sus|add)?\d*(?:\/[CDEFGAB][#b]?)?)\b/g;
            const lines = inputText.split('\n');
            const processedLines = lines.map(line => {
                const words = line.trim().split(/\s+/);
                const isChordLine = words.length > 0 && words.every(w => chordRegex.test(w) || w === '');
                if (isChordLine) return line.replace(chordRegex, (match) => transpose(match, step));
                else return line.replace(/(\[|\()([CDEFGAB][#b]?(?:m|M|maj|min|aug|dim|sus|add)?\d*(?:\/[CDEFGAB][#b]?)?)(\]|\))/g, (fm, p1, p2, p3) => p1 + transpose(p2, step) + p3);
            });
            return processedLines.join('\n');
        };

        return (
          <div className="flex flex-col gap-4 py-2 w-full max-w-2xl mx-auto">
            <div className="flex justify-between items-center bg-[#050811] p-3 rounded-xl border border-[#1E3A5F]">
                <span className="text-sm font-bold text-sky-300">คีย์ (Key Step): {step > 0 ? '+'+step : step}</span>
                <div className="flex gap-2">
                    <button onClick={() => setStep(s => s - 1)} className="btn-d px-4 py-1.5 font-bold">-</button>
                    <button onClick={() => setStep(0)} className="btn-d px-4 py-1.5 text-xs">Reset</button>
                    <button onClick={() => setStep(s => s + 1)} className="btn-b px-4 py-1.5 font-bold">+</button>
                </div>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div className="flex flex-col gap-1">
                    <label className="text-xs text-slate-400 font-bold">เนื้อเพลงและคอร์ดต้นฉบับ</label>
                    <textarea rows="10" value={inputText} onChange={e => setInputText(e.target.value)} className="inp font-mono text-sm leading-relaxed whitespace-pre" placeholder="วางเนื้อเพลงพร้อมคอร์ดที่นี่..."></textarea>
                </div>
                <div className="flex flex-col gap-1">
                    <label className="text-xs text-slate-400 font-bold">ผลลัพธ์การแปลงคีย์</label>
                    <div className="inp font-mono text-sm leading-relaxed whitespace-pre min-h-[200px] overflow-y-auto bg-[#0B1325]">
                        {getTransposedText()}
                    </div>
                </div>
            </div>
          </div>
        );
    };

                    if(data.length > 0) setResults(data.slice(0, 40).map(d => d.word));
                    else setError('❌ ไม่พบคำคล้องจองสำหรับคำนี้');
                } catch(e) { setError('⚠️ เกิดข้อผิดพลาดในการเชื่อมต่อ'); }
            } else {
                let foundGroup = null;
                for(const [group, words] of Object.entries(mergedRhymes)) {
                    if(words.includes(word.trim())) {
                        foundGroup = group; break;
                    }
                }
                
                if(foundGroup) {
                    setResults(mergedRhymes[foundGroup].filter(w => w !== word.trim()));
                } else {
                    setError(`❌ ยังไม่มีคำว่า "${word}" ในฐานข้อมูลของสมาคม`);
                    setShowAdd(true);
                    setNewWord(word.trim());
                }
            }
            setLoading(false);
        };

        const handleAddWordToDict = async () => {
            if(!newWord.trim()) return;
            const currentGroupData = dbRhymes[newGroup] || (THAI_RHYMES_BASE[newGroup] || []);
            
            if (currentGroupData.includes(newWord.trim())) {
                setAddMsg('⚠️ คำนี้มีอยู่ในหมวดนี้แล้วครับ'); return;
            }

            try {
                await db.collection('bma_system').doc('rhyme_dict').set({
                    groups: {
                        ...dbRhymes,
                        [newGroup]: [...new Set([...(dbRhymes[newGroup] || []), newWord.trim()])]
                    }
                }, { merge: true });
                setAddMsg('✅ เพิ่มคำศัพท์สำเร็จ! (ทุกคนจะสามารถใช้คำนี้ได้ทันที)');
                setTimeout(() => { setShowAdd(false); setAddMsg(''); setWord(newWord.trim()); findRhyme(); }, 1500);
            } catch(e) {
                setAddMsg('❌ เกิดข้อผิดพลาดในการบันทึก');
            }
        };

        return (
            <div className="flex flex-col gap-4 py-2 w-full max-w-lg mx-auto">
                <div className="bg-[#0B1325] p-5 rounded-2xl border border-[#1E3A5F] shadow-xl">
                    <div className="flex justify-between items-center mb-4">
                        <label className="text-sm text-sky-400 font-bold uppercase tracking-widest">Rhyme Finder ✍️</label>
                        <div className="flex bg-[#050811] rounded-lg border border-[#1E3A5F] overflow-hidden text-[10px] font-bold">
                            <button onClick={() => { setLang('th'); setResults([]); setError(''); setShowAdd(false); }} className={`px-3 py-1.5 ${lang === 'th' ? 'bg-sky-600 text-white' : 'text-slate-400 hover:text-white'}`}>ไทย</button>
                            <button onClick={() => { setLang('en'); setResults([]); setError(''); setShowAdd(false); }} className={`px-3 py-1.5 ${lang === 'en' ? 'bg-sky-600 text-white' : 'text-slate-400 hover:text-white'}`}>EN</button>
                        </div>
                    </div>
                    
                    <div className="flex gap-2">
                        <input 
                            type="text" 
                            value={word} 
                            onChange={(e) => setWord(e.target.value)} 
                            onKeyDown={(e) => { if(e.key === 'Enter') findRhyme(); }}
                            placeholder={lang === 'th' ? "พิมพ์คำที่ต้องการ (เช่น รัก, ใจ, ดาว)..." : "Type a word (e.g. love, night)..."} 
                            className="flex-1 inp font-bold text-sm"
                        />
                        <button onClick={findRhyme} disabled={loading} className="btn-b text-xs px-4 font-bold shadow-lg">
                            {loading ? '🔍...' : 'ค้นหา'}
                        </button>
                    </div>
                    {lang === 'th' && (
                        <div className="text-[9px] text-slate-400 mt-2 flex justify-between items-center">
                            <span>💡 ฐานข้อมูล Community Dictionary อัปเดตคำศัพท์โดยสมาชิก</span>
                            <span className="text-emerald-400 font-bold">({Object.values(mergedRhymes).flat().length} คำศัพท์)</span>
                        </div>
                    )}
                </div>

                <div className="bg-gradient-to-b from-[#050811] to-[#0a101f] p-5 rounded-xl border border-[#1E3A5F] shadow-lg min-h-[150px]">
                    <div className="text-[10px] text-slate-400 font-bold mb-3 border-b border-[#1E3A5F] pb-2 flex justify-between">
                        <span>ผลลัพธ์คำคล้องจอง (Rhymes)</span>
                        {results.length > 0 && lang === 'th' && <button onClick={() => setShowAdd(!showAdd)} className="text-sky-300 hover:text-sky-200 underline">+ เพิ่มคำศัพท์เข้าหมวดหมู่นี้</button>}
                    </div>

                    {showAdd && lang === 'th' && (
                        <div className="mb-4 bg-[#0F2547] p-3 rounded-lg border border-sky-500/50 shadow-inner text-xs animate-fade-in">
                            <div className="font-bold text-amber-300 mb-2">ช่วยกันเพิ่มคำศัพท์ใหม่ให้สมาคม! 🧠</div>
                            <div className="flex gap-2 mb-2">
                                <input type="text" value={newWord} onChange={e=>setNewWord(e.target.value)} placeholder="คำศัพท์ใหม่..." className="w-1/3 inp py-1 px-2" />
                                <select value={newGroup} onChange={e=>setNewGroup(e.target.value)} className="flex-1 inp py-1 px-2 bg-[#050811]">
                                    {Object.keys(mergedRhymes).map(g => <option key={g} value={g}>หมวด: สระ{g}</option>)}
                                </select>
                                <button onClick={handleAddWordToDict} className="btn-b py-1 px-3 text-sky-200">บันทึก</button>
                            </div>
                            {addMsg && <div className={`font-bold ${addMsg.includes('✅') ? 'text-emerald-400' : 'text-red-400'}`}>{addMsg}</div>}
                        </div>
                    )}

                    {error && !showAdd ? (
                        <div className="text-red-400 text-xs font-bold text-center py-4 bg-red-950/30 rounded border border-red-900/50">{error}</div>
                    ) : results.length > 0 ? (
                        <div className="flex flex-wrap gap-2">
                            {results.map((r, i) => (
                                <span key={i} className="px-3 py-1.5 bg-[#0F2547] text-sky-200 text-sm font-bold rounded-lg border border-sky-900/50 hover:bg-sky-700 hover:text-white transition-colors cursor-pointer shadow-sm">
                                    {r}
                                </span>
                            ))}
                        </div>
                    ) : (
                        !showAdd && <div className="text-slate-500 text-xs text-center py-8 opacity-50">พิมพ์คำเพื่อค้นหาคำคล้องจองสำหรับเขียนเนื้อเพลง</div>
                    )}
                </div>
            </div>
        );
    };

    const AdvancedUnitConverter = () => {
        const CATEGORIES = {
          'Length (ความยาว)': { 'm': 1, 'cm': 100, 'mm': 1000, 'km': 0.001, 'in': 39.3701, 'ft': 3.28084, 'yd': 1.09361, 'mile': 0.000621371, 'วา (wa)': 0.5, 'ศอก (sok)': 2, 'คืบ (khuep)': 4, 'เส้น (sen)': 0.025, 'โยชน์ (yot)': 0.0000625 },
          'Area (พื้นที่)': { 'm²': 1, 'cm²': 10000, 'km²': 1e-6, 'hectare': 1e-4, 'acre': 0.000247105, 'sq ft': 10.7639, 'ตารางวา (sq wa)': 0.25, 'งาน (ngan)': 0.0025, 'ไร่ (rai)': 0.000625 },
          'Mass (น้ำหนัก)': { 'kg': 1, 'g': 1000, 'mg': 1e6, 'lb': 2.20462, 'oz': 35.274, 'ton': 0.001, 'ขีด (khit)': 10, 'บาท (ทอง)': 65.59958, 'สลึง (ทอง)': 262.3983, 'ตำลึง': 16.39989 },
          'Volume (ปริมาตร)': { 'L': 1, 'mL': 1000, 'm³': 0.001, 'cm³': 1000, 'gal (US)': 0.264172, 'qt (US)': 1.05669, 'fl oz (US)': 33.814, 'ถัง (thang)': 0.05, 'เกวียน (kwian)': 0.0005, 'ทะนาน (thanan)': 1 },
          'Force (แรง)': { 'N': 1, 'kN': 1e-3, 'kgf': 0.10197, 'lbf': 0.224809 },
          'Pressure (ความดัน)': { 'Pa': 1, 'kPa': 1e-3, 'MPa': 1e-6, 'bar': 1e-5, 'psi': 0.000145038, 'atm': 0.0000098692 },
          'Energy (พลังงาน)': { 'J': 1, 'kJ': 1e-3, 'cal': 0.239006, 'kcal': 0.000239006, 'Wh': 0.000277778, 'kWh': 2.77778e-7, 'eV': 6.242e18 },
          'Torque (แรงบิด)': { 'N·m': 1, 'lbf·ft': 0.737562, 'kgf·m': 0.101972, 'ozf·in': 141.6119 },
          'Power (กำลัง)': { 'W': 1, 'kW': 1e-3, 'HP': 0.00134102, 'BTU/hr': 3.41214 },
          'Velocity (ความเร็ว)': { 'm/s': 1, 'km/h': 3.6, 'mph': 2.23694, 'knot': 1.94384, 'ft/s': 3.28084 },
          'Data Storage (ข้อมูล)': { 'Byte': 1, 'KB': 1e-3, 'MB': 1e-6, 'GB': 1e-9, 'TB': 1e-12 },
          'Angle (มุม)': { 'Degree': 1, 'Radian': 0.0174533, 'Gradian': 1.11111 },
          'Temperature (อุณหภูมิ)': 'special',
          'Custom (พิมพ์หน่วยเอง)': 'compound'
        };

        const BASE_UNITS = {
            'kg': { type: 'mass', val: 1 }, 'g': { type: 'mass', val: 1000 }, 'lb': { type: 'mass', val: 2.20462 },
            'm': { type: 'length', val: 1 }, 'cm': { type: 'length', val: 100 }, 'mm': { type: 'length', val: 1000 }, 'km': { type: 'length', val: 0.001 }, 'in': { type: 'length', val: 39.3701 }, 'ft': { type: 'length', val: 3.28084 },
            's': { type: 'time', val: 1 }, 'min': { type: 'time', val: 1/60 }, 'h': { type: 'time', val: 1/3600 },
            'L': { type: 'volume', val: 1 }, 'mL': { type: 'volume', val: 1000 }
        };

        const [category, setCategory] = useState('Length (ความยาว)');
        const [fromUnit, setFromUnit] = useState('m'); 
        const [toUnit, setToUnit] = useState('cm');
                  
        const [customFrom, setCustomFrom] = useState('kg * m / s^2');
        const [customTo, setCustomTo] = useState('g * cm / s^2');

        const [inputValue, setInputValue] = useState('');
        const [useSciNotation, setUseSciNotation] = useState(false);
        const [precision, setPrecision] = useState(6);
        const [copied, setCopied] = useState(false);

        useEffect(() => {
          if (category === 'Temperature (อุณหภูมิ)') { setFromUnit('C'); setToUnit('F'); }
          else if (category !== 'Custom (พิมพ์หน่วยเอง)') { 
              const units = Object.keys(CATEGORIES[category]); 
              setFromUnit(units[0]); setToUnit(units[1] || units[0]); 
          }
          setInputValue('');
        }, [category]);

        const parseCompoundUnit = (unitStr) => {
            if(!unitStr) return null;
            try {
                let str = unitStr.replace(/\s+/g, '');
                Object.keys(BASE_UNITS).sort((a,b) => b.length - a.length).forEach(u => {
                    const regex = new RegExp(`(?<![a-zA-Z])${u}(?![a-zA-Z])`, 'g');
                    str = str.replace(regex, BASE_UNITS[u].val);
                });
                str = str.replace(/\^/g, '**');
                if (/[a-zA-Z]/.test(str)) return null;
                const factor = new Function('return ' + str)();
                return factor;
            } catch (e) {
                return null;
            }
        };

        const calculateResult = () => {
          if (inputValue === '') return '';
          const val = parseFloat(inputValue); if (isNaN(val)) return 'Invalid Input';
          let resultNum = 0;
                    
          if (category === 'Temperature (อุณหภูมิ)') {
            if (fromUnit === toUnit) resultNum = val;
            else if (fromUnit === 'C' && toUnit === 'F') resultNum = (val * 9/5) + 32;
            else if (fromUnit === 'C' && toUnit === 'K') resultNum = val + 273.15;
            else if (fromUnit === 'F' && toUnit === 'C') resultNum = (val - 32) * 5/9;
            else if (fromUnit === 'F' && toUnit === 'K') resultNum = (val - 32) * 5/9 + 273.15;
            else if (fromUnit === 'K' && toUnit === 'C') resultNum = val - 273.15;
            else if (fromUnit === 'K' && toUnit === 'F') resultNum = (val - 273.15) * 9/5 + 32;
          } else if (category === 'Custom (พิมพ์หน่วยเอง)') {
            const factorFrom = parseCompoundUnit(customFrom);
            const factorTo = parseCompoundUnit(customTo);
            if (!factorFrom || !factorTo) return 'Unit Error';
            resultNum = (val / factorFrom) * factorTo;
          } else {
            resultNum = (val / CATEGORIES[category][fromUnit]) * CATEGORIES[category][toUnit];
          }

          if (useSciNotation) return resultNum.toExponential(precision > 0 ? precision - 1 : 2);
                    
          const absVal = Math.abs(resultNum);
          if (absVal > 0 && (absVal < 0.0001 || absVal > 1e7)) return resultNum.toExponential(precision > 0 ? precision - 1 : 2);
          if (Number.isInteger(resultNum)) return resultNum.toString();
                    
          return parseFloat(resultNum.toPrecision(precision)).toString(); 
        };

        const handleSwap = () => {
          if (category === 'Custom (พิมพ์หน่วยเอง)') {
              const temp = customFrom; setCustomFrom(customTo); setCustomTo(temp);
          } else {
              const temp = fromUnit; setFromUnit(toUnit); setToUnit(temp);
          }
          const res = calculateResult();
          if(res && res !== 'Invalid Input' && res !== 'Unit Error') setInputValue(useSciNotation ? parseFloat(res).toExponential(precision-1) : parseFloat(res).toString());
        };

        const handleCopy = () => {
            const res = calculateResult();
            if (res && res !== 'Invalid Input' && res !== 'Unit Error') {
                navigator.clipboard.writeText(res); setCopied(true); setTimeout(() => setCopied(false), 2000);
            }
        };

        const tempUnits = ['C', 'F', 'K'];

        return (
          <div className="flex flex-col gap-5 py-4 w-full max-w-lg mx-auto bg-[#0a101f] p-4 sm:p-6 rounded-2xl border border-[#1E3A5F] shadow-2xl relative overflow-hidden">
            <div className="absolute -top-10 -right-10 w-32 h-32 bg-sky-500 rounded-full blur-[80px] opacity-20 pointer-events-none"></div>

            <div className="flex justify-between items-center z-10 flex-wrap gap-2">
              <label className="text-xs text-slate-400 font-bold uppercase tracking-wider">ประเภทหน่วยวัด</label>
              <div className="flex items-center gap-2">
                  <select value={precision} onChange={e => setPrecision(parseInt(e.target.value))} className="bg-[#050811] text-sky-300 text-[10px] px-2 py-1.5 rounded-lg border border-[#1E3A5F] outline-none cursor-pointer font-bold">
                      <option value="4">4 ตำแหน่ง</option>
                      <option value="6">6 ตำแหน่ง</option>
                      <option value="8">8 ตำแหน่ง</option>
                  </select>
                  <label className="flex items-center gap-2 cursor-pointer text-[10px] bg-[#050811] px-2.5 py-1.5 rounded-lg border border-[#1E3A5F]">
                      <input type="checkbox" checked={useSciNotation} onChange={e => setUseSciNotation(e.target.checked)} className="rounded bg-slate-800 accent-sky-500" />
                      <span className="text-sky-300 font-bold">1.2e-5</span>
                  </label>
              </div>
            </div>
                      
            <select value={category} onChange={e => setCategory(e.target.value)} className="inp py-2.5 text-sm text-sky-300 font-bold z-10 bg-[#0B1325] shadow-inner cursor-pointer">
              {Object.keys(CATEGORIES).map(c => <option key={c} value={c}>{c}</option>)}
            </select>

            <div className="flex flex-col gap-4 z-10 mt-2">
              <div className="flex flex-col bg-[#050811] rounded-xl border border-[#1E3A5F] p-3 focus-within:border-sky-500 transition-colors">
                <span className="text-[10px] text-slate-500 font-bold mb-1">จาก (From)</span>
                <div className="flex items-center gap-2">
                    <input type="number" value={inputValue} onChange={e => setInputValue(e.target.value)} className="w-full bg-transparent text-2xl font-mono text-white outline-none" placeholder="0" />
                    <div className="w-[1px] h-8 bg-[#1E3A5F] mx-1 shrink-0"></div>
                    {category === 'Custom (พิมพ์หน่วยเอง)' ? (
                        <input type="text" value={customFrom} onChange={e => setCustomFrom(e.target.value)} className="w-32 bg-[#0B1325] border border-[#1E3A5F] rounded p-1 text-xs text-sky-200 font-mono text-center outline-none focus:border-sky-500 shrink-0" placeholder="kg*m/s^2" />
                    ) : (
                        <select value={fromUnit} onChange={e => setFromUnit(e.target.value)} className="bg-transparent text-sm font-bold text-sky-200 outline-none cursor-pointer w-28 sm:w-32 text-right shrink-0 truncate">
                          {(category === 'Temperature (อุณหภูมิ)' ? tempUnits : Object.keys(CATEGORIES[category])).map(u => <option key={u} value={u} className="bg-[#0B1325]">{u}</option>)}
                        </select>
                    )}
                </div>
              </div>

              <div className="flex justify-center -my-6 z-20 relative">
                 <button onClick={handleSwap} className="w-10 h-10 rounded-full bg-[#1E3A5F] border-4 border-[#0a101f] text-white flex items-center justify-center hover:bg-sky-500 hover:scale-110 transition-all shadow-lg group">
                    <span className="group-hover:rotate-180 transition-transform duration-300 font-bold">⇅</span>
                 </button>
              </div>

              <div className="flex flex-col bg-[#11241a] rounded-xl border border-emerald-900/50 p-3 relative">
                <span className="text-[10px] text-emerald-600 font-bold mb-1">ผลลัพธ์ (To)</span>
                <div className="flex items-center gap-2">
                    <div className="w-full bg-transparent text-xl sm:text-2xl font-mono text-emerald-400 min-h-[32px] overflow-hidden text-ellipsis whitespace-nowrap pt-1">
                       {calculateResult() || '0'}
                    </div>
                    <div className="w-[1px] h-8 bg-emerald-900 mx-1 shrink-0"></div>
                    {category === 'Custom (พิมพ์หน่วยเอง)' ? (
                        <input type="text" value={customTo} onChange={e => setCustomTo(e.target.value)} className="w-32 bg-[#0B1325] border border-emerald-900/50 rounded p-1 text-xs text-emerald-200 font-mono text-center outline-none focus:border-emerald-500 shrink-0" placeholder="g*cm/s^2" />
                    ) : (
                        <select value={toUnit} onChange={e => setToUnit(e.target.value)} className="bg-transparent text-sm font-bold text-emerald-200 outline-none cursor-pointer w-28 sm:w-32 text-right shrink-0 truncate">
                          {(category === 'Temperature (อุณหภูมิ)' ? tempUnits : Object.keys(CATEGORIES[category])).map(u => <option key={u} value={u} className="bg-[#0B1325]">{u}</option>)}
                        </select>
                    )}
                </div>
                          
                <button onClick={handleCopy} className={`absolute top-2 right-2 text-[10px] px-2 py-1 rounded border transition-colors ${copied ? 'bg-emerald-500 text-white border-emerald-400 font-bold' : 'bg-[#0B1325] text-slate-400 border-[#1E3A5F] hover:text-white'}`}>
                    {copied ? '✓ คัดลอกแล้ว' : '📋 Copy'}
                </button>
              </div>
            </div>
                      
            {category === 'Temperature (อุณหภูมิ)' && (
                <div className="text-[10px] text-slate-500 text-center font-mono bg-[#050811] py-1.5 rounded-lg border border-[#1E3A5F]/50 shadow-inner">
                   สูตร: K = °C + 273.15 | °F = (°C × 9/5) + 32
                </div>
            )}
            {category === 'Custom (พิมพ์หน่วยเอง)' && (
                <div className="text-[10px] text-slate-400 text-center bg-amber-950/30 py-2 px-3 rounded-lg border border-amber-900/50 shadow-inner leading-relaxed">
                   💡 พิมพ์หน่วยฐานที่ต้องการผสมลงในกล่อง<br/>(รองรับ: kg, g, lb, m, cm, mm, km, in, ft, s, min, h, L, mL) <br/>ตัวอย่าง: <span className="text-amber-300 font-mono">kg*m/s^2</span>
                </div>
            )}
          </div>
        );
    };

    const MatrixSolver = () => {
        const [mode, setMode] = useState('2x2'); // '2x2', '3x3', 'quad'
        const [inputFmt, setInputFmt] = useState('eq'); // 'eq', 'matrix'
        
        // เมทริกซ์เก็บค่า 3 แถว 4 คอลัมน์ (เผื่อ 3x3)
        const [mat, setMat] = useState([
            ['', '', '', ''],
            ['', '', '', ''],
            ['', '', '', '']
        ]);
        
        // สำหรับสมการกำลังสอง ax^2 + bx + c = 0
        const [quad, setQuad] = useState({a: '', b: '', c: ''});
        const [result, setResult] = useState(null);

        const handleMat = (r, c, val) => {
            const newMat = [...mat];
            newMat[r][c] = val;
            setMat(newMat);
            setResult(null);
        };

        const solve2x2 = () => {
            const a1=parseFloat(mat[0][0]), b1=parseFloat(mat[0][1]), c1=parseFloat(mat[0][2]);
            const a2=parseFloat(mat[1][0]), b2=parseFloat(mat[1][1]), c2=parseFloat(mat[1][2]);
