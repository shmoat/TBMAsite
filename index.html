<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Blue Moon Association</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap');
    body {
      font-family: 'Inter', 'Noto Sans Thai', sans-serif;
      background-color: #050811;
      color: #ffffff;
      overflow-x: hidden;
    }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    @keyframes orbit-cw {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }
    @keyframes orbit-ccw {
      from { transform: translate(-50%, -50%) rotate(360deg); }
      to { transform: translate(-50%, -50%) rotate(0deg); }
    }
    @keyframes counter-rotate-cw {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(-360deg); }
    }
    @keyframes counter-rotate-ccw {
      from { transform: translate(-50%, -50%) rotate(-360deg); }
      to { transform: translate(-50%, -50%) rotate(0deg); }
    }
    .orbit-ring-1 { animation: orbit-cw 38s linear infinite; }
    .orbit-ring-2 { animation: orbit-ccw 55s linear infinite; }
    .orbit-ring-3 { animation: orbit-cw 75s linear infinite; }
    .counter-ring-1 { animation: counter-rotate-cw 38s linear infinite; }
    .counter-ring-2 { animation: counter-rotate-ccw 55s linear infinite; }
    .counter-ring-3 { animation: counter-rotate-cw 75s linear infinite; }
    .orbit-system:hover .orbit-ring-1,
    .orbit-system:hover .orbit-ring-2,
    .orbit-system:hover .orbit-ring-3,
    .orbit-system:hover .counter-ring-1,
    .orbit-system:hover .counter-ring-2,
    .orbit-system:hover .counter-ring-3 {
      animation-play-state: paused;
    }
  </style>
</head>
<body class="bg-[#050811] text-white selection:bg-blue-900 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyD80Ml5mk7IGFOx0qx4HRL-D_3TEy9h0YI",
      authDomain: "tbmasite.firebaseapp.com",
      projectId: "tbmasite",
      storageBucket: "tbmasite.firebasestorage.app",
      messagingSenderId: "616851307256",
      appId: "1:616851307256:web:15b49dfec2de521af6990d",
      measurementId: "G-JDW0E0S138"
    };

    let db = null;
    try {
      const app = !firebase.apps.length ? firebase.initializeApp(firebaseConfig) : firebase.app();
      db = firebase.firestore(app);
    } catch (e) {
      console.error("Firebase Init Error:", e);
    }

    const PRESET_MEMBER_TAGS = ['LCs & Pal', 'PCSHS', 'KPN', 'KMUTT', 'Instrumix', 'Others'];

    const INITIAL_OWNER_SEED = {
      id: 'M000',
      username: '',
      password: '',
      isActivated: false,
      role: 'admin',
      memberTag: 'LCs & Pal',
      displayName: 'Founder (M000)',
      bio: 'ผู้ก่อตั้งและผู้ดูแลสูงสุดแห่ง The Blue Moon Association',
      avatarUrl: '',
      joinedAt: '2026-10-08'
    };

    function Avatar({ user, size = 'md', className = '' }) {
      const sizeMap = {
        xs: 'w-6 h-6 text-[10px]',
        sm: 'w-8 h-8 text-xs',
        md: 'w-11 h-11 text-xs',
        lg: 'w-16 h-16 text-base',
        xl: 'w-20 h-20 text-lg'
      };
      const sc = sizeMap[size] || sizeMap.md;

      if (user && user.avatarUrl) {
        return (
          <img
            src={user.avatarUrl}
            alt={user.displayName || 'Avatar'}
            className={sc + ' rounded-full object-cover border-2 border-white/40 bg-[#0F2547] shrink-0 ' + className}
          />
        );
      }
      return (
        <div className={sc + ' rounded-full bg-[#0F2547] border-2 border-white/30 flex items-center justify-center font-mono font-bold text-white shrink-0 ' + className}>
          {user && user.displayName ? user.displayName.charAt(0).toUpperCase() : '#'}
        </div>
      );
    }

    function RoleBadge({ role }) {
      if (role === 'admin') {
        return <span className="px-2 py-0.5 rounded bg-amber-400 text-[#050811] text-[10px] font-bold uppercase">👑 Owner</span>;
      }
      if (role === 'mod') {
        return <span className="px-2 py-0.5 rounded bg-sky-400 text-[#050811] text-[10px] font-bold uppercase">🛡️ ผู้ดูแล (Mod)</span>;
      }
      return null;
    }

    function App() {
      const [users, setUsers] = useState([INITIAL_OWNER_SEED]);
      const [posts, setPosts] = useState([]);
      const [currentUser, setCurrentUser] = useState(null);
      const [dbErrorBanner, setDbErrorBanner] = useState('');

      const [currentView, setCurrentView] = useState('home');
      const [selectedTagFilter, setSelectedTagFilter] = useState('ALL');
      const [memberDirectoryTag, setMemberDirectoryTag] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedMemberModal, setSelectedMemberModal] = useState(null);

      const [authMode, setAuthMode] = useState('signin');
      const [loginUsername, setLoginUsername] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [authError, setAuthError] = useState('');

      const [activateIdInput, setActivateIdInput] = useState('');
      const [activateUsername, setActivateUsername] = useState('');
      const [activatePassword, setActivatePassword] = useState('');
      const [activateDisplayName, setActivateDisplayName] = useState('');

      const [isEditingProfile, setIsEditingProfile] = useState(false);
      const [editDisplayName, setEditDisplayName] = useState('');
      const [editBio, setEditBio] = useState('');
      const [editAvatarUrl, setEditAvatarUrl] = useState('');
      const avatarInputRef = useRef(null);

      const [isCreatingPost, setIsCreatingPost] = useState(false);
      const [newPostTitle, setNewPostTitle] = useState('');
      const [newPostContent, setNewPostContent] = useState('');
      const [newPostCategory, setNewPostCategory] = useState('');
      const [newPostAttachments, setNewPostAttachments] = useState([]);
      const [attachmentUrlInput, setAttachmentUrlInput] = useState('');
      const [attachmentTypeInput, setAttachmentTypeInput] = useState('image');
      const postFileInputRef = useRef(null);

      const [newMemberId, setNewMemberId] = useState('M001');
      const [newMemberTag, setNewMemberTag] = useState('LCs & Pal');
      const [copiedId, setCopiedId] = useState(null);
      const [commentInputs, setCommentInputs] = useState({});

      useEffect(() => {
        if (!db) return;

        const unsubUsers = db.collection('bma_users').onSnapshot(
          async (snapshot) => {
            setDbErrorBanner('');
            if (snapshot.empty) {
              try {
                await db.collection('bma_users').doc(INITIAL_OWNER_SEED.id).set(INITIAL_OWNER_SEED);
              } catch (e) {}
            } else {
              const allDocs = snapshot.docs.map((doc) => doc.data());
              const loadedUsers = allDocs.filter(
                (u) => u.id !== 'BMA-000' && u.password !== 'bma-root-password' && u.password !== 'moon-8842'
              );

              if (!loadedUsers.some((u) => u.id === 'M000')) {
                try {
                  await db.collection('bma_users').doc(INITIAL_OWNER_SEED.id).set(INITIAL_OWNER_SEED);
                } catch (e) {}
                return;
              }

              loadedUsers.sort((a, b) => String(a.id).localeCompare(String(b.id)));
              setUsers(loadedUsers);

              const maxNum = loadedUsers.reduce((max, u) => {
                const m = String(u.id).match(/^M(\d+)$/i);
                if (m) {
                  const num = parseInt(m[1], 10);
                  return num > max ? num : max;
                }
                return max;
              }, 0);
              setNewMemberId('M' + String(maxNum + 1).padStart(3, '0'));
            }
          },
          (err) => {
            setDbErrorBanner('แจ้งเตือน Firebase (' + err.code + '): กรุณาตรวจสอบว่าได้สร้าง Firestore Database (Start in test mode) แล้ว');
          }
        );

        const unsubPosts = db.collection('bma_posts').onSnapshot(
          (snapshot) => {
            const loadedPosts = snapshot.docs.map((doc) => doc.data());
            loadedPosts.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            setPosts(loadedPosts);
          },
          (err) => console.error(err)
        );

        return () => {
          unsubUsers();
          unsubPosts();
        };
      }, []);

      useEffect(() => {
        if (currentUser && users.length > 0) {
          const latestMe = users.find((u) => u.id === currentUser.id);
          if (latestMe) setCurrentUser(latestMe);
        }
      }, [users]);

      const handleSignIn = (e) => {
        e.preventDefault();
        setAuthError('');
        const found = users.find(
          (u) =>
            u.isActivated &&
            u.username &&
            u.username.toLowerCase() === loginUsername.trim().toLowerCase() &&
            u.password === loginPassword
        );
        if (found) {
          setCurrentUser(found);
          setLoginUsername('');
          setLoginPassword('');
          setCurrentView('feed');
        } else {
          setAuthError('Username หรือ Password ไม่ถูกต้อง (หากเพิ่งได้รับรหัส เช่น M000 หรือ M001 กรุณากดแท็บ "เปิดใช้งาน Member ID" ด้านบน)');
        }
      };

      const handleActivateMemberId = async (e) => {
        e.preventDefault();
        setAuthError('');
        const cleanId = activateIdInput.trim().toUpperCase();
        const cleanUser = activateUsername.trim();
        const cleanPass = activatePassword.trim();
        const cleanName = activateDisplayName.trim() || ('Member #' + cleanId);

        if (!cleanId || !cleanUser || !cleanPass) {
          setAuthError('กรุณากรอกข้อมูลให้ครบทุกช่อง');
          return;
        }

        const targetAccount = users.find((u) => String(u.id).toUpperCase() === cleanId);
        if (!targetAccount) {
          setAuthError('ไม่พบรหัสประจำตัว "' + cleanId + '" ในระบบ กรุณาติดต่อเจ้าของเว็บไซต์');
          return;
        }
        if (targetAccount.isActivated) {
          setAuthError('รหัส "' + cleanId + '" ถูกเปิดใช้งานไปแล้ว กรุณาเข้าสู่ระบบตามปกติ');
          return;
        }

        const usernameTaken = users.some(
          (u) => u.id !== targetAccount.id && u.username && u.username.toLowerCase() === cleanUser.toLowerCase()
        );
        if (usernameTaken) {
          setAuthError('Username นี้มีผู้ใช้งานแล้ว กรุณาตั้งชื่ออื่น');
          return;
        }

        const updatedAccount = {
          ...targetAccount,
          username: cleanUser,
          password: cleanPass,
          displayName: cleanName,
          isActivated: true,
          joinedAt: new Date().toISOString().split('T')[0]
        };

        try {
          if (db) await db.collection('bma_users').doc(targetAccount.id).set(updatedAccount);
          setUsers(users.map((u) => (u.id === targetAccount.id ? updatedAccount : u)));
          setCurrentUser(updatedAccount);
          setActivateIdInput('');
          setActivateUsername('');
          setActivatePassword('');
          setActivateDisplayName('');
          setCurrentView('feed');
        } catch (err) {
          setAuthError('บันทึกข้อมูลไม่สำเร็จ: ' + err.message);
        }
      };

      const handleIssueNewId = async (e) => {
        e.preventDefault();
        if (!currentUser || currentUser.role !== 'admin') return;
        const cleanId = newMemberId.trim().toUpperCase();
        const cleanTag = newMemberTag.trim();
        if (!cleanId || !cleanTag) return;

        if (users.some((u) => String(u.id).toUpperCase() === cleanId)) {
          alert('รหัส ' + cleanId + ' มีอยู่ในระบบแล้ว');
          return;
        }

        const newSlot = {
          id: cleanId,
          memberTag: cleanTag,
          role: 'member',
          isActivated: false,
          username: '',
          password: '',
          displayName: 'รออนุมัติตัวตน (' + cleanId + ')',
          bio: 'สมาชิกใหม่ (รอเจ้าตัวเข้ามากำหนด Username และโปรไฟล์)',
          avatarUrl: '',
          joinedAt: new Date().toISOString().split('T')[0]
        };

        if (db) await db.collection('bma_users').doc(cleanId).set(newSlot);
      };

      const handleToggleModerator = async (targetUser) => {
        if (!currentUser || currentUser.role !== 'admin' || targetUser.role === 'admin') return;
        const nextRole = targetUser.role === 'mod' ? 'member' : 'mod';
        if (db) await db.collection('bma_users').doc(targetUser.id).update({ role: nextRole });
      };

      const handleDeleteUser = async (userId) => {
        if (!currentUser || currentUser.role !== 'admin' || userId === 'M000') return;
        if (!confirm('ยืนยันการลบบัญชีรหัส ' + userId + ' ?')) return;
        if (db) await db.collection('bma_users').doc(userId).delete();
      };

      const handleCopyInviteId = (user) => {
        const text =
          '[The Blue Moon Association]\nบัตรเชิญเข้าสู่สมาคมของคุณ:\n- Member ID: ' +
          user.id +
          '\n- หมวดหมู่ (Tag): ' +
          user.memberTag +
          '\n\nวิธีเข้าใช้งานครั้งแรก:\n1. กดปุ่ม "เข้าสู่ระบบ / เปิดใช้งาน ID"\n2. เลือกแท็บ "เปิดใช้งาน Member ID"\n3. กรอกรหัส ' +
          user.id +
          ' เพื่อตั้ง Username และ Password ของคุณเอง';
        navigator.clipboard.writeText(text);
        setCopiedId(user.id);
        setTimeout(() => setCopiedId(null), 2500);
      };

      const canManagePostOrComment = (authorId) => {
        if (!currentUser) return false;
        return currentUser.role === 'admin' || currentUser.role === 'mod' || currentUser.id === authorId;
      };

      const handleDeletePost = async (postId) => {
        if (!confirm('ยืนยันการลบโพสต์นี้?')) return;
        if (db) await db.collection('bma_posts').doc(postId).delete();
      };

      const handleDeleteComment = async (postId, commentId) => {
        const targetPost = posts.find((p) => p.id === postId);
        if (!targetPost) return;
        const updatedComments = (targetPost.comments || []).filter((c) => c.id !== commentId);
        if (db) await db.collection('bma_posts').doc(postId).update({ comments: updatedComments });
      };

      const handleAvatarUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_SIZE = 300;
            let w = img.width;
            let h = img.height;
            if (w > h && w > MAX_SIZE) {
              h *= MAX_SIZE / w;
              w = MAX_SIZE;
            } else if (h > MAX_SIZE) {
              w *= MAX_SIZE / h;
              h = MAX_SIZE;
            }
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            setEditAvatarUrl(canvas.toDataURL('image/jpeg', 0.85));
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      const handleSaveProfile = async (e) => {
        e.preventDefault();
        if (!editDisplayName.trim() || !currentUser) return;
        const updatedUser = {
          ...currentUser,
          displayName: editDisplayName.trim(),
          bio: editBio.trim(),
          avatarUrl: editAvatarUrl.trim()
        };
        if (db) await db.collection('bma_users').doc(updatedUser.id).set(updatedUser);
        setCurrentUser(updatedUser);
        setIsEditingProfile(false);
      };

      const handlePostFileSelect = (e) => {
        const files = Array.from(e.target.files || []);
        files.forEach((file) => {
          if (file.size > 850 * 1024) {
            alert('ไฟล์ "' + file.name + '" มีขนาดเกิน 850KB กรุณาใช้ไฟล์ขนาดเล็กลง หรือแนบเป็นลิงก์ URL แทนครับ');
            return;
          }
          const reader = new FileReader();
          reader.onloadend = () => {
            let fileType = 'file';
            if (file.type.startsWith('image/')) fileType = 'image';
            else if (file.type.startsWith('video/')) fileType = 'video';
            setNewPostAttachments((prev) => [
              ...prev,
              {
                id: 'att-' + Date.now() + Math.random().toString(36).slice(2, 6),
                name: file.name,
                type: fileType,
                url: reader.result,
                size: (file.size / 1024).toFixed(1) + ' KB'
              }
            ]);
          };
          reader.readAsDataURL(file);
        });
        e.target.value = '';
      };

      const handleAddUrlAttachment = () => {
        if (!attachmentUrlInput.trim()) return;
        setNewPostAttachments((prev) => [
          ...prev,
          {
            id: 'att-' + Date.now(),
            name: attachmentUrlInput.split('/').pop() || 'Attached Media',
            type: attachmentTypeInput,
            url: attachmentUrlInput.trim(),
            size: 'External Link'
          }
        ]);
        setAttachmentUrlInput('');
      };

      const handleCreatePost = async (e) => {
        e.preventDefault();
        if (!currentUser) return;
        if (!newPostContent.trim() && !newPostTitle.trim() && newPostAttachments.length === 0) return;

        const postObj = {
          id: 'post-' + Date.now(),
          authorId: currentUser.id,
          title: newPostTitle.trim(),
          content: newPostContent.trim(),
          category: newPostCategory,
          attachments: newPostAttachments,
          createdAt: new Date().toLocaleDateString('th-TH', {
            day: 'numeric',
            month: 'short',
            hour: '2-digit',
            minute: '2-digit'
          }),
          timestamp: Date.now(),
          likes: [],
          bookmarks: [],
          comments: []
        };

        if (db) await db.collection('bma_posts').doc(postObj.id).set(postObj);
        setNewPostTitle('');
        setNewPostContent('');
        setNewPostCategory('');
        setNewPostAttachments([]);
        setIsCreatingPost(false);
      };

      const toggleLike = async (postId) => {
        if (!currentUser) {
          setCurrentView('login');
          return;
        }
        const target = posts.find((p) => p.id === postId);
        if (!target) return;
        const likes = target.likes || [];
        const updatedLikes = likes.includes(currentUser.id)
          ? likes.filter((id) => id !== currentUser.id)
          : [...likes, currentUser.id];
        if (db) await db.collection('bma_posts').doc(postId).update({ likes: updatedLikes });
      };

      const toggleBookmark = async (postId) => {
        if (!currentUser) {
          setCurrentView('login');
          return;
        }
        const target = posts.find((p) => p.id === postId);
        if (!target) return;
        const bookmarks = target.bookmarks || [];
        const updatedBookmarks = bookmarks.includes(currentUser.id)
          ? bookmarks.filter((id) => id !== currentUser.id)
          : [...bookmarks, currentUser.id];
        if (db) await db.collection('bma_posts').doc(postId).update({ bookmarks: updatedBookmarks });
      };

      const handleAddComment = async (postId) => {
        if (!currentUser) {
          setCurrentView('login');
          return;
        }
        const text = commentInputs[postId];
        if (!text || !text.trim()) return;
        const target = posts.find((p) => p.id === postId);
        if (!target) return;

        const newComment = {
          id: 'c-' + Date.now(),
          authorId: currentUser.id,
          text: text.trim(),
          createdAt: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })
        };

        const updatedComments = [...(target.comments || []), newComment];
        if (db) await db.collection('bma_posts').doc(postId).update({ comments: updatedComments });
        setCommentInputs({ ...commentInputs, [postId]: '' });
      };

      const getAuthor = (authorId) => {
        return (
          users.find((u) => u.id === authorId) || {
            id: authorId,
            displayName: 'Member (' + authorId + ')',
            memberTag: 'Others',
            username: 'member',
            role: 'member',
            avatarUrl: ''
          }
        );
      };

      const allFilterTags = ['ALL', ...PRESET_MEMBER_TAGS];
      const activatedMembers = users.filter((u) => u.isActivated);

      const filteredPosts = posts.filter((post) => {
        const author = getAuthor(post.authorId);
        const matchesBookmark = currentView === 'bookmarks' ? (post.bookmarks || []).includes(currentUser && currentUser.id) : true;
        const matchesTag = selectedTagFilter === 'ALL' ? true : author.memberTag === selectedTagFilter;
        const matchesSearch =
          (post.title || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
          (post.content || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
          author.displayName.toLowerCase().includes(searchQuery.toLowerCase()) ||
          String(author.id).toLowerCase().includes(searchQuery.toLowerCase());
        return matchesBookmark && matchesTag && matchesSearch;
      });

      const getOrbitRings = () => {
        const r1 = [], r2 = [], r3 = [];
        const list = activatedMembers.length > 0 ? activatedMembers : users;
        list.forEach((u, i) => {
          if (i % 3 === 0) r1.push(u);
          else if (i % 3 === 1) r2.push(u);
          else r3.push(u);
        });
        return [
          { radius: 135, items: r1, ringClass: 'orbit-ring-1', counterClass: 'counter-ring-1' },
          { radius: 210, items: r2, ringClass: 'orbit-ring-2', counterClass: 'counter-ring-2' },
          { radius: 285, items: r3, ringClass: 'orbit-ring-3', counterClass: 'counter-ring-3' }
        ];
      };

      return (
        <div className="min-h-screen bg-[#050811] text-white flex flex-col">
          {dbErrorBanner && (
            <div className="bg-amber-500 text-[#050811] px-4 py-2 text-xs font-bold text-center">
              ⚠️ {dbErrorBanner}
            </div>
          )}

          {/* NAVBAR */}
          <header className="sticky top-0 z-40 bg-[#070C18]/90 backdrop-blur-md border-b border-[#1E3A5F]">
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
              <button onClick={() => setCurrentView('home')} className="flex items-center gap-3 text-left group">

                <form onSubmit={handleSaveProfile} className="space-y-4">
                  <div className="flex flex-col items-center p-4 rounded-xl bg-[#050811] border border-[#1E3A5F]">
                    <Avatar user={{ ...currentUser, displayName: editDisplayName, avatarUrl: editAvatarUrl }} size="xl" />
                    <input type="file" accept="image/*" ref={avatarInputRef} onChange={handleAvatarUpload} className="hidden" />
                    <div className="flex gap-2 mt-3">
                      <button type="button" onClick={() => avatarInputRef.current && avatarInputRef.current.click()} className="px-3.5 py-1.5 rounded-lg bg-white text-[#050811] text-xs font-bold">
                        📁 อัปโหลดรูปจากเครื่อง
                      </button>
                      {editAvatarUrl && (
                        <button type="button" onClick={() => setEditAvatarUrl('')} className="px-3 py-1.5 rounded-lg bg-[#0F2547] text-xs text-white">ลบรูป</button>
                      )}
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs text-slate-300 mb-1">ชื่อที่แสดง (Display Name)</label>
                    <input type="text" value={editDisplayName} onChange={(e) => setEditDisplayName(e.target.value)} className="w-full bg-[#050811] border border-[#1E3A5F] rounded-xl px-4 py-2 text-sm text-white outline-none" required />
                  </div>
                  <div>
                    <label className="block text-xs text-slate-300 mb-1">คำอธิบายตัวตน (Bio)</label>
                    <textarea rows={3} value={editBio} onChange={(e) => setEditBio(e.target.value)} className="w-full bg-[#050811] border border-[#1E3A5F] rounded-xl p-3 text-sm text-white outline-none resize-none" />
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setIsEditingProfile(false)} className="px-4 py-2 rounded-xl bg-[#050811] border border-[#1E3A5F] text-xs text-slate-300">ยกเลิก</button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-white text-[#050811] font-bold text-xs">บันทึกโปรไฟล์</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: MEMBER ORBIT CARD */}
          {selectedMemberModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-sm bg-[#0B1325] border border-white/30 rounded-2xl overflow-hidden shadow-2xl">
                <div className="bg-gradient-to-r from-[#0F2547] to-[#081226] px-5 py-3.5 border-b border-[#1E3A5F] flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <span className="font-mono text-xs font-bold">{selectedMemberModal.id}</span>
                    <RoleBadge role={selectedMemberModal.role} />
                  </div>
                  <button onClick={() => setSelectedMemberModal(null)} className="text-slate-300 hover:text-white">✕</button>
                </div>
                <div className="p-6 text-center space-y-3">
                  <div className="flex justify-center"><Avatar user={selectedMemberModal} size="xl" /></div>
                  <div>
                    <span className="px-2.5 py-0.5 rounded-full bg-white text-[#050811] text-[10px] font-bold">{selectedMemberModal.memberTag}</span>
                    <h3 className="text-lg font-bold text-white mt-2">{selectedMemberModal.displayName}</h3>
                    {selectedMemberModal.username && <p className="text-xs font-mono text-slate-400">@{selectedMemberModal.username}</p>}
                  </div>
                  <p className="text-xs text-slate-200 bg-[#050811] p-3.5 rounded-xl border border-[#1E3A5F]">{selectedMemberModal.bio}</p>
                  <button
                    onClick={() => {
                      setSelectedTagFilter(selectedMemberModal.memberTag);
                      setSelectedMemberModal(null);
                      setCurrentView('feed');
                    }}
                    className="w-full py-2.5 rounded-xl bg-white text-[#050811] font-bold text-xs hover:bg-slate-200"
                  >
                    ดูโพสต์ในกลุ่ม {selectedMemberModal.memberTag}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
