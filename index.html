  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap');

    /* Orbit Animations สำหรับหน้า Home พระจันทร์สีน้ำเงินและดาวบริวาร */
    @keyframes orbit-cw {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }
    @keyframes orbit-ccw {
      from { transform: translate(-50%, -50%) rotate(360deg); }
      to { transform: translate(-50%, -50%) rotate(0deg); }
    }
    @keyframes counter-rotate-cw {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(-360deg); }
    }
    @keyframes counter-rotate-ccw {
      from { transform: translate(-50%, -50%) rotate(-360deg); }
      to { transform: translate(-50%, -50%) rotate(0deg); }
    }

    .orbit-ring-1 { animation: orbit-cw 38s linear infinite; }
    .orbit-ring-2 { animation: orbit-ccw 55s linear infinite; }
    .orbit-ring-3 { animation: orbit-cw 75s linear infinite; }

    .counter-ring-1 { animation: counter-rotate-cw 38s linear infinite; }
    .counter-ring-2 { animation: counter-rotate-ccw 55s linear infinite; }
    .counter-ring-3 { animation: counter-rotate-cw 75s linear infinite; }

    .orbit-system:hover .orbit-ring-1,
    .orbit-system:hover .orbit-ring-2,
    .orbit-system:hover .orbit-ring-3,
    .orbit-system:hover .counter-ring-1,
    .orbit-system:hover .counter-ring-2,
    .orbit-system:hover .counter-ring-3 {
      animation-play-state: paused;
    }
  </style>

    function Avatar({ user, size = 'md', className = '' }) {
      const sizeClasses = {
        xs: 'w-6 h-6 text-[10px]',
        sm: 'w-8 h-8 text-xs',
        md: 'w-11 h-11 text-xs',
        lg: 'w-16 h-16 text-base',
        xl: 'w-20 h-20 text-lg'
      }[size];

      if (user?.avatarUrl) {
        return (
          <img
            src={user.avatarUrl}
            alt={user.displayName}
            className={`${sizeClasses} rounded-full object-cover border-2 border-white/40 bg-[#0F2547] shrink-0 ${className}`}
          />
        );
      }

      return (
        <div
          className={`${sizeClasses} rounded-full bg-[#0F2547] border-2 border-white/30 flex items-center justify-center font-mono font-bold text-white shrink-0 ${className}`}
        >
          {user?.displayName ? user.displayName.charAt(0).toUpperCase() : '#'}
        </div>
      );
    }

    function App() {
      // Data States
      const [users, setUsers] = useState(INITIAL_USERS);
      const [posts, setPosts] = useState(INITIAL_POSTS);
      const [currentUser, setCurrentUser] = useState(null); // null = Guest (โหมดผู้มาเยือน)

      // Navigation: 'home' | 'feed' | 'members' | 'bookmarks' | 'admin' | 'login'
      const [currentView, setCurrentView] = useState('home');
      const [selectedTagFilter, setSelectedTagFilter] = useState('ALL');
      const [memberDirectoryTag, setMemberDirectoryTag] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedMemberModal, setSelectedMemberModal] = useState(null);

      // Firebase States
      const [db, setDb] = useState(null);
      const [isCloudConnected, setIsCloudConnected] = useState(false);
      const [isFirebaseModalOpen, setIsFirebaseModalOpen] = useState(false);
      const [firebaseConfigInput, setFirebaseConfigInput] = useState('');
      const [firebaseStatusMsg, setFirebaseStatusMsg] = useState('');

      // Login States
      const [loginUsername, setLoginUsername] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [loginError, setLoginError] = useState('');

      // Profile Edit States
      const [isEditingProfile, setIsEditingProfile] = useState(false);
      const [editDisplayName, setEditDisplayName] = useState('');
      const [editBio, setEditBio] = useState('');
      const [editAvatarUrl, setEditAvatarUrl] = useState('');
      const avatarInputRef = useRef(null);

      // New Post & Attachments States
      const [isCreatingPost, setIsCreatingPost] = useState(false);
      const [newPostTitle, setNewPostTitle] = useState('');
      const [newPostContent, setNewPostContent] = useState('');
      const [newPostCategory, setNewPostCategory] = useState(''); // ค่าเริ่มต้นว่าง = "โปรดเลือก..."
      const [newPostAttachments, setNewPostAttachments] = useState([]);
      const [attachmentUrlInput, setAttachmentUrlInput] = useState('');
      const [attachmentTypeInput, setAttachmentTypeInput] = useState('image');
      const postFileInputRef = useRef(null);

      // Admin Issue Account States
      const [newMemberId, setNewMemberId] = useState('BMA-005');
      const [newUsername, setNewUsername] = useState('');
      const [newPassword, setNewPassword] = useState('moon-' + Math.floor(1000 + Math.random() * 9000));
      const [newMemberTag, setNewMemberTag] = useState('LCs & Pal');
      const [copiedId, setCopiedId] = useState(null);

      // Comment Input
      const [commentInputs, setCommentInputs] = useState({});

      // ============================================================================
      // 1. ระบบเชื่อมต่อ FIREBASE FIRESTORE (REALTIME SYNC)
      // ============================================================================
      const connectToFirebase = (configObj) => {
        try {
          if (!configObj || !configObj.apiKey || !configObj.projectId) return false;
          let app;
          if (!firebase.apps.length) {
            app = firebase.initializeApp(configObj);
          } else {
            app = firebase.app();
          }
          const firestore = firebase.firestore(app);
          setDb(firestore);
          setIsCloudConnected(true);
          setFirebaseStatusMsg('เชื่อมต่อฐานข้อมูล Firebase Firestore สำเร็จแล้ว!');
          return firestore;
        } catch (err) {
          console.error('Firebase Init Error:', err);
          setFirebaseStatusMsg('เกิดข้อผิดพลาดในการเชื่อมต่อ: ' + err.message);
          return false;
        }
      };

      // ตรวจสอบค่า Config ตอนเปิดเว็บครั้งแรก
      useEffect(() => {
        if (HARDCODED_FIREBASE_CONFIG.apiKey && HARDCODED_FIREBASE_CONFIG.projectId) {
          connectToFirebase(HARDCODED_FIREBASE_CONFIG);
        } else {
          const savedConfig = localStorage.getItem('bma_firebase_config');
          if (savedConfig) {
            try {
              const parsed = JSON.parse(savedConfig);
              setFirebaseConfigInput(JSON.stringify(parsed, null, 2));
              connectToFirebase(parsed);
            } catch (e) {}
          }
        }
      }, []);

      // ดึงข้อมูลแบบ Realtime เมื่อเชื่อมต่อ Firebase แล้ว
      useEffect(() => {
        if (!db) return;

        // Sync ตารางสมาชิก (bma_users)
        const unsubUsers = db.collection('bma_users').onSnapshot(async (snapshot) => {
          if (snapshot.empty) {
            // หากฐานข้อมูลว่างเปล่า ให้สร้างข้อมูลตั้งต้น (Seed) อัตโนมัติ
            for (const u of INITIAL_USERS) {
              await db.collection('bma_users').doc(u.id).set(u);
            }
          } else {
            const loadedUsers = snapshot.docs.map((doc) => doc.data());
            loadedUsers.sort((a, b) => a.id.localeCompare(b.id));
            setUsers(loadedUsers);
            if (currentUser) {
              const updatedMe = loadedUsers.find((u) => u.id === currentUser.id);
              if (updatedMe) setCurrentUser(updatedMe);
            }
          }
        });

        // Sync ตารางโพสต์ (bma_posts)
        const unsubPosts = db.collection('bma_posts').onSnapshot(async (snapshot) => {
          if (snapshot.empty) {
            for (const p of INITIAL_POSTS) {
              await db.collection('bma_posts').doc(p.id).set(p);
            }
          } else {
            const loadedPosts = snapshot.docs.map((doc) => doc.data());
            loadedPosts.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            setPosts(loadedPosts);
          }
        });

        return () => {
          unsubUsers();
          unsubPosts();
        };
      }, [db]);

      // ฟังก์ชันแปลงข้อความ firebaseConfig ที่ผู้ใช้ก๊อปมาจากเว็บ Firebase
      const handleSaveFirebaseConfig = (e) => {
        e.preventDefault();
        try {
          let raw = firebaseConfigInput.trim();
          // รองรับทั้งการวาง JSON ตรงๆ หรือวางโค้ด const firebaseConfig = { ... };
          const match = raw.match(/\{[\s\S]*\}/);
          if (!match) throw new Error('ไม่พบรูปแบบ Object { ... }');
          // แปลง JS Object เป็น JSON
          const cleanJson = match[0]
            .replace(/(['"])?([a-zA-Z0-9_]+)(['"])?\s*:/g, '"$2":')
            .replace(/'/g, '"')
            .replace(/,\s*\}/g, '}');
          const parsed = JSON.parse(cleanJson);
          localStorage.setItem('bma_firebase_config', JSON.stringify(parsed));
          const ok = connectToFirebase(parsed);
          if (ok) {
            setTimeout(() => setIsFirebaseModalOpen(false), 1200);
          }
        } catch (err) {
          setFirebaseStatusMsg('รูปแบบ Config ไม่ถูกต้อง กรุณาวางเฉพาะส่วน { apiKey: "...", ... }');
        }
      };

      const handleDisconnectFirebase = () => {
        localStorage.removeItem('bma_firebase_config');
        window.location.reload();
      };

      // ============================================================================
      // 2. HANDLERS: ระบบล็อกอิน, โปรไฟล์, โพสต์, และแนบไฟล์
      // ============================================================================
      const handleLogin = (e) => {
        e.preventDefault();
        const found = users.find(
          (u) => u.username.toLowerCase() === loginUsername.trim().toLowerCase() && u.password === loginPassword
        );
        if (found) {
          setCurrentUser(found);
          setLoginError('');
          setLoginUsername('');
          setLoginPassword('');
          setCurrentView('feed');
        } else {
          setLoginError('Username หรือ Password ไม่ถูกต้อง (บัญชีออกโดยเจ้าของเว็บไซต์เท่านั้น)');
        }
      };

      // อัปโหลดรูปโปรไฟล์ (บีบอัดขนาดอัตโนมัติเพื่อให้เซฟลง Firestore ได้รวดเร็ว)
      const handleAvatarUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_SIZE = 300;
            let width = img.width;
            let height = img.height;
            if (width > height && width > MAX_SIZE) {
              height *= MAX_SIZE / width;
              width = MAX_SIZE;
            } else if (height > MAX_SIZE) {
              width *= MAX_SIZE / height;
              height = MAX_SIZE;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            setEditAvatarUrl(canvas.toDataURL('image/jpeg', 0.85));
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      const handleSaveProfile = async (e) => {
        e.preventDefault();
        if (!editDisplayName.trim() || !currentUser) return;

        const updatedUser = {
          ...currentUser,
          displayName: editDisplayName.trim(),
          bio: editBio.trim(),
          avatarUrl: editAvatarUrl.trim()
        };

        if (db) {
          await db.collection('bma_users').doc(updatedUser.id).set(updatedUser);
        } else {
          setUsers(users.map((u) => (u.id === currentUser.id ? updatedUser : u)));
        }
        setCurrentUser(updatedUser);
        setIsEditingProfile(false);
      };

      // แนบไฟล์ รูปภาพ วิดีโอ ในโพสต์
      const handlePostFileSelect = (e) => {
        const files = Array.from(e.target.files || []);
        files.forEach((file) => {
          if (file.size > 800 * 1024 && db) {
            alert(`ไฟล์ "${file.name}" มีขนาดใหญ่เกิน 800KB สำหรับการเก็บตรงลงฐานข้อมูล แนะนำให้แนบเป็นลิงก์ URL หรือใช้ไฟล์ขนาดเล็กลงครับ`);
            return;
          }
          const reader = new FileReader();
          reader.onloadend = () => {
            let fileType = 'file';
            if (file.type.startsWith('image/')) fileType = 'image';
            else if (file.type.startsWith('video/')) fileType = 'video';

            setNewPostAttachments((prev) => [
              ...prev,
              {
                id: 'att-' + Date.now() + Math.random().toString(36).slice(2, 6),
                name: file.name,
                type: fileType,
                url: reader.result,
                size: (file.size / 1024).toFixed(1) + ' KB'
              }
            ]);
          };
          reader.readAsDataURL(file);
        });
        e.target.value = '';
      };

      const handleAddUrlAttachment = () => {
        if (!attachmentUrlInput.trim()) return;
        setNewPostAttachments((prev) => [
          ...prev,
          {
            id: 'att-' + Date.now(),
            name: attachmentUrlInput.split('/').pop() || 'Attached Media',
            type: attachmentTypeInput,
            url: attachmentUrlInput.trim(),
            size: 'External Link'
          }
        ]);
        setAttachmentUrlInput('');
      };

      const handleCreatePost = async (e) => {
        e.preventDefault();
        if (!currentUser) return;
        if (!newPostContent.trim() && !newPostTitle.trim() && newPostAttachments.length === 0) return;

        const postObj = {
          id: `post-${Date.now()}`,
          authorId: currentUser.id,
          title: newPostTitle.trim(),
          content: newPostContent.trim(),
          category: newPostCategory, // หากเป็น "" จะไม่แสดงป้ายหมวดหมู่
          attachments: newPostAttachments,
          createdAt: new Date().toLocaleDateString('th-TH', {
            day: 'numeric',
            month: 'short',
            hour: '2-digit',
            minute: '2-digit'
          }),
          timestamp: Date.now(),
          likes: [],
          bookmarks: [],
          comments: []
        };

        if (db) {
          await db.collection('bma_posts').doc(postObj.id).set(postObj);
        } else {
          setPosts([postObj, ...posts]);
        }

        setNewPostTitle('');
        setNewPostContent('');
        setNewPostCategory('');
        setNewPostAttachments([]);
        setIsCreatingPost(false);
      };

      const toggleLike = async (postId) => {
        if (!currentUser) {
          setCurrentView('login');
          return;
        }
        const target = posts.find((p) => p.id === postId);
        if (!target) return;
        const hasLiked = target.likes.includes(currentUser.id);
        const updatedLikes = hasLiked
          ? target.likes.filter((id) => id !== currentUser.id)
          : [...target.likes, currentUser.id];

        if (db) {
          await db.collection('bma_posts').doc(postId).update({ likes: updatedLikes });
        } else {
          setPosts(posts.map((p) => (p.id === postId ? { ...p, likes: updatedLikes } : p)));
        }
      };

      const toggleBookmark = async (postId) => {
        if (!currentUser) {
          setCurrentView('login');
          return;
        }
        const target = posts.find((p) => p.id === postId);
        if (!target) return;
        const hasBookmarked = target.bookmarks.includes(currentUser.id);
        const updatedBookmarks = hasBookmarked
          ? target.bookmarks.filter((id) => id !== currentUser.id)
          : [...target.bookmarks, currentUser.id];

        if (db) {
          await db.collection('bma_posts').doc(postId).update({ bookmarks: updatedBookmarks });
        } else {
          setPosts(posts.map((p) => (p.id === postId ? { ...p, bookmarks: updatedBookmarks } : p)));
        }
      };

      const handleAddComment = async (postId) => {
        if (!currentUser) {
          setCurrentView('login');
          return;
        }
        const text = commentInputs[postId];
        if (!text || !text.trim()) return;
        const target = posts.find((p) => p.id === postId);
        if (!target) return;

        const newComment = {
          id: `c-${Date.now()}`,
          authorId: currentUser.id,

                      >
                        <option value="">โปรดเลือก... (ไม่ต้องมีหมวดหมู่)</option>
                        <option value="General">General (ทั่วไป)</option>
                        <option value="Music & Art">Music & Art (ดนตรีและศิลปะ)</option>
                        <option value="Night Log">Night Log (บันทึกยามดึก)</option>
                        <option value="Engineering & Tech">Engineering & Tech</option>
                        <option value="Announcement">Announcement (ประกาศ)</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs text-slate-300 mb-1">
                      เนื้อหาโพสต์
                    </label>
                    <textarea
                      rows={4}
                      value={newPostContent}
                      onChange={(e) => setNewPostContent(e.target.value)}
                      placeholder="เขียนสิ่งที่คุณอยากแชร์กับสมาคม..."
                      className="w-full bg-[#050811] border border-[#1E3A5F] focus:border-white rounded-xl p-3.5 text-sm text-white outline-none resize-none"
                    />
                  </div>

                  {/* ส่วนแนบรูปภาพ วิดีโอ หรือไฟล์ */}
                  <div className="p-4 rounded-xl bg-[#050811] border border-[#1E3A5F] space-y-3">
                    <div className="flex flex-wrap items-center justify-between gap-2">
                      <span className="text-xs font-semibold text-slate-200">
                        📎 แนบรูปภาพ, วิดีโอ หรือไฟล์เอกสาร
                      </span>
                      <input
                        type="file"
                        multiple
                        ref={postFileInputRef}
                        onChange={handlePostFileSelect}
                        className="hidden"
                      />
                      <button
                        type="button"
                        onClick={() => postFileInputRef.current?.click()}
                        className="px-3 py-1.5 rounded-lg bg-[#0F2547] hover:bg-white hover:text-[#050811] border border-white/20 text-xs font-semibold transition"
                      >
                        + เลือกไฟล์จากเครื่อง
                      </button>
                    </div>

                    {/* แนบผ่าน URL สำหรับไฟล์หรือวิดีโอขนาดใหญ่ */}
                    <div className="flex flex-col sm:flex-row gap-2 pt-1">
                      <select
                        value={attachmentTypeInput}
                        onChange={(e) => setAttachmentTypeInput(e.target.value)}
                        className="bg-[#0B1325] border border-[#1E3A5F] rounded-lg px-2.5 py-1.5 text-xs text-white outline-none"
                      >
                        <option value="image">รูปภาพ (URL)</option>
                        <option value="video">วิดีโอ (MP4/URL)</option>
                        <option value="file">ไฟล์เอกสาร (URL)</option>
                      </select>
                      <input
                        type="text"
                        value={attachmentUrlInput}
                        onChange={(e) => setAttachmentUrlInput(e.target.value)}
                        placeholder="หรือวางลิงก์รูปภาพ / วิดีโอ / ไฟล์..."
                        className="flex-1 bg-[#0B1325] border border-[#1E3A5F] rounded-lg px-3 py-1.5 text-xs text-white outline-none"
                      />
                      <button
                        type="button"
                        onClick={handleAddUrlAttachment}
                        className="px-3 py-1.5 rounded-lg bg-white text-[#050811] text-xs font-bold shrink-0"
                      >
                        เพิ่มลิงก์
                      </button>
                    </div>

                    {/* รายการไฟล์ที่แนบแล้ว */}
                    {newPostAttachments.length > 0 && (
                      <div className="space-y-1.5 pt-2">
                        {newPostAttachments.map((att) => (
                          <div
                            key={att.id}
                            className="flex items-center justify-between px-3 py-1.5 rounded-lg bg-[#0B1325] border border-[#1E3A5F] text-xs"
                          >
                            <span className="truncate max-w-xs">
                              [{att.type.toUpperCase()}] {att.name}
                            </span>
                            <button
                              type="button"
                              onClick={() =>
                                setNewPostAttachments(newPostAttachments.filter((a) => a.id !== att.id))
                              }
                              className="text-red-400 hover:text-red-300 ml-2"
                            >
                              ลบ
                            </button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setIsCreatingPost(false)}
                      className="px-4 py-2 rounded-xl bg-[#050811] border border-[#1E3A5F] text-xs text-slate-300"
                    >
                      ยกเลิก
                    </button>
                    <button
                      type="submit"
                      className="px-6 py-2 rounded-xl bg-white text-[#050811] font-bold text-xs hover:bg-slate-200 transition"
                    >
                      เผยแพร่โพสต์
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ================================================================= */}
          {/* MODAL: แก้ไขโปรไฟล์สมาชิก (รูปโปรไฟล์, ชื่อ, Bio)                 */}
          {/* ================================================================= */}
          {isEditingProfile && currentUser && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-md bg-[#0B1325] border border-white/30 rounded-2xl p-6 shadow-2xl">
                <div className="flex items-center justify-between pb-3 mb-4 border-b border-[#1E3A5F]">
                  <h3 className="text-base font-bold text-white">ตั้งค่าโปรไฟล์สมาชิก</h3>
                  <button onClick={() => setIsEditingProfile(false)} className="text-slate-400 hover:text-white">
                    ✕
                  </button>
                </div>

                <form onSubmit={handleSaveProfile} className="space-y-4">
                  <div className="flex flex-col items-center p-4 rounded-xl bg-[#050811] border border-[#1E3A5F]">
                    <Avatar
                      user={{ ...currentUser, displayName: editDisplayName, avatarUrl: editAvatarUrl }}
                      size="xl"
                    />
                    <input
                      type="file"
                      accept="image/*"
                      ref={avatarInputRef}
                      onChange={handleAvatarUpload}
                      className="hidden"
                    />
                    <div className="flex gap-2 mt-3">
                      <button
                        type="button"
                        onClick={() => avatarInputRef.current?.click()}
                        className="px-3.5 py-1.5 rounded-lg bg-white text-[#050811] text-xs font-bold"
                      >
                        📁 อัปโหลดรูปจากเครื่อง
                      </button>
                      {editAvatarUrl && (
                        <button
                          type="button"
                          onClick={() => setEditAvatarUrl('')}
                          className="px-3 py-1.5 rounded-lg bg-[#0F2547] text-xs text-white"
                        >
                          ลบรูป
                        </button>
                      )}
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs text-slate-300 mb-1">ชื่อที่แสดง (Display Name)</label>
                    <input
                      type="text"
                      value={editDisplayName}
                      onChange={(e) => setEditDisplayName(e.target.value)}
                      className="w-full bg-[#050811] border border-[#1E3A5F] rounded-xl px-4 py-2 text-sm text-white outline-none"
                      required
                    />
                  </div>

                  <div>
                    <label className="block text-xs text-slate-300 mb-1">คำอธิบายตัวตน (Bio)</label>
                    <textarea
                      rows={3}
                      value={editBio}
                      onChange={(e) => setEditBio(e.target.value)}
                      className="w-full bg-[#050811] border border-[#1E3A5F] rounded-xl p-3 text-sm text-white outline-none resize-none"
                    />
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setIsEditingProfile(false)}
                      className="px-4 py-2 rounded-xl bg-[#050811] border border-[#1E3A5F] text-xs text-slate-300"
                    >
                      ยกเลิก
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 rounded-xl bg-white text-[#050811] font-bold text-xs"
                    >
                      บันทึกโปรไฟล์
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ================================================================= */}
          {/* MODAL: ดูโปรไฟล์สมาชิกเมื่อคลิกจากดาวบริวารในหน้า Home             */}
          {/* ================================================================= */}
          {selectedMemberModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-sm bg-[#0B1325] border border-white/30 rounded-2xl overflow-hidden shadow-2xl">
                <div className="bg-gradient-to-r from-[#0F2547] to-[#081226] px-5 py-3.5 border-b border-[#1E3A5F] flex items-center justify-between">
                  <span className="font-mono text-xs font-bold">{selectedMemberModal.id}</span>
                  <button
                    onClick={() => setSelectedMemberModal(null)}
                    className="text-slate-300 hover:text-white"
                  >
                    ✕
                  </button>
                </div>
                <div className="p-6 text-center space-y-3">
                  <div className="flex justify-center">
                    <Avatar user={selectedMemberModal} size="xl" />
                  </div>
                  <div>
                    <span className="px-2.5 py-0.5 rounded-full bg-white text-[#050811] text-[10px] font-bold">
                      {selectedMemberModal.memberTag}
                    </span>
                    <h3 className="text-lg font-bold text-white mt-2">
                      {selectedMemberModal.displayName}
                    </h3>
                    <p className="text-xs font-mono text-slate-400">
                      @{selectedMemberModal.username}
                    </p>
                  </div>
                  <p className="text-xs text-slate-200 bg-[#050811] p-3.5 rounded-xl border border-[#1E3A5F]">
                    {selectedMemberModal.bio}
                  </p>
                  <button
                    onClick={() => {
                      setSelectedTagFilter(selectedMemberModal.memberTag);
                      setSelectedMemberModal(null);
                      setCurrentView('feed');
                    }}
                    className="w-full py-2.5 rounded-xl bg-white text-[#050811] font-bold text-xs hover:bg-slate-200 transition"
                  >
                    ดูโพสต์ในกลุ่ม {selectedMemberModal.memberTag}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================================================================= */}
          {/* MODAL: ตั้งค่าการเชื่อมต่อ FIREBASE (วาง Config บนหน้าเว็บได้ทันที) */}
          {/* ================================================================= */}
          {isFirebaseModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-lg bg-[#0B1325] border border-white/30 rounded-2xl p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-[#1E3A5F]">
                  <h3 className="text-base font-bold text-white">
                    ☁️ เชื่อมต่อฐานข้อมูล Firebase Firestore
                  </h3>
                  <button
                    onClick={() => setIsFirebaseModalOpen(false)}
                    className="text-slate-400 hover:text-white"
                  >
                    ✕
                  </button>
                </div>

                <p className="text-xs text-slate-300 leading-relaxed">
                  วางโค้ด <code className="text-white font-mono">firebaseConfig</code> ที่ได้จากหน้าเว็บ Firebase Console ลงในช่องด้านล่างเพื่อซิงค์ข้อมูลสมาชิกและโพสต์แบบ Realtime (หรือใส่ไว้ในตัวแปร <code className="text-white font-mono">HARDCODED_FIREBASE_CONFIG</code> ในไฟล์ HTML ก็ได้ครับ)
                </p>

                <form onSubmit={handleSaveFirebaseConfig} className="space-y-3">
                  <textarea
                    rows={7}
                    value={firebaseConfigInput}
                    onChange={(e) => setFirebaseConfigInput(e.target.value)}
                    placeholder={`{\n  apiKey: "AIzaSy...",\n  authDomain: "your-app.firebaseapp.com",\n  projectId: "your-app",\n  storageBucket: "your-app.appspot.com",\n  messagingSenderId: "123456",\n  appId: "1:123456:web:abcdef"\n}`}
                    className="w-full bg-[#050811] border border-[#1E3A5F] focus:border-white rounded-xl p-3.5 text-xs font-mono text-white outline-none"
                    required
                  />

                  {firebaseStatusMsg && (
                    <div className="p-3 rounded-xl bg-[#050811] border border-blue-400 text-xs text-blue-200">
                      {firebaseStatusMsg}
                    </div>
                  )}

                  <div className="flex items-center justify-between pt-2">
                    {isCloudConnected ? (
                      <button
                        type="button"
                        onClick={handleDisconnectFirebase}
                        className="px-3 py-2 rounded-xl bg-red-950/70 border border-red-500/40 text-xs text-red-200"
                      >
                        ยกเลิกการเชื่อมต่อ
                      </button>
                    ) : (
                      <span />
                    )}
                    <div className="flex gap-2">
                      <button
                        type="button"
                        onClick={() => setIsFirebaseModalOpen(false)}
                        className="px-4 py-2 rounded-xl bg-[#050811] border border-[#1E3A5F] text-xs text-slate-300"
                      >
                        ปิด
                      </button>
                      <button
                        type="submit"
                        className="px-5 py-2 rounded-xl bg-white text-[#050811] font-bold text-xs hover:bg-slate-200 transition"
                      >
                        เชื่อมต่อ Firebase ทันที
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
