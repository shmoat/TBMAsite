<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Blue Moon Association</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap');
    body {
      font-family: 'Inter', 'Noto Sans Thai', sans-serif;
      background-color: #050811;
      color: #ffffff;
      overflow-x: hidden;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Orbit Animations */
    @keyframes orbit-cw {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }
    @keyframes orbit-ccw {
      from { transform: translate(-50%, -50%) rotate(360deg); }
      to { transform: translate(-50%, -50%) rotate(0deg); }
    }
    @keyframes counter-rotate-cw {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(-360deg); }
    }
    @keyframes counter-rotate-ccw {
      from { transform: translate(-50%, -50%) rotate(-360deg); }
      to { transform: translate(-50%, -50%) rotate(0deg); }
    }

    .orbit-ring-1 { animation: orbit-cw 38s linear infinite; }
    .orbit-ring-2 { animation: orbit-ccw 55s linear infinite; }
    .orbit-ring-3 { animation: orbit-cw 75s linear infinite; }

    .counter-ring-1 { animation: counter-rotate-cw 38s linear infinite; }
    .counter-ring-2 { animation: counter-rotate-ccw 55s linear infinite; }
    .counter-ring-3 { animation: counter-rotate-cw 75s linear infinite; }

    .orbit-system:hover .orbit-ring-1,
    .orbit-system:hover .orbit-ring-2,
    .orbit-system:hover .orbit-ring-3,
    .orbit-system:hover .counter-ring-1,
    .orbit-system:hover .counter-ring-2,
    .orbit-system:hover .counter-ring-3 {
      animation-play-state: paused;
    }
  </style>
</head>
<body class="bg-[#050811] text-white selection:bg-blue-900 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ============================================================================
    // FIREBASE CONFIGURATION (เชื่อมต่อกับโปรเจกต์ tbmasite ถาวร)
    // ============================================================================
    const firebaseConfig = {
      apiKey: "AIzaSyD80Ml5mk7IGFOx0qx4HRL-D_3TEy9h0YI",
      authDomain: "tbmasite.firebaseapp.com",
      projectId: "tbmasite",
      storageBucket: "tbmasite.firebasestorage.app",
      messagingSenderId: "616851307256",
      appId: "1:616851307256:web:15b49dfec2de521af6990d",
      measurementId: "G-JDW0E0S138"
    };

    const app = !firebase.apps.length ? firebase.initializeApp(firebaseConfig) : firebase.app();
    const db = firebase.firestore(app);

    const PRESET_MEMBER_TAGS = [
      'LCs & Pal',
      'PCSHS',
      'KPN',
      'KMUTT',
      'Instrumix',
      'Others'
    ];

    // บัญชีตั้งต้นรหัส M000 สำหรับเจ้าของเว็บ (Owner/Admin) รอให้เจ้าของเว็บมาตั้ง Username/Password เองในครั้งแรก
    const INITIAL_OWNER_SEED = {
      id: 'M000',
      username: '',
      password: '',
      isActivated: false,
      role: 'admin', // 'admin' (เจ้าของเว็บ) | 'mod' (ผู้ดูแลโพสต์) | 'member' (สมาชิกทั่วไป)
      memberTag: 'LCs & Pal',
      displayName: 'Founder (M000)',
      bio: 'ผู้ก่อตั้งและผู้ดูแลสูงสุดแห่ง The Blue Moon Association',
      avatarUrl: '',
      joinedAt: '2026-10-08'
    };

    function Avatar({ user, size = 'md', className = '' }) {
      const sizeClasses = {
        xs: 'w-6 h-6 text-[10px]',
        sm: 'w-8 h-8 text-xs',
        md: 'w-11 h-11 text-xs',
        lg: 'w-16 h-16 text-base',
        xl: 'w-20 h-20 text-lg'
      }[size];

      if (user?.avatarUrl) {
        return (
          <img
            src={user.avatarUrl}
            alt={user.displayName}
            className={`${sizeClasses} rounded-full object-cover border-2 border-white/40 bg-[#0F2547] shrink-0 ${className}`}
          />
        );
      }

      return (
        <div
          className={`${sizeClasses} rounded-full bg-[#0F2547] border-2 border-white/30 flex items-center justify-center font-mono font-bold text-white shrink-0 ${className}`}
        >
          {user?.displayName ? user.displayName.charAt(0).toUpperCase() : '#'}
        </div>
      );
    }

    function RoleBadge({ role }) {
      if (role === 'admin') {
        return (
          <span className="px-2 py-0.5 rounded bg-amber-400 text-[#050811] text-[10px] font-bold uppercase tracking-wider">
            👑 Owner
          </span>
        );
      }
      if (role === 'mod') {
        return (
          <span className="px-2 py-0.5 rounded bg-sky-400 text-[#050811] text-[10px] font-bold uppercase tracking-wider">
            🛡️ ผู้ดูแล (Mod)
          </span>
        );
      }
      return null;
    }

    function App() {
      const [users, setUsers] = useState([]);
      const [posts, setPosts] = useState([]);
      const [currentUser, setCurrentUser] = useState(null);
      const [isLoadingData, setIsLoadingData] = useState(true);

      // Views: 'home' | 'feed' | 'members' | 'bookmarks' | 'admin' | 'login'
      const [currentView, setCurrentView] = useState('home');
      const [selectedTagFilter, setSelectedTagFilter] = useState('ALL');
      const [memberDirectoryTag, setMemberDirectoryTag] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedMemberModal, setSelectedMemberModal] = useState(null);

      // Auth Tab: 'signin' (เข้าสู่ระบบด้วย Username/Pass) | 'activate' (กรอก ID เพื่อสร้าง Username/Pass ครั้งแรก)
      const [authMode, setAuthMode] = useState('signin');
      const [loginUsername, setLoginUsername] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [authError, setAuthError] = useState('');
      const [authSuccess, setAuthSuccess] = useState('');

      // Activate ID States (สมาชิกกรอก ID เพื่อสร้าง Username & Password เอง)
      const [activateIdInput, setActivateIdInput] = useState('');
      const [activateUsername, setActivateUsername] = useState('');
      const [activatePassword, setActivatePassword] = useState('');
      const [activateDisplayName, setActivateDisplayName] = useState('');

      // Profile Edit States
      const [isEditingProfile, setIsEditingProfile] = useState(false);
      const [editDisplayName, setEditDisplayName] = useState('');
      const [editBio, setEditBio] = useState('');
      const [editAvatarUrl, setEditAvatarUrl] = useState('');
      const avatarInputRef = useRef(null);

      // Post Creation States
      const [isCreatingPost, setIsCreatingPost] = useState(false);
      const [newPostTitle, setNewPostTitle] = useState('');
      const [newPostContent, setNewPostContent] = useState('');
      const [newPostCategory, setNewPostCategory] = useState('');
      const [newPostAttachments, setNewPostAttachments] = useState([]);
      const [attachmentUrlInput, setAttachmentUrlInput] = useState('');
      const [attachmentTypeInput, setAttachmentTypeInput] = useState('image');
      const postFileInputRef = useRef(null);

      // Admin Issue ID States (ออกเฉพาะ ID แพตเทิร์น M001 และ Tag)
      const [newMemberId, setNewMemberId] = useState('M001');
      const [newMemberTag, setNewMemberTag] = useState('LCs & Pal');
      const [copiedId, setCopiedId] = useState(null);

      // Comment Input
      const [commentInputs, setCommentInputs] = useState({});

      // ============================================================================
      // 1. REALTIME SYNC กับ FIREBASE FIRESTORE (โปรเจกต์ tbmasite)
      // ============================================================================
      useEffect(() => {
        // ดึงข้อมูลสมาชิก
        const unsubUsers = db.collection('bma_users').onSnapshot(
          async (snapshot) => {
            if (snapshot.empty) {
              // ถ้าฐานข้อมูลยังว่างเปล่า ให้สร้างรหัส M000 (Owner) ไว้รอให้เจ้าของเว็บมาเปิดใช้งาน
              await db.collection('bma_users').doc(INITIAL_OWNER_SEED.id).set(INITIAL_OWNER_SEED);
            } else {
              // ล้างรหัส BMA-000 เก่าที่ยังไม่ได้เปิดใช้งานออก (ถ้ามี) และเปลี่ยนมาใช้ M000 แทน
              const allDocs = snapshot.docs.map((doc) => doc.data());
              const oldUnactivatedOwner = allDocs.find((u) => u.id === 'BMA-000' && !u.isActivated);
              if (oldUnactivatedOwner) {
                await db.collection('bma_users').doc('BMA-000').delete();
              }

              const loadedUsers = allDocs.filter(
                (u) =>
                  u.id !== 'BMA-000' &&
                  u.password !== 'bma-root-password' &&
                  u.password !== 'moon-8842'
              );

              // หากยังไม่มี M000 ในระบบเลย ให้สร้าง M000 ให้อัตโนมัติ
              if (!loadedUsers.some((u) => u.id === 'M000')) {
                await db.collection('bma_users').doc(INITIAL_OWNER_SEED.id).set(INITIAL_OWNER_SEED);
                return;
              }

              loadedUsers.sort((a, b) => a.id.localeCompare(b.id));
              setUsers(loadedUsers);

              // คำนวณเลข ID ถัดไปในรูปแบบ M001, M002, ...
              const maxNum = loadedUsers.reduce((max, u) => {
                const match = String(u.id).match(/^M(\d+)$/i);
                if (match) {
                  const num = parseInt(match[1], 10);
                  return num > max ? num : max;
                }
                return max;
              }, 0);
              const nextNum = String(maxNum + 1).padStart(3, '0');
              setNewMemberId(`M${nextNum}`);
            }
            setIsLoadingData(false);
          },
          (err) => {
            console.error('Firestore Users Error:', err);
            setIsLoadingData(false);
          }
        );

        // ดึงข้อมูลโพสต์
        const unsubPosts = db.collection('bma_posts').onSnapshot(
          (snapshot) => {
            const loadedPosts = snapshot.docs.map((doc) => doc.data());
            loadedPosts.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            setPosts(loadedPosts);
          },
          (err) => {
            console.error('Firestore Posts Error:', err);
          }
        );

        return () => {
          unsubUsers();
          unsubPosts();
        };
      }, []);

      // ซิงค์ข้อมูล currentUser ให้เป็นปัจจุบันเสมอเมื่อฐานข้อมูลอัปเดต
      useEffect(() => {
        if (currentUser && users.length > 0) {
          const latestMe = users.find((u) => u.id === currentUser.id);
          if (latestMe) {
            setCurrentUser(latestMe);
          } else {
            setCurrentUser(null);
          }
        }
      }, [users]);

      // ============================================================================
      // 2. ระบบเข้าสู่ระบบ (Sign In) & เปิดใช้งานรหัสสมาชิก (Activate ID)
      // ============================================================================
      const handleSignIn = (e) => {
        e.preventDefault();
        setAuthError('');
        const found = users.find(
          (u) =>
            u.isActivated &&
            u.username &&
            u.username.toLowerCase() === loginUsername.trim().toLowerCase() &&
            u.password === loginPassword
        );

        if (found) {
          setCurrentUser(found);
          setLoginUsername('');
          setLoginPassword('');
          setCurrentView('feed');
        } else {
          setAuthError('Username หรือ Password ไม่ถูกต้อง (หากเพิ่งได้รับ Member ID กรุณากดแท็บ "เปิดใช้งาน Member ID" ด้านบน)');
        }
      };

      const handleActivateMemberId = async (e) => {
        e.preventDefault();
        setAuthError('');
        setAuthSuccess('');

        const cleanId = activateIdInput.trim().toUpperCase();
        const cleanUser = activateUsername.trim();
        const cleanPass = activatePassword.trim();
        const cleanName = activateDisplayName.trim() || `Member #${cleanId}`;

        if (!cleanId || !cleanUser || !cleanPass) {
          setAuthError('กรุณากรอกข้อมูลให้ครบทุกช่อง');
          return;
        }

        // ค้นหาว่ามี Member ID ที่ Admin ออกไว้ให้หรือไม่
        const targetAccount = users.find((u) => u.id.toUpperCase() === cleanId);
        if (!targetAccount) {
          setAuthError(`ไม่พบรหัสประจำตัว "${cleanId}" ในระบบ กรุณาติดต่อเจ้าของเว็บไซต์เพื่อขอรับ Member ID`);
          return;
        }

        if (targetAccount.isActivated) {
          setAuthError(`รหัส "${cleanId}" ถูกเปิดใช้งานและตั้ง Username ไปเรียบร้อยแล้ว กรุณาเข้าสู่ระบบตามปกติ`);
          return;
        }

        // ตรวจสอบว่า Username ซ้ำกับคนอื่นหรือไม่
        const usernameTaken = users.some(
          (u) => u.id !== targetAccount.id && u.username && u.username.toLowerCase() === cleanUser.toLowerCase()
        );
        if (usernameTaken) {
          setAuthError('Username นี้มีสมาชิกท่านอื่นใช้งานแล้ว กรุณาตั้ง Username อื่น');
          return;
        }

        const updatedAccount = {
          ...targetAccount,
          username: cleanUser,
          password: cleanPass,
          displayName: cleanName,
          isActivated: true,
          joinedAt: new Date().toISOString().split('T')[0]
        };

        try {
          await db.collection('bma_users').doc(targetAccount.id).set(updatedAccount);
          setCurrentUser(updatedAccount);
          setActivateIdInput('');
          setActivateUsername('');
          setActivatePassword('');
          setActivateDisplayName('');
          setCurrentView('feed');
        } catch (err) {
          setAuthError('เกิดข้อผิดพลาดในการบันทึกข้อมูล: ' + err.message);
        }
      };

      // ============================================================================
      // 3. ระบบ ADMIN: ออกรหัส (ID + Tag) และแต่งตั้งผู้ดูแลโพสต์ (Moderator)
      // ============================================================================
      const handleIssueNewId = async (e) => {
        e.preventDefault();
        if (currentUser?.role !== 'admin') return;

        const cleanId = newMemberId.trim().toUpperCase();
        const cleanTag = newMemberTag.trim();
        if (!cleanId || !cleanTag) return;

        if (users.some((u) => u.id.toUpperCase() === cleanId)) {
          alert(`รหัส ${cleanId} มีอยู่ในระบบแล้ว กรุณาระบุรหัสอื่น`);
          return;
        }

        const newSlot = {
          id: cleanId,
          memberTag: cleanTag,
          role: 'member',
          isActivated: false,
          username: '',
          password: '',
          displayName: `รออนุมัติตัวตน (${cleanId})`,
          bio: 'สมาชิกใหม่ (รอเจ้าตัวเข้ามากำหนด Username และโปรไฟล์)',
          avatarUrl: '',
          joinedAt: new Date().toISOString().split('T')[0]
        };

        await db.collection('bma_users').doc(cleanId).set(newSlot);
      };

      // สลับตำแหน่ง Member <-> Moderator (ผู้ดูแลโพสต์)
      const handleToggleModerator = async (targetUser) => {
        if (currentUser?.role !== 'admin' || targetUser.role === 'admin') return;
        const nextRole = targetUser.role === 'mod' ? 'member' : 'mod';
        await db.collection('bma_users').doc(targetUser.id).update({ role: nextRole });
      };

      const handleDeleteUser = async (userId) => {
        if (currentUser?.role !== 'admin' || userId === 'M000') return;
        if (!confirm(`ยืนยันการลบบัญชีรหัส ${userId} ออกจากระบบ?`)) return;
        await db.collection('bma_users').doc(userId).delete();
      };

      const handleCopyInviteId = (user) => {
        const text = `[The Blue Moon Association]\nบัตรเชิญเข้าสู่สมาคมของคุณ:\n- Member ID: ${user.id}\n- หมวดหมู่ (Tag): ${user.memberTag}\n\nวิธีเข้าใช้งานครั้งแรก:\n1. เข้าเว็บไซต์สมาคม แล้วกดปุ่ม "เข้าสู่ระบบ / เปิดใช้งาน ID"\n2. เลือกแท็บ "เปิดใช้งาน Member ID"\n3. กรอกรหัส ${user.id} เพื่อตั้ง Username และ Password ของคุณเองได้ทันที`;
        navigator.clipboard.writeText(text);
        setCopiedId(user.id);
        setTimeout(() => setCopiedId(null), 2500);
      };

      // ============================================================================
      // 4. ระบบจัดการโพสต์และคอมเมนต์ (สำหรับเจ้าของโพสต์, ผู้ดูแล Mod, และ Admin)
      // ============================================================================
      const canManagePostOrComment = (authorId) => {
        if (!currentUser) return false;
        return (
          currentUser.role === 'admin' ||
          currentUser.role === 'mod' ||
          currentUser.id === authorId
        );
      };

      const handleDeletePost = async (postId) => {
        if (!confirm('ยืนยันการลบโพสต์นี้ออกจากกระดานสมาคม?')) return;
        await db.collection('bma_posts').doc(postId).delete();
      };

      const handleDeleteComment = async (postId, commentId) => {
        const targetPost = posts.find((p) => p.id === postId);
        if (!targetPost) return;
        const updatedComments = (targetPost.comments || []).filter((c) => c.id !== commentId);
        await db.collection('bma_posts').doc(postId).update({ comments: updatedComments });
      };

      // ============================================================================
      // 5. ระบบโปรไฟล์และการสร้างโพสต์ใหม่
      // ============================================================================
      const handleAvatarUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_SIZE = 300;
            let width = img.width;
            let height = img.height;
            if (width > height && width > MAX_SIZE) {
              height *= MAX_SIZE / width;
              width = MAX_SIZE;
            } else if (height > MAX_SIZE) {
              width *= MAX_SIZE / height;
              height = MAX_SIZE;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            setEditAvatarUrl(canvas.toDataURL('image/jpeg', 0.85));
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      const handleSaveProfile = async (e) => {
        e.preventDefault();
        if (!editDisplayName.trim() || !currentUser) return;

        const updatedUser = {
          ...currentUser,
          displayName: editDisplayName.trim(),
          bio: editBio.trim(),
          avatarUrl: editAvatarUrl.trim()
        };

        await db.collection('bma_users').doc(updatedUser.id).set(updatedUser);
        setCurrentUser(updatedUser);
        setIsEditingProfile(false);
      };

      const handlePostFileSelect = (e) => {
        const files = Array.from(e.target.files || []);
        files.forEach((file) => {
          if (file.size > 850 * 1024) {
            alert(`ไฟล์ "${file.name}" มีขนาดเกิน 850KB กรุณาใช้ไฟล์ขนาดเล็กลง หรือแนบเป็นลิงก์ URL ด้านล่างแทนครับ`);
            return;
          }
          const reader = new FileReader();
          reader.onloadend = () => {
            let fileType = 'file';
            if (file.type.startsWith('image/')) fileType = 'image';
            else if (file.type.startsWith('video/')) fileType = 'video';

            setNewPostAttachments((prev) => [
              ...prev,
              {
                id: 'att-' + Date.now() + Math.random().toString(36).slice(2, 6),
                name: file.name,
                type: fileType,
                url: reader.result,
                size: (file.size / 1024).toFixed(1) + ' KB'
              }
            ]);
          };
          reader.readAsDataURL(file);
        });
        e.target.value = '';
      };

      const handleAddUrlAttachment = () => {
        if (!attachmentUrlInput.trim()) return;
        setNewPostAttachments((prev) => [
          ...prev,
          {
            id: 'att-' + Date.now(),
            name: attachmentUrlInput.split('/').pop() || 'Attached Media',
            type: attachmentTypeInput,
            url: attachmentUrlInput.trim(),
            size: 'External Link'
          }
        ]);
        setAttachmentUrlInput('');
      };

      const handleCreatePost = async (e) => {
        e.preventDefault();
        if (!currentUser) return;
        if (!newPostContent.trim() && !newPostTitle.trim() && newPostAttachments.length === 0) return;

        const postObj = {
          id: `post-${Date.now()}`,
          authorId: currentUser.id,
          title: newPostTitle.trim(),
          content: newPostContent.trim(),
          category: newPostCategory,
          attachments: newPostAttachments,
          createdAt: new Date().toLocaleDateString('th-TH', {
            day: 'numeric',
            month: 'short',
            hour: '2-digit',
            minute: '2-digit'
          }),
          timestamp: Date.now(),
          likes: [],
          bookmarks: [],
          comments: []
        };

        await db.collection('bma_posts').doc(postObj.id).set(postObj);
        setNewPostTitle('');
        setNewPostContent('');
        setNewPostCategory('');
        setNewPostAttachments([]);
        setIsCreatingPost(false);
      };

      const toggleLike = async (postId) => {
        if (!currentUser) {
