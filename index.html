                <div className="flex items-center justify-between pb-3 mb-4 border-b border-[#1E3A5F]">
                  <h3 className="text-base font-bold text-white">
                    🏷️ แก้ไขหมวดหมู่สมาชิก: {editingTagsUser.displayName} ({editingTagsUser.id})
                  </h3>
                  <button onClick={() => setEditingTagsUser(null)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <form onSubmit={handleSaveEditedMemberTags} className="space-y-4">
                  <div className="flex flex-wrap gap-2">
                    {Array.from(new Set([...allAvailableTags, ...editingTagsList])).map((t) => {
                      const isChecked = editingTagsList.includes(t);
                      return (
                        <button
                          type="button"
                          key={t}
                          onClick={() => toggleEditingTagItem(t)}
                          className={
                            isChecked
                              ? 'px-3 py-1.5 rounded-xl text-xs border bg-white text-[#050811] border-white font-bold shadow'
                              : 'px-3 py-1.5 rounded-xl text-xs border bg-[#050811] text-slate-300 border-[#1E3A5F]'
                          }
                        >
                          {isChecked ? '✓ ' + t : '+ ' + t}
                        </button>
                      );
                    })}
                  </div>
                  <div className="flex gap-2 pt-2">
                    <input
                      type="text"
                      value={editingCustomTag}
                      onChange={(e) => setEditingCustomTag(e.target.value)}
                      placeholder="หรือพิมพ์หมวดหมู่ใหม่..."
                      className="flex-1 bg-[#050811] border border-[#1E3A5F] rounded-xl px-3.5 py-2 text-xs text-white outline-none"
                    />
                    <button type="button" onClick={handleAddEditingCustomTag} className="px-3.5 py-2 rounded-xl bg-[#0F2547] border border-white/20 text-xs font-bold text-white">
                      + เพิ่มแท็ก
                    </button>
                  </div>
                  <div className="flex justify-end gap-2 pt-3 border-t border-[#1E3A5F]">
                    <button type="button" onClick={() => setEditingTagsUser(null)} className="px-4 py-2 rounded-xl bg-[#050811] border border-[#1E3A5F] text-xs text-slate-300">ยกเลิก</button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-white text-[#050811] font-bold text-xs">บันทึกหมวดหมู่</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: CREATE POST & POLL */}
          {isCreatingPost && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="w-full max-w-xl bg-[#0B1325] border border-white/30 rounded-2xl p-6 shadow-2xl my-8">
                <div className="flex items-center justify-between pb-3 mb-4 border-b border-[#1E3A5F]">
                  <h3 className="text-base font-bold text-white">เขียนโพสต์ใหม่ / สร้างโพลล์สำรวจความคิดเห็น</h3>
                  <button onClick={() => setIsCreatingPost(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <form onSubmit={handleCreatePost} className="space-y-4">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs text-slate-300 mb-1">หัวข้อเรื่อง (ไม่บังคับ)</label>
                      <input
                        type="text"
                        value={newPostTitle}
                        onChange={(e) => setNewPostTitle(e.target.value)}
                        placeholder="เว้นว่างไว้ได้หากไม่มีหัวข้อ..."
                        className="w-full bg-[#050811] border border-[#1E3A5F] rounded-xl px-3.5 py-2 text-sm text-white outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-300 mb-1">หมวดหมู่บทความ (ไม่บังคับ)</label>
                      <select
                        value={newPostCategory}
                        onChange={(e) => setNewPostCategory(e.target.value)}
                        className="w-full bg-[#050811] border border-[#1E3A5F] rounded-xl px-3.5 py-2 text-sm text-white outline-none"
                      >
                        <option value="">โปรดเลือก... (ไม่ต้องมีหมวดหมู่)</option>
                        <option value="General">General (ทั่วไป)</option>
                        <option value="Music & Art">Music & Art (ดนตรีและศิลปะ)</option>
                        <option value="Night Log">Night Log (บันทึกยามดึก)</option>
                        <option value="Engineering & Tech">Engineering & Tech</option>
                        <option value="Announcement">Announcement (ประกาศ)</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs text-slate-300 mb-1">เนื้อหาโพสต์</label>
                    <textarea
                      rows={3}
                      value={newPostContent}
                      onChange={(e) => setNewPostContent(e.target.value)}
                      placeholder="เขียนสิ่งที่คุณอยากแชร์กับสมาคม..."
                      className="w-full bg-[#050811] border border-[#1E3A5F] rounded-xl p-3.5 text-sm text-white outline-none resize-none"
                    />
                  </div>

                  <div className="p-4 rounded-xl bg-[#050811] border border-[#1E3A5F] space-y-3">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-bold text-white">📊 แนบโพลล์สำรวจความคิดเห็น (แสดงผลโพลล์ในคอมเมนต์)</span>
                      <button
                        type="button"
                        onClick={() => setHasPollInNewPost(!hasPollInNewPost)}
                        className={
                          hasPollInNewPost
                            ? 'px-3 py-1 rounded-lg bg-white text-[#050811] text-xs font-bold'
                            : 'px-3 py-1 rounded-lg bg-[#0F2547] text-white text-xs font-semibold'
                        }
                      >
                        {hasPollInNewPost ? '✓ เปิดใช้งานโพลล์แล้ว' : '+ เพิ่มโพลล์'}
                      </button>
                    </div>

                    {hasPollInNewPost && (
                      <div className="space-y-3 pt-2 border-t border-[#1E3A5F]">
                        <div>
                          <label className="block text-xs text-slate-300 mb-1">หัวข้อคำถามโพลล์ *</label>
                          <input
                            type="text"
                            value={pollQuestionInput}
                            onChange={(e) => setPollQuestionInput(e.target.value)}
                            placeholder="ตั้งคำถามโพลล์..."
                            className="w-full bg-[#0B1325] border border-[#1E3A5F] rounded-lg px-3 py-2 text-xs text-white outline-none"
                          />
                        </div>

                        <div className="space-y-2">
                          <label className="block text-xs text-slate-300">ตัวเลือกโพลล์ *</label>
                          {pollOptionsInput.map((optVal, idx) => (
                            <div key={idx} className="flex items-center gap-2">
                              <input
                                type="text"
                                value={optVal}
                                onChange={(e) => {
                                  const next = [...pollOptionsInput];
                                  next[idx] = e.target.value;
                                  setPollOptionsInput(next);
                                }}
                                placeholder={'ตัวเลือกที่ ' + (idx + 1)}
                                className="flex-1 bg-[#0B1325] border border-[#1E3A5F] rounded-lg px-3 py-1.5 text-xs text-white outline-none"
                              />
                              {pollOptionsInput.length > 2 && (
                                <button
                                  type="button"
                                  onClick={() => handleRemovePollOptionField(idx)}
                                  className="text-red-400 text-xs font-bold px-2"
                                >
                                  ลบ
                                </button>
                              )}
                            </div>
                          ))}
                          <button
                            type="button"
                            onClick={handleAddPollOptionField}
                            className="px-3 py-1 rounded-lg bg-[#0F2547] text-xs text-blue-200 font-semibold"
                          >
                            + เพิ่มตัวเลือก
                          </button>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
                          <div>
                            <label className="block text-xs text-slate-300 mb-1">ตั้งเวลาปิดโพลล์ (ไม่บังคับ)</label>
                            <input
                              type="datetime-local"
                              value={pollCloseTimeInput}
                              onChange={(e) => setPollCloseTimeInput(e.target.value)}
                              className="w-full bg-[#0B1325] border border-[#1E3A5F] rounded-lg px-3 py-1.5 text-xs text-white outline-none"
                            />
                          </div>
                          <div className="flex items-end pb-1">
                            <label className="flex items-center gap-2 cursor-pointer text-xs text-slate-200">
                              <input
                                type="checkbox"
                                checked={pollIsAnonymousInput}
                                onChange={(e) => setPollIsAnonymousInput(e.target.checked)}
                                className="w-4 h-4 rounded"
                              />
                              <span>🕵️ โหวตแบบไม่แสดงชื่อ (Anonymous Vote)</span>
                            </label>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>

                  <div className="p-4 rounded-xl bg-[#050811] border border-[#1E3A5F] space-y-3">
                    <div className="flex flex-wrap items-center justify-between gap-2">
                      <span className="text-xs font-semibold text-slate-200">📎 แนบรูปภาพ, วิดีโอ หรือไฟล์เอกสาร</span>
                      <input type="file" multiple ref={postFileInputRef} onChange={handlePostFileSelect} className="hidden" />
                      <button type="button" onClick={() => postFileInputRef.current && postFileInputRef.current.click()} className="px-3 py-1.5 rounded-lg bg-[#0F2547] hover:bg-white hover:text-[#050811] border border-white/20 text-xs font-semibold">
                        + เลือกไฟล์จากเครื่อง
                      </button>
                    </div>
                    <div className="flex flex-col sm:flex-row gap-2 pt-1">
                      <select value={attachmentTypeInput} onChange={(e) => setAttachmentTypeInput(e.target.value)} className="bg-[#0B1325] border border-[#1E3A5F] rounded-lg px-2.5 py-1.5 text-xs text-white outline-none">
                        <option value="image">รูปภาพ (URL)</option>
                        <option value="video">วิดีโอ (MP4/URL)</option>
                        <option value="file">ไฟล์เอกสาร (URL)</option>
                      </select>
                      <input
                        type="text"
                        value={attachmentUrlInput}
                        onChange={(e) => setAttachmentUrlInput(e.target.value)}
                        placeholder="หรือวางลิงก์รูปภาพ / วิดีโอ / ไฟล์..."
                        className="flex-1 bg-[#0B1325] border border-[#1E3A5F] rounded-lg px-3 py-1.5 text-xs text-white outline-none"
                      />
                      <button type="button" onClick={handleAddUrlAttachment} className="px-3 py-1.5 rounded-lg bg-white text-[#050811] text-xs font-bold shrink-0">เพิ่มลิงก์</button>
                    </div>
                    {newPostAttachments.length > 0 && (
                      <div className="space-y-1.5 pt-2">
                        {newPostAttachments.map((att) => (
                          <div key={att.id} className="flex items-center justify-between px-3 py-1.5 rounded-lg bg-[#0B1325] border border-[#1E3A5F] text-xs">
                            <span className="truncate max-w-xs">[{att.type.toUpperCase()}] {att.name}</span>
                            <button type="button" onClick={() => setNewPostAttachments(newPostAttachments.filter((a) => a.id !== att.id))} className="text-red-400 ml-2">ลบ</button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setIsCreatingPost(false)} className="px-4 py-2 rounded-xl bg-[#050811] border border-[#1E3A5F] text-xs text-slate-300">ยกเลิก</button>
                    <button type="submit" className="px-6 py-2 rounded-xl bg-white text-[#050811] font-bold text-xs">เผยแพร่โพสต์</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: สร้างห้อง Global Chat ใหม่ */}
          {isCreateChannelOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-md bg-[#0B1325] border border-white/30 rounded-2xl p-6 shadow-2xl">
                <div className="flex items-center justify-between pb-3 mb-4 border-b border-[#1E3A5F]">
                  <h3 className="text-base font-bold text-white">🛡️ สร้างห้อง Global Chat ใหม่</h3>
                  <button onClick={() => setIsCreateChannelOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <form onSubmit={handleCreateChannel} className="space-y-4">
                  <div className="grid grid-cols-4 gap-3">
                    <div>
                      <label className="block text-xs text-slate-300 mb-1">ไอคอน</label>
                      <input type="text" value={newChannelIcon} onChange={(e) => setNewChannelIcon(e.target.value)} className="w-full bg-[#050811] border border-[#1E3A5F] rounded-xl px-3 py-2 text-center text-base outline-none" />
                    </div>
                    <div className="col-span-3">
                      <label className="block text-xs text-slate-300 mb-1">ชื่อห้อง (Channel Name) *</label>
                      <input type="text" value={newChannelName} onChange={(e) => setNewChannelName(e.target.value)} placeholder="เช่น music-room" className="w-full bg-[#050811] border border-[#1E3A5F] rounded-xl px-3.5 py-2 text-sm text-white outline-none" required />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs text-slate-300 mb-1">คำอธิบายหัวข้อห้อง</label>
                    <input type="text" value={newChannelDesc} onChange={(e) => setNewChannelDesc(e.target.value)} placeholder="ระบุจุดประสงค์ของห้องนี้..." className="w-full bg-[#050811] border border-[#1E3A5F] rounded-xl px-3.5 py-2 text-sm text-white outline-none" />
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setIsCreateChannelOpen(false)} className="px-4 py-2 rounded-xl bg-[#050811] border border-[#1E3A5F] text-xs text-slate-300">ยกเลิก</button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-white text-[#050811] font-bold text-xs">สร้างห้องแชตรวม</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: สร้างกลุ่มแชตย่อย */}
          {isCreateGroupOpen && currentUser && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-md bg-[#0B1325] border border-white/30 rounded-2xl p-6 shadow-2xl">
                <div className="flex items-center justify-between pb-3 mb-4 border-b border-[#1E3A5F]">
                  <h3 className="text-base font-bold text-white">👥 สร้างกลุ่มแชตใหม่ (เลือกสมาชิก)</h3>
                  <button onClick={() => setIsCreateGroupOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <form onSubmit={handleCreateGroup} className="space-y-4">
                  <div>
                    <label className="block text-xs text-slate-300 mb-1">ชื่อกลุ่มแชต *</label>
                    <input type="text" value={newGroupName} onChange={(e) => setNewGroupName(e.target.value)} placeholder="ตั้งชื่อกลุ่มแชตของคุณ..." className="w-full bg-[#050811] border border-[#1E3A5F] rounded-xl px-3.5 py-2 text-sm text-white outline-none" required />
                  </div>
                  <div>
                    <label className="block text-xs text-slate-300 mb-1.5">คลิกเลือกสมาชิกที่ต้องการดึงเข้ากลุ่ม ({selectedGroupMembers.length} คน) *</label>
                    <div className="max-h-52 overflow-y-auto space-y-1.5 p-2 rounded-xl bg-[#050811] border border-[#1E3A5F]">
                      {activatedMembers.filter((m) => m.id !== currentUser.id).map((m) => {
                        const isChecked = selectedGroupMembers.includes(m.id);
                        return (
                          <div
                            key={m.id}
                            onClick={() => toggleSelectGroupMember(m.id)}
                            className={isChecked ? 'p-2.5 rounded-xl bg-[#0F2547] border border-white flex items-center justify-between cursor-pointer' : 'p-2.5 rounded-xl bg-[#0B1325] border border-[#1E3A5F] flex items-center justify-between cursor-pointer hover:border-white/40'}
                          >
                            <div className="flex items-center gap-2.5">
                              <Avatar user={m} size="xs" showStatus={true} />
                              <div>
                                <div className="text-xs font-bold text-white">{m.displayName} <span className="font-mono text-blue-300">({m.id})</span></div>
                                <div className="text-[10px] text-slate-400">@{m.username} • {getUserTags(m).join(', ')}</div>
                              </div>
                            </div>
                            <span className="text-xs font-bold">{isChecked ? '✓ เลือกแล้ว' : '+ เลือก'}</span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setIsCreateGroupOpen(false)} className="px-4 py-2 rounded-xl bg-[#050811] border border-[#1E3A5F] text-xs text-slate-300">ยกเลิก</button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-white text-[#050811] font-bold text-xs">สร้างกลุ่มแชต</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: หน้าต่างยืนยันการลบห้องแชต */}
          {deleteConfirmTarget && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-sm bg-[#0B1325] border-2 border-red-500/60 rounded-2xl p-6 shadow-2xl text-center space-y-4">
                <div className="w-12 h-12 mx-auto rounded-full bg-red-950 border border-red-500/40 flex items-center justify-center text-2xl">⚠️</div>
                <div>
                  <h3 className="text-base font-bold text-white">ยืนยันการลบห้องแชต?</h3>
                  <p className="text-xs text-slate-300 mt-1.5 leading-relaxed">
                    คุณกำลังจะลบห้อง <strong className="text-white">"{deleteConfirmTarget.name}"</strong> อย่างถาวร การกระทำนี้ไม่สามารถย้อนกลับได้
                  </p>
                </div>
                <div className="flex items-center justify-center gap-2.5 pt-2">
                  <button type="button" onClick={() => setDeleteConfirmTarget(null)} className="flex-1 py-2.5 rounded-xl bg-[#050811] border border-[#1E3A5F] text-xs font-semibold text-slate-300">ยกเลิก</button>
                  <button type="button" onClick={handleConfirmDeleteRoom} className="flex-1 py-2.5 rounded-xl bg-red-600 hover:bg-red-500 text-xs font-bold text-white shadow-lg">🗑️ ยืนยันการลบถาวร</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
