<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Blue Moon Association</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap');
    body {
      font-family: 'Inter', 'Noto Sans Thai', sans-serif;
      background-color: #050811;
      color: #ffffff;
      overflow-x: hidden;
    }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #050811; }
    ::-webkit-scrollbar-thumb { background: #1E3A5F; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #3B82F6; }

    @keyframes orbit-cw {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }
    @keyframes orbit-ccw {
      from { transform: translate(-50%, -50%) rotate(360deg); }
      to { transform: translate(-50%, -50%) rotate(0deg); }
    }
    @keyframes counter-rotate-cw {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(-360deg); }
    }
    @keyframes counter-rotate-ccw {
      from { transform: translate(-50%, -50%) rotate(-360deg); }
      to { transform: translate(-50%, -50%) rotate(0deg); }
    }
    .orbit-ring-1 { animation: orbit-cw 38s linear infinite; }
    .orbit-ring-2 { animation: orbit-ccw 55s linear infinite; }
    .orbit-ring-3 { animation: orbit-cw 75s linear infinite; }
    .counter-ring-1 { animation: counter-rotate-cw 38s linear infinite; }
    .counter-ring-2 { animation: counter-rotate-ccw 55s linear infinite; }
    .counter-ring-3 { animation: counter-rotate-cw 75s linear infinite; }
    .orbit-system:hover .orbit-ring-1,
    .orbit-system:hover .orbit-ring-2,
    .orbit-system:hover .orbit-ring-3,
    .orbit-system:hover .counter-ring-1,
    .orbit-system:hover .counter-ring-2,
    .orbit-system:hover .counter-ring-3 {
      animation-play-state: paused;
    }
  </style>
</head>
<body class="bg-[#050811] text-white selection:bg-blue-900 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ============================================================================
    // FIREBASE CONFIGURATION (โปรเจกต์ tbmasite)
    // ============================================================================
    const firebaseConfig = {
      apiKey: "AIzaSyD80Ml5mk7IGFOx0qx4HRL-D_3TEy9h0YI",
      authDomain: "tbmasite.firebaseapp.com",
      projectId: "tbmasite",
      storageBucket: "tbmasite.firebasestorage.app",
      messagingSenderId: "616851307256",
      appId: "1:616851307256:web:15b49dfec2de521af6990d",
      measurementId: "G-JDW0E0S138"
    };

    let db = null;
    try {
      const app = !firebase.apps.length ? firebase.initializeApp(firebaseConfig) : firebase.app();
      db = firebase.firestore(app);
    } catch (e) {
      console.error("Firebase Init Error:", e);
    }

    const PRESET_MEMBER_TAGS = ['LCs & Pal', 'PCSHS', 'KPN', 'KMUTT', 'Instrumix', 'Others'];

    const SOCIAL_PLATFORMS = [
      { id: 'Facebook', label: 'Facebook', icon: '📘' },
      { id: 'Instagram', label: 'Instagram', icon: '📸' },
      { id: 'YouTube', label: 'YouTube', icon: '▶️' },
      { id: 'TikTok', label: 'TikTok', icon: '🎵' },
      { id: 'External Link', label: 'External Link (ลิงก์เว็บไซต์)', icon: '🔗' }
    ];

    const INITIAL_OWNER_SEED = {
      id: 'M000',
      username: '',
      password: '',
      isActivated: false,
      role: 'admin',
      memberTag: 'LCs & Pal',
      memberTags: ['LCs & Pal'],
      displayName: 'Founder (M000)',
      bio: 'ผู้ก่อตั้งและผู้ดูแลสูงสุดแห่ง The Blue Moon Association',
      avatarUrl: '',
      socialLinks: [],
      isOnline: false,
      joinedAt: '2026-10-08'
    };

    const DEFAULT_GLOBAL_CHANNELS = [
      {
        id: 'global-lobby',
        name: 'blue-moon-lobby',
        icon: '🌐',
        desc: 'โถงหลักสำหรับสมาชิกทุกคนในสมาคม',
        createdBy: 'M000',
        isProtected: true,
        isSystemReadOnly: false,
        timestamp: 1000
      },
      {
        id: 'global-announce',
        name: 'announcements',
        icon: '📢',
        desc: 'ห้องแจ้งเตือนอัตโนมัติเมื่อมีโพสต์ใหม่ในเว็บไซต์ (ไม่อนุญาตให้พิมพ์)',
        createdBy: 'SYSTEM',
        isProtected: true,
        isSystemReadOnly: true,
        timestamp: 2000
      }
    ];

    // Helper ดึงหมวดหมู่ทั้งหมดของสมาชิก (รองรับทั้งรูปแบบเก่า memberTag เดียว และรูปแบบใหม่ memberTags หลายอัน)
    function getUserTags(user) {
      if (!user) return ['Others'];
      if (Array.isArray(user.memberTags) && user.memberTags.length > 0) {
        return user.memberTags;
      }
      if (user.memberTag) return [user.memberTag];
      return ['Others'];
    }

    function getSocialIcon(platform) {
      const found = SOCIAL_PLATFORMS.find((p) => p.id === platform);
      return found ? found.icon : '🔗';
    }

    function formatSafeUrl(url) {
      if (!url) return '#';
      const trimmed = url.trim();
      if (trimmed.startsWith('http://') || trimmed.startsWith('https://')) return trimmed;
      return 'https://' + trimmed;
    }

    function Avatar({ user, size = 'md', showStatus = false, className = '' }) {
      const sizeMap = {
        xs: 'w-6 h-6 text-[10px]',
        sm: 'w-8 h-8 text-xs',
        md: 'w-11 h-11 text-xs',
        lg: 'w-16 h-16 text-base',
        xl: 'w-20 h-20 text-lg'
      };
      const sc = sizeMap[size] || sizeMap.md;
      const isOnline = user && user.isOnline;

      return (
        <div className={'relative inline-flex shrink-0 ' + className}>
          {user && user.avatarUrl ? (
            <img
              src={user.avatarUrl}
              alt={user.displayName || 'Avatar'}
              className={sc + ' rounded-full object-cover border-2 border-white/40 bg-[#0F2547] shrink-0'}
            />
          ) : (
            <div className={sc + ' rounded-full bg-[#0F2547] border-2 border-white/30 flex items-center justify-center font-mono font-bold text-white shrink-0'}>
              {user && user.displayName ? user.displayName.charAt(0).toUpperCase() : '#'}
            </div>
          )}
          {showStatus && user && (
            <span
              className={
                'absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full border-2 border-[#050811] ' +
                (isOnline ? 'bg-emerald-400' : 'bg-slate-500')
              }
              title={isOnline ? 'ออนไลน์' : 'ออฟไลน์'}
            />
          )}
        </div>
      );
    }

    function RoleBadge({ role }) {
      if (role === 'admin') {
        return <span className="px-2 py-0.5 rounded bg-amber-400 text-[#050811] text-[10px] font-bold uppercase shrink-0">👑 Owner</span>;
      }
      if (role === 'mod') {
        return <span className="px-2 py-0.5 rounded bg-sky-400 text-[#050811] text-[10px] font-bold uppercase shrink-0">🛡️ Mod</span>;
      }
      return null;
    }

    function TagBadgesList({ user, dark = false }) {
      const tags = getUserTags(user);
      return (
        <div className="flex flex-wrap gap-1">
          {tags.map((t, i) => (
            <span
              key={i}
              className={
                dark
                  ? 'px-2 py-0.5 rounded-full bg-[#050811] text-white border border-white/20 text-[10px] font-bold'
                  : 'px-2 py-0.5 rounded-full bg-[#0F2547] border border-white/20 text-blue-100 text-[10px] font-semibold'
              }
            >
              {t}
            </span>
          ))}
        </div>
      );
    }

    function FormattedMessageText({ text, currentUser }) {
      if (!text) return null;
      const regex = /(@\[[^\]]+\]|@[a-zA-Z0-9_&-]+)/g;
      const parts = text.split(regex);
      const myTags = currentUser ? getUserTags(currentUser) : [];

      return (
        <p className="text-sm text-slate-100 mt-1.5 whitespace-pre-line leading-relaxed break-words">
          {parts.map((part, idx) => {
            if (!part.startsWith('@')) return <span key={idx}>{part}</span>;

            const lower = part.toLowerCase();
            let highlightMe = false;
            if (currentUser) {
              const isGlobalTag = lower === '@everyone' || (lower === '@here' && currentUser.isOnline);
              const isMyCat = myTags.some(
                (t) => part === '@[' + t + ']' || lower === '@' + t.toLowerCase()
              );
              const isDirectMe =
                lower === '@' + String(currentUser.id).toLowerCase() ||
                (currentUser.username && lower === '@' + currentUser.username.toLowerCase());
              highlightMe = isGlobalTag || isMyCat || isDirectMe;
            }

            return (
              <span
                key={idx}
                className={
                  highlightMe
                    ? 'inline-block px-1.5 py-0.5 mx-0.5 rounded bg-amber-400 text-[#050811] font-mono text-xs font-bold shadow'
                    : 'inline-block px-1.5 py-0.5 mx-0.5 rounded bg-[#0F2547] border border-blue-400/50 text-blue-200 font-mono text-xs font-semibold'
                }
              >
                {part}
              </span>
            );
          })}
        </p>
      );
    }

    function App() {
      // Main Data States
      const [users, setUsers] = useState([INITIAL_OWNER_SEED]);
      const [posts, setPosts] = useState([]);
      const [channels, setChannels] = useState(DEFAULT_GLOBAL_CHANNELS);
      const [groups, setGroups] = useState([]);
      const [chatMessages, setChatMessages] = useState([]);

      const [currentUser, setCurrentUser] = useState(null);
      const [dbErrorBanner, setDbErrorBanner] = useState('');

      // Navigation: 'home' | 'feed' | 'members' | 'bookmarks' | 'chat' | 'admin' | 'login'
      const [currentView, setCurrentView] = useState('home');
      const [selectedTagFilter, setSelectedTagFilter] = useState('ALL');
      const [memberDirectoryTag, setMemberDirectoryTag] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');
      const [highlightedPostId, setHighlightedPostId] = useState(null);

      // Modal ดูโปรไฟล์เต็มๆ ของสมาชิก (คลิกจากดาวบริวาร, โพสต์, หรือแถบรายชื่อในห้องแชต)
      const [selectedMemberModal, setSelectedMemberModal] = useState(null);

      // Auth & Password Toggle & Remember Me States
      const [authMode, setAuthMode] = useState('signin');
      const [loginUsername, setLoginUsername] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [showLoginPassword, setShowLoginPassword] = useState(false); // ปุ่มกดสลับดูรหัสผ่าน (Toggle)
      const [rememberMe, setRememberMe] = useState(true); // ปุ่มล็อกอินค้างไว้
      const [authError, setAuthError] = useState('');

      // Activate ID States
      const [activateIdInput, setActivateIdInput] = useState('');
      const [activateUsername, setActivateUsername] = useState('');
      const [activatePassword, setActivatePassword] = useState('');
      const [showActivatePassword, setShowActivatePassword] = useState(false); // ปุ่มกดสลับดูรหัสผ่านตอนลงทะเบียน
      const [activateDisplayName, setActivateDisplayName] = useState('');

      // Profile Edit & Social Links States
      const [isEditingProfile, setIsEditingProfile] = useState(false);
      const [editDisplayName, setEditDisplayName] = useState('');
      const [editBio, setEditBio] = useState('');
      const [editAvatarUrl, setEditAvatarUrl] = useState('');
      const [editSocialLinks, setEditSocialLinks] = useState([]);
      const [newSocialPlatform, setNewSocialPlatform] = useState('Instagram');
      const [newSocialLabel, setNewSocialLabel] = useState('');
      const [newSocialUrl, setNewSocialUrl] = useState('');
      const avatarInputRef = useRef(null);

      // Create Post States
      const [isCreatingPost, setIsCreatingPost] = useState(false);
      const [newPostTitle, setNewPostTitle] = useState('');
      const [newPostContent, setNewPostContent] = useState('');
      const [newPostCategory, setNewPostCategory] = useState('');
      const [newPostAttachments, setNewPostAttachments] = useState([]);
      const [attachmentUrlInput, setAttachmentUrlInput] = useState('');
      const [attachmentTypeInput, setAttachmentTypeInput] = useState('image');
      const postFileInputRef = useRef(null);
      const [commentInputs, setCommentInputs] = useState({});

      // Admin Issue ID (รองรับหลายหมวดหมู่) & Edit Member Tags Modal
      const [newMemberId, setNewMemberId] = useState('M001');
      const [newMemberTags, setNewMemberTags] = useState(['LCs & Pal']);
      const [customTagInput, setCustomTagInput] = useState('');
      const [copiedId, setCopiedId] = useState(null);
      const [editingTagsUser, setEditingTagsUser] = useState(null); // สมาชิกที่ Admin กำลังแก้ไขหมวดหมู่
      const [editingTagsList, setEditingTagsList] = useState([]);
      const [editingCustomTag, setEditingCustomTag] = useState('');

      // ============================================================================
      // CHAT STATES (The Blue Moon Comms V3)
      // ============================================================================
      const [activeRoom, setActiveRoom] = useState({ type: 'channel', id: 'global-lobby' });
      const [openedDmPartners, setOpenedDmPartners] = useState([]); // เก็บรายชื่อคนที่กดทักแชตใหม่ในเซสชันนี้
      const [isRightMemberDrawerOpen, setIsRightMemberDrawerOpen] = useState(true);
      const [rightMemberTagFilter, setRightMemberTagFilter] = useState('ALL');

      const [chatInputText, setChatInputText] = useState('');
      const [chatPendingAttachments, setChatPendingAttachments] = useState([]);
      const [isChatUrlAttachOpen, setIsChatUrlAttachOpen] = useState(false);
      const [chatAttachUrlInput, setChatAttachUrlInput] = useState('');
      const [chatAttachTypeInput, setChatAttachTypeInput] = useState('image');
      const chatFileInputRef = useRef(null);

      const [showMentionMenu, setShowMentionMenu] = useState(false);
      const [mentionFilter, setMentionFilter] = useState('');

      const [isCreateChannelOpen, setIsCreateChannelOpen] = useState(false);
      const [newChannelName, setNewChannelName] = useState('');
      const [newChannelIcon, setNewChannelIcon] = useState('💬');
      const [newChannelDesc, setNewChannelDesc] = useState('');

      const [isCreateGroupOpen, setIsCreateGroupOpen] = useState(false);
      const [newGroupName, setNewGroupName] = useState('');
      const [selectedGroupMembers, setSelectedGroupMembers] = useState([]);

      const [deleteConfirmTarget, setDeleteConfirmTarget] = useState(null);
      const [toastList, setToastList] = useState([]);
      const messagesEndRef = useRef(null);

      // ============================================================================
      // 1. REALTIME SYNC กับ FIREBASE FIRESTORE
      // ============================================================================
      useEffect(() => {
        if (!db) return;

        // 1.1 Sync สมาชิก (bma_users)
        const unsubUsers = db.collection('bma_users').onSnapshot(
          async (snapshot) => {
            setDbErrorBanner('');
            if (snapshot.empty) {
              try {
                await db.collection('bma_users').doc(INITIAL_OWNER_SEED.id).set(INITIAL_OWNER_SEED);
              } catch (e) {}
            } else {
              const allDocs = snapshot.docs.map((doc) => doc.data());
              const loadedUsers = allDocs.filter(
                (u) => u.id !== 'BMA-000' && u.password !== 'bma-root-password' && u.password !== 'moon-8842'
              );

              if (!loadedUsers.some((u) => u.id === 'M000')) {
                try {
                  await db.collection('bma_users').doc(INITIAL_OWNER_SEED.id).set(INITIAL_OWNER_SEED);
                } catch (e) {}
                return;
              }

              loadedUsers.sort((a, b) => String(a.id).localeCompare(String(b.id)));
              setUsers(loadedUsers);

              const maxNum = loadedUsers.reduce((max, u) => {
                const m = String(u.id).match(/^M(\d+)$/i);
                if (m) {
                  const num = parseInt(m[1], 10);
                  return num > max ? num : max;
                }
                return max;
              }, 0);
              setNewMemberId('M' + String(maxNum + 1).padStart(3, '0'));
            }
          },
          (err) => {
            setDbErrorBanner('แจ้งเตือน Firebase (' + err.code + '): กรุณาตรวจสอบการตั้งค่า Firestore Database');
          }
        );

        // 1.2 Sync โพสต์บล็อก (bma_posts)
        const unsubPosts = db.collection('bma_posts').onSnapshot(
          (snapshot) => {
            const loadedPosts = snapshot.docs.map((doc) => doc.data());
            loadedPosts.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            setPosts(loadedPosts);
          },
          (err) => console.error(err)
        );

        // 1.3 Sync ห้อง Global Chat (bma_channels)
        const unsubChannels = db.collection('bma_channels').onSnapshot(
          async (snapshot) => {
            if (snapshot.empty) {
              try {
                for (const ch of DEFAULT_GLOBAL_CHANNELS) {
                  await db.collection('bma_channels').doc(ch.id).set(ch);
                }
              } catch (e) {}
            } else {
              const loadedCh = snapshot.docs.map((d) => d.data());
              // รับประกันว่ามีห้อง lobby และ announcements เสมอ
              const hasLobby = loadedCh.some((c) => c.id === 'global-lobby');
              const hasAnnounce = loadedCh.some((c) => c.id === 'global-announce');
              if (!hasLobby) await db.collection('bma_channels').doc('global-lobby').set(DEFAULT_GLOBAL_CHANNELS[0]);
              if (!hasAnnounce) await db.collection('bma_channels').doc('global-announce').set(DEFAULT_GLOBAL_CHANNELS[1]);

              loadedCh.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
              setChannels(loadedCh);
            }
          },
          (err) => console.error(err)
        );

        // 1.4 Sync กลุ่มแชตย่อย (bma_groups)
        const unsubGroups = db.collection('bma_groups').onSnapshot(
          (snapshot) => {
            const loadedGrp = snapshot.docs.map((d) => d.data());
            loadedGrp.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            setGroups(loadedGrp);
          },
          (err) => console.error(err)
        );

        // 1.5 Sync ข้อความแชตทั้งหมด (bma_messages)
        const unsubMessages = db.collection('bma_messages').onSnapshot(
          (snapshot) => {
            const loadedMsgs = snapshot.docs.map((d) => d.data());
            loadedMsgs.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
            setChatMessages(loadedMsgs);
          },
          (err) => console.error(err)
        );

        return () => {
          unsubUsers();
          unsubPosts();
          unsubChannels();
          unsubGroups();
          unsubMessages();
        };
      }, []);

      // ตรวจสอบการล็อกอินค้างไว้ (Remember Me Session) เมื่อโหลดรายชื่อสมาชิกเสร็จ
      useEffect(() => {
        if (!currentUser && users.length > 0) {
          const savedId =
            localStorage.getItem('tbma_saved_user_id') ||
            sessionStorage.getItem('tbma_session_user_id');
          if (savedId) {
            const found = users.find((u) => u.id === savedId && u.isActivated);
            if (found) {
              setCurrentUser(found);
              if (db && !found.isOnline) {
                db.collection('bma_users').doc(found.id).update({ isOnline: true }).catch(() => {});
              }
            }
          }
        } else if (currentUser && users.length > 0) {
          const latestMe = users.find((u) => u.id === currentUser.id);
          if (latestMe) setCurrentUser(latestMe);
        }
      }, [users]);

      // เลื่อนแชตลงล่างสุดเมื่อมีข้อความใหม่ในห้องปัจจุบัน
      const getDmRoomKey = (id1, id2) => {
        const sorted = [id1, id2].sort();
        return 'dm_' + sorted[0] + '_' + sorted[1];
      };

      const currentRoomKey =
        currentUser && activeRoom.type === 'dm'
          ? getDmRoomKey(currentUser.id, activeRoom.id)
          : activeRoom.id;

      useEffect(() => {
        if (currentView === 'chat' && messagesEndRef.current) {
          messagesEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [chatMessages, currentRoomKey, currentView]);

      // ============================================================================
      // 2. ระบบเข้าสู่ระบบ (พร้อมตัวเลือกล็อกอินค้างไว้ & ปุ่มดูรหัสผ่าน)
      // ============================================================================
      const saveLoginSession = (userObj, keepLoggedIn) => {
        if (keepLoggedIn) {
          localStorage.setItem('tbma_saved_user_id', userObj.id);
          sessionStorage.removeItem('tbma_session_user_id');
        } else {
          sessionStorage.setItem('tbma_session_user_id', userObj.id);
          localStorage.removeItem('tbma_saved_user_id');
        }
      };

      const handleLogout = async () => {
        if (currentUser && db) {
          try {
            await db.collection('bma_users').doc(currentUser.id).update({ isOnline: false });
          } catch (e) {}
        }
        localStorage.removeItem('tbma_saved_user_id');
        sessionStorage.removeItem('tbma_session_user_id');
        setCurrentUser(null);
        setCurrentView('home');
      };

      const handleSignIn = async (e) => {
        e.preventDefault();
        setAuthError('');
        const found = users.find(
          (u) =>
            u.isActivated &&
            u.username &&
            u.username.toLowerCase() === loginUsername.trim().toLowerCase() &&
            u.password === loginPassword
        );
        if (found) {
          const onlineUser = { ...found, isOnline: true };
          setCurrentUser(onlineUser);
          saveLoginSession(onlineUser, rememberMe);
          if (db) {
            try {
              await db.collection('bma_users').doc(found.id).update({ isOnline: true });
            } catch (err) {}
          }
          setLoginUsername('');
          setLoginPassword('');
          setShowLoginPassword(false);
          setCurrentView('feed');
        } else {

            const MAX_SIZE = 300;
            let w = img.width;
            let h = img.height;
            if (w > h && w > MAX_SIZE) {
              h *= MAX_SIZE / w;
              w = MAX_SIZE;
            } else if (h > MAX_SIZE) {
              w *= MAX_SIZE / h;
              h = MAX_SIZE;
            }
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);

                        onChange={(e) => setNewPostTitle(e.target.value)}
                        placeholder="เว้นว่างไว้ได้หากไม่มีหัวข้อ..."
                        className="w-full bg-[#050811] border border-[#1E3A5F] rounded-xl px-3.5 py-2 text-sm text-white outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-300 mb-1">หมวดหมู่บทความ (ไม่บังคับ)</label>
                      <select
                        value={newPostCategory}
                        onChange={(e) => setNewPostCategory(e.target.value)}
                        className="w-full bg-[#050811] border border-[#1E3A5F] rounded-xl px-3.5 py-2 text-sm text-white outline-none"
                      >
                        <option value="">โปรดเลือก... (ไม่ต้องมีหมวดหมู่)</option>
                        <option value="General">General (ทั่วไป)</option>
                        <option value="Music & Art">Music & Art (ดนตรีและศิลปะ)</option>
                        <option value="Night Log">Night Log (บันทึกยามดึก)</option>
                        <option value="Engineering & Tech">Engineering & Tech</option>
                        <option value="Announcement">Announcement (ประกาศ)</option>
                      </select>
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs text-slate-300 mb-1">เนื้อหาโพสต์</label>
                    <textarea
                      rows={4}
                      value={newPostContent}
                      onChange={(e) => setNewPostContent(e.target.value)}
                      placeholder="เขียนสิ่งที่คุณอยากแชร์กับสมาคม..."
                      className="w-full bg-[#050811] border border-[#1E3A5F] rounded-xl p-3.5 text-sm text-white outline-none resize-none"
                    />
                  </div>
                  <div className="p-4 rounded-xl bg-[#050811] border border-[#1E3A5F] space-y-3">
                    <div className="flex flex-wrap items-center justify-between gap-2">
                      <span className="text-xs font-semibold text-slate-200">📎 แนบรูปภาพ, วิดีโอ หรือไฟล์เอกสาร</span>
                      <input type="file" multiple ref={postFileInputRef} onChange={handlePostFileSelect} className="hidden" />
                      <button type="button" onClick={() => postFileInputRef.current && postFileInputRef.current.click()} className="px-3 py-1.5 rounded-lg bg-[#0F2547] hover:bg-white hover:text-[#050811] border border-white/20 text-xs font-semibold">
                        + เลือกไฟล์จากเครื่อง
                      </button>
                    </div>
                    <div className="flex flex-col sm:flex-row gap-2 pt-1">
                      <select value={attachmentTypeInput} onChange={(e) => setAttachmentTypeInput(e.target.value)} className="bg-[#0B1325] border border-[#1E3A5F] rounded-lg px-2.5 py-1.5 text-xs text-white outline-none">
                        <option value="image">รูปภาพ (URL)</option>
                        <option value="video">วิดีโอ (MP4/URL)</option>
                        <option value="file">ไฟล์เอกสาร (URL)</option>
                      </select>
                      <input
                        type="text"
                        value={attachmentUrlInput}
                        onChange={(e) => setAttachmentUrlInput(e.target.value)}
                        placeholder="หรือวางลิงก์รูปภาพ / วิดีโอ / ไฟล์..."
                        className="flex-1 bg-[#0B1325] border border-[#1E3A5F] rounded-lg px-3 py-1.5 text-xs text-white outline-none"
                      />
                      <button type="button" onClick={handleAddUrlAttachment} className="px-3 py-1.5 rounded-lg bg-white text-[#050811] text-xs font-bold shrink-0">เพิ่มลิงก์</button>
                    </div>
                    {newPostAttachments.length > 0 && (
                      <div className="space-y-1.5 pt-2">
                        {newPostAttachments.map((att) => (
                          <div key={att.id} className="flex items-center justify-between px-3 py-1.5 rounded-lg bg-[#0B1325] border border-[#1E3A5F] text-xs">
                            <span className="truncate max-w-xs">[{att.type.toUpperCase()}] {att.name}</span>
                            <button type="button" onClick={() => setNewPostAttachments(newPostAttachments.filter((a) => a.id !== att.id))} className="text-red-400 hover:text-red-300 ml-2">ลบ</button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setIsCreatingPost(false)} className="px-4 py-2 rounded-xl bg-[#050811] border border-[#1E3A5F] text-xs text-slate-300">ยกเลิก</button>
                    <button type="submit" className="px-6 py-2 rounded-xl bg-white text-[#050811] font-bold text-xs">เผยแพร่โพสต์</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ================================================================= */}
          {/* MODAL: สร้างห้อง Global Chat ใหม่ (เฉพาะ Owner / Mod)              */}
          {/* ================================================================= */}
          {isCreateChannelOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-md bg-[#0B1325] border border-white/30 rounded-2xl p-6 shadow-2xl">
                <div className="flex items-center justify-between pb-3 mb-4 border-b border-[#1E3A5F]">
                  <h3 className="text-base font-bold text-white">🛡️ สร้างห้อง Global Chat ใหม่</h3>
                  <button onClick={() => setIsCreateChannelOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <form onSubmit={handleCreateChannel} className="space-y-4">
                  <div className="grid grid-cols-4 gap-3">
                    <div>
                      <label className="block text-xs text-slate-300 mb-1">ไอคอน</label>
                      <input
                        type="text"
                        value={newChannelIcon}
                        onChange={(e) => setNewChannelIcon(e.target.value)}
                        className="w-full bg-[#050811] border border-[#1E3A5F] rounded-xl px-3 py-2 text-center text-base outline-none"
                      />
                    </div>
                    <div className="col-span-3">
                      <label className="block text-xs text-slate-300 mb-1">ชื่อห้อง (Channel Name) *</label>
                      <input
                        type="text"
                        value={newChannelName}
                        onChange={(e) => setNewChannelName(e.target.value)}
                        placeholder="เช่น music-room"
                        className="w-full bg-[#050811] border border-[#1E3A5F] rounded-xl px-3.5 py-2 text-sm text-white outline-none"
                        required
                      />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs text-slate-300 mb-1">คำอธิบายหัวข้อห้อง</label>
                    <input
                      type="text"
                      value={newChannelDesc}
                      onChange={(e) => setNewChannelDesc(e.target.value)}
                      placeholder="ระบุจุดประสงค์ของห้องนี้..."
                      className="w-full bg-[#050811] border border-[#1E3A5F] rounded-xl px-3.5 py-2 text-sm text-white outline-none"
                    />
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setIsCreateChannelOpen(false)} className="px-4 py-2 rounded-xl bg-[#050811] border border-[#1E3A5F] text-xs text-slate-300">ยกเลิก</button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-white text-[#050811] font-bold text-xs">สร้างห้องแชตรวม</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ================================================================= */}
          {/* MODAL: สร้างกลุ่มแชตย่อยด้วยตัวเอง                                  */}
          {/* ================================================================= */}
          {isCreateGroupOpen && currentUser && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-md bg-[#0B1325] border border-white/30 rounded-2xl p-6 shadow-2xl">
                <div className="flex items-center justify-between pb-3 mb-4 border-b border-[#1E3A5F]">
                  <h3 className="text-base font-bold text-white">👥 สร้างกลุ่มแชตใหม่ (เลือกสมาชิก)</h3>
                  <button onClick={() => setIsCreateGroupOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <form onSubmit={handleCreateGroup} className="space-y-4">
                  <div>
                    <label className="block text-xs text-slate-300 mb-1">ชื่อกลุ่มแชต *</label>
                    <input
                      type="text"
                      value={newGroupName}
                      onChange={(e) => setNewGroupName(e.target.value)}
                      placeholder="ตั้งชื่อกลุ่มแชตของคุณ..."
                      className="w-full bg-[#050811] border border-[#1E3A5F] rounded-xl px-3.5 py-2 text-sm text-white outline-none"
                      required
                    />
                  </div>
                  <div>
                    <label className="block text-xs text-slate-300 mb-1.5">
                      คลิกเลือกสมาชิกที่ต้องการดึงเข้ากลุ่ม ({selectedGroupMembers.length} คน) *
                    </label>
                    <div className="max-h-52 overflow-y-auto space-y-1.5 p-2 rounded-xl bg-[#050811] border border-[#1E3A5F]">
                      {activatedMembers.filter((m) => m.id !== currentUser.id).map((m) => {
                        const isChecked = selectedGroupMembers.includes(m.id);
                        return (
                          <div
                            key={m.id}
                            onClick={() => toggleSelectGroupMember(m.id)}
                            className={
                              isChecked
                                ? 'p-2.5 rounded-xl bg-[#0F2547] border border-white flex items-center justify-between cursor-pointer'
                                : 'p-2.5 rounded-xl bg-[#0B1325] border border-[#1E3A5F] flex items-center justify-between cursor-pointer hover:border-white/40'
                            }
                          >
                            <div className="flex items-center gap-2.5">
                              <Avatar user={m} size="xs" showStatus={true} />
                              <div>
                                <div className="text-xs font-bold text-white">
                                  {m.displayName} <span className="font-mono text-blue-300">({m.id})</span>
                                </div>
                                <div className="text-[10px] text-slate-400">@{m.username} • {getUserTags(m).join(', ')}</div>
                              </div>
                            </div>
                            <span className="text-xs font-bold">{isChecked ? '✓ เลือกแล้ว' : '+ เลือก'}</span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setIsCreateGroupOpen(false)} className="px-4 py-2 rounded-xl bg-[#050811] border border-[#1E3A5F] text-xs text-slate-300">ยกเลิก</button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-white text-[#050811] font-bold text-xs">สร้างกลุ่มแชต</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ================================================================= */}
          {/* MODAL: หน้าต่างยืนยันการลบห้องแชต                                 */}
          {/* ================================================================= */}
          {deleteConfirmTarget && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-sm bg-[#0B1325] border-2 border-red-500/60 rounded-2xl p-6 shadow-2xl text-center space-y-4">
                <div className="w-12 h-12 mx-auto rounded-full bg-red-950 border border-red-500/40 flex items-center justify-center text-2xl">⚠️</div>
                <div>
                  <h3 className="text-base font-bold text-white">ยืนยันการลบห้องแชต?</h3>
                  <p className="text-xs text-slate-300 mt-1.5 leading-relaxed">
                    คุณกำลังจะลบห้อง <strong className="text-white">"{deleteConfirmTarget.name}"</strong> อย่างถาวร การกระทำนี้ไม่สามารถย้อนกลับได้
                  </p>
                </div>
                <div className="flex items-center justify-center gap-2.5 pt-2">
                  <button
                    type="button"
                    onClick={() => setDeleteConfirmTarget(null)}
                    className="flex-1 py-2.5 rounded-xl bg-[#050811] border border-[#1E3A5F] text-xs font-semibold text-slate-300"
                  >
                    ยกเลิก
                  </button>
                  <button
                    type="button"
                    onClick={handleConfirmDeleteRoom}
                    className="flex-1 py-2.5 rounded-xl bg-red-600 hover:bg-red-500 text-xs font-bold text-white shadow-lg"
                  >
                    🗑️ ยืนยันการลบถาวร
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
