    const CHUNK_LEN = 700 * 1024;
    const compressImg = (file) => new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const c = document.createElement('canvas'); let w = img.width, h = img.height, m = 1400;
          if (w > h && w > m) { h *= m / w; w = m; } else if (h > m) { w *= m / h; h = m; }

    async function uploadChunked(file) {
      if (file.size > 10485760) throw new Error('ไฟล์ "' + file.name + '" เกิน 10MB กรุณาแนบเป็นลิงก์แทน');
      const type = file.type.startsWith('image/') ? 'image' : file.type.startsWith('video/') ? 'video' : 'file';
      const dataUrl = type === 'image' ? await compressImg(file) : await new Promise((res, rej) => { const r = new FileReader(); r.onloadend = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
      const id = 'att-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
      const size = file.size > 1048576 ? (file.size / 1048576).toFixed(2) + ' MB' : (file.size / 1024).toFixed(1) + ' KB';
      if (dataUrl.length <= CHUNK_LEN) return { id, name: file.name, type, url: dataUrl, isChunked: false, size };
      const chunkIds = [];
      for (let i = 0; i < Math.ceil(dataUrl.length / CHUNK_LEN); i++) {
        const cId = id + '_p' + i;
        await db.collection('bma_file_chunks').doc(cId).set({ id: cId, parentId: id, index: i, data: dataUrl.slice(i * CHUNK_LEN, (i + 1) * CHUNK_LEN) });
        chunkIds.push(cId);
      }
      return { id, name: file.name, type, url: '', isChunked: true, chunkIds, size };
    }

                <div className="flex justify-between">
                  <div className="flex gap-1">{[['posts', '📝 โพสต์'], ['messages', '💬 ข้อความ'], ['settings', '🔕 ตั้งค่า']].map(([k, l]) => <button key={k} onClick={() => setNotifTab(k)} className={notifTab === k ? 'px-2.5 py-1 rounded-lg font-bold bg-white text-[#050811]' : 'px-2.5 py-1 rounded-lg bg-[#050811]'}>{l}</button>)}</div>
                  {notifTab !== 'settings' && <button onClick={() => unreadNotifs.forEach((n) => db.collection('bma_notifications').doc(n.id).update({ readBy: Array.from(new Set([...(n.readBy || []), currentUser.id])) }))} className="text-sky-300 font-bold">✓ อ่านแล้วทั้งหมด</button>}
                </div>
                {notifTab === 'settings' ? (
                  <div className="space-y-2">{[['muteOwnPosts', 'ปิดแจ้งเตือนโพสต์ตนเอง'], ['muteGlobalChat', 'ปิดแจ้งเตือนช่องหลัก'], ['mutePrivateChat', 'ปิดแจ้งเตือนแชตกลุ่ม/ส่วนตัว']].map(([k, l]) => <div key={k} className="p-2.5 rounded-xl bg-[#050811] border border-[#1E3A5F] flex justify-between items-center"><span>{l}</span><button onClick={() => db.collection('bma_users').doc(currentUser.id).update({ notifPrefs: { ...(currentUser.notifPrefs || {}), [k]: !currentUser.notifPrefs?.[k] } })} className={currentUser.notifPrefs?.[k] ? 'px-2.5 py-1 rounded bg-red-600 font-bold' : 'btn-b py-1'}>{currentUser.notifPrefs?.[k] ? '🔕 ปิดอยู่' : '🔔 เปิดอยู่'}</button></div>)}</div>
                ) : (
                  <div className="max-h-64 overflow-y-auto space-y-1.5">
                    {myNotifs.filter((n) => n.category === notifTab).map((n) => {
                      const rd = (n.readBy || []).includes(currentUser.id);
                      return <div key={n.id} onClick={() => { db.collection('bma_notifications').doc(n.id).update({ readBy: Array.from(new Set([...(n.readBy || []), currentUser.id])) }); setNotifOpen(false); if (n.targetPostId) jumpToPost(n.targetPostId); else if (n.targetRoomType) { setActiveRoom({ type: n.targetRoomType, id: n.targetRoomId }); setCurrentView('chat'); } }} className={'p-2.5 rounded-xl border cursor-pointer flex justify-between items-center ' + (rd ? 'bg-[#050811] border-[#1E3A5F] opacity-60' : 'bg-[#0F2547]/70 border-sky-400')}><div><div className="font-bold">{!rd && '● '}{n.title}</div><div className="text-slate-300">{n.body}</div></div><span className="text-sky-400 shrink-0">ดู →</span></div>;
                    })}
                  </div>
                )}
              </div>
            </Modal>
          )}

          {memberModal && (
            <Modal title={'โปรไฟล์: ' + memberModal.id} onClose={() => setMemberModal(null)}>
              <div className="text-center space-y-3 text-xs">
                <div className="flex justify-center"><Avatar user={memberModal} size="xl" showStatus={true} /></div>
                <div className="flex justify-center"><TagBadges user={memberModal} /></div>
                <div><h3 className="text-base font-bold">{memberModal.displayName}</h3><p className="font-mono text-slate-400">@{memberModal.username}</p></div>
                <p className="bg-[#050811] p-3 rounded-xl border border-[#1E3A5F] text-left">{memberModal.bio || 'ยังไม่ได้ระบุคำอธิบายตัวตน'}</p>
                {memberModal.socialLinks?.length > 0 && <div className="flex flex-wrap gap-1.5">{memberModal.socialLinks.map((s) => <a key={s.id} href={s.url} target="_blank" rel="noreferrer" className="btn-d py-1">{SOCIALS.find((x) => x.id === s.platform)?.icon || '🔗'} {s.label} ↗</a>)}</div>}
                {currentUser?.id !== memberModal.id && <button onClick={() => { if (!currentUser) return setCurrentView('login'); if (!openDms.includes(memberModal.id)) setOpenDms([...openDms, memberModal.id]); setMemberModal(null); setActiveRoom({ type: 'dm', id: memberModal.id }); setCurrentView('chat'); }} className="w-full btn-w py-2.5">💬 ส่งข้อความส่วนตัว (DM)</button>}
              </div>
            </Modal>
          )}

          {editProf && currentUser && (
            <Modal title="ตั้งค่าโปรไฟล์ & โซเชียล" onClose={() => setEditProf(false)} maxW="max-w-lg">
              <form onSubmit={handleSaveProfile} className="space-y-3 text-xs">
                <div className="flex items-center gap-3 p-2.5 rounded-xl bg-[#050811] border border-[#1E3A5F]"><Avatar user={{ ...currentUser, displayName: eName, avatarUrl: eAv }} size="md" /><input type="file" accept="image/*" ref={avRef} onChange={async (e) => { const f = e.target.files?.[0]; if (f) setEAv(await compressImg(f)); }} className="hidden" /><button type="button" onClick={() => avRef.current?.click()} className="btn-w py-1.5"><UpIcon />อัปโหลดรูปโปรไฟล์</button></div>
                <div className="grid grid-cols-2 gap-2">
                  <div><label className="block mb-1">ชื่อที่แสดง *</label><input type="text" value={eName} onChange={(e) => setEName(e.target.value)} className="w-full inp" required /></div>
                  <div><label className="block mb-1">Username ({Math.max(0, 2 - recentChg(currentUser).length)}/2 ใน 14 วัน)</label><input type="text" value={eUser} onChange={(e) => setEUser(e.target.value)} className="w-full inp font-mono" required /></div>
                </div>
                <div className="relative flex items-center"><input type={showPass ? 'text' : 'password'} value={ePass} onChange={(e) => setEPass(e.target.value)} className="w-full inp pr-16 font-mono" required /><button type="button" onClick={() => setShowPass(!showPass)} className="absolute right-2 px-2 py-0.5 rounded bg-[#0B1325]">{showPass ? '🙈 ซ่อน' : '👁️ ดู'}</button></div>
                <textarea rows={2} value={eBio} onChange={(e) => setEBio(e.target.value)} placeholder="Bio..." className="w-full inp" />
                <div className="p-2.5 rounded-xl bg-[#050811] border border-[#1E3A5F] space-y-2">
                  <div className="flex gap-1"><select value={sPlat} onChange={(e) => setSPlat(e.target.value)} className="bg-[#0B1325] border border-[#1E3A5F] rounded px-1.5 py-1">{SOCIALS.map((s) => <option key={s.id} value={s.id}>{s.icon} {s.id}</option>)}</select><input type="text" value={sLbl} onChange={(e) => setSLbl(e.target.value)} placeholder="ชื่อปุ่ม..." className="w-24 bg-[#0B1325] border border-[#1E3A5F] rounded px-2 py-1" /><input type="text" value={sUrl} onChange={(e) => setSUrl(e.target.value)} placeholder="URL..." className="flex-1 bg-[#0B1325] border border-[#1E3A5F] rounded px-2 py-1" /><button type="button" onClick={() => { if (sUrl.trim()) { setESocs([...eSocs, { id: 's-' + Date.now(), platform: sPlat, label: sLbl.trim() || sPlat, url: safeUrl(sUrl) }]); setSUrl(''); setSLbl(''); } }} className="btn-w py-1">เพิ่ม</button></div>
                  {eSocs.map((s) => <div key={s.id} className="flex justify-between px-2 py-1 rounded bg-[#0B1325]"><span>{s.label}: {s.url}</span><button type="button" onClick={() => setESocs(eSocs.filter((x) => x.id !== s.id))} className="text-red-400">ลบ</button></div>)}
                </div>
                {profErr && <div className="p-2 rounded bg-red-950 text-red-200">{profErr}</div>}
                <button type="submit" className="w-full btn-w py-2">บันทึกโปรไฟล์</button>
              </form>
            </Modal>
          )}

          {editTagU && (
            <Modal title={'🏷️ แก้ไขหมวดหมู่: ' + editTagU.displayName} onClose={() => setEditTagU(null)}>
              <div className="space-y-3 text-xs">
                <div className="flex flex-wrap gap-1.5">{allTags.map((t) => <button key={t} onClick={() => setEditTagL(editTagL.includes(t) ? (editTagL.length > 1 ? editTagL.filter((x) => x !== t) : editTagL) : [...editTagL, t])} className={editTagL.includes(t) ? 'px-2.5 py-1 rounded-xl bg-white text-[#050811] font-bold' : 'btn-d py-1'}>{editTagL.includes(t) ? '✓ ' + t : '+ ' + t}</button>)}</div>
                <button onClick={async () => { await db.collection('bma_users').doc(editTagU.id).update({ memberTags: editTagL, memberTag: editTagL[0] }); setEditTagU(null); }} className="w-full btn-w py-2">บันทึกหมวดหมู่</button>
              </div>
            </Modal>
          )}

          {createPost && (
            <Modal title="เขียนโพสต์ใหม่ / สร้างโพลล์" onClose={() => setCreatePost(false)} maxW="max-w-xl">
              <form onSubmit={handleCreatePost} className="space-y-3 text-xs">
                <input type="text" value={pTitle} onChange={(e) => setPTitle(e.target.value)} placeholder="หัวข้อเรื่อง (ไม่บังคับ)..." className="w-full inp text-sm" />
                <textarea rows={3} value={pCont} onChange={(e) => setPCont(e.target.value)} placeholder="เนื้อหาโพสต์..." className="w-full inp text-sm" />
                <label className="flex items-center justify-between p-2.5 rounded-xl bg-[#050811] border border-[#1E3A5F] cursor-pointer">
                  <span>🌐 อนุญาตให้ผู้มาเยือน (Guest) มองเห็นโพสต์นี้ได้ (ค่าเริ่มต้นเป็นความลับเฉพาะสมาชิก)</span>
                  <input type="checkbox" checked={pGuest} onChange={(e) => setPGuest(e.target.checked)} />
                </label>
                <div className="p-3 rounded-xl bg-[#050811] border border-[#1E3A5F] space-y-2">
                  <div className="flex justify-between items-center"><span className="font-bold">📊 โพลล์สำรวจความคิดเห็น</span><button type="button" onClick={() => setHasPoll(!hasPoll)} className="btn-b py-1">{hasPoll ? '✓ เปิดโพลล์แล้ว' : '+ เพิ่มโพลล์'}</button></div>
                  {hasPoll && (
                    <div className="space-y-1.5 pt-1.5 border-t border-[#1E3A5F]">
                      <input type="text" value={pollQ} onChange={(e) => setPollQ(e.target.value)} placeholder="คำถามโพลล์ *" className="w-full inp py-1.5" />
                      {pollOpts.map((o, i) => <input key={i} type="text" value={o} onChange={(e) => { const n = [...pollOpts]; n[i] = e.target.value; setPollOpts(n); }} placeholder={'ตัวเลือกที่ ' + (i + 1)} className="w-full inp py-1" />)}
                      <button type="button" onClick={() => setPollOpts([...pollOpts, ''])} className="btn-b py-0.5">+ เพิ่มตัวเลือก</button>
                      <div className="flex justify-between items-center pt-1"><input type="datetime-local" value={pollClose} onChange={(e) => setPollClose(e.target.value)} className="inp py-1" /><label className="flex items-center gap-1 cursor-pointer"><input type="checkbox" checked={pollAnon} onChange={(e) => setPollAnon(e.target.checked)} /> 🕵️ โหวตไม่แสดงชื่อ</label></div>
                    </div>
                  )}
                </div>
                <div className="p-3 rounded-xl bg-[#050811] border border-[#1E3A5F] space-y-2">
                  <div className="flex justify-between items-center">
                    <span>อัปโหลดไฟล์ (สูงสุด 10MB) หรือแนบลิงก์</span>
                    <input type="file" multiple ref={pFileRef} onChange={async (e) => { const fl = Array.from(e.target.files || []); e.target.value = ''; setUploading(true); for (const f of fl) { try { const a = await uploadChunked(f); setPAtts((p) => [...p, a]); } catch (err) { alert(err.message); } } setUploading(false); }} className="hidden" />
                    <button type="button" onClick={() => pFileRef.current?.click()} className="btn-b py-1 font-bold"><UpIcon />อัปโหลดไฟล์</button>
                  </div>
                  {uploading && <div className="text-sky-300 animate-pulse">⏳ กำลังอัปโหลด...</div>}
                  <div className="flex gap-1.5"><select value={aType} onChange={(e) => setAType(e.target.value)} className="inp py-1"><option value="image">รูปภาพ</option><option value="video">วิดีโอ (Drive/YouTube)</option><option value="file">ไฟล์</option></select><input type="text" value={aUrl} onChange={(e) => setAUrl(e.target.value)} placeholder="วางลิงก์..." className="flex-1 inp py-1" /><button type="button" onClick={() => { if (aUrl.trim()) { setPAtts([...pAtts, { id: 'att-' + Date.now(), name: 'Link', type: aType, url: aUrl.trim(), size: 'URL' }]); setAUrl(''); } }} className="btn-w py-1">🔗 แนบลิงก์</button></div>
                  {pAtts.map((a) => <div key={a.id} className="flex justify-between px-2 py-1 rounded bg-[#0B1325]"><span>{a.name}</span><button type="button" onClick={() => setPAtts(pAtts.filter((x) => x.id !== a.id))} className="text-red-400">ลบ</button></div>)}
                </div>
                <button type="submit" className="w-full btn-w py-2.5">เผยแพร่โพสต์</button>
              </form>
            </Modal>
          )}

          {cChOpen && (
            <Modal title="🛡️ สร้างห้อง Global Chat ใหม่" onClose={() => setCChOpen(false)}>
              <form onSubmit={async (e) => { e.preventDefault(); const n = chName.trim().toLowerCase().replace(/\s+/g, '-'); if (!n) return; const id = 'global-' + Date.now(); await db.collection('bma_channels').doc(id).set({ id, name: n, icon: chIcon || '💬', desc: chDesc.trim() || 'ห้องสนทนากลาง', createdBy: currentUser.id, isProtected: false, isSystemReadOnly: false, timestamp: Date.now(), serverCreatedAt: svrTs() }); setActiveRoom({ type: 'channel', id }); setChName(''); setChDesc(''); setCChOpen(false); }} className="space-y-3 text-xs">
                <div className="flex gap-2"><input type="text" value={chIcon} onChange={(e) => setChIcon(e.target.value)} className="w-14 inp text-center" /><input type="text" value={chName} onChange={(e) => setChName(e.target.value)} placeholder="ชื่อห้อง..." className="flex-1 inp" required /></div>
                <input type="text" value={chDesc} onChange={(e) => setChDesc(e.target.value)} placeholder="คำอธิบายห้อง..." className="w-full inp" />
                <button type="submit" className="w-full btn-w py-2">สร้างห้องแชตรวม</button>
              </form>
            </Modal>
          )}

          {cGrpOpen && currentUser && (
            <Modal title="👥 สร้างกลุ่มแชตใหม่" onClose={() => setCGrpOpen(false)}>
              <form onSubmit={async (e) => { e.preventDefault(); if (!grpName.trim() || !grpMems.length) return alert('ตั้งชื่อและเลือกสมาชิก'); const id = 'grp-' + Date.now(); await db.collection('bma_groups').doc(id).set({ id, name: grpName.trim(), members: Array.from(new Set([currentUser.id, ...grpMems])), createdBy: currentUser.id, isArchived: false, timestamp: Date.now(), serverCreatedAt: svrTs() }); setActiveRoom({ type: 'group', id }); setGrpName(''); setGrpMems([]); setCGrpOpen(false); }} className="space-y-3 text-xs">
                <input type="text" value={grpName} onChange={(e) => setGrpName(e.target.value)} placeholder="ชื่อกลุ่มแชต *" className="w-full inp" required />
                <div className="max-h-48 overflow-y-auto space-y-1 p-2 rounded-xl bg-[#050811] border border-[#1E3A5F]">
                  {activeMembers.filter((m) => m.id !== currentUser.id).map((m) => <div key={m.id} onClick={() => setGrpMems(grpMems.includes(m.id) ? grpMems.filter((i) => i !== m.id) : [...grpMems, m.id])} className={grpMems.includes(m.id) ? 'p-2 rounded-xl bg-[#0F2547] border border-white flex justify-between cursor-pointer' : 'p-2 rounded-xl bg-[#0B1325] flex justify-between cursor-pointer'}><span>{m.displayName} ({m.id})</span><span className="font-bold">{grpMems.includes(m.id) ? '✓ เลือกแล้ว' : '+ เลือก'}</span></div>)}
                </div>
                <button type="submit" className="w-full btn-w py-2">สร้างกลุ่มแชต</button>
              </form>
            </Modal>
          )}

          {delTgt && (
            <Modal title="⚠️ ยืนยันการลบห้องแชต?" onClose={() => setDelTgt(null)} maxW="max-w-sm">
              <div className="space-y-3 text-center text-xs">
                <p>ยืนยันการลบห้อง <strong className="text-white">"{delTgt.name}"</strong> อย่างถาวรหรือไม่?</p>
                <div className="flex gap-2"><button onClick={() => setDelTgt(null)} className="flex-1 btn-d py-2">ยกเลิก</button><button onClick={async () => { if (delTgt.roomType === 'channel') await db.collection('bma_channels').doc(delTgt.id).delete(); else await db.collection('bma_groups').doc(delTgt.id).delete(); setActiveRoom({ type: 'channel', id: 'global-lobby' }); setDelTgt(null); }} className="flex-1 py-2 rounded-xl bg-red-600 font-bold">🗑️ ยืนยันลบ</button></div>
              </div>
            </Modal>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
