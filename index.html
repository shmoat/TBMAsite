                      <div className="flex flex-wrap gap-1.5 p-3 rounded-xl bg-[#050811] border border-[#1E3A5F]">
                        {Array.from(new Set([...allTags, ...newMTags])).map((t) => {
                          const sel = newMTags.includes(t);
                          return (
                            <button 
                              type="button" 
                              key={t} 
                              onClick={() => setNewMTags(sel ? (newMTags.length > 1 ? newMTags.filter((x) => x !== t) : newMTags) : [...newMTags, t])} 
                              className={sel ? 'px-3 py-1 rounded-full bg-white text-[#050811] font-bold shadow transition-transform scale-105' : 'px-3 py-1 rounded-full bg-[#0B1325] text-slate-400 border border-[#1E3A5F] hover:text-white'}
                            >
                              {sel ? '✓ ' + t : '+ ' + t}
                            </button>
                          );
                        })}
                      </div>
                    </div>

                    <button type="submit" className="w-full btn-w py-2.5 text-sm shadow-lg hover:scale-[1.01] transition-transform">
                      ➕ ยืนยันการออกรหัส {newMId.toUpperCase()}
                    </button>
                  </form>

                  {/* กล่องแสดงผลเมื่อออกรหัสสำเร็จ พร้อมปุ่มคัดลอกทันที */}
                  {lastCreatedUser && (
                    <div className="p-4 rounded-xl bg-emerald-950/60 border border-emerald-500/60 space-y-2.5 animate-fade-in">
                      <div className="flex justify-between items-center">
                        <span className="font-bold text-emerald-300 text-xs">🎉 ออกรหัส {lastCreatedUser.id} สำเร็จเรียบร้อย!</span>
                        <button onClick={() => setLastCreatedUser(null)} className="text-slate-400 hover:text-white">✕</button>
                      </div>
                      <div className="p-2.5 rounded-lg bg-[#050811] border border-[#1E3A5F] font-mono text-[11px] text-slate-300 whitespace-pre-line">
                        {`รหัสประจำตัว: ${lastCreatedUser.id}\nหมวดหมู่: ${lastCreatedUser.memberTags.join(', ')}`}
                      </div>
                      <button 
                        onClick={() => handleCopyInvite(lastCreatedUser.id)} 
                        className="w-full py-2 rounded-xl bg-emerald-500 text-[#050811] font-bold hover:bg-emerald-400 transition-colors shadow"
                      >
                        {copiedId === lastCreatedUser.id ? '✓ คัดลอกข้อความเชิญแล้ว!' : '📋 คัดลอกข้อความเชิญส่งให้สมาชิก'}
                      </button>
                    </div>
                  )}
                </div>

                {/* สัดส่วนหมวดหมู่ & รหัสที่รอเปิดใช้งาน */}
                <div className="lg:col-span-5 space-y-4">
                  {/* การ์ดรหัสที่ยังไม่เปิดใช้งาน (Pending Codes) */}
                  <div className="card p-4 space-y-3">
                    <div className="flex justify-between items-center border-b border-[#1E3A5F] pb-2">
                      <h3 className="font-bold text-amber-300">⏳ รหัสที่รอการเปิดใช้งาน ({pendingUsers.length})</h3>
                      {pendingUsers.length > 0 && (
                        <button onClick={() => { setStatusFilter('PENDING'); setSubTab('members'); }} className="text-[10px] text-sky-400 hover:underline">ดูทั้งหมด →</button>
                      )}
                    </div>
                    {pendingUsers.length === 0 ? (
                      <div className="text-center py-6 text-slate-500">สมาชิกทุกคนเปิดใช้งานรหัสครบทั้งหมดแล้ว ✨</div>
                    ) : (
                      <div className="space-y-2 max-h-48 overflow-y-auto pr-1 custom-scrollbar">
                        {pendingUsers.map(u => (
                          <div key={u.id} className="p-2.5 rounded-xl bg-[#050811] border border-[#1E3A5F] flex items-center justify-between gap-2">
                            <div>
                              <div className="flex items-center gap-1.5">
                                <span className={`font-mono font-bold text-xs ${String(u.id).startsWith('F') ? 'text-sky-400' : 'text-amber-300'}`}>{u.id}</span>
                                <TagBadges user={u} />
                              </div>
                              <div className="text-[10px] text-slate-500 mt-0.5">สร้างเมื่อ: {u.joinedAt || '-'}</div>
                            </div>
                            <div className="flex items-center gap-1">
                              <button 
                                onClick={() => handleCopyInvite(u.id)} 
                                className="btn-w py-1 px-2.5 text-[10px]"
                              >
                                {copiedId === u.id ? '✓ คัดลอกแล้ว' : '📋 คัดลอกคำเชิญ'}
                              </button>
                              <button 
                                onClick={() => confirm(`ลบรหัส ${u.id} ทิ้ง?`) && db.collection('bma_users').doc(u.id).delete()} 
                                className="p-1 rounded bg-red-950/50 text-red-400 hover:bg-red-900"
                                title="ลบรหัสนี้"
                              >
                                🗑️
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  {/* สัดส่วนสมาชิกตามหมวดหมู่ */}
                  <div className="card p-4 space-y-2.5">
                    <h3 className="font-bold text-sky-300 border-b border-[#1E3A5F] pb-2">🏷️ สัดส่วนสมาชิกตามหมวดหมู่</h3>
                    <div className="space-y-2 max-h-48 overflow-y-auto pr-1 custom-scrollbar">
                      {allTags.map(tag => {
                        const count = users.filter(u => getTags(u).includes(tag)).length;
                        const pct = users.length ? Math.round((count / users.length) * 100) : 0;
                        return (
                          <div key={tag} className="space-y-1">
                            <div className="flex justify-between text-[11px]">
                              <span className="font-semibold text-slate-200">{tag}</span>
                              <span className="font-mono text-slate-400">{count} คน ({pct}%)</span>
                            </div>
                            <div className="w-full h-1.5 rounded-full bg-[#050811] overflow-hidden border border-[#1E3A5F]/50">
                              <div className="h-full bg-sky-400 rounded-full transition-all" style={{ width: `${pct}%` }}></div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ========================================== */}
          {/* TAB 2: MEMBER DIRECTORY & MANAGEMENT       */}
          {/* ========================================== */}
          {subTab === 'members' && (
            <div className="card p-5 space-y-4 animate-fade-in">
              {/* แถบค้นหาและตัวกรอง */}
              <div className="flex flex-col md:flex-row gap-2.5 justify-between">
                <input 
                  type="text" 
                  value={searchMember} 
                  onChange={(e) => setSearchMember(e.target.value)} 
                  placeholder="🔍 ค้นหาด้วยรหัส (เช่น M001), ชื่อที่แสดง หรือ @username..." 
                  className="flex-1 inp text-xs"
                />
                <div className="flex flex-wrap gap-2">
                  <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)} className="inp py-1.5 text-xs bg-[#050811]">
                    <option value="ALL">สถานะทั้งหมด ({users.length})</option>
                    <option value="ACTIVE">🟢 เปิดใช้งานแล้ว ({activeUsers.length})</option>
                    <option value="PENDING">⏳ รอเปิดใช้งาน ({pendingUsers.length})</option>
                    <option value="VICE">🛡️ เฉพาะ Owner / Vice</option>
                    <option value="FOLLOWER">🛰️ เฉพาะผู้ติดตาม (F)</option>
                  </select>
                  <select value={tagFilter} onChange={(e) => setTagFilter(e.target.value)} className="inp py-1.5 text-xs bg-[#050811]">
                    <option value="ALL">ทุกหมวดหมู่</option>
                    {allTags.map(t => <option key={t} value={t}>{t}</option>)}
                  </select>
                </div>
              </div>

              {/* รายการสมาชิก */}
              <div className="space-y-2.5 max-h-[62vh] overflow-y-auto pr-1 custom-scrollbar">
                {filteredMembers.length === 0 ? (
                  <div className="text-center py-10 text-slate-500 border border-dashed border-[#1E3A5F] rounded-xl">
                    ไม่พบรายชื่อสมาชิกที่ตรงกับเงื่อนไขการค้นหา
                  </div>
                ) : (
                  filteredMembers.map((u) => {
                    const stat = getStatusInfo(u);
                    return (
                      <div key={u.id} className="p-3.5 rounded-xl bg-[#050811] border border-[#1E3A5F] hover:border-white/30 transition-colors flex flex-wrap items-center justify-between gap-3">
                        <div className="flex items-center gap-3 min-w-0">
                          <div onClick={() => u.isActivated && setMemberModal && setMemberModal(u)} className={u.isActivated ? "cursor-pointer" : ""}>
                            <Avatar user={u} size="md" showStatus={u.isActivated} />
                          </div>
                          <div className="min-w-0">
                            <div className="flex flex-wrap items-center gap-1.5">
                              <span className={`px-1.5 py-0.5 rounded font-mono text-[10px] font-bold ${String(u.id).startsWith('F') ? 'bg-sky-400 text-[#050811]' : 'bg-white text-[#050811]'}`}>
                                {u.id}
                              </span>
                              <span className="font-bold text-sm text-white truncate">{u.displayName}</span>
                              <RoleBadge role={u.role} />
                              {!u.isActivated && <span className="px-2 py-0.5 rounded-full bg-amber-950 border border-amber-600 text-amber-300 text-[10px] font-bold">⏳ ยังไม่เปิดใช้งาน</span>}
                            </div>
                            <div className="flex flex-wrap items-center gap-2 text-[11px] text-slate-400 mt-1">
                              {u.isActivated ? (
                                <>
                                  <span className="font-mono text-sky-300">@{u.username}</span>
                                  <span>•</span>
                                  <span>{stat.t}</span>
                                </>
                              ) : (
                                <span>สร้างรหัสเมื่อ: {u.joinedAt || '-'}</span>
                              )}
                            </div>
                            <div className="mt-1.5">
                              <TagBadges user={u} />
                            </div>
                          </div>
                        </div>

                        {/* ปุ่มจัดการสมาชิก */}
                        <div className="flex flex-wrap items-center gap-1.5 shrink-0">
                          {!u.isActivated && (
                            <button 
                              onClick={() => handleCopyInvite(u.id)} 
                              className="btn-w py-1.5 px-3 text-[11px]"
                            >
                              {copiedId === u.id ? '✓ คัดลอกแล้ว' : '📋 ส่งคำเชิญ'}
                            </button>
                          )}
                          <button 
                            onClick={() => { setEditTagU(u); setEditTagL(getTags(u)); }} 
                            className="btn-d text-blue-200 py-1.5"
                          >
                            🏷️ หมวดหมู่
                          </button>
                          {u.isActivated && (
                            <button 
                              onClick={() => { setResetPassU(u); setNewPassVal(u.password || ''); }} 
                              className="btn-d text-amber-300 py-1.5"
                              title="ดูหรือเปลี่ยนรหัสผ่านให้สมาชิก"
                            >
                              🔑 รหัสผ่าน
                            </button>
                          )}
                          {u.role !== 'admin' && u.isActivated && (
                            <button 
                              onClick={() => db.collection('bma_users').doc(u.id).update({ role: u.role === 'mod' ? 'member' : 'mod' })} 
                              className="btn-b py-1.5"
                            >
                              {u.role === 'mod' ? 'ปลด Vice' : '🛡️ ตั้ง Vice'}
                            </button>
                          )}
                          {u.role !== 'admin' && (
                            <button 
                              onClick={() => confirm(`ยืนยันการลบบัญชี ${u.id} (${u.displayName}) ออกจากระบบ?`) && db.collection('bma_users').doc(u.id).delete()} 
                              className="px-2.5 py-1.5 rounded-xl bg-red-950/60 hover:bg-red-900 text-red-300 font-bold border border-red-900/50"
                            >
                              🗑️ ลบ
                            </button>
                          )}
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
            </div>
          )}

          {/* Modal แก้ไขหมวดหมู่สมาชิก */}
          {editTagU && (
            <Modal title={`🏷️ แก้ไขหมวดหมู่: ${editTagU.displayName} (${editTagU.id})`} onClose={() => setEditTagU(null)}>
              <div className="space-y-3 text-xs">
                <div className="flex gap-2">
                  <input type="text" value={cTag} onChange={(e) => setCTag(e.target.value)} placeholder="เพิ่มหมวดหมู่ใหม่..." className="flex-1 inp" />
                  <button type="button" onClick={() => { if (cTag.trim() && !editTagL.includes(cTag.trim())) setEditTagL([...editTagL, cTag.trim()]); setCTag(''); }} className="btn-b">+ เพิ่ม</button>
                </div>
                <div className="flex flex-wrap gap-1.5 p-3 rounded-xl bg-[#050811] border border-[#1E3A5F]">
                  {Array.from(new Set([...allTags, ...editTagL])).map((t) => (
                    <button 
                      key={t} 
                      onClick={() => setEditTagL(editTagL.includes(t) ? (editTagL.length > 1 ? editTagL.filter((x) => x !== t) : editTagL) : [...editTagL, t])} 
                      className={editTagL.includes(t) ? 'px-3 py-1 rounded-full bg-white text-[#050811] font-bold' : 'px-3 py-1 rounded-full bg-[#0B1325] text-slate-400 border border-[#1E3A5F]'}
                    >
                      {editTagL.includes(t) ? '✓ ' + t : '+ ' + t}
                    </button>
                  ))}
                </div>
                <button 
                  onClick={() => { 
                    db.collection('bma_users').doc(editTagU.id).update({ memberTag: editTagL[0], memberTags: editTagL }); 
                    setEditTagU(null); 
                  }} 
                  className="w-full btn-w py-2.5 mt-2"
                >
                  💾 บันทึกหมวดหมู่
                </button>
              </div>
            </Modal>
          )}

          {/* Modal ดู/รีเซ็ตรหัสผ่านให้สมาชิก */}
          {resetPassU && (
            <Modal title={`🔑 จัดการรหัสผ่าน: ${resetPassU.displayName} (${resetPassU.id})`} onClose={() => setResetPassU(null)}>
              <div className="space-y-3 text-xs">
                <div className="p-3 rounded-xl bg-[#050811] border border-[#1E3A5F] space-y-1">
                  <div className="text-slate-400">Username ปัจจุบัน: <strong className="font-mono text-white">@{resetPassU.username}</strong></div>
                  <div className="text-slate-400">Password ปัจจุบัน: <strong className="font-mono text-amber-300">{resetPassU.password}</strong></div>
                </div>
                <div>
                  <label className="block text-slate-400 mb-1 font-bold">ตั้งรหัสผ่านใหม่ (กรณีสมาชิกลืมรหัสผ่าน)</label>
                  <input 
                    type="text" 
                    value={newPassVal} 
                    onChange={(e) => setNewPassVal(e.target.value)} 
                    className="w-full inp font-mono" 
                    placeholder="ระบุรหัสผ่านใหม่..."
                  />
                </div>
                <button 
                  onClick={async () => {
                    if (!newPassVal.trim()) return alert('กรุณาระบุรหัสผ่าน');
                    await db.collection('bma_users').doc(resetPassU.id).update({ password: newPassVal.trim() });
                    alert(`อัปเดตรหัสผ่านของ ${resetPassU.displayName} เรียบร้อยแล้ว`);
                    setResetPassU(null);
                  }} 
                  className="w-full btn-w py-2.5"
                >
                  ✅ บันทึกรหัสผ่านใหม่
                </button>
              </div>
            </Modal>
          )}
        </div>
      );
    }

    function BoardPage({ 
      currentUser, searchQ, setSearchQ, setVisiblePosts, setCreatePost, 
      filterMenuOpen, setFilterMenuOpen, tagFilter, setTagFilter, allTags, 
      filterType, setFilterType, filterLatestOnly, setFilterLatestOnly, 
      filteredPosts, visiblePosts, hiPostId, getAuthor, setMemberModal, 
      postMenu, setPostMenu, db, handleEditPostReq, setCurrentView, setActiveGameTab, GAMES, fmtTime,
      toggleCommLike, repComm, setRepComm, setCommMenu, cInputs, setCInputs, handleAddComment
    }) {
      return (
        <>
      {/* ส่วนค้นหาและฟิลเตอร์ */}
          <div className="card p-3.5 space-y-2.5">
            <div className="flex gap-2">
              <input type="text" value={searchQ} onChange={(e) => { setSearchQ(e.target.value); setVisiblePosts(10); }} placeholder="ค้นหาโพสต์, โพลล์, ชื่อสมาชิก..." className="flex-1 inp text-xs" />
              {currentUser && <button onClick={() => setCreatePost(true)} className="btn-w text-xs whitespace-nowrap">+ เขียนโพสต์ / โพลล์</button>}
            </div>
            <div className="relative">
              <button onClick={() => setFilterMenuOpen(!filterMenuOpen)} className={`px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-2 border transition-colors ${tagFilter !== 'ALL' || filterType !== 'ALL' || filterLatestOnly ? 'bg-sky-900/50 border-sky-500 text-sky-100' : 'bg-[#050811] border-[#1E3A5F] text-slate-300 hover:text-white'}`}>
                <span>⚙️ เลือกดู</span>
                {(tagFilter !== 'ALL' || filterType !== 'ALL' || filterLatestOnly) && <span className="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>}
              </button>
          
              {filterMenuOpen && <div className="fixed inset-0 z-20" onClick={() => setFilterMenuOpen(false)}></div>}
          
              {filterMenuOpen && (
                <div className="absolute top-full mt-2 left-0 w-64 card p-3 z-30 shadow-2xl border-white/20 text-xs flex flex-col gap-3">
                  <div>
                    <div className="font-bold text-sky-300 mb-1.5">🏷️ หมวดหมู่สมาชิก</div>
                    <select value={tagFilter} onChange={e => setTagFilter(e.target.value)} className="w-full inp py-1.5 text-xs text-white">
                      <option value="ALL">ทั้งหมด</option>
                      {allTags.map(t => <option key={t} value={t}>{t}</option>)}
                    </select>
                  </div>

                  <div>
                    <div className="font-bold text-sky-300 mb-1.5">📝 ประเภทโพสต์</div>
                    <select value={filterType} onChange={e => setFilterType(e.target.value)} className="w-full inp py-1.5 text-xs text-white">
                      <option value="ALL">ทั้งหมด</option>
                      <option value="NORMAL">โพสต์ทั่วไป</option>
                      <option value="GAME">🎮 ผล Daily Games</option>
                      <option value="MEDIA">🖼️ มีสื่อ</option>
                    </select>
                  </div>

                  <label className="flex items-center gap-2 cursor-pointer border-t border-[#1E3A5F] pt-3 mt-1">
                    <input type="checkbox" checked={filterLatestOnly} onChange={e => setFilterLatestOnly(e.target.checked)} className="rounded bg-[#0B1325] border-[#1E3A5F] w-4 h-4 accent-sky-500" />
                    <span className="font-bold text-slate-200">📌 ดูเฉพาะโพสต์ล่าสุดของทุกคน</span>
                  </label>

                  {(tagFilter !== 'ALL' || filterType !== 'ALL' || filterLatestOnly) && (
                    <button onClick={() => { setTagFilter('ALL'); setFilterType('ALL'); setFilterLatestOnly(false); setFilterMenuOpen(false); }} className="mt-1 btn-d py-1.5 w-full text-red-300 hover:text-white hover:bg-red-950 font-bold border-red-900/50">
                      ✕ ล้างฟิลเตอร์ทั้งหมด
                    </button>
                  )}
                </div>
              )}
            </div>
          </div>

      {/* รายการโพสต์ */}
          {filteredPosts.slice(0, visiblePosts).map((post) => {
            const author = getAuthor(post.authorId);
            const isLiked = currentUser && (post.likes || []).includes(currentUser.id);
            const isBm = currentUser && (post.bookmarks || []).includes(currentUser.id);
            const isClosed = post.poll?.closesAt && Date.now() > post.poll.closesAt;
            const totalVotes = post.poll ? (post.poll.options || []).reduce((s, o) => s + (o.votes?.length || 0), 0) : 0;
            const canManage = (uid) => currentUser?.role === 'admin' || currentUser?.role === 'mod' || currentUser?.id === uid;
            const allComm = post.comments || [];
            const rootComm = allComm.filter((c) => { const pid = c.parentId || c.replyTo?.id; return !pid || !allComm.some((x) => x.id === pid); });

            return (
              <article id={'post-' + post.id} key={post.id} className={'card p-5 space-y-3.5 shadow-2xl border border-sky-900/50'}>
                          {post.isPinned && <div className="text-amber-300 text-xs font-bold -mt-1 mb-1 border-b border-amber-900/30 pb-2">📌 โพสต์ปักหมุด</div>}
                          <div className="flex justify-between items-start gap-2">
                            <div onClick={() => setMemberModal(author)} className="flex items-center gap-2.5 cursor-pointer"><Avatar user={author} size="md" showStatus={true} /><div><div className="flex flex-wrap items-center gap-1.5"><span className="font-bold text-sm hover:underline">{author.displayName}</span><span className={`px-1.5 py-0.5 rounded font-mono text-[10px] font-bold ${author.id.startsWith('F') ? 'bg-[#38BDF8] text-[#050811]' : 'bg-white text-[#050811]'}`}>{author.id}</span><TagBadges user={author} /><RoleBadge role={author.role} /></div><div className="text-[11px] text-slate-400">@{author.username} • {post.createdAt}</div></div></div>
                            <div className="flex items-center gap-2 relative">
                              {!canManage(post.authorId) && <span className="px-2 py-0.5 rounded-full bg-[#050811] text-[10px] text-slate-400">{post.isGuestAllowed ? '🌐 Guest' : '🔒 สมาชิก'}</span>}
                              {canManage(post.authorId) && (
                                <button onClick={() => setPostMenu(postMenu === post.id ? null : post.id)} className="text-slate-400 hover:text-white px-2 font-bold">⋮</button>
                              )}
                              {postMenu === post.id && (
                                <div className="absolute top-6 right-0 w-48 card border border-white/20 shadow-2xl py-1 z-30 flex flex-col text-left">
                                  <button onClick={() => { setPostMenu(null); db.collection('bma_posts').doc(post.id).update({ isGuestAllowed: !post.isGuestAllowed }); }} className="w-full px-4 py-2 text-left hover:bg-[#0F2547] flex justify-between items-center">
                                    <span>{post.isGuestAllowed ? '🔒 เปลี่ยนเป็นเฉพาะสมาชิก' : '🌐 ให้ Guest อ่านได้'}</span>
                                  </button>
                                  <button onClick={() => { setPostMenu(null); handleEditPostReq(post); }} className="w-full px-4 py-2 text-left hover:bg-[#0F2547] text-amber-300">✎ แก้ไขโพสต์</button>
                                  <button onClick={() => { setPostMenu(null); if(confirm('ต้องการลบโพสต์นี้ใช่หรือไม่?')) { db.collection('bma_posts').doc(post.id).delete(); window.history.replaceState({}, document.title, window.location.pathname); setCurrentView('home'); } }} className="w-full px-4 py-2 text-left hover:bg-red-950 text-red-400">🗑️ ลบโพสต์</button>
                                </div>
                              )}
                            </div>
                          </div>
                          {post.title && <h3 className="text-base font-bold">{post.title}</h3>}
                          {post.content && <FormattedText text={post.content} currentUser={currentUser} />}
                          {post.tags?.length > 0 && (
                              <div className="flex flex-wrap gap-1.5 mt-2">
                                  {post.tags.map(t => (
                                      <button key={t} onClick={() => { setSearchQ(t); setCurrentView('feed'); }} className="px-2 py-0.5 bg-sky-900/30 text-sky-300 hover:bg-sky-700/50 rounded text-[10px] border border-sky-800 transition-colors shadow-sm">
                                          #{t}
                                      </button>
                                  ))}
                              </div>
                          )}

                          {post.dailyGameShare && (
                            <div className="p-3.5 card border-amber-400/50 flex flex-col gap-2 shadow-lg bg-[#0F2547]/50">
                              <div className="text-amber-300 font-bold">🎯 {GAMES[post.dailyGameShare.gameIndex]?.name || 'Daily Game'}</div>
                              <div className="text-sm">ผู้โพสต์ทำสถิติได้: <span className="font-mono text-white font-bold bg-black/40 px-2 py-0.5 rounded">
                                {post.dailyGameShare.score ? `สถิติ ${post.dailyGameShare.score} / ${fmtTime(post.dailyGameShare.timeMs)}` : fmtTime(post.dailyGameShare.timeMs)}
                              </span></div>
                              <button onClick={() => { window.history.replaceState({}, document.title, window.location.pathname); setActiveGameTab(post.dailyGameShare.gameIndex); setCurrentView('daily_game'); }} className="btn-w text-xs self-start mt-1 hover:scale-105 transition-transform">🎮 ตามไปเล่นเกมนี้เลย</button>
                            </div>
                          )}

                          {post.poll && (
                            <div className="p-3.5 rounded-xl bg-[#050811] border border-[#1E3A5F] space-y-2">
                              <div className="flex justify-between text-xs"><span className="font-bold">📊 {post.poll.question}</span><span className="text-slate-400">{post.poll.isAnonymous ? '🕵️ ไม่ระบุชื่อ' : '👁️ แสดงชื่อในคอมเมนต์'}</span></div>
                              {(post.poll.options || []).map((opt) => {
                                const voted = currentUser && (opt.votes || []).includes(currentUser.id);
                                return <button key={opt.id} disabled={isClosed} onClick={async () => { if (!currentUser) return alert('กรุณาเข้าสู่ระบบก่อนโหวต!'); const opts = post.poll.options.map((o) => ({ ...o, votes: (o.votes || []).filter((u) => u !== currentUser.id).concat(o.id === opt.id ? [currentUser.id] : []) })); await db.collection('bma_posts').doc(post.id).update({ poll: { ...post.poll, options: opts } }); }} className={voted ? 'w-full flex justify-between px-3.5 py-2 rounded-xl bg-white text-[#050811] font-bold text-xs' : 'w-full flex justify-between px-3.5 py-2 rounded-xl bg-[#0B1325] border border-[#1E3A5F] text-xs'}><span>{voted ? '✓ ' + opt.text : opt.text}</span><span>โหวต</span></button>;
                              })}
                            </div>
                          )}

                          {post.attachments?.length > 0 && <div className="space-y-2">{post.attachments.map((att) => <SmartMedia key={att.id} att={att} />)}</div>}

                          <div className="flex justify-between pt-2.5 border-t border-[#1E3A5F] text-xs">
                            <LikeButton likes={post.likes} currentUser={currentUser} getAuthor={getAuthor} onLike={() => { if(!currentUser) return; db.collection('bma_posts').doc(post.id).update({ likes: (post.likes||[]).includes(currentUser.id) ? post.likes.filter((i) => i !== currentUser.id) : [...(post.likes || []), currentUser.id] }); }} />
                            <div className="flex gap-2">
                               <button onClick={() => { const u = window.location.origin + window.location.pathname + '?post=' + post.id; navigator.clipboard.writeText(u); alert('คัดลอกลิงก์โพสต์นี้แล้ว!\n' + u); }} className="px-2 py-0.5 rounded-full bg-[#0B1325] border border-[#1E3A5F] text-[10px]">🔗 คัดลอกลิงก์แชร์</button>
                               <button onClick={async () => { if (!currentUser) return alert('เข้าสู่ระบบก่อนบันทึกโพสต์'); const b = post.bookmarks || []; await db.collection('bma_posts').doc(post.id).update({ bookmarks: b.includes(currentUser.id) ? b.filter((i) => i !== currentUser.id) : [...b, currentUser.id] }); }} className={isBm ? 'px-3 py-1 rounded-lg font-bold bg-white text-[#050811]' : 'btn-d py-1'}>{isBm ? '★ บันทึกแล้ว' : '☆ บันทึก'}</button>
                            </div>
                          </div>

                          <div className="pt-2.5 border-t border-[#1E3A5F]/60 space-y-2">
                            {post.poll && (
                              <div className="p-3 rounded-xl bg-[#050811] border border-sky-500/40 space-y-1.5 text-xs">
                                <div className="font-bold text-sky-300">📊 ผลโพลล์ในคอมเมนต์ (รวม {totalVotes} โหวต)</div>
                                {(post.poll.options || []).map((o) => {
                                  const c = o.votes?.length || 0, pct = totalVotes ? Math.round((c / totalVotes) * 100) : 0;

          else if (MediaRecorder.isTypeSupported('audio/mp4')) options = { mimeType: 'audio/mp4' };

          mediaRecorderRef.current = new MediaRecorder(stream, options);

                         if (typeof loadedIdA !== 'undefined') loadedIdA.current = CLOSED_SONG_ID;
                         ytA.current.loadVideoById(CLOSED_SONG_ID, targetTime);
                     } else if (state === 0 || state === 2 || state === -1 || state === 5 || Math.abs(targetTime - cur) > 4) {
                         if (ytA.current.seekTo) ytA.current.seekTo(targetTime, true);
                         if (ytA.current.playVideo) {

                 const activePlayData = isDeckA ? djState.playA : djState.playB;

                 const durA = ytA.current?.getDuration ? ytA.current.getDuration() : 0;
                 const curA = ytA.current?.getCurrentTime ? ytA.current.getCurrentTime() : 0;
                 const durB = ytB.current?.getDuration ? ytB.current.getDuration() : 0;
                 const curB = ytB.current?.getCurrentTime ? ytB.current.getCurrentTime() : 0;
                 
                 setTrackTime({ 
                     curA: Math.floor(curA), durA: Math.floor(durA), 
                     curB: Math.floor(curB), durB: Math.floor(durB) 
                 });

                 const stateA = ytA.current?.getPlayerState ? ytA.current.getPlayerState() : -1;
                 const stateB = ytB.current?.getPlayerState ? ytB.current.getPlayerState() : -1;

                 const isEndedA = (stateA === 0 || (durA > 0 && durA - curA <= 0.5)) && djState.deckA?.id;
                 const isEndedB = (stateB === 0 || (durB > 0 && durB - curB <= 0.5)) && djState.deckB?.id;
                 const activeIsEnded = isDeckA ? isEndedA : isEndedB;

                 if ((!djState.playA?.isPlaying && !djState.playB?.isPlaying) || activeIsEnded) {

                     upClear.deckA = null; cleared = true;

                 if (isEndedB && !djState.playB?.isLooping) {
                     upClear.playB = { ...djState.playB, isPlaying: false, startedAt: 0, pausedPos: 0 };

             }

             const syncPlayer = (player, playData, isActive, deckId) => {
                 if (!player?.getCurrentTime || !playData?.isPlaying) return; 
                 
                 const currentSpeed = djState.speed || 1;
                 const expRaw = ((Date.now() - (playData.startedAt||Date.now())) / 1000) * currentSpeed;
                 const exp = Math.max(0, expRaw);
                 const cur = player.getCurrentTime();
                 const state = player.getPlayerState ? player.getPlayerState() : -1;
                 
                 if (state === -1 || state === 2 || state === 5) {
                     player.playVideo();
                     if (player.setPlaybackRate) player.setPlaybackRate(currentSpeed);
                 }
                 
                 if (isLocalPaused) {
                     if (player.isMuted && !player.isMuted()) player.mute();
                 } else {
                     if (player.isMuted && player.isMuted()) player.unMute();
                     const cVal = localCrossfadeRef.current;
                     const targetVol = deckId === 'A' ? (cVal < 50 ? 100 : 100 - ((cVal - 50) * 2)) : (cVal > 50 ? 100 : cVal * 2);
                     const finalVol = Math.max(0, (targetVol * localVolumeRef.current) / 100);
                     if (player.getVolume && player.getVolume() !== finalVol) {

                     }
                 }
                 
                 const dur = player.getDuration ? player.getDuration() : 0;
                 if (dur > 0 && dur - cur < 2) return;
                 if (dur > 0 && exp >= dur) return;
                 
                 if (Math.abs(exp - cur) > 4 && state !== 3 && state !== 0 && !isSeekingRef.current) {

                 if (canAutoRun && isActive && !isFadingRef.current) {

                             if (deckId === 'A') { up.deckB = nextSong; up.playB = { isPlaying: true, startedAt: Date.now(), pausedPos: 0 }; }

        const target = posts.find((p) => p.id === postId); if (!target) return;
        
        const attachmentsArray = attachment ? [attachment] : [];
        const c = { id: 'c-' + Date.now(), authorId: currentUser.id, text, attachments: attachmentsArray, likes: [], parentId: rep ? rep.id : null, replyTo: rep ? { id: rep.id, authorName: getAuthor(rep.authorId).displayName, text: rep.text.slice(0, 80) } : null, createdAt: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) };
        await db.collection('bma_posts').doc(postId).update({ comments: [...(target.comments || []), c] });
        await sendNotif({ recipientId: rep ? rep.authorId : target.authorId, actorId: currentUser.id, category: 'posts', subType: 'comment', title: rep ? '↩️ มีคนตอบกลับคอมเมนต์' : '💬 คอมเมนต์ใหม่ในโพสต์', body: currentUser.displayName + ': ' + (text || '[ส่งไฟล์แนบ]'), targetView: 'feed', targetPostId: postId });
      };

      const toggleCommLike = async (postId, cId) => {
        if (!currentUser) return;
        const p = posts.find((x) => x.id === postId); if (!p) return;
        await db.collection('bma_posts').doc(postId).update({ comments: (p.comments || []).map((c) => c.id !== cId ? c : { ...c, likes: (c.likes || []).includes(currentUser.id) ? c.likes.filter((i) => i !== currentUser.id) : [...(c.likes || []), currentUser.id] }) });
      };

      const setTyping = (isTyping) => { if (currentUser) db.collection('bma_typing').doc(roomKey + '_' + currentUser.id).set({ id: roomKey + '_' + currentUser.id, roomKey, userId: currentUser.id, displayName: currentUser.displayName, isTyping, updatedAt: Date.now() }).catch(() => {}); };

      const handleSendChat = async (e) => {
        if (e?.preventDefault) e.preventDefault();
        if (!currentUser) return;
        if (editMsg) {
          const t = chatIn.trim(), id = editMsg.id; if (!t) return;
          setEditMsg(null); setChatIn(''); setTyping(false);
          return db.collection('bma_messages').doc(id).update({ text: t, isEdited: true });
        }
        const text = chatIn.trim(), atts = [...chatAtts], rep = repMsg;
        if ((!text && !atts.length) || activeCh?.isSystemReadOnly || activeGrp?.isArchived) return;
        
        let finalText = text;
        if (IS_HALLOWEEN && finalText.length > 0 && Math.random() < 0.15) {
            const spookySuffixes = [" 👻", " 🎃", " 🕸️", " 🦇", " ...ระวังหลังให้ดีนะ", " ...แฮ่!"];
            finalText += spookySuffixes[Math.floor(Math.random() * spookySuffixes.length)];
        }

        setChatIn(''); setChatAtts([]); setRepMsg(null); setMentOpen(false); setTyping(false);
        const now = Date.now(), id = 'msg-' + now + '-' + Math.random().toString(36).slice(2, 5);
        const dStr = new Date().toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' });
        const fullTime = `${dStr} ${new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })}`;
        
        await db.collection('bma_messages').doc(id).set({ id, roomKey, senderId: currentUser.id, receiverId: activeRoom.type === 'dm' ? activeRoom.id : null, text: finalText, attachments: atts, likes: [], replyTo: rep ? { id: rep.id, senderName: getAuthor(rep.senderId).displayName, text: rep.text || '[ไฟล์แนบ]' } : null, readBy: [currentUser.id], isEdited: false, isDeleted: false, isSystemPostAlert: false, isSilent: isSilentMsg, time: fullTime, timestamp: now, serverCreatedAt: svrTs() });
        
        // 🌟 ถอยกลับโหมด Silent เป็นปกติหลังจากส่งเสร็จ
        const wasSilent = isSilentMsg;
        setIsSilentMsg(false);

        // 🌟 เช็กว่าถ้าไม่ใช่โหมด Silent ถึงจะแจ้งเตือน
        if (!wasSilent) {
            if (activeRoom.type === 'dm') await sendNotif({ recipientId: activeRoom.id, actorId: currentUser.id, category: 'messages', subType: 'dm_chat', title: '💬 ข้อความส่วนตัวจาก ' + currentUser.displayName, body: text || '[ไฟล์แนบ]', targetView: 'chat', targetRoomType: 'dm', targetRoomId: currentUser.id });
            else if (activeRoom.type === 'group' && activeGrp) { for (const mId of activeGrp.members || []) if (mId !== currentUser.id) await sendNotif({ recipientId: mId, actorId: currentUser.id, category: 'messages', subType: 'group_chat', title: '👥 ข้อความในกลุ่ม ' + activeGrp.name, body: currentUser.displayName + ': ' + (text || '[ไฟล์แนบ]'), targetView: 'chat', targetRoomType: 'group', targetRoomId: activeGrp.id }); }
            else if (activeCh) await sendNotif({ recipientId: 'ALL', actorId: currentUser.id, category: 'messages', subType: 'global_chat', title: '🌐 ข้อความใน #' + activeCh.name, body: currentUser.displayName + ': ' + (text || '[ไฟล์แนบ]'), targetView: 'chat', targetRoomType: 'channel', targetRoomId: activeCh.id });
        }
      };

      const handleSendDjChat = async (e) => {
        e.preventDefault();
        if (!currentUser || !djChatIn.trim()) return;
        const text = djChatIn.trim();
        setDjChatIn('');
        const now = Date.now(), id = 'msg-' + now + '-' + Math.random().toString(36).slice(2, 5);
        const dStr = new Date().toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' });
        const fullTime = `${dStr} ${new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })}`;
        await db.collection('bma_messages').doc(id).set({
            id, roomKey: 'global-discjam', senderId: currentUser.id, text, attachments: [], likes: [], readBy: [currentUser.id], isEdited: false, isDeleted: false, time: fullTime, timestamp: now, serverCreatedAt: svrTs()
        });
      };

      const jumpToPost = (postId) => { setTagFilter('ALL'); setSearchQ(''); setCurrentView('feed'); setHiPostId(postId); setTimeout(() => document.getElementById('post-' + postId)?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 180); setTimeout(() => setHiPostId(null), 4000); };
      
      const mentionList = () => {
        const l = [{ token: '@everyone', label: '@everyone', sub: 'แจ้งเตือนทุกคน' }, { token: '@here', label: '@here', sub: 'คนที่ออนไลน์' }];
        allTags.forEach((t) => l.push({ token: '@[' + t + ']', label: '@[' + t + ']', sub: 'หมวดหมู่ ' + t }));
        activeMembers.forEach((m) => { l.push({ token: '@' + m.id, label: '@' + m.id + ' (' + m.displayName + ')', sub: '@' + m.username }); if (m.username) l.push({ token: '@' + m.username, label: '@' + m.username + ' (' + m.displayName + ')', sub: m.id }); });
        return !mentF ? l : l.filter((x) => x.label.toLowerCase().includes(mentF) || x.sub.toLowerCase().includes(mentF));
      };

      const conversedDms = currentUser ? activeMembers.filter((m) => m.id !== currentUser.id && (chatMessages.some((msg) => msg.roomKey === dmKey(currentUser.id, m.id)) || openDms.includes(m.id) || (activeRoom.type === 'dm' && activeRoom.id === m.id))) : [];
      if(dmSortType === 'alpha') {
         conversedDms.sort((a,b) => a.displayName.localeCompare(b.displayName, 'th'));
      } else {
         conversedDms.sort((a,b) => {
             const aMsgs = chatMessages.filter(msg => msg.roomKey === dmKey(currentUser.id, a.id));
             const bMsgs = chatMessages.filter(msg => msg.roomKey === dmKey(currentUser.id, b.id));
             const aLast = aMsgs.length > 0 ? getMs(aMsgs[aMsgs.length-1]) : 0;
             const bLast = bMsgs.length > 0 ? getMs(bMsgs[bMsgs.length-1]) : 0;
             return bLast - aLast;
         });
      }
      
      const myGroups = currentUser ? groups.filter((g) => (g.members || []).includes(currentUser.id)) : [];
      const roomTypers = typingStatuses.filter((t) => t.roomKey === roomKey && t.userId !== currentUser?.id);
      
      let basePosts = posts.filter((p) => {
        if (!currentUser && !p.isGuestAllowed) return false;
        const a = getAuthor(p.authorId);
        const myBm = currentUser ? (p.bookmarks || []).includes(currentUser.id) : false;
        if (currentView === 'bookmarks' && !myBm) return false;
        if (tagFilter !== 'ALL' && !getTags(a).includes(tagFilter)) return false;
        if (searchQ) {
            const q = searchQ.toLowerCase();
            const matchText = (p.title || '').toLowerCase().includes(q) || (p.content || '').toLowerCase().includes(q) || a.displayName.toLowerCase().includes(q) || String(a.id).toLowerCase().includes(q);
            const matchTag = (p.tags || []).some(t => t.toLowerCase().includes(q));
            if (!matchText && !matchTag) return false;
        }
        
        if (filterType === 'GAME' && !p.dailyGameShare) return false;
        if (filterType === 'MEDIA' && !(p.attachments?.length > 0)) return false;
        if (filterType === 'NORMAL' && p.dailyGameShare) return false;

        return true;
      });

      if (filterLatestOnly) {
         const seen = new Set();
         basePosts = basePosts.filter(p => {
            if (seen.has(p.authorId)) return false;
            seen.add(p.authorId);
            return true;
         });
      }

      const filteredPosts = basePosts.sort((a, b) => (b.isPinned ? 1 : 0) - (a.isPinned ? 1 : 0));
      
      const orbitRings = () => {
        const r1 = [], r2 = [], r3 = [], r4 = [], list = activeMembers.length ? activeMembers : users;
        list.forEach((u, i) => {
           if (i % 4 === 0) r1.push(u);
           else if (i % 4 === 1) r2.push(u);
           else if (i % 4 === 2) r3.push(u);
           else r4.push(u);
        });
        return [
           { r: 125, items: r1, rc: 'or1', cc: 'cr1' }, 
           { r: 190, items: r2, rc: 'or2', cc: 'cr2' }, 
           { r: 260, items: r3, rc: 'or3', cc: 'cr3' },
           { r: 335, items: r4, rc: 'or2', cc: 'cr2' } 
        ];
      };

      const sortScores = (list, gIdx) => {
        return list.sort((a,b) => {
          if(gIdx === 2) return (b.score||0) - (a.score||0) || a.timeMs - b.timeMs;
          if(gIdx === 4) return (a.score||99) - (b.score||99) || a.timeMs - b.timeMs;
          if(gIdx === 5) return (b.score||0) - (a.score||0) || a.timeMs - b.timeMs;
          if(gIdx === 6) return (b.score||0) - (a.score||0) || a.timeMs - b.timeMs;
          if(gIdx === 8) return (b.score||0) - (a.score||0) || a.timeMs - b.timeMs;
          return a.timeMs - b.timeMs;
        });
      };

      const handleFirstMove = useCallback(() => {
         setGameAppSt(prev => {
            const c = prev[activeGameTab] || {};
            if (c.isPlaying && !c.hasStartedMove) {
               return { ...prev, [activeGameTab]: { ...c, hasStartedMove: true } };
            }
            return prev;
         });
      }, [activeGameTab]);

      useEffect(() => {
        let intv = setInterval(() => {
          setGameAppSt(prev => {
            const c = prev[activeGameTab] || {};
            if(c.isPlaying && c.status === 'pending' && !c.isPaused && c.hasStartedMove !== false) {
              return { ...prev, [activeGameTab]: { ...c, time: (c.time||0) + 1 } };
            }
            return prev;
          });
        }, 1000);
        return () => clearInterval(intv);
      }, [activeGameTab]);

      useEffect(() => {
        if(!db) return;
        return db.collection('bma_daily_scores')
          .where('date', '==', todayStr)
          .where('gameIndex', '==', activeGameTab)
          .onSnapshot(s => setGameScores(sortScores(s.docs.map(d=>d.data()), activeGameTab)));
      }, [todayStr, activeGameTab]);

      useEffect(() => {
        if(!db || lbTab !== 'monthly') return;
        const prefix = todayStr.substring(0, 7);
        db.collection('bma_daily_scores').where('gameIndex', '==', activeGameTab).get().then(s => {
          const docs = s.docs.map(d=>d.data()).filter(d => d.date.startsWith(prefix) && d.timeMs !== Infinity);
          let best = {};
          docs.forEach(sc => {
            if(!best[sc.userId]) best[sc.userId] = sc;
            else {
              let isB = false;
              if(activeGameTab===2) isB = sc.score > best[sc.userId].score || (sc.score === best[sc.userId].score && sc.timeMs < best[sc.userId].timeMs);
              else if(activeGameTab===4) isB = sc.score < best[sc.userId].score || (sc.score === best[sc.userId].score && sc.timeMs < best[sc.userId].timeMs);
              else if(activeGameTab===5) isB = sc.score > best[sc.userId].score || (sc.score === best[sc.userId].score && sc.timeMs < best[sc.userId].timeMs);
              else if(activeGameTab===6) isB = sc.score > best[sc.userId].score || (sc.score === best[sc.userId].score && sc.timeMs < best[sc.userId].timeMs);
              else isB = sc.timeMs < best[sc.userId].timeMs;
              if(isB) best[sc.userId] = sc;
            }
          });
          setMonthlyScores(sortScores(Object.values(best), activeGameTab));
        });
      }, [lbTab, activeGameTab, todayStr]);

      const handleGameWinLose = async (result, payload = {}) => {
        const st = result === 'bomb' ? 'lost_bomb' : result;
        const sVal = payload.score || 0;
        let fTime;
        
        setGameAppSt(prev => {
          const c = prev[activeGameTab] || {};
          fTime = result === 'bomb' ? Infinity : (c.time || 0);
          
          if(currentUser) {
            const ext = gameScores.find(x => x.userId === currentUser.id);
            let up = false;
            if(!ext) up = true;
            else if(activeGameTab===2 && (sVal > (ext.score||0) || (sVal === (ext.score||0) && fTime < ext.timeMs))) up = true;
            else if(activeGameTab===4 && (sVal < (ext.score||99) || (sVal === (ext.score||99) && fTime < ext.timeMs))) up = true;
            else if(activeGameTab===5 && (sVal > (ext.score||0) || (sVal === (ext.score||0) && fTime < ext.timeMs))) up = true;
            else if(activeGameTab===6 && (sVal > (ext.score||0) || (sVal === (ext.score||0) && fTime < ext.timeMs))) up = true;
            else if(activeGameTab===8 && (sVal > (ext.score||0) || (sVal === (ext.score||0) && fTime < ext.timeMs))) up = true;
            else if(activeGameTab!==2 && activeGameTab!==4 && activeGameTab!==5 && activeGameTab!==6 && activeGameTab!==8 && fTime < ext.timeMs) up = true;

            if(up) {
              db.collection('bma_daily_scores').doc(`${todayStr}_${activeGameTab}_${currentUser.id}`).set({
                userId: currentUser.id, displayName: currentUser.displayName, date: todayStr,
                timeMs: fTime, status: st, gameIndex: activeGameTab, score: sVal, maxTile: payload.maxTile || null, timestamp: Date.now()
              });
            }
          }
          return { ...prev, [activeGameTab]: { ...c, isPlaying: false, status: st, score: sVal, time: fTime, showModal: true, answer: payload.answer || null, maxTile: payload.maxTile || null } };
        });
      };

      const shareGameResult = async () => {
        if(!currentUser) return;
        const t = currGameSt.time;
        let msg = '';
        if (currGameSt.status === 'lost_bomb') msg = `พลาดเหยียบระเบิดในเกม ${GAMES[activeGameTab].name}! พรุ่งนี้เอาใหม่ 😭💣`;
        else if (currGameSt.status === 'lost' && activeGameTab === 2) msg = `ทายธงพลาด! ถูกไปแค่ ${currGameSt.score}/3 ประเทศ ในเกม ${GAMES[activeGameTab].name} 🏳️`;
        else if (currGameSt.status === 'lost' && activeGameTab === 4) msg = `ทายคำศัพท์ไม่ถูกใน ${GAMES[activeGameTab].name}! พรุ่งนี้เอาใหม่นะ 🔤`;
        else if (currGameSt.status === 'lost' && activeGameTab === 8) msg = `ต่อวงจรระเบิดตู้ม! ทายผิด 3 ครั้งในเกม ${GAMES[activeGameTab].name} 💥`; 
        else if (activeGameTab === 2) msg = `ทายถูก ${currGameSt.score}/3 ประเทศ ใช้เวลา ${fmtTime(t)} ในเกม ${GAMES[activeGameTab].name}! 🏳️`;
        else if (activeGameTab === 4) msg = `ทายคำศัพท์สำเร็จใน ${currGameSt.score} ครั้ง! ใช้เวลา ${fmtTime(t)} ในเกม ${GAMES[activeGameTab].name}! 🔤`;
        else if (activeGameTab === 5) msg = `ทำคะแนนได้ ${currGameSt.score} 🍎 ใช้เวลา ${fmtTime(t)} ในเกม ${GAMES[activeGameTab].name}! 🐍`;
        else if (activeGameTab === 6) msg = `ทำคะแนนรวมไปได้ ${currGameSt.score} คะแนน โดยได้เลขสูงสุดคือ [${currGameSt.maxTile || 0}] 🟨 ในเกม ${GAMES[activeGameTab].name}! 😎`;
        else if (activeGameTab === 8) msg = `ต่อวงจรสำเร็จใน ${4 - (currGameSt.score/100)} ครั้ง! ใช้เวลา ${fmtTime(t)} ในเกม ${GAMES[activeGameTab].name}! 🔌`; 
        else msg = `ทำเวลาไปได้ ${fmtTime(t)} ในเกม ${GAMES[activeGameTab].name}! ใครว่างมาท้าดวลกัน 😎`;

        const postId = 'post-' + Date.now();
        await db.collection('bma_posts').doc(postId).set({
          id: postId, authorId: currentUser.id, title: `แชร์สถิติ Daily Game: ${GAMES[activeGameTab].name}`, content: msg,
          dailyGameShare: { gameIndex: activeGameTab, timeMs: t, score: currGameSt.score, dateStr: todayStr },
          isGuestAllowed: true, category: 'General', attachments: [], mutedBy: [], 
          createdAt: new Date().toLocaleDateString('th-TH', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }), 
          timestamp: Date.now(), serverCreatedAt: svrTs(), likes: [], bookmarks: [], comments: []
        });
        alert('แชร์ไปที่กระดานโพสต์เรียบร้อย!');
        setGameAppSt(p => ({ ...p, [activeGameTab]: { ...(p[activeGameTab]||{}), showModal: false, status: 'viewing_board' } }));
        setCurrentView('feed');
      };

      return (
        <div className="bg-[#050811] text-white flex flex-col h-screen overflow-hidden">
          {/* WELCOME OVERLAY (Loy Krathong) */}
          {showWelcome && (
            <div id="welcome-overlay" className="fixed inset-0 bg-[#040914] z-[1000] flex flex-col items-center overflow-y-auto pt-4 transition-all pb-10">
              <div className="max-w-[800px] w-full px-4 text-center relative z-10 flex flex-col items-center">
                <div className="full-moon"></div>
                <h1 className="text-xl sm:text-2xl font-bold text-[#FBBF24] mt-2 drop-shadow-md">ยินดีต้อนรับสู่ The Blue Moon Association</h1>
                <h2 className="text-sm sm:text-lg text-white mt-1">✨ กิจกรรมพิเศษเทศกาลวันลอยกระทง ✨</h2>
                
                <div className="flex justify-center gap-2 my-4 flex-wrap">
                  <button onClick={() => setLoyTab('krathong')} className={`px-4 py-2 text-xs sm:text-sm rounded-full font-bold border transition-colors ${loyTab === 'krathong' ? 'bg-[#13284C] text-[#FBBF24] border-[#FBBF24] shadow-[0_0_10px_rgba(251,191,36,0.3)]' : 'bg-[#0A162C] text-[#FDE68A] border-[#D97706]'}`}>🪷 ลอยกระทงออนไลน์</button>
                  <button onClick={() => setLoyTab('siemsi')} className={`px-4 py-2 text-xs sm:text-sm rounded-full font-bold border transition-colors ${loyTab === 'siemsi' ? 'bg-[#13284C] text-[#FBBF24] border-[#FBBF24] shadow-[0_0_10px_rgba(251,191,36,0.3)]' : 'bg-[#0A162C] text-[#FDE68A] border-[#D97706]'}`}>🎋 เซียมซีเสี่ยงทาย</button>
                  <button onClick={() => setLoyTab('game')} className={`px-4 py-2 text-xs sm:text-sm rounded-full font-bold border transition-colors ${loyTab === 'game' ? 'bg-[#13284C] text-[#FBBF24] border-[#FBBF24] shadow-[0_0_10px_rgba(251,191,36,0.3)]' : 'bg-[#0A162C] text-[#FDE68A] border-[#D97706]'}`}>🎮 มินิเกมรักษ์โลก</button>
                </div>

                {loyTab === 'krathong' && (
                  <div className="bg-[#0A162C] border-2 border-[#D97706] rounded-2xl p-4 sm:p-6 shadow-2xl w-full max-w-[600px] mx-auto animate-fade-in">
                    <h3 className="text-white text-base sm:text-lg font-bold">ร่วมอธิษฐานลอยกระทง</h3>
                    <p className="text-xs sm:text-sm text-slate-300 mb-2">พิมพ์คำอธิษฐานแล้วกดลอยกระทงก่อนเข้าเว็บ</p>
                    <input type="text" value={loyWish} onChange={e => setLoyWish(e.target.value)} className="w-full bg-[#040914] border border-[#D97706] text-[#FDE68A] p-2.5 rounded-lg outline-none text-xs sm:text-sm" placeholder="พิมพ์คำอธิษฐานของคุณที่นี่..." />
                    <button onClick={handleFloatKrathong} className="mt-4 px-6 py-2 bg-[#13284C] border-2 border-[#FBBF24] text-[#FDE68A] text-xs sm:text-sm font-bold rounded-full hover:bg-[#D97706] hover:text-white transition-all">✨ ลอยกระทงเลย!</button>
                    <div className="relative h-[150px] sm:h-[180px] w-full mt-6 rounded-xl border border-[#D97706] overflow-hidden bg-gradient-to-b from-[#040914] to-[#0a192f]">
                      <div className="river-reflection"></div>
                      {loyKrathongs.map(k => (
                        <img key={k.id} src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Lotus_flower_icon.svg/512px-Lotus_flower_icon.svg.png" className="absolute w-[50px] sm:w-[60px] h-auto -left-[100px] z-20" style={{ top: `${k.top}%`, animation: 'floatKrathongImg 8s linear forwards', filter: 'drop-shadow(0 15px 15px rgba(255, 200, 0, 0.6))' }} alt="krathong" />
                      ))}
                    </div>
                  </div>
                )}

                {loyTab === 'siemsi' && (
                  <div className="bg-[#0A162C] border-2 border-[#D97706] rounded-2xl p-4 sm:p-6 shadow-2xl w-full max-w-[600px] mx-auto animate-fade-in flex flex-col items-center">
                    <h3 className="text-white text-base sm:text-lg font-bold">เซียมซีเสี่ยงทาย รับวันเพ็ญ</h3>
                    <div className={`text-[4rem] sm:text-[5rem] transition-transform origin-bottom ${isSiemsiShaking ? 'animate-shake' : ''}`}>🎋</div>
                    <div className="bg-black/30 border border-dashed border-[#D97706] rounded-xl p-4 w-full min-h-[80px] flex items-center justify-center text-white mt-4 text-xs sm:text-sm">

                        <div className="flex h-full items-center justify-center">

                        </div>
                      ) : loyGameTime === 0 ? (
                        <div className="absolute inset-0 bg-black/70 z-50 flex flex-col items-center justify-center">

                          <p className="text-[#FBBF24] font-bold text-base my-2">คะแนนของคุณ: {loyGameScore}</p>
                          <button onClick={startLoyGame} className="mt-2 px-4 py-1.5 bg-[#13284C] border border-[#FBBF24] text-[#FDE68A] text-xs rounded-full hover:bg-[#D97706] hover:text-white">เล่นอีกครั้ง</button>
                        </div>
                      ) : (
                        loyGameItems.map(item => (
                          <div key={item.id} onClick={() => handleGameItemClick(item)} className="absolute text-2xl sm:text-3xl select-none" style={{ top: `${item.top}%`, animation: `floatGameItem ${item.duration}s linear forwards`, filter: item.clicked ? (item.isGarbage ? 'drop-shadow(0 0 10px #4ade80)' : 'drop-shadow(0 0 10px #f87171)') : 'drop-shadow(0 5px 5px rgba(0,0,0,0.5))' }}>
                            {item.clicked ? (item.isGarbage ? '✨' : '❌') : (item.isGarbage ? item.txt : <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Lotus_flower_icon.svg/512px-Lotus_flower_icon.svg.png" style={{width:'40px'}}/>)}

                        <span className={`hidden md:flex overflow-hidden transition-all duration-300 items-center ${currentView === 'admin' ? 'max-w-[150px] opacity-100 ml-1.5' : 'max-w-0 opacity-0 group-hover:max-w-[150px] group-hover:opacity-100 group-hover:ml-1.5'}`}>Owner</span>

                          </div>
                       </div>

              </div>
            </div>
          </header>

                            <div className="w-full h-full rounded-full overflow-hidden">
                                {isFullyClosedSync ? (

                                    <img src={`https://img.youtube.com/vi/${activeDeckSong.id}/default.jpg`} className={`w-full h-full object-cover ${isDeckPlaying && !isLocalPaused ? 'animate-[spin_4s_linear_infinite]' : ''}`} alt="" />

                                    <div className="w-full h-full bg-slate-900 flex items-center justify-center text-xs">💿</div>
                                )}

                            <div className="absolute inset-0 pointer-events-none flex items-end justify-center pb-2" style={{ overflow: 'visible' }}>
                                {flyingNotes.map(n => (
                                    <div key={n.id} className="animate-music-note text-[10px]" style={{ left: n.left }}>{n.char}</div>

                                {isFullyClosedSync ? 'สถานีปิดรับคิวชั่วคราว' : (activeDeckSong?.title || 'ไม่มีเพลงเล่น')}

                            <div className="flex items-center gap-2 mt-1.5 justify-between w-full">
                                <button onClick={handleToggleLocalAudio} className={`px-2.5 py-0.5 rounded-full text-[10px] font-bold border transition-colors ${!isLocalPaused ? 'bg-sky-900/50 text-sky-300 border-sky-500/50 shadow-[0_0_8px_rgba(14,165,233,0.4)]' : 'bg-slate-800 text-slate-400 border-slate-600 hover:bg-slate-700'}`}>

                                    <span className="text-[9px] font-mono text-slate-400 mr-2">

                                    </span>
                                )}
                            </div>
                        </div>
                        <button onClick={() => setIsPlayerFloatingOpen(false)} className="text-slate-500 hover:text-white p-1 self-start -mt-1 -mr-1">✕</button>
                    </div>
                    {!isLocalPaused && (
                        <div className="flex items-center gap-2 px-1 pt-1.5 border-t border-[#1E3A5F]">
                            <span className="text-xs text-slate-400">🔈</span>
                            <input type="range" min="0" max="100" value={localVolume} onChange={(e) => setLocalVolume(parseInt(e.target.value))} className="flex-1 h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-sky-500" />
                            <span className="text-[9px] font-mono w-6 text-right text-sky-400">{localVolume}%</span>
                        </div>
                    )}
                </div>
            </div>
          )}
          
          {!isPlayerFloatingOpen && (
              <button onClick={() => setIsPlayerFloatingOpen(true)} className="fixed bottom-6 right-6 z-50 w-12 h-12 rounded-full bg-[#0F2547] border-2 border-sky-500/50 shadow-[0_0_15px_rgba(14,165,233,0.3)] flex items-center justify-center text-xl hover:scale-110 transition-transform pointer-events-auto cursor-pointer">🎧</button>

            <div className="animate-view relative flex-1 flex flex-col items-center py-8 px-4 overflow-y-auto no-scrollbar">

                <p className="text-xs text-slate-300">คลิกดาวบริวารเพื่อดูโปรไฟล์และส่งข้อความ หรือเข้าสู่กระดานโพสต์</p>

              <div className="relative w-full max-w-[760px] h-[700px] flex items-center justify-center orbit-sys select-none shrink-0 my-4">
                <div onClick={() => setCurrentView('feed')} className="relative z-20 w-32 h-32 rounded-full cursor-pointer flex flex-col items-center justify-center text-center p-4 hover:scale-105 transition" style={{ background: 'radial-gradient(circle at 30% 30%, #60A5FA, #1D4ED8 45%, #0F2547 80%, #050811 100%)', boxShadow: '0 0 60px rgba(37,99,235,0.65)' }}><Logo s={32} /><span className="text-[11px] font-bold uppercase mt-1">Blue Moon</span><span className="text-[10px] text-blue-200">{activeMembers.length} Satellites</span></div>
                {orbitRings().map((ring, ri) => (
                  <div key={ri} className={'absolute top-1/2 left-1/2 rounded-full border border-[#1E3A5F]/70 pointer-events-none ' + ring.rc} style={{ width: ring.r * 2 + 'px', height: ring.r * 2 + 'px' }}>
                    {ring.items.map((m, mi) => {
                      const rad = ((360 / Math.max(1, ring.items.length)) * mi * Math.PI) / 180;
                      return <div key={m.id} style={{ left: ring.r + ring.r * Math.cos(rad) + 'px', top: ring.r + ring.r * Math.sin(rad) + 'px' }} className={'absolute pointer-events-auto ' + ring.cc}><button onClick={() => {
                          if (IS_HALLOWEEN && m.id === cursedUserId) {
                              setScareTriggered(true);
                              setTimeout(() => setScareTriggered(false), 1200);
                              const mems = activeMembers.filter(x => x.id !== m.id);
                              setCursedUserId(mems.length > 0 ? mems[Math.floor(Math.random() * mems.length)].id : null); 
                          } else {
                              setMemberModal(m);
                          }
                      }} className="flex flex-col items-center"><Avatar user={m} size="md" showStatus={true} /><div className="mt-1 px-2 py-0.5 rounded-full bg-[#050811]/90 border border-[#1E3A5F] text-[10px] whitespace-nowrap">{m.displayName}</div></button></div>;
                    })}
                  </div>
                ))}
              </div>
              
              <div className="flex gap-3 w-full max-w-md justify-center z-10 shrink-0">
                <button onClick={() => setCurrentView('feed')} className="flex-1 py-3 btn-b text-xs shadow-lg hover:scale-105 transition-transform">📖 กระดานโพสต์</button>
                <button onClick={() => currentUser ? setCurrentView('daily_game') : setCurrentView('login')} className="flex-1 py-3 btn-w text-xs shadow-lg hover:scale-105 transition-transform">{currentUser ? '🎮 ท้าดวล Daily Game' : '🔑 เข้าสู่ระบบ'}</button>
              </div>

              <div className="z-10 mt-16 mb-8 w-full max-w-3xl bg-[#0B1325]/80 backdrop-blur-sm border border-[#1E3A5F] rounded-2xl p-6 sm:p-8 text-xs text-slate-300 leading-relaxed shadow-2xl shrink-0 text-left">
                <h3 className="font-bold text-sky-400 text-sm mb-4">📜 ข้อตกลง (อัพเดตล่าสุด 10 ตุลาคม 2026)</h3>
                <ul className="space-y-3 list-none pl-0">
                  <li className="flex gap-2.5"><span className="text-sky-500 font-bold">1.</span> <span>สมาคมนี้จัดตั้งขึ้นเพื่อสร้างคอนเนกชั่นระหว่างคนในจักรวาลของทอมสำหรับประโยชน์อันใดของสมาชิกในอนาคต</span></li>
                  <li className="flex gap-2.5"><span className="text-sky-500 font-bold">2.</span> <span>สมาคมนี้ไม่แสวงหาผลกำไรใด ๆ</span></li>
                  <li className="flex gap-2.5"><span className="text-sky-500 font-bold">3.</span> <span>สมาชิกทุกคนจะถูกเชิญโดยเจ้าของเท่านั้น</span></li>
                  <li className="flex gap-2.5"><span className="text-sky-500 font-bold">4.</span> <span>สมาชิกทุกคนสามารถมีผู้ติดตามมาในนี้ได้ครั้งละ 1 คน หากต้องการเปลี่ยนคนหรือต้องการผู้ติดตามมากกว่า 1 คน โปรดแจ้งเจ้าของก่อน</span></li>
                  <li className="flex gap-2.5"><span className="text-sky-500 font-bold">5.</span> <span>สมาคมนี้จะใช้ Website ของสมาคมเป็นช่องทางหลักในการติดต่อสื่อสาร และมี {currentUser ? <a href="https://discord.com/invite/HCqFYXCYBt" target="_blank" rel="noreferrer" className="text-[#5865F2] font-bold hover:underline bg-[#5865F2]/10 px-1 rounded transition-colors">Discord</a> : <span className="text-slate-400 font-bold bg-[#5865F2]/10 px-1 rounded cursor-not-allowed">Discord (เฉพาะสมาชิก)</span>} เป็นห้องเสียงในการพูดคุยกันอีกช่องทางหนึ่ง โดยเจ้าของจะออก ID ให้สำหรับสมาชิกในการเข้าเว็บไซต์</span></li>
                </ul>
              </div>
            </div>
          )}

          {/* LOGIN VIEW */}
          {currentView === 'login' && (
            <div className="flex-1 flex items-center justify-center p-4">
              <div className="w-full max-w-md card p-7 space-y-4">
                <div className="text-center"><div className="flex justify-center mb-2"><Logo s={46} /></div><h2 className="text-lg font-bold uppercase">The Blue Moon Portal</h2></div>
                <div className="grid grid-cols-2 gap-1 p-1 rounded-xl bg-[#050811] border border-[#1E3A5F]">
                  <button onClick={() => { setAuthMode('signin'); setAuthErr(''); }} className={authMode === 'signin' ? 'py-2 rounded-lg text-xs font-bold bg-white text-[#050811]' : 'py-2 text-xs text-slate-400'}>เข้าสู่ระบบ</button>
                  <button onClick={() => { setAuthMode('activate'); setAuthErr(''); }} className={authMode === 'activate' ? 'py-2 rounded-lg text-xs font-bold bg-white text-[#050811]' : 'py-2 text-xs text-slate-400'}>เปิดใช้งาน Member ID</button>
                </div>
                {authMode === 'signin' ? (

                          <div className="text-xs font-mono text-sky-400 font-bold mt-2 text-center">

          )}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div className="lg:col-span-5 space-y-4">
               <div className="card p-4 h-[350px] flex flex-col shrink-0 border-sky-900/50">
                  <h3 className="font-bold mb-3 border-b border-[#1E3A5F] pb-2 text-sm text-sky-400 shrink-0">💬 แชตกับ DJ (Global)</h3>

                     {chatMessages.filter(m => m.roomKey === 'global-discjam').map((msg) => {
                         const s = getAuthor(msg.senderId);
                         const isDJ = djState.jammerId === msg.senderId;

                             <div key={msg.id} className="flex items-start gap-2.5">

                                     </div>
                                     <div className="text-xs text-slate-200 break-words">{msg.isDeleted ? <span className="italic text-slate-500">🚫 ข้อความถูกยกเลิก</span> : msg.text}</div>
                                 </div>
                             </div>
                         );
                     })}

                     <button type="submit" className="btn-w text-xs">ส่ง</button>
                  </form>
               </div>
               
               <div className="card p-4">
                    <div className="text-sm font-bold text-sky-400 mb-3 border-b border-[#1E3A5F] pb-2">📁 Quick Playlists</div>
                    <div className="flex flex-wrap gap-2 mb-3">
                        {(djState.quickPlaylists || []).length === 0 && <span className="text-[10px] text-slate-500 italic">ยังไม่มีเพลย์ลิสต์</span>}
                        {(djState.quickPlaylists || []).map((qp, i) => (
                            <div key={i} className="flex items-center rounded-lg bg-[#050811] border border-[#1E3A5F] overflow-hidden group shadow-md">
                                <button onClick={() => {
                                    if(!djState.jammerId || djState.jammerId !== currentUser?.id) {
                                        if(!canManageAudio) return alert('เฉพาะ DJ เท่านั้นที่สามารถกดนำเข้าเพลย์ลิสต์ได้');
                                    }
                                    const parsed = parseYouTubeUrl(qp.url);
                                    if (parsed?.listId && (ytA.current || ytB.current)) {
                                        alert("กำลังนำเข้าเพลย์ลิสต์...");
                                        const helper = ytA.current || ytB.current;
                                        helper.loadPlaylist({list: parsed.listId});
                                        if (helper.playVideo) helper.playVideo();
                                        setTimeout(() => {
                                             const playlistArr = helper.getPlaylist ? helper.getPlaylist() : null;
                                             if (playlistArr && playlistArr.length > 0) {
                                                 const songsToAdd = playlistArr.slice(0, 50).map((vid, index) => ({ id: vid, title: `กำลังโหลดข้อมูล...`, addedBy: currentUser.id, key: Date.now() + index + Math.random() }));
                                                 handleAddTrack(songsToAdd.shift());
                                                 if (songsToAdd.length > 0) updateDjState({ queue: firebase.firestore.FieldValue.arrayUnion(...songsToAdd) });
                                                 alert(`เพิ่มเพลงจาก Playlist จำนวน ${songsToAdd.length + 1} เพลงเรียบร้อย`);
                                             } else alert("ไม่พบเพลงในเพลย์ลิสต์นี้ หรือเพลย์ลิสต์ถูกตั้งเป็นส่วนตัว");
                                        }, 3500);
                                    }
                                }} className="px-3 py-1.5 text-xs text-slate-300 hover:bg-[#0F2547] hover:text-white transition-colors">▶ {qp.name}</button>
                                {(currentUser?.role === 'admin' || currentUser?.role === 'mod') && (
                                    <button onClick={() => {
                                        if(confirm(`ลบเพลย์ลิสต์ ${qp.name} ?`)) {
                                            const newQp = [...djState.quickPlaylists];
                                            newQp.splice(i, 1);
                                            updateDjState({ quickPlaylists: newQp });
                                        }

                            e.target.reset();
                        }} className="flex gap-1.5">

                            <button type="submit" className="btn-b py-1.5 px-3 text-xs">+</button>
                        </form>
                    )}

            </div>

            <div className="lg:col-span-7 space-y-4">

                 <form onSubmit={(e) => {
                  e.preventDefault();

                  const isInputBlocked = radioClosed && !djState.jammerId;

                  const url = e.target.elements.ytUrl.value;
                  const parsed = parseYouTubeUrl(url);
                  
                  if (parsed?.listId || parsed?.videoId) {
                    const newId = parsed.listId || parsed.videoId;
                    const isPlaylist = !!parsed.listId;

                    if (isPlaylist && (ytA.current || ytB.current)) {
                         alert("กำลังประมวลผล Playlist กรุณารอสักครู่...");
                         const helper = ytA.current || ytB.current;
                         helper.loadPlaylist({list: parsed.listId});
                         if (helper.playVideo) helper.playVideo();
                         setTimeout(() => {
                             const playlistArr = helper.getPlaylist ? helper.getPlaylist() : null;
                             if (playlistArr && playlistArr.length > 0) {
                                 const songsToAdd = playlistArr.slice(0, 50).map((vid, index) => ({ id: vid, title: `กำลังโหลดข้อมูล...`, addedBy: currentUser.id, key: Date.now() + index + Math.random() }));
                                 handleAddTrack(songsToAdd.shift());
                                 if (songsToAdd.length > 0) updateDjState({ queue: firebase.firestore.FieldValue.arrayUnion(...songsToAdd) });
                                 alert(`เพิ่มเพลงจาก Playlist จำนวน ${songsToAdd.length + 1} เพลงลงในคิวแล้ว`);

                         }, 3500);
                    } else {
                         handleAddTrack({ id: newId, title: `กำลังโหลดข้อมูล...`, addedBy: currentUser.id, key: Date.now()+Math.random() });

                    <input name="ytUrl" type="url" placeholder="วางลิงก์ YouTube Video หรือ Playlist เพื่อเพิ่มเข้าคิวที่นี่..." className="inp flex-1 text-xs" required />
                    <button type="submit" className="btn-b text-xs font-bold px-6 shadow hover:scale-105">เพิ่มเข้าคิว</button>
                 </form>
               ) : (
                 <div className="bg-blue-900/30 text-blue-200 p-3 rounded-xl border border-blue-800 text-xs text-center font-bold">
                    🎵 คุณกำลังรับชมในฐานะผู้มาเยือน สามารถฟังเพลงร่วมกับสมาคมได้ แต่ไม่สามารถเพิ่มเพลงหรือพิมพ์แชตได้
                 </div>
               )}
               
               <div className="card p-4 h-[500px] flex flex-col shrink-0">

                        <span className="text-amber-400 text-xs">({djState.queue?.length || 0} เพลง)</span>
                    </div>
                    {canManageAudio && djState.queue?.length > 0 && (
                        <button onClick={() => { if(confirm('คุณต้องการลบเพลงในคิวทิ้งทั้งหมดหรือไม่?')) updateDjState({ queue: [] }); }} className="text-[10px] px-2.5 py-1 bg-red-950/80 text-red-400 rounded-lg hover:bg-red-600 hover:text-white transition-colors border border-red-900 shadow">
                           🗑️ ล้างคิว
                        </button>
                    )}
                  </h3>
                  <div className="flex-1 overflow-y-auto pr-2 space-y-2 no-scrollbar">
                    {(!djState.queue || djState.queue.length === 0) ? (

                    ) : (
                      <>
                        {djState.queue.map((q, idx) => (
                        <div key={q.key} className="flex items-center justify-between p-2.5 rounded-xl text-xs bg-[#050811] border border-[#1E3A5F] hover:border-slate-600 transition-colors">

                            <div className="flex flex-col min-w-0">
                              <span className="truncate text-slate-200">{q.title}</span><span className="text-[9px] text-slate-500 font-normal">โดย {getAuthor(q.addedBy).displayName}</span>
                            </div>
                          </div>
                          <div className="flex items-center gap-1.5 shrink-0 ml-2">
                            {canManageAudio && djState.djMode === 'manual' ? (

                                  <button onClick={() => { const nQ = djState.queue.filter(x => x.key !== q.key); updateDjState({ queue: nQ, deckA: q, playA: { isPlaying: true, startedAt: Date.now(), pausedPos: 0 } }); }} className="bg-sky-900/50 hover:bg-sky-600 text-sky-200 px-2 py-1 text-[10px] rounded border border-sky-700 transition">เข้า A</button>
                                  <button onClick={() => { const nQ = djState.queue.filter(x => x.key !== q.key); updateDjState({ queue: nQ, deckB: q, playB: { isPlaying: true, startedAt: Date.now(), pausedPos: 0 } }); }} className="bg-amber-900/50 hover:bg-amber-600 text-amber-200 px-2 py-1 text-[10px] rounded border border-amber-700 transition">เข้า B</button>
                               </div>
                            ) : (
                               idx === 0 && <span className="text-[9px] font-bold bg-emerald-900/50 text-emerald-400 px-2 py-0.5 rounded animate-pulse shrink-0">คิวถัดไป</span>
                            )}
                            {canManageAudio && idx > 0 && <button onClick={() => { const nQ = [...djState.queue]; [nQ[idx-1], nQ[idx]] = [nQ[idx], nQ[idx-1]]; updateDjState({ queue: nQ }); }} className="w-6 h-6 flex items-center justify-center bg-[#0F2547] rounded hover:bg-white hover:text-black">↑</button>}

                            {(canManageAudio || q.addedBy === currentUser?.id) && (
                              <button onClick={() => { const nQ = [...djState.queue]; nQ.splice(idx, 1); updateDjState({ queue: nQ }); }} className="w-6 h-6 flex items-center justify-center bg-red-950/50 text-red-400 rounded hover:bg-red-500 hover:text-white ml-1" title="ลบเพลงนี้">✕</button>
                            )}
                          </div>
                        </div>
                      ))}
                      </>
                    )}
                  </div>
               </div>

            </div>
         </div>
      </div>
      )}

          {/* CHAT VIEW (REVAMPED) */}

            <div className="flex-1 flex overflow-hidden min-h-0 relative">

                            <span className="opacity-70 mr-1.5">{ch.icon}</span> {ch.name}
                        </button>
                        {isModOrAdmin && !ch.isProtected && <button onClick={() => setDelTgt({ roomType: 'channel', id: ch.id, name: '#' + ch.name })} className="text-slate-500 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity px-2"><i className="fas fa-trash-alt"></i></button>}
                      </div>
                    ))}
                  </div>

                  <div className="p-3 border-b border-[#1E3A5F]">
                    <div className="mb-2 flex justify-between items-center">
                        <span className="text-[11px] font-bold uppercase text-slate-400">กลุ่มแชต (Groups)</span>
