            if([a1,b1,c1,a2,b2,c2].some(isNaN)) return setResult({ err: 'กรุณากรอกตัวเลขให้ครบทุกช่อง' });

            const det = a1*b2 - a2*b1;
            const detX = c1*b2 - c2*b1;
            const detY = a1*c2 - a2*c1;

            if (det === 0) {
                if (detX === 0 && detY === 0) return setResult({ err: 'สมการมีคำตอบนับไม่ถ้วน (เส้นทับกัน)', det: 0 });
                return setResult({ err: 'สมการไม่มีคำตอบ (เส้นขนานกัน)', det: 0 });
            }

            const x = detX / det;
            const y = detY / det;
            setResult({ type: '2x2', x, y, det, detX, detY, eq: {a1,b1,c1,a2,b2,c2} });
        };

        const solve3x3 = () => {
            const m = mat.map(row => row.map(v => parseFloat(v)));
            if(m.some(row => row.some(isNaN))) return setResult({ err: 'กรุณากรอกตัวเลขให้ครบทุกช่อง' });

            const getDet3 = (a,b,c, d,e,f, g,h,i) => a*(e*i - f*h) - b*(d*i - f*g) + c*(d*h - e*g);
            
            const det = getDet3(m[0][0], m[0][1], m[0][2], m[1][0], m[1][1], m[1][2], m[2][0], m[2][1], m[2][2]);
            const detX = getDet3(m[0][3], m[0][1], m[0][2], m[1][3], m[1][1], m[1][2], m[2][3], m[2][1], m[2][2]);
            const detY = getDet3(m[0][0], m[0][3], m[0][2], m[1][0], m[1][3], m[1][2], m[2][0], m[2][3], m[2][2]);
            const detZ = getDet3(m[0][0], m[0][1], m[0][3], m[1][0], m[1][1], m[1][3], m[2][0], m[2][1], m[2][3]);

            if (det === 0) return setResult({ err: 'หาค่าไม่ได้ (Determinant = 0)', det: 0 });

            setResult({ type: '3x3', x: detX/det, y: detY/det, z: detZ/det, det, detX, detY, detZ });
        };

        const solveQuad = () => {
            const a=parseFloat(quad.a), b=parseFloat(quad.b), c=parseFloat(quad.c);
            if([a,b,c].some(isNaN)) return setResult({ err: 'กรุณากรอกตัวเลขให้ครบทุกช่อง' });
            if(a === 0) return setResult({ err: 'ค่า a ต้องไม่เป็น 0 (ไม่ใช่สมการกำลังสอง)' });

            const D = b*b - 4*a*c;
            if (D > 0) {
                const x1 = (-b + Math.sqrt(D)) / (2*a);
                const x2 = (-b - Math.sqrt(D)) / (2*a);
                setResult({ type: 'quad', roots: 2, x1, x2, D, a, b, c });
            } else if (D === 0) {
                const x = -b / (2*a);
                setResult({ type: 'quad', roots: 1, x, D, a, b, c });
            } else {
                // แก้ไขกรณี D < 0 ให้รองรับจำนวนจินตภาพ
                const real = (-b / (2*a));
                const img = (Math.sqrt(-D) / (2*Math.abs(a))); 
                setResult({ type: 'quad', roots: 0, real, img, D, a, b, c, isComplex: true });
            }
        };

        const handleSolve = () => {
            if(mode === '2x2') solve2x2();
            else if(mode === '3x3') solve3x3();
            else solveQuad();
        };

        // ฟังก์ชันวาดกราฟสำหรับ 2x2
        const renderGraph2D = (eq) => {
            const getPts = (a,b,c) => {
                if(b===0) return {x1:c/a, y1:-20, x2:c/a, y2:20};
                return {x1:-20, y1:(c-a*-20)/b, x2:20, y2:(c-a*20)/b};
            };
            const l1 = getPts(eq.a1, eq.b1, eq.c1);
            const l2 = getPts(eq.a2, eq.b2, eq.c2);
            
            // Transform (scale & translate) สำหรับ SVG
            const scale = 5;
            const tf = (x, y) => ({ cx: 150 + x*scale, cy: 100 - y*scale });
            const p1A = tf(l1.x1, l1.y1); const p1B = tf(l1.x2, l1.y2);
            const p2A = tf(l2.x1, l2.y1); const p2B = tf(l2.x2, l2.y2);

            return (
                <div className="w-full h-48 bg-[#0a101f] border border-slate-700 rounded-lg relative overflow-hidden mt-4 shadow-inner">
                    <div className="absolute top-2 left-2 text-[9px] font-bold text-slate-500">2D Intersection Graph</div>
                    <svg viewBox="0 0 300 200" className="w-full h-full">
                        {/* Grid */}
                        <line x1="0" y1="100" x2="300" y2="100" stroke="#334155" strokeWidth="1" />
                        <line x1="150" y1="0" x2="150" y2="200" stroke="#334155" strokeWidth="1" />
                        
                        {/* Lines */}
                        <line x1={p1A.cx} y1={p1A.cy} x2={p1B.cx} y2={p1B.cy} stroke="#38BDF8" strokeWidth="2" />
                        <line x1={p2A.cx} y1={p2A.cy} x2={p2B.cx} y2={p2B.cy} stroke="#F472B6" strokeWidth="2" />
                        
                        {/* Intersection Point */}
                        {result.x !== undefined && (
                            <circle cx={150 + result.x*scale} cy={100 - result.y*scale} r="4" fill="#FBBF24" />
                        )}
                    </svg>
                </div>
            );
        };

        return (
          <div className="flex flex-col gap-4 py-2 w-full max-w-2xl mx-auto">
            
            <div className="bg-[#0B1325] p-2 rounded-xl border border-[#1E3A5F] flex gap-1">
                <button onClick={()=>{setMode('2x2'); setResult(null);}} className={`flex-1 py-1.5 text-xs font-bold rounded-lg transition-colors ${mode==='2x2'?'bg-sky-600 text-white':'text-slate-400 hover:bg-[#0F2547]'}`}>2 Variables</button>
                <button onClick={()=>{setMode('3x3'); setResult(null);}} className={`flex-1 py-1.5 text-xs font-bold rounded-lg transition-colors ${mode==='3x3'?'bg-sky-600 text-white':'text-slate-400 hover:bg-[#0F2547]'}`}>3 Variables</button>
                <button onClick={()=>{setMode('quad'); setResult(null);}} className={`flex-1 py-1.5 text-xs font-bold rounded-lg transition-colors ${mode==='quad'?'bg-amber-600 text-white':'text-slate-400 hover:bg-[#0F2547]'}`}>Quadratic</button>
            </div>

            <div className="bg-[#050811] p-4 sm:p-6 rounded-xl border border-[#1E3A5F] w-full shadow-lg">
                {(mode === '2x2' || mode === '3x3') && (
                    <div className="flex justify-end mb-4">
                        <div className="bg-[#0B1325] rounded border border-[#1E3A5F] flex text-[10px] overflow-hidden">
                            <button onClick={()=>setInputFmt('eq')} className={`px-3 py-1 font-bold ${inputFmt==='eq'?'bg-white text-black':'text-slate-400 hover:text-white'}`}>รูปแบบสมการ</button>
                            <button onClick={()=>setInputFmt('matrix')} className={`px-3 py-1 font-bold ${inputFmt==='matrix'?'bg-white text-black':'text-slate-400 hover:text-white'}`}>รูปแบบ Matrix</button>
                        </div>
                    </div>
                )}

                {/* --- INPUT FORMS --- */}
                <div className="flex flex-col gap-3 items-center justify-center min-h-[120px]">
                    {mode === '2x2' && inputFmt === 'eq' && (
                        <div className="space-y-3 font-mono text-sm sm:text-base text-slate-300 w-full max-w-sm">
                            <div className="flex items-center gap-2"><input type="number" value={mat[0][0]} onChange={e=>handleMat(0,0,e.target.value)} className="inp w-16 text-center" placeholder="a1" /> <span>X +</span><input type="number" value={mat[0][1]} onChange={e=>handleMat(0,1,e.target.value)} className="inp w-16 text-center" placeholder="b1" /> <span>Y =</span><input type="number" value={mat[0][2]} onChange={e=>handleMat(0,2,e.target.value)} className="inp w-20 text-center text-sky-200" placeholder="c1" /></div>
                            <div className="flex items-center gap-2"><input type="number" value={mat[1][0]} onChange={e=>handleMat(1,0,e.target.value)} className="inp w-16 text-center" placeholder="a2" /> <span>X +</span><input type="number" value={mat[1][1]} onChange={e=>handleMat(1,1,e.target.value)} className="inp w-16 text-center" placeholder="b2" /> <span>Y =</span><input type="number" value={mat[1][2]} onChange={e=>handleMat(1,2,e.target.value)} className="inp w-20 text-center text-sky-200" placeholder="c2" /></div>
                        </div>
                    )}

                    {mode === '2x2' && inputFmt === 'matrix' && (
                        <div className="flex items-center gap-4 font-mono text-sm">
                            <div className="border-l-2 border-r-2 border-slate-500 rounded-[8px] p-2 grid grid-cols-2 gap-2">
                                <input type="number" value={mat[0][0]} onChange={e=>handleMat(0,0,e.target.value)} className="inp w-14 text-center" /><input type="number" value={mat[0][1]} onChange={e=>handleMat(0,1,e.target.value)} className="inp w-14 text-center" />
                                <input type="number" value={mat[1][0]} onChange={e=>handleMat(1,0,e.target.value)} className="inp w-14 text-center" /><input type="number" value={mat[1][1]} onChange={e=>handleMat(1,1,e.target.value)} className="inp w-14 text-center" />
                            </div>
                            <div className="text-xl">×</div>
                            <div className="border-l-2 border-r-2 border-sky-600 rounded-[8px] p-2 flex flex-col gap-2 bg-sky-950/20 text-sky-300 font-bold"><div>X</div><div>Y</div></div>
                            <div className="text-xl">=</div>
                            <div className="border-l-2 border-r-2 border-emerald-600 rounded-[8px] p-2 flex flex-col gap-2">
                                <input type="number" value={mat[0][2]} onChange={e=>handleMat(0,2,e.target.value)} className="inp w-16 text-center text-emerald-300 border-emerald-900" />
                                <input type="number" value={mat[1][2]} onChange={e=>handleMat(1,2,e.target.value)} className="inp w-16 text-center text-emerald-300 border-emerald-900" />
                            </div>
                        </div>
                    )}

                    {mode === '3x3' && inputFmt === 'eq' && (
                        <div className="space-y-3 font-mono text-xs sm:text-sm text-slate-300 w-full max-w-md">
                            {[0,1,2].map(r => (
                                <div key={r} className="flex items-center justify-center gap-1.5 w-full">
                                    <input type="number" value={mat[r][0]} onChange={e=>handleMat(r,0,e.target.value)} className="inp w-14 sm:w-16 text-center" placeholder="a" /> <span>X +</span>
                                    <input type="number" value={mat[r][1]} onChange={e=>handleMat(r,1,e.target.value)} className="inp w-14 sm:w-16 text-center" placeholder="b" /> <span>Y +</span>
                                    <input type="number" value={mat[r][2]} onChange={e=>handleMat(r,2,e.target.value)} className="inp w-14 sm:w-16 text-center" placeholder="c" /> <span>Z =</span>
                                    <input type="number" value={mat[r][3]} onChange={e=>handleMat(r,3,e.target.value)} className="inp w-16 sm:w-20 text-center text-sky-200" placeholder="d" />
                                </div>
                            ))}
                        </div>
                    )}

                    {mode === '3x3' && inputFmt === 'matrix' && (
                        <div className="flex items-center justify-center gap-2 sm:gap-4 font-mono text-xs sm:text-sm overflow-x-auto w-full no-scrollbar">
                            <div className="border-l-2 border-r-2 border-slate-500 rounded-[8px] p-2 grid grid-cols-3 gap-1 sm:gap-2">
                                {[0,1,2].map(r => [0,1,2].map(c => (
                                    <input key={`${r}${c}`} type="number" value={mat[r][c]} onChange={e=>handleMat(r,c,e.target.value)} className="inp w-12 sm:w-14 text-center px-1" />
                                )))}
                            </div>
                            <div className="text-lg sm:text-xl shrink-0">×</div>
                            <div className="border-l-2 border-r-2 border-sky-600 rounded-[8px] p-2 flex flex-col gap-1 sm:gap-2 bg-sky-950/20 text-sky-300 font-bold shrink-0"><div className="h-7 sm:h-[34px] flex items-center">X</div><div className="h-7 sm:h-[34px] flex items-center">Y</div><div className="h-7 sm:h-[34px] flex items-center">Z</div></div>
                            <div className="text-lg sm:text-xl shrink-0">=</div>
                            <div className="border-l-2 border-r-2 border-emerald-600 rounded-[8px] p-2 flex flex-col gap-1 sm:gap-2 shrink-0">
                                {[0,1,2].map(r => (
                                    <input key={r} type="number" value={mat[r][3]} onChange={e=>handleMat(r,3,e.target.value)} className="inp w-14 sm:w-16 text-center text-emerald-300 border-emerald-900 px-1" />
                                ))}
                            </div>
                        </div>
                    )}

                    {mode === 'quad' && (
                        <div className="flex items-center gap-2 font-mono text-sm sm:text-base text-amber-400 justify-center">
                            <input type="number" value={quad.a} onChange={e=>{setQuad({...quad, a:e.target.value}); setResult(null);}} className="inp w-16 text-center bg-amber-950/20 border-amber-500/50" placeholder="a" /> <span>X² +</span>
                            <input type="number" value={quad.b} onChange={e=>{setQuad({...quad, b:e.target.value}); setResult(null);}} className="inp w-16 text-center bg-amber-950/20 border-amber-500/50" placeholder="b" /> <span>X +</span>
                            <input type="number" value={quad.c} onChange={e=>{setQuad({...quad, c:e.target.value}); setResult(null);}} className="inp w-16 text-center bg-amber-950/20 border-amber-500/50" placeholder="c" /> <span>= 0</span>
                        </div>
                    )}
                </div>

                <div className="mt-6 flex justify-center border-t border-[#1E3A5F] pt-6">
                    <button onClick={handleSolve} className="btn-w py-2.5 px-10 text-sm shadow-[0_0_15px_rgba(255,255,255,0.2)] hover:scale-105 transition-transform">🚀 ประมวลผลสมการ (Solve)</button>
                </div>
            </div>
            
            {/* --- RESULTS --- */}
            {result && (
                <div className="bg-[#0B1325] border border-sky-500/30 rounded-xl p-5 shadow-2xl animate-fade-in relative">
                    <div className="absolute top-0 right-0 px-3 py-1 bg-sky-900/50 text-sky-200 text-[10px] rounded-bl-lg rounded-tr-xl border-l border-b border-sky-500/30 font-bold">SOLUTION</div>
                    
                    {result.err && !result.isComplex ? (
                        <div className="text-red-400 font-bold bg-red-950/50 p-4 rounded text-center border border-red-900/50">{result.err}</div>
                    ) : (
                        <div className="space-y-4">
                            <div className="text-sky-300 font-bold text-sm border-b border-[#1E3A5F] pb-2">🎯 คำตอบ (Final Answers)</div>
                            <div className="flex flex-wrap gap-4 justify-center font-mono text-xl sm:text-2xl font-bold text-white">
                                {result.type === '2x2' && (
                                    <>
                                        <div className="bg-[#050811] px-4 py-2 rounded-lg border border-[#1E3A5F]">X = <span className="text-sky-400">{result.x.toFixed(4)}</span></div>
                                        <div className="bg-[#050811] px-4 py-2 rounded-lg border border-[#1E3A5F]">Y = <span className="text-sky-400">{result.y.toFixed(4)}</span></div>
                                    </>
                                )}
                                {result.type === '3x3' && (
                                    <>
                                        <div className="bg-[#050811] px-4 py-2 rounded-lg border border-[#1E3A5F] text-lg">X = <span className="text-sky-400">{result.x.toFixed(4)}</span></div>
                                        <div className="bg-[#050811] px-4 py-2 rounded-lg border border-[#1E3A5F] text-lg">Y = <span className="text-sky-400">{result.y.toFixed(4)}</span></div>
                                        <div className="bg-[#050811] px-4 py-2 rounded-lg border border-[#1E3A5F] text-lg">Z = <span className="text-sky-400">{result.z.toFixed(4)}</span></div>
                                    </>
                                )}
                                {result.type === 'quad' && result.roots === 2 && (
                                    <>
                                        <div className="bg-[#050811] px-4 py-2 rounded-lg border border-amber-500/30">X₁ = <span className="text-amber-400">{result.x1.toFixed(4)}</span></div>
                                        <div className="bg-[#050811] px-4 py-2 rounded-lg border border-amber-500/30">X₂ = <span className="text-amber-400">{result.x2.toFixed(4)}</span></div>
                                    </>
                                )}
                                {result.type === 'quad' && result.roots === 1 && (
                                    <div className="bg-[#050811] px-4 py-2 rounded-lg border border-amber-500/30">X = <span className="text-amber-400">{result.x.toFixed(4)}</span></div>
                                )}
                                {/* ส่วนแสดงผลแบบ Complex Roots (i) */}
                                {result.type === 'quad' && result.isComplex && (
                                    <>
                                        <div className="bg-[#050811] px-4 py-2 rounded-lg border border-red-500/30 text-lg">X₁ = <span className="text-red-400">{result.real.toFixed(4)} + {result.img.toFixed(4)}i</span></div>
                                        <div className="bg-[#050811] px-4 py-2 rounded-lg border border-red-500/30 text-lg">X₂ = <span className="text-red-400">{result.real.toFixed(4)} - {result.img.toFixed(4)}i</span></div>
                                    </>
                                )}
                            </div>

                            {result.isComplex && (
                                <div className="text-[10px] text-red-300 text-center font-bold">⚠️ ไม่มีคำตอบเป็นจำนวนจริง (Complex Roots)</div>
                            )}

                            <div className="mt-6 pt-4 border-t border-[#1E3A5F] text-xs text-slate-400">
                                <div className="font-bold text-slate-300 mb-2">📝 วิธีทำ (Step-by-Step Cramer's Rule)</div>
                                {(result.type === '2x2' || result.type === '3x3') && (
                                    <div className="grid grid-cols-2 gap-3 font-mono">
                                        <div className="bg-[#050811] p-2 rounded">Δ (Det) = {result.det.toFixed(4)}</div>
                                        <div className="bg-[#050811] p-2 rounded">Δx (Det X) = {result.detX.toFixed(4)}</div>
                                        <div className="bg-[#050811] p-2 rounded">Δy (Det Y) = {result.detY.toFixed(4)}</div>
                                        {result.type === '3x3' && <div className="bg-[#050811] p-2 rounded">Δz (Det Z) = {result.detZ.toFixed(4)}</div>}
                                    </div>
                                )}
                                {result.type === 'quad' && (
                                    <div className="space-y-1.5 font-mono">
                                        <div>Discriminant (D) = b² - 4ac = ({result.b})² - 4({result.a})({result.c})</div>
                                        <div className="text-amber-300">D = {result.D.toFixed(4)}</div>
                                        <div>x = (-b ± √D) / 2a</div>
                                    </div>
                                )}
                            </div>

                            {/* แสดงผลกราฟเฉพาะโหมด 2x2 */}
                            {result.type === '2x2' && renderGraph2D(result.eq)}
                        </div>
                    )}
                </div>
            )}

          </div>
        );
    };

    const ResistorCalcReal = () => {
        const colors = [
          { n: 'Black', v: 0, m: 1, c: '#000', t: '#fff' }, { n: 'Brown', v: 1, m: 10, c: '#8B4513', t: '#fff' },
          { n: 'Red', v: 2, m: 100, c: '#FF0000', t: '#fff' }, { n: 'Orange', v: 3, m: 1000, c: '#FFA500', t: '#000' },
          { n: 'Yellow', v: 4, m: 10000, c: '#FFFF00', t: '#000' }, { n: 'Green', v: 5, m: 100000, c: '#008000', t: '#fff' },
          { n: 'Blue', v: 6, m: 1000000, c: '#0000FF', t: '#fff' }, { n: 'Violet', v: 7, m: 10000000, c: '#EE82EE', t: '#000' },
          { n: 'Gray', v: 8, m: 100000000, c: '#808080', t: '#fff' }, { n: 'White', v: 9, m: 1000000000, c: '#FFFFFF', t: '#000' }
        ];
        const tolColors = [{ n: 'Gold', tol: '5%', c: '#FFD700', t: '#000' }, { n: 'Silver', tol: '10%', c: '#C0C0C0', t: '#000' }];
        const [b1, setB1] = useState(colors[1]); const [b2, setB2] = useState(colors[0]); const [mult, setMult] = useState(colors[2]); const [tol, setTol] = useState(tolColors[0]);

        const formatVal = (v) => {
          if(v >= 1000000) return (v/1000000) + ' MΩ';
          if(v >= 1000) return (v/1000) + ' kΩ';
          return v + ' Ω';
        };
        const val = ((b1.v * 10) + b2.v) * mult.m;

        return (
          <div className="flex flex-col items-center gap-6 py-4 w-full max-w-xl mx-auto">
            <div className="text-3xl font-bold text-amber-400 bg-[#0F2547] p-6 rounded-xl border border-[#1E3A5F] w-full text-center font-mono shadow-inner">{formatVal(val)} ± {tol.tol}</div>
            <div className="relative w-64 h-16 sm:w-80 sm:h-20 flex items-center justify-center my-2">
                <div className="absolute w-full h-2 bg-slate-400 z-0"></div>
                <div className="relative w-40 sm:w-48 h-full bg-[#f4a460] rounded-[30px] border border-amber-800 z-10 flex items-center justify-between px-4 shadow-inner">
                    <div className="w-3 h-full" style={{ backgroundColor: b1.c }}></div><div className="w-3 h-full" style={{ backgroundColor: b2.c }}></div>
                    <div className="w-3 h-full" style={{ backgroundColor: mult.c }}></div><div className="w-1.5 h-full bg-transparent border-l border-amber-800/30 mx-1"></div>
                    <div className="w-3 h-full" style={{ backgroundColor: tol.c }}></div>
                </div>
            </div>
            <div className="flex gap-2 sm:gap-4 w-full overflow-x-auto pb-2">
              <div className="flex flex-col gap-1 flex-1 min-w-[70px]">
                <span className="text-[10px] text-center text-slate-400 font-bold">หลักที่ 1</span>
                {colors.map(c => <button key={'b1'+c.n} onClick={()=>setB1(c)} style={{background: c.c, color: c.t}} className={`py-1 text-[10px] font-bold border rounded-md shadow-sm ${b1.n===c.n?'border-white scale-110 z-10 ring-2 ring-sky-400':'border-transparent'}`}>{c.n}</button>)}
              </div>
              <div className="flex flex-col gap-1 flex-1 min-w-[70px]">
                <span className="text-[10px] text-center text-slate-400 font-bold">หลักที่ 2</span>
                {colors.map(c => <button key={'b2'+c.n} onClick={()=>setB2(c)} style={{background: c.c, color: c.t}} className={`py-1 text-[10px] font-bold border rounded-md shadow-sm ${b2.n===c.n?'border-white scale-110 z-10 ring-2 ring-sky-400':'border-transparent'}`}>{c.n}</button>)}
              </div>
              <div className="flex flex-col gap-1 flex-1 min-w-[70px]">
                <span className="text-[10px] text-center text-slate-400 font-bold">ตัวคูณ</span>
                {colors.map(c => <button key={'m'+c.n} onClick={()=>setMult(c)} style={{background: c.c, color: c.t}} className={`py-1 text-[10px] font-bold border rounded-md shadow-sm ${mult.n===c.n?'border-white scale-110 z-10 ring-2 ring-sky-400':'border-transparent'}`}>{c.n}</button>)}
              </div>
              <div className="flex flex-col gap-1 flex-1 min-w-[70px]">
                <span className="text-[10px] text-center text-slate-400 font-bold">คลาดเคลื่อน</span>
                {tolColors.map(c => <button key={'t'+c.n} onClick={()=>setTol(c)} style={{background: c.c, color: c.t}} className={`py-1 text-[10px] font-bold border rounded-md shadow-sm ${tol.n===c.n?'border-white scale-110 z-10 ring-2 ring-sky-400':'border-transparent'}`}>{c.n}</button>)}
              </div>
            </div>
          </div>
        );
    };
    
    const BeamCalculator = () => {
        const [L, setL] = useState(10);
        const [supports, setSupports] = useState([{ id: 's1', x: 0 }, { id: 's2', x: 10 }]);
        const [pointLoads, setPointLoads] = useState([{ id: 'p1', x: 5, p: 1000 }]);
        const [uniLoads, setUniLoads] = useState([]);
        const [result, setResult] = useState(null);

        // ระบบแก้สมการเชิงเส้น (Gaussian Elimination)
        const solveLinearSystem = (A, B) => {
            let n = A.length;
            for (let i = 0; i < n; i++) {
                let maxEl = Math.abs(A[i][i]), maxRow = i;
                for (let k = i + 1; k < n; k++) { if (Math.abs(A[k][i]) > maxEl) { maxEl = Math.abs(A[k][i]); maxRow = k; } }
                if (maxEl < 1e-10) return null; // Singular Matrix (โครงสร้างไม่สมดุล)
                for (let k = i; k < n; k++) { let tmp = A[maxRow][k]; A[maxRow][k] = A[i][k]; A[i][k] = tmp; }
                let tmp = B[maxRow]; B[maxRow] = B[i]; B[i] = tmp;
                for (let k = i + 1; k < n; k++) {
                    let c = -A[k][i] / A[i][i];
                    for (let j = i; j < n; j++) { if (i === j) A[k][j] = 0; else A[k][j] += c * A[i][j]; }
                    B[k] += c * B[i];
                }
            }
            let x = new Array(n).fill(0);
            for (let i = n - 1; i > -1; i--) {
                x[i] = B[i] / A[i][i];
                for (let k = i - 1; k > -1; k--) B[k] -= A[k][i] * x[i];
            }
            return x;
        };

        // คำนวณปฏิกิริยา (Reactions) ด้วย Macaulay's Method
        const calculateBeam = () => {
            let n = supports.length;
            if (n < 2) return setResult({ error: "⚠️ ต้องการ Support อย่างน้อย 2 จุด เพื่อให้คานมีเสถียรภาพ" });
            
            let A = Array(n + 2).fill(0).map(() => Array(n + 2).fill(0));
            let B = Array(n + 2).fill(0);

            // Eq 1: Sum Fy = 0
            let totalP = pointLoads.reduce((s, p) => s + p.p, 0);
            let totalW = uniLoads.reduce((s, w) => s + w.w * (w.x2 - w.x1), 0);
            for (let i = 0; i < n; i++) A[0][i] = 1;
            B[0] = totalP + totalW;

            // Eq 2: Sum M = 0
            let totalMP = pointLoads.reduce((s, p) => s + p.p * p.x, 0);
            let totalMW = uniLoads.reduce((s, w) => s + w.w * (Math.pow(w.x2, 2) - Math.pow(w.x1, 2)) / 2, 0);
            for (let i = 0; i < n; i++) A[1][i] = supports[i].x;
            B[1] = totalMP + totalMW;

            // Eq 3 to n+2: Deflection at supports = 0
            const mac = (x, a, pow) => x > a ? Math.pow(x - a, pow) : 0;
            for (let k = 0; k < n; k++) {
                let xk = supports[k].x;
                for (let i = 0; i < n; i++) A[k + 2][i] = mac(xk, supports[i].x, 3) / 6;
                A[k + 2][n] = xk; A[k + 2][n + 1] = 1;

                let pTerm = pointLoads.reduce((s, p) => s + p.p * mac(xk, p.x, 3) / 6, 0);
                let wTerm = uniLoads.reduce((s, w) => s + w.w * mac(xk, w.x1, 4) / 24 - w.w * mac(xk, w.x2, 4) / 24, 0);
                B[k + 2] = pTerm + wTerm;
            }

            let X = solveLinearSystem(A, B);
            if (!X) return setResult({ error: "⚠️ โครงสร้างไม่สมดุล (Unstable) หรือตำแหน่ง Support ทับซ้อนกัน" });

            let reacs = supports.map((s, i) => ({ ...s, r: X[i] }));
            
            // สร้างจุดวาดกราฟ SFD, BMD
            const getV = (x) => reacs.reduce((s, r) => s + (x >= r.x ? r.r : 0), 0) - pointLoads.reduce((s, p) => s + (x >= p.x ? p.p : 0), 0) - uniLoads.reduce((s, w) => s + w.w * (x > w.x1 ? (Math.min(x, w.x2) - w.x1) : 0), 0);
            const getM = (x) => reacs.reduce((s, r) => s + (x > r.x ? r.r * (x - r.x) : 0), 0) - pointLoads.reduce((s, p) => s + (x > p.x ? p.p * (x - p.x) : 0), 0) - uniLoads.reduce((s, w) => { if (x <= w.x1) return s; let loadLen = Math.min(x, w.x2) - w.x1; let cgDist = x - (w.x1 + loadLen / 2); return s + (w.w * loadLen) * cgDist; }, 0);

            let critXs = [0, L, ...supports.map(s => s.x), ...pointLoads.map(p => p.x), ...uniLoads.flatMap(w => [w.x1, w.x2])];
            critXs = Array.from(new Set(critXs)).filter(x => x >= 0 && x <= L).sort((a, b) => a - b);
            
            let plotPts = [];
            let maxV = 0, maxM = 0;
            
            critXs.forEach(x => {
                let dx = 0.0001;
                if (x > 0) {
                    let vL = getV(x - dx), mL = getM(x - dx);
                    plotPts.push({ x, v: vL, m: mL });
                    if(Math.abs(vL) > maxV) maxV = Math.abs(vL); if(Math.abs(mL) > maxM) maxM = Math.abs(mL);
                }
                if (x < L || x === L) {
                    let vR = getV(x + dx), mR = getM(x + dx);
                    plotPts.push({ x, v: vR, m: mR });
                    if(Math.abs(vR) > maxV) maxV = Math.abs(vR); if(Math.abs(mR) > maxM) maxM = Math.abs(mR);
                }
            });

            setResult({ reacs, plotPts, maxV, maxM });
        };

        useEffect(() => { calculateBeam(); }, [L, supports, pointLoads, uniLoads]);

        const downloadReport = () => {
            if(!result || result.error) return alert('ไม่สามารถสร้าง Report ได้ กรุณาตรวจสอบข้อมูล');
            let content = `=== THE BLUE MOON ASSOCIATION : STRUCTURAL ANALYSIS REPORT ===\n`;
            content += `Date: ${new Date().toLocaleString('th-TH')}\n`;
            content += `Beam Length: ${L} m\n\n`;
            content += `[ SUPPORTS & REACTIONS ]\n`;
            result.reacs.forEach((r, i) => content += `Support ${i+1} at x = ${r.x} m : Reaction = ${r.r.toFixed(2)} kg\n`);
            content += `\n[ MAX INTERNAL FORCES ]\n`;
            content += `Max Shear Force (V_max): ${result.maxV.toFixed(2)} kg\n`;
            content += `Max Bending Moment (M_max): ${result.maxM.toFixed(2)} kg-m\n\n`;
            content += `=== END OF REPORT ===\n`;

            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `BMA_Beam_Report_${Date.now()}.txt`;
            a.click(); URL.revokeObjectURL(url);
        };

        // Helpers สำหรับวาดกราฟิก
        const svgW = 600, svgH = 150;
        const scaleX = (x) => (x / L) * (svgW - 40) + 20;

        return (
            <div className="flex flex-col gap-4 py-2 w-full max-w-3xl mx-auto">
                {/* 1. INPUT SECTION */}
                <div className="bg-[#0B1325] p-4 sm:p-6 rounded-xl border border-[#1E3A5F] shadow-inner space-y-5 text-xs">
                    <div className="flex justify-between items-center border-b border-[#1E3A5F] pb-3">
                        <label className="text-sky-400 font-bold text-sm">📏 ความยาวคานรวม (L)</label>
                        <div className="flex items-center gap-2"><input type="number" min="1" step="0.1" value={L} onChange={e=>setL(parseFloat(e.target.value)||1)} className="w-24 inp font-mono text-center" /> <span className="text-slate-400">เมตร</span></div>
                    </div>

                    <div className="space-y-2">
                        <div className="flex justify-between items-center"><label className="text-emerald-400 font-bold">🔼 จุดรองรับ (Supports)</label><button onClick={()=>setSupports([...supports, {id:'s'+Date.now(), x: L/2}])} className="btn-b py-1 px-3 text-[10px]">+ เพิ่ม Support</button></div>
                        {supports.map((s, i) => (
                            <div key={s.id} className="flex items-center gap-2 bg-[#050811] p-2 rounded-lg border border-[#1E3A5F]">
                                <span className="text-slate-400 w-16">จุดที่ {i+1} : x =</span><input type="number" min="0" max={L} step="0.1" value={s.x} onChange={e=>{let n=[...supports]; n[i].x=parseFloat(e.target.value)||0; setSupports(n);}} className="flex-1 inp font-mono py-1" />
                                <button onClick={()=>setSupports(supports.filter(x=>x.id!==s.id))} className="text-red-400 font-bold px-2">✕</button>
                            </div>
                        ))}
                    </div>

                    <div className="space-y-2">
                        <div className="flex justify-between items-center"><label className="text-amber-400 font-bold">⬇️ แรงกระทำแบบจุด (Point Loads)</label><button onClick={()=>setPointLoads([...pointLoads, {id:'p'+Date.now(), x: L/2, p: 1000}])} className="btn-b py-1 px-3 text-[10px]">+ เพิ่ม Point Load</button></div>
                        {pointLoads.map((p, i) => (
                            <div key={p.id} className="flex items-center gap-2 bg-[#050811] p-2 rounded-lg border border-[#1E3A5F]">
                                <span className="text-slate-400">x =</span><input type="number" min="0" max={L} step="0.1" value={p.x} onChange={e=>{let n=[...pointLoads]; n[i].x=parseFloat(e.target.value)||0; setPointLoads(n);}} className="w-16 inp font-mono py-1 px-1" />
                                <span className="text-slate-400 pl-2">P =</span><input type="number" step="10" value={p.p} onChange={e=>{let n=[...pointLoads]; n[i].p=parseFloat(e.target.value)||0; setPointLoads(n);}} className="flex-1 inp font-mono py-1" />
                                <button onClick={()=>setPointLoads(pointLoads.filter(x=>x.id!==p.id))} className="text-red-400 font-bold px-2">✕</button>
                            </div>
                        ))}
                    </div>

                    <div className="space-y-2">
                        <div className="flex justify-between items-center"><label className="text-fuchsia-400 font-bold">⏬ แรงกระทำแบบแผ่ (Uniform Loads)</label><button onClick={()=>setUniLoads([...uniLoads, {id:'u'+Date.now(), x1: 0, x2: L, w: 500}])} className="btn-b py-1 px-3 text-[10px]">+ เพิ่ม Uniform Load</button></div>
                        {uniLoads.map((u, i) => (
                            <div key={u.id} className="flex items-center gap-2 bg-[#050811] p-2 rounded-lg border border-[#1E3A5F]">
                                <span className="text-slate-400">เริ่ม x =</span><input type="number" min="0" max={L} step="0.1" value={u.x1} onChange={e=>{let n=[...uniLoads]; n[i].x1=parseFloat(e.target.value)||0; setUniLoads(n);}} className="w-14 inp font-mono py-1 px-1" />
                                <span className="text-slate-400">จบ x =</span><input type="number" min="0" max={L} step="0.1" value={u.x2} onChange={e=>{let n=[...uniLoads]; n[i].x2=parseFloat(e.target.value)||0; setUniLoads(n);}} className="w-14 inp font-mono py-1 px-1" />
                                <span className="text-slate-400 pl-2">w =</span><input type="number" step="10" value={u.w} onChange={e=>{let n=[...uniLoads]; n[i].w=parseFloat(e.target.value)||0; setUniLoads(n);}} className="flex-1 inp font-mono py-1" />
                                <button onClick={()=>setUniLoads(uniLoads.filter(x=>x.id!==u.id))} className="text-red-400 font-bold px-2">✕</button>
                            </div>
                        ))}
                    </div>
                </div>

                {/* 2. RESULTS & DIAGRAMS */}
                <div className="bg-[#050811] border border-[#1E3A5F] rounded-xl p-4 sm:p-6 shadow-2xl space-y-6">
                    {result?.error ? (
                        <div className="text-red-400 font-bold bg-red-950/50 p-4 rounded-xl border border-red-900/50 w-full text-center">{result.error}</div>
                    ) : result && (
                        <>
                            <div className="flex justify-between items-center">
                                <div className="text-sky-300 font-bold text-sm">📊 แผนภาพและผลลัพธ์ (Diagrams)</div>
                                <button onClick={downloadReport} className="btn-w py-1.5 text-[10px] flex items-center gap-1.5 shadow-lg hover:scale-105">📥 โหลด Report (.txt)</button>
                            </div>

                            {/* FBD (Free Body Diagram) */}
                            <div className="w-full bg-[#0a101f] border border-slate-700 rounded-xl p-2 relative overflow-x-auto no-scrollbar">
                                <div className="text-[10px] text-slate-500 absolute top-2 left-4 font-bold">Free Body Diagram (FBD)</div>
                                <svg viewBox={`0 0 ${svgW} 120`} className="w-full min-w-[500px] h-auto">
                                    <line x1={scaleX(0)} y1="60" x2={scaleX(L)} y2="60" stroke="#60A5FA" strokeWidth="8" strokeLinecap="round" />
                                    {/* Uniform Loads */}
                                    {uniLoads.map(u => (
                                        <g key={u.id}>
                                            <rect x={scaleX(u.x1)} y="30" width={scaleX(u.x2) - scaleX(u.x1)} height="26" fill="#d946ef" opacity="0.3" />
                                            <text x={scaleX(u.x1 + (u.x2-u.x1)/2)} y="25" fill="#d946ef" fontSize="10" textAnchor="middle" fontWeight="bold">{u.w} kg/m</text>
                                        </g>
                                    ))}
                                    {/* Supports & Reactions */}
                                    {result.reacs.map((r, i) => (
                                        <g key={i}>
                                            <polygon points={`${scaleX(r.x)},64 ${scaleX(r.x)-8},80 ${scaleX(r.x)+8},80`} fill="#34D399" />
                                            <line x1={scaleX(r.x)} y1="80" x2={scaleX(r.x)} y2="105" stroke="#34D399" strokeWidth="2" markerEnd="url(#arrowUp)" />
                                            <text x={scaleX(r.x)} y="115" fill="#34D399" fontSize="10" textAnchor="middle" fontWeight="bold">R{i+1}={r.r.toFixed(1)}</text>
                                        </g>
                                    ))}
                                    {/* Point Loads */}
                                    {pointLoads.map((p, i) => (
                                        <g key={i}>
                                            <line x1={scaleX(p.x)} y1="15" x2={scaleX(p.x)} y2="55" stroke="#FBBF24" strokeWidth="2" markerEnd="url(#arrowDown)" />
                                            <text x={scaleX(p.x)} y="10" fill="#FBBF24" fontSize="10" textAnchor="middle" fontWeight="bold">{p.p} kg</text>
                                        </g>
                                    ))}
                                    <defs>
                                        <marker id="arrowDown" markerWidth="6" markerHeight="6" refX="3" refY="6" orient="auto"><path d="M0,0 L6,0 L3,6 Z" fill="#FBBF24" /></marker>
                                        <marker id="arrowUp" markerWidth="6" markerHeight="6" refX="3" refY="0" orient="auto"><path d="M0,6 L6,6 L3,0 Z" fill="#34D399" /></marker>
                                    </defs>
                                </svg>
                            </div>

                            {/* SFD */}
                            <div className="w-full bg-[#0a101f] border border-slate-700 rounded-xl p-2 relative overflow-x-auto no-scrollbar">
                                <div className="text-[10px] text-red-400 absolute top-2 left-4 font-bold">Shear Force Diagram (SFD)</div>
                                <div className="text-[10px] text-slate-400 absolute top-2 right-4 font-mono">V_max = {result.maxV.toFixed(2)} kg</div>
                                <svg viewBox={`0 0 ${svgW} ${svgH}`} className="w-full min-w-[500px] h-auto">
                                    <line x1={scaleX(0)} y1={svgH/2} x2={scaleX(L)} y2={svgH/2} stroke="#475569" strokeWidth="1" />
                                    <polyline points={result.plotPts.map(p => `${scaleX(p.x)},${svgH/2 - (p.v / (result.maxV||1)) * 50}`).join(' ')} fill="none" stroke="#F87171" strokeWidth="2" />
                                    <polygon points={`${scaleX(0)},${svgH/2} ${result.plotPts.map(p => `${scaleX(p.x)},${svgH/2 - (p.v / (result.maxV||1)) * 50}`).join(' ')} ${scaleX(L)},${svgH/2}`} fill="#F87171" opacity="0.2" />
                                </svg>
                            </div>

                            {/* BMD */}
                            <div className="w-full bg-[#0a101f] border border-slate-700 rounded-xl p-2 relative overflow-x-auto no-scrollbar">
                                <div className="text-[10px] text-sky-400 absolute top-2 left-4 font-bold">Bending Moment Diagram (BMD)</div>
                                <div className="text-[10px] text-slate-400 absolute top-2 right-4 font-mono">M_max = {result.maxM.toFixed(2)} kg-m</div>
                                <svg viewBox={`0 0 ${svgW} ${svgH}`} className="w-full min-w-[500px] h-auto">
                                    <line x1={scaleX(0)} y1={svgH/2} x2={scaleX(L)} y2={svgH/2} stroke="#475569" strokeWidth="1" />
                                    {/* BMD วาดลงล่าง (Positive Moment = Tension at bottom) ตามมาตรฐานโยธา */}
                                    <polyline points={result.plotPts.map(p => `${scaleX(p.x)},${svgH/2 + (p.m / (result.maxM||1)) * 50}`).join(' ')} fill="none" stroke="#38BDF8" strokeWidth="2" />
                                    <polygon points={`${scaleX(0)},${svgH/2} ${result.plotPts.map(p => `${scaleX(p.x)},${svgH/2 + (p.m / (result.maxM||1)) * 50}`).join(' ')} ${scaleX(L)},${svgH/2}`} fill="#38BDF8" opacity="0.2" />
                                </svg>
                            </div>
                        </>
                    )}
                </div>
            </div>
        );
    };

    const RCBeamDesign = () => {
        const [fc, setFc] = useState(240); // ksc
        const [fy, setFy] = useState(4000); // ksc (SD40)
        const [b, setB] = useState(20); // cm
        const [d, setD] = useState(40); // cm
        const [Mu, setMu] = useState(3000); // kg-m
        
        // คำนวณ (วิธี USD)
        const Mu_kgcm = Mu * 100;
        const Rn = Mu_kgcm / (0.9 * b * d * d);
        let rho = 0, As = 0, warning = '';
        
        const rootTerm = 1 - (2 * Rn) / (0.85 * fc);
        if (rootTerm < 0) {
            warning = '⚠️ หน้าตัดคานเล็กเกินไป (ต้องเสริมเหล็กรับแรงอัด หรือเพิ่มขนาดคาน)';
            rho = 0;
        } else {
            rho = (0.85 * fc / fy) * (1 - Math.sqrt(rootTerm));
            As = rho * b * d;
        }
        
        const As_min = (14 / fy) * b * d;
        const finalAs = Math.max(As, As_min);
        
        return (
            <div className="flex flex-col gap-4 py-2 w-full max-w-2xl mx-auto">
                <div className="grid grid-cols-2 sm:grid-cols-5 gap-2">
                    <div className="col-span-2 sm:col-span-1"><label className="text-[10px] text-slate-400 font-bold">fc' (ksc)</label><input type="number" value={fc} onChange={e=>setFc(e.target.value)} className="w-full inp text-sm font-mono" /></div>
                    <div className="col-span-2 sm:col-span-1"><label className="text-[10px] text-slate-400 font-bold">fy (ksc)</label><input type="number" value={fy} onChange={e=>setFy(e.target.value)} className="w-full inp text-sm font-mono" /></div>
                    <div className="col-span-1"><label className="text-[10px] text-slate-400 font-bold">b (cm)</label><input type="number" value={b} onChange={e=>setB(e.target.value)} className="w-full inp text-sm font-mono" /></div>
                    <div className="col-span-1"><label className="text-[10px] text-slate-400 font-bold">d (cm)</label><input type="number" value={d} onChange={e=>setD(e.target.value)} className="w-full inp text-sm font-mono" /></div>
                    <div className="col-span-2 sm:col-span-1"><label className="text-[10px] text-sky-400 font-bold">Mu (kg-m)</label><input type="number" value={Mu} onChange={e=>setMu(e.target.value)} className="w-full inp text-sm font-mono border-sky-500/50 bg-sky-950/20" /></div>
                </div>

                <div className="flex flex-col sm:flex-row gap-4 items-center bg-[#0B1325] p-5 rounded-xl border border-[#1E3A5F] shadow-lg">
                    {/* SVG Cross-section */}
                    <div className="w-32 h-40 bg-[#050811] border-2 border-slate-600 rounded flex flex-col items-center justify-end p-2 relative shrink-0">
                        <div className="absolute top-1/2 left-[-25px] -translate-y-1/2 text-[10px] text-slate-400 rotate-270 font-mono">d={d}</div>
                        <div className="absolute -bottom-5 left-1/2 -translate-x-1/2 text-[10px] text-slate-400 font-mono">b={b}</div>
                        
                        {/* ปลอกคาน */}
                        <div className="w-[85%] h-[90%] border border-amber-500/50 rounded-sm absolute top-[5%] flex items-end justify-center pb-1">
                            {/* เหล็กแกน */}
                            <div className="flex gap-1.5 justify-center w-full">
                                <div className={`w-3 h-3 rounded-full ${warning ? 'bg-red-500' : 'bg-amber-400'}`}></div>
                                <div className={`w-3 h-3 rounded-full ${warning ? 'bg-red-500' : 'bg-amber-400'}`}></div>
                                <div className={`w-3 h-3 rounded-full ${warning ? 'bg-red-500' : 'bg-amber-400'}`}></div>
                            </div>
                        </div>
                    </div>
                    
                    <div className="flex-1 w-full space-y-3 pl-0 sm:pl-4 border-l-0 sm:border-l border-[#1E3A5F]">
                        {warning ? (
                            <div className="text-red-400 font-bold text-sm bg-red-950/50 p-3 rounded border border-red-900/50 animate-pulse">{warning}</div>
                        ) : (
                            <>
                                <div>
                                    <div className="text-xs text-slate-400">เนื้อที่เหล็กเสริมที่ต้องการ (As req)</div>
                                    <div className="text-2xl font-mono font-bold text-emerald-400">{As.toFixed(2)} <span className="text-sm text-slate-500">cm²</span></div>
                                </div>
                                <div className="grid grid-cols-2 gap-2 text-xs pt-2 border-t border-[#1E3A5F]">
                                    <div><span className="text-slate-400">As min:</span> <span className="font-mono text-amber-200">{As_min.toFixed(2)} cm²</span></div>
                                    <div><span className="text-slate-400">อัตราส่วน (ρ):</span> <span className="font-mono text-amber-200">{rho.toFixed(5)}</span></div>
                                </div>
                                <div className="text-[10px] text-sky-300 font-bold bg-sky-950/30 p-2 rounded border border-sky-900/50">
                                    ✅ ควรใช้เหล็ก: As = {finalAs.toFixed(2)} cm²
                                </div>
                            </>
                        )}
                    </div>
                </div>
            </div>
        );
    };

    const SteelSectionViewer = () => {
        // 1. ฐานข้อมูลเหล็ก (Mockup Database)
        const DB = {
            'H-Beam': [
                { id: 'h1', name: 'H 100x100x6x8', d: 100, bf: 100, tw: 6, tf: 8, w: 17.2, a: 21.9, ix: 383, iy: 134, sx: 76.5, sy: 26.7 },
                { id: 'h2', name: 'H 125x125x6.5x9', d: 125, bf: 125, tw: 6.5, tf: 9, w: 23.8, a: 30.3, ix: 847, iy: 293, sx: 136, sy: 46.9 },
                { id: 'h3', name: 'H 150x150x7x10', d: 150, bf: 150, tw: 7, tf: 10, w: 31.5, a: 40.1, ix: 1640, iy: 563, sx: 219, sy: 75.1 },
                { id: 'h4', name: 'H 200x200x8x12', d: 200, bf: 200, tw: 8, tf: 12, w: 49.9, a: 63.5, ix: 4720, iy: 1600, sx: 472, sy: 160 },
                { id: 'h5', name: 'H 250x250x9x14', d: 250, bf: 250, tw: 9, tf: 14, w: 72.4, a: 92.2, ix: 10800, iy: 3650, sx: 867, sy: 292 }
            ],
            'C-Channel': [
                { id: 'c1', name: 'C 100x50x5x7.5', d: 100, bf: 50, tw: 5, tf: 7.5, w: 9.36, a: 11.9, ix: 188, iy: 26, sx: 37.6, sy: 7.5 },
                { id: 'c2', name: 'C 150x75x6.5x10', d: 150, bf: 75, tw: 6.5, tf: 10, w: 18.6, a: 23.7, ix: 861, iy: 117, sx: 115, sy: 22.4 }
            ],
            'Angle': [
                { id: 'a1', name: 'L 50x50x4', d: 50, bf: 50, tw: 4, tf: 4, w: 3.06, a: 3.89, ix: 9.16, iy: 9.16, sx: 2.56, sy: 2.56 },
                { id: 'a2', name: 'L 100x100x10', d: 100, bf: 100, tw: 10, tf: 10, w: 14.9, a: 19.0, ix: 175, iy: 175, sx: 24.5, sy: 24.5 }
            ],
            'Rebar': [
                { id: 'rb6', name: 'RB6 (Round Bar)', d: 6, bf: 6, tw: 6, tf: 6, w: 0.222, a: 0.283, ix: 0, iy: 0, sx: 0, sy: 0 },
                { id: 'rb9', name: 'RB9 (Round Bar)', d: 9, bf: 9, tw: 9, tf: 9, w: 0.499, a: 0.636, ix: 0, iy: 0, sx: 0, sy: 0 },
                { id: 'db12', name: 'DB12 (Deformed Bar)', d: 12, bf: 12, tw: 12, tf: 12, w: 0.888, a: 1.13, ix: 0, iy: 0, sx: 0, sy: 0 },
                { id: 'db16', name: 'DB16 (Deformed Bar)', d: 16, bf: 16, tw: 16, tf: 16, w: 1.58, a: 2.01, ix: 0, iy: 0, sx: 0, sy: 0 },
                { id: 'db20', name: 'DB20 (Deformed Bar)', d: 20, bf: 20, tw: 20, tf: 20, w: 2.47, a: 3.14, ix: 0, iy: 0, sx: 0, sy: 0 },
                { id: 'db25', name: 'DB25 (Deformed Bar)', d: 25, bf: 25, tw: 25, tf: 25, w: 3.85, a: 4.91, ix: 0, iy: 0, sx: 0, sy: 0 }
            ]
        };

        const [tab, setTab] = useState('browse'); // browse, reverse, compare, builtup

        // States for Browse & Estimate
        const [cat, setCat] = useState('H-Beam');
        const [secId, setSecId] = useState('h1');
        const [len, setLen] = useState(6);
        const [qty, setQty] = useState(1);
        const [price, setPrice] = useState(25); // บาท/กก.

        // States for Reverse Finder
        const [targetProp, setTargetProp] = useState('sx'); // sx, a, ix
        const [targetVal, setTargetVal] = useState(200);

        // States for Compare
        const [cmp1, setCmp1] = useState('h1');
        const [cmp2, setCmp2] = useState('h3');

        // States for Built-up
        const [buBase, setBuBase] = useState('h4');
        const [plW, setPlW] = useState(200); // mm
        const [plT, setPlT] = useState(10); // mm

        // Helpers
        const getAllSecs = () => Object.values(DB).flat();
        const getSec = (id) => getAllSecs().find(s => s.id === id) || DB['H-Beam'][0];
        const selSec = getSec(secId);

        // Render SVG Diagram based on category
        const renderSVG = (sec, category) => {
            if (!sec) return null;
            const w = 120, h = 120;
            const maxDim = Math.max(sec.d, sec.bf);
            const scale = 100 / maxDim;
            const drawD = sec.d * scale;
            const drawB = sec.bf * scale;
            const drawTw = Math.max(4, sec.tw * scale);
            const drawTf = Math.max(4, sec.tf * scale);

            if (category === 'Rebar') {
                const isDeformed = sec.name.includes('DB');
                return (
                    <svg viewBox={`0 0 ${w} ${h}`} className="w-32 h-32 drop-shadow-[0_0_8px_rgba(56,189,248,0.5)]">
                        <circle cx={w/2} cy={h/2} r={drawD/2} fill="#0F2547" stroke="#38BDF8" strokeWidth="3" />
                        {isDeformed && (
                            <>
                                <line x1={w/2 - drawD/2} y1={h/2 - drawD/2} x2={w/2 + drawD/2} y2={h/2 + drawD/2} stroke="#38BDF8" strokeWidth="2" opacity="0.5" />
                                <line x1={w/2 - drawD/2} y1={h/2 + drawD/2} x2={w/2 + drawD/2} y2={h/2 - drawD/2} stroke="#38BDF8" strokeWidth="2" opacity="0.5" />
                            </>
                        )}
                        <text x={w/2} y={h/2 + 3} fill="#fff" fontSize="10" textAnchor="middle" fontWeight="bold">⌀{sec.d}</text>
                    </svg>
                );
            }

            return (
                <svg viewBox={`0 0 ${w} ${h}`} className="w-32 h-32 drop-shadow-[0_0_8px_rgba(56,189,248,0.5)]">
                    <g transform={`translate(${(w-drawB)/2}, ${(h-drawD)/2})`}>
                        {category === 'H-Beam' && (
                            <path d={`M 0 0 H ${drawB} V ${drawTf} H ${(drawB+drawTw)/2} V ${drawD-drawTf} H ${drawB} V ${drawD} H 0 V ${drawD-drawTf} H ${(drawB-drawTw)/2} V ${drawTf} H 0 Z`} fill="#38BDF8" />
                        )}
                        {category === 'C-Channel' && (
                            <path d={`M 0 0 H ${drawB} V ${drawTf} H ${drawTw} V ${drawD-drawTf} H ${drawB} V ${drawD} H 0 Z`} fill="#38BDF8" />
                        )}
                        {category === 'Angle' && (
                            <path d={`M 0 0 H ${drawTw} V ${drawD-drawTf} H ${drawB} V ${drawD} H 0 Z`} fill="#38BDF8" />
                        )}
                    </g>
                    {/* Dimension Lines */}
                    <line x1="5" y1={(h-drawD)/2} x2="5" y2={(h+drawD)/2} stroke="#94A3B8" strokeWidth="1" markerEnd="url(#arrow)" markerStart="url(#arrow)" />
                    <text x="8" y={h/2 + 3} fill="#94A3B8" fontSize="8" fontWeight="bold">d={sec.d}</text>
                    <line x1={(w-drawB)/2} y1="5" x2={(w+drawB)/2} y2="5" stroke="#94A3B8" strokeWidth="1" markerEnd="url(#arrow)" markerStart="url(#arrow)" />
                    <text x={w/2} y="14" fill="#94A3B8" fontSize="8" textAnchor="middle" fontWeight="bold">bf={sec.bf}</text>
                    
                    <defs><marker id="arrow" markerWidth="4" markerHeight="4" refX="2" refY="2" orient="auto"><circle cx="2" cy="2" r="2" fill="#94A3B8" /></marker></defs>
                </svg>
            );
        };

        return (
            <div className="flex flex-col gap-4 py-2 w-full max-w-3xl mx-auto text-xs">
                {/* TABS */}
                <div className="flex bg-[#0B1325] p-1.5 rounded-xl border border-[#1E3A5F] overflow-x-auto no-scrollbar font-bold">
                    <button onClick={()=>setTab('browse')} className={`px-4 py-2 rounded-lg whitespace-nowrap ${tab==='browse'?'bg-sky-600 text-white shadow-md':'text-slate-400 hover:text-white'}`}>🔍 เปิดตาราง & ประเมินราคา</button>
                    <button onClick={()=>setTab('reverse')} className={`px-4 py-2 rounded-lg whitespace-nowrap ${tab==='reverse'?'bg-amber-600 text-white shadow-md':'text-slate-400 hover:text-white'}`}>🔄 ค้นหากลับ (Reverse)</button>
                    <button onClick={()=>setTab('compare')} className={`px-4 py-2 rounded-lg whitespace-nowrap ${tab==='compare'?'bg-emerald-600 text-white shadow-md':'text-slate-400 hover:text-white'}`}>⚖️ เปรียบเทียบหน้าตัด</button>
                    <button onClick={()=>setTab('builtup')} className={`px-4 py-2 rounded-lg whitespace-nowrap ${tab==='builtup'?'bg-fuchsia-600 text-white shadow-md':'text-slate-400 hover:text-white'}`}>🛠️ Built-up Section</button>
                </div>

                {/* TAB 1: BROWSE & ESTIMATE */}
                {tab === 'browse' && (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="bg-[#0B1325] p-4 rounded-xl border border-[#1E3A5F] shadow-lg flex flex-col gap-3">
                            <div>
                                <label className="text-sky-400 font-bold mb-1 block">ประเภท (Category)</label>
                                <select value={cat} onChange={e=>{setCat(e.target.value); setSecId(DB[e.target.value][0].id);}} className="w-full inp bg-[#050811] font-bold">
                                    {Object.keys(DB).map(k => <option key={k} value={k}>{k}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="text-sky-400 font-bold mb-1 block">ขนาด (Section Size)</label>
                                <select value={secId} onChange={e=>setSecId(e.target.value)} className="w-full inp bg-[#050811] font-mono">
                                    {DB[cat].map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                                </select>
                            </div>
                            <div className="flex items-center justify-center py-4 border-y border-[#1E3A5F] bg-[#050811] rounded-lg mt-2">
                                {renderSVG(selSec, cat)}
                            </div>
                            <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                                <div className="bg-[#050811] p-2 rounded border border-[#1E3A5F]"><div className="text-slate-400 text-[10px]">Weight (W)</div><div className="font-bold text-emerald-400 font-mono">{selSec.w} <span className="text-[9px] text-slate-500">kg/m</span></div></div>
                                <div className="bg-[#050811] p-2 rounded border border-[#1E3A5F]"><div className="text-slate-400 text-[10px]">Area (A)</div><div className="font-bold text-white font-mono">{selSec.a} <span className="text-[9px] text-slate-500">cm²</span></div></div>
                                <div className="bg-[#050811] p-2 rounded border border-[#1E3A5F]"><div className="text-slate-400 text-[10px]">Inertia (Ix)</div><div className="font-bold text-white font-mono">{selSec.ix} <span className="text-[9px] text-slate-500">cm⁴</span></div></div>
                                <div className="bg-[#050811] p-2 rounded border border-[#1E3A5F]"><div className="text-slate-400 text-[10px]">Inertia (Iy)</div><div className="font-bold text-white font-mono">{selSec.iy} <span className="text-[9px] text-slate-500">cm⁴</span></div></div>
                                <div className="bg-[#050811] p-2 rounded border border-[#1E3A5F]"><div className="text-slate-400 text-[10px]">Sec Mod (Sx)</div><div className="font-bold text-white font-mono">{selSec.sx} <span className="text-[9px] text-slate-500">cm³</span></div></div>
                                <div className="bg-[#050811] p-2 rounded border border-[#1E3A5F]"><div className="text-slate-400 text-[10px]">Sec Mod (Sy)</div><div className="font-bold text-white font-mono">{selSec.sy} <span className="text-[9px] text-slate-500">cm³</span></div></div>
                            </div>
                        </div>

                        <div className="bg-gradient-to-br from-[#050811] to-[#0B1325] p-5 rounded-xl border border-emerald-900/50 shadow-lg flex flex-col gap-4">
                            <div className="text-emerald-400 font-bold uppercase tracking-widest border-b border-[#1E3A5F] pb-2">💰 ประเมินน้ำหนักและราคา (Cost Estimator)</div>
                            <div className="flex items-center gap-3">
                                <label className="w-24 text-slate-400 font-bold">ความยาว/ท่อน</label>
                                <div className="flex-1 flex gap-2 items-center"><input type="number" min="0" step="0.5" value={len} onChange={e=>setLen(parseFloat(e.target.value)||0)} className="w-full inp font-mono" /><span>ม.</span></div>
                            </div>
                            <div className="flex items-center gap-3">
                                <label className="w-24 text-slate-400 font-bold">จำนวนที่ใช้</label>
                                <div className="flex-1 flex gap-2 items-center"><input type="number" min="1" step="1" value={qty} onChange={e=>setQty(parseInt(e.target.value)||0)} className="w-full inp font-mono" /><span>ท่อน</span></div>
                            </div>
                            <div className="flex items-center gap-3">
                                <label className="w-24 text-amber-400 font-bold">ราคาเหล็ก/กก.</label>
                                <div className="flex-1 flex gap-2 items-center"><input type="number" min="0" step="1" value={price} onChange={e=>setPrice(parseFloat(e.target.value)||0)} className="w-full inp font-mono border-amber-900/50 bg-amber-950/20" /><span>บาท</span></div>
                            </div>
                            
                            <div className="mt-auto pt-4 space-y-2">
                                <div className="flex justify-between p-3 bg-[#0a101f] rounded-lg border border-slate-700">
                                    <span className="text-slate-400">น้ำหนักรวม (Total Weight)</span>
                                    <span className="font-bold text-lg font-mono text-emerald-300">{(selSec.w * len * qty).toLocaleString()} <span className="text-[10px]">kg</span></span>
                                </div>
                                <div className="flex justify-between p-3 bg-emerald-950/30 rounded-lg border border-emerald-900/50">
                                    <span className="text-emerald-400 font-bold">ราคาประเมิน (Est. Cost)</span>
                                    <span className="font-bold text-2xl font-mono text-emerald-400">{(selSec.w * len * qty * price).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2})} <span className="text-xs">฿</span></span>
                                </div>
                            </div>
                        </div>
                    </div>
                )}

                {/* TAB 2: REVERSE FINDER */}
                {tab === 'reverse' && (() => {
                    // Filter and sort sections
                    const propKey = targetProp;
                    const matches = getAllSecs()
                        .filter(s => s[propKey] >= targetVal && s[propKey] > 0)
                        .sort((a, b) => a.w - b.w) // เรียงตามน้ำหนัก (ราคาถูกสุดขึ้นก่อน)
                        .slice(0, 10);

                    return (
                        <div className="bg-[#0B1325] p-5 rounded-xl border border-amber-500/50 shadow-lg">
                            <div className="flex flex-col sm:flex-row gap-4 items-end border-b border-[#1E3A5F] pb-4 mb-4">
                                <div className="flex-1 w-full">
                                    <label className="text-amber-400 font-bold mb-1 block">ค้นหาจากคุณสมบัติ (Property)</label>
                                    <select value={targetProp} onChange={e=>setTargetProp(e.target.value)} className="w-full inp bg-[#050811] font-bold">
                                        <option value="sx">Section Modulus (Sx) อย่างน้อย...</option>
                                        <option value="a">เนื้อที่หน้าตัด (Area) อย่างน้อย...</option>
                                        <option value="ix">Moment of Inertia (Ix) อย่างน้อย...</option>
                                    </select>
                                </div>
                                <div className="flex-1 w-full">
                                    <label className="text-amber-400 font-bold mb-1 block">ค่าที่ต้องการ (Target Value)</label>
                                    <input type="number" value={targetVal} onChange={e=>setTargetVal(parseFloat(e.target.value)||0)} className="w-full inp font-mono text-amber-200 text-lg py-1.5" />
                                </div>
                            </div>
                            
                            <div className="text-xs font-bold text-slate-300 mb-2">💡 รายชื่อเหล็กที่ผ่านเกณฑ์ (เรียงจากเบาที่สุด/ประหยัดสุด)</div>
                            <div className="space-y-2 overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="bg-[#050811] text-sky-400 border-b border-[#1E3A5F]">
                                            <th className="p-2 whitespace-nowrap">Section Name</th>
                                            <th className="p-2">W (kg/m)</th>
                                            <th className="p-2">Area (cm²)</th>
                                            <th className="p-2">Ix (cm⁴)</th>
                                            <th className="p-2">Sx (cm³)</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {matches.length === 0 ? <tr><td colSpan="5" className="p-4 text-center text-slate-500">ไม่พบเหล็กที่ตรงตามเงื่อนไข</td></tr> : null}
                                        {matches.map((s, i) => (
                                            <tr key={s.id} className={`border-b border-[#1E3A5F] hover:bg-[#0F2547] font-mono ${i===0?'bg-emerald-950/20':''}`}>
                                                <td className="p-2 font-sans font-bold flex items-center gap-2">
                                                    {i===0 && <span className="text-[10px] bg-emerald-600 text-white px-1.5 py-0.5 rounded">เบาสุด</span>} {s.name}
                                                </td>
                                                <td className={`p-2 ${i===0?'text-emerald-400 font-bold':'text-slate-300'}`}>{s.w}</td>
                                                <td className={`p-2 ${targetProp==='a'?'text-amber-300 font-bold':'text-slate-300'}`}>{s.a}</td>
                                                <td className={`p-2 ${targetProp==='ix'?'text-amber-300 font-bold':'text-slate-300'}`}>{s.ix}</td>
                                                <td className={`p-2 ${targetProp==='sx'?'text-amber-300 font-bold':'text-slate-300'}`}>{s.sx}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    );
                })()}

                {/* TAB 3: COMPARE */}
                {tab === 'compare' && (() => {
                    const s1 = getSec(cmp1);
                    const s2 = getSec(cmp2);
                    return (
                        <div className="bg-[#0B1325] p-5 rounded-xl border border-emerald-500/50 shadow-lg">
                            <div className="grid grid-cols-2 gap-4 mb-4">
                                <div>
                                    <label className="text-emerald-400 font-bold mb-1 block">Section 1</label>
                                    <select value={cmp1} onChange={e=>setCmp1(e.target.value)} className="w-full inp bg-[#050811] font-mono text-[10px] sm:text-xs">
                                        {getAllSecs().map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="text-sky-400 font-bold mb-1 block">Section 2</label>
                                    <select value={cmp2} onChange={e=>setCmp2(e.target.value)} className="w-full inp bg-[#050811] font-mono text-[10px] sm:text-xs">
                                        {getAllSecs().map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                                    </select>
                                </div>
                            </div>
                            <div className="grid grid-cols-3 text-center border-t border-[#1E3A5F] pt-4 font-mono">
                                <div className="font-bold text-slate-400 text-[10px] sm:text-xs space-y-3">
                                    <div className="h-6">Property</div><div className="h-6">W (kg/m)</div><div className="h-6">Area (cm²)</div>
                                    <div className="h-6">Ix (cm⁴)</div><div className="h-6">Iy (cm⁴)</div><div className="h-6">Sx (cm³)</div><div className="h-6">Sy (cm³)</div>
                                </div>
                                <div className="font-bold text-emerald-300 space-y-3">
                                    <div className="h-6 font-sans text-emerald-400 bg-emerald-950/50 rounded line-clamp-1">{s1.name}</div>
                                    <div className="h-6">{s1.w}</div><div className="h-6">{s1.a}</div><div className="h-6">{s1.ix}</div>
                                    <div className="h-6">{s1.iy}</div><div className="h-6">{s1.sx}</div><div className="h-6">{s1.sy}</div>
                                </div>
                                <div className="font-bold text-sky-300 space-y-3 border-l border-[#1E3A5F]">
                                    <div className="h-6 font-sans text-sky-400 bg-sky-950/50 rounded line-clamp-1">{s2.name}</div>
                                    <div className="h-6 flex justify-center items-center gap-1">{s2.w} {s2.w > s1.w ? <span className="text-red-400 text-[9px]">▲</span> : s2.w < s1.w ? <span className="text-emerald-400 text-[9px]">▼</span> : ''}</div>
                                    <div className="h-6 flex justify-center items-center gap-1">{s2.a} {s2.a > s1.a ? <span className="text-emerald-400 text-[9px]">▲</span> : s2.a < s1.a ? <span className="text-red-400 text-[9px]">▼</span> : ''}</div>
                                    <div className="h-6 flex justify-center items-center gap-1">{s2.ix} {s2.ix > s1.ix ? <span className="text-emerald-400 text-[9px]">▲</span> : s2.ix < s1.ix ? <span className="text-red-400 text-[9px]">▼</span> : ''}</div>
                                    <div className="h-6">{s2.iy}</div>
                                    <div className="h-6 flex justify-center items-center gap-1">{s2.sx} {s2.sx > s1.sx ? <span className="text-emerald-400 text-[9px]">▲</span> : s2.sx < s1.sx ? <span className="text-red-400 text-[9px]">▼</span> : ''}</div>
                                    <div className="h-6">{s2.sy}</div>
                                </div>
                            </div>
                        </div>
                    );
                })()}

                {/* TAB 4: BUILT-UP SECTION */}
                {tab === 'builtup' && (() => {
                    const base = DB['H-Beam'].find(s => s.id === buBase) || DB['H-Beam'][0];
                    // การคำนวณ Built-up Section (ประกบแผ่นบน-ล่าง)
                    // แปลง mm เป็น cm สำหรับแผ่นเพลท
                    const ptCm = plT / 10; const pwCm = plW / 10;
                    const plArea = pwCm * ptCm;
                    const plWgt = plArea * 100 * 0.00785; // kg/m (สมมติ density เหล็ก 7850 kg/m3)
                    
                    const newW = base.w + (plWgt * 2);
                    const newA = base.a + (plArea * 2);
                    
                    // Ix_new = Ix_base + 2 * (I_plate + A_plate * d^2)
                    const I_plate_x = (pwCm * Math.pow(ptCm, 3)) / 12;
                    const d_cg = (base.d / 10) / 2 + (ptCm / 2); // ระยะจากแกน x ถึง cg ของ plate (cm)
                    const newIx = base.ix + 2 * (I_plate_x + plArea * Math.pow(d_cg, 2));
                    
                    // Iy_new = Iy_base + 2 * (I_plate_y)
                    const I_plate_y = (ptCm * Math.pow(pwCm, 3)) / 12;
                    const newIy = base.iy + 2 * I_plate_y;
                    
                    // Sx_new = Ix_new / (d_base/2 + t_plate)
                    const c_new = (base.d / 10) / 2 + ptCm;
                    const newSx = newIx / c_new;

                    return (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div className="bg-[#0B1325] p-4 rounded-xl border border-fuchsia-500/50 shadow-lg space-y-4">
                                <div className="text-fuchsia-400 font-bold uppercase tracking-widest border-b border-[#1E3A5F] pb-2">H-Beam + Cover Plates</div>
                                <div>
                                    <label className="text-slate-400 font-bold mb-1 block">เหล็กแกนหลัก (Base H-Beam)</label>
                                    <select value={buBase} onChange={e=>setBuBase(e.target.value)} className="w-full inp bg-[#050811] font-mono">
                                        {DB['H-Beam'].map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                                    </select>
                                </div>
                                <div className="grid grid-cols-2 gap-3 bg-[#050811] p-3 rounded-lg border border-[#1E3A5F]">
                                    <div className="col-span-2 text-[10px] text-fuchsia-300 font-bold">ขนาดแผ่นประกบ บน-ล่าง (Cover Plate)</div>
                                    <div>
                                        <label className="text-slate-400 text-[10px]">ความกว้าง (Width, mm)</label>
                                        <input type="number" step="10" value={plW} onChange={e=>setPlW(parseFloat(e.target.value)||0)} className="w-full inp font-mono mt-1" />
                                    </div>
                                    <div>
                                        <label className="text-slate-400 text-[10px]">ความหนา (Thk, mm)</label>
                                        <input type="number" step="1" value={plT} onChange={e=>setPlT(parseFloat(e.target.value)||0)} className="w-full inp font-mono mt-1" />
                                    </div>
                                </div>
                                <div className="text-center pt-2">
                                    {/* Built-up SVG */}
                                    <svg viewBox="0 0 100 100" className="w-32 h-32 mx-auto drop-shadow-[0_0_10px_rgba(217,70,239,0.4)]">
                                        {/* Base H-Beam */}
                                        <path d="M 25 20 H 75 V 28 H 54 V 72 H 75 V 80 H 25 V 72 H 46 V 28 H 25 Z" fill="#38BDF8" opacity="0.6" />
                                        {/* Top/Bottom Plates */}
                                        <rect x="15" y="10" width="70" height="10" fill="#d946ef" />
                                        <rect x="15" y="80" width="70" height="10" fill="#d946ef" />
                                    </svg>
                                </div>
                            </div>

                            <div className="bg-gradient-to-br from-[#050811] to-[#1a0f2e] p-5 rounded-xl border border-fuchsia-900/50 shadow-lg flex flex-col gap-3">
                                <div className="text-fuchsia-400 font-bold mb-2">คุณสมบัติหน้าตัดใหม่ (New Properties)</div>
                                <div className="space-y-2 font-mono text-sm">
                                    <div className="flex justify-between bg-[#0B1325] p-2.5 rounded border border-[#1E3A5F]">
                                        <span className="text-slate-400">Total W</span><span className="font-bold text-emerald-400">{newW.toFixed(2)} <span className="text-[10px]">kg/m</span></span>
                                    </div>
                                    <div className="flex justify-between bg-[#0B1325] p-2.5 rounded border border-[#1E3A5F]">
                                        <span className="text-slate-400">Total Area</span><span className="font-bold text-white">{newA.toFixed(2)} <span className="text-[10px]">cm²</span></span>
                                    </div>
                                    <div className="flex justify-between bg-fuchsia-950/30 p-2.5 rounded border border-fuchsia-900/50">
                                        <span className="text-fuchsia-300">New Ix</span>
                                        <span className="font-bold text-white">{newIx.toFixed(2)} <span className="text-red-400 text-[10px]">(+{(((newIx-base.ix)/base.ix)*100).toFixed(0)}%)</span></span>
                                    </div>
                                    <div className="flex justify-between bg-fuchsia-950/30 p-2.5 rounded border border-fuchsia-900/50">
                                        <span className="text-fuchsia-300">New Iy</span>
                                        <span className="font-bold text-white">{newIy.toFixed(2)}</span>
                                    </div>
                                    <div className="flex justify-between bg-sky-950/30 p-2.5 rounded border border-sky-900/50">
                                        <span className="text-sky-300">New Sx</span>
                                        <span className="font-bold text-white">{newSx.toFixed(2)} <span className="text-red-400 text-[10px]">(+{(((newSx-base.sx)/base.sx)*100).toFixed(0)}%)</span></span>
                                    </div>
                                </div>
                                <div className="text-[9px] text-slate-500 mt-auto leading-relaxed text-center">
                                    * คำนวณด้วย Parallel Axis Theorem<br/>* ค่า Ix และ Sx ที่เพิ่มขึ้น % เทียบกับ H-Beam เดิม
                                </div>
                            </div>
                        </div>
                    );
                })()}
            </div>
        );
    };

    const ConcreteCalculator = () => {
        const [w, setW] = useState(5); // กว้าง
        const [l, setL] = useState(5); // ยาว
        const [t, setT] = useState(0.1); // หนา
        const [sf, setSf] = useState(10); // Safety Factor %

        // สภาพแวดล้อมและเงื่อนไขมวลรวม (Mix Design Conditions)
        const [env, setEnv] = useState('normal'); // normal, marine
        const [sandMoist, setSandMoist] = useState(2.0); // % ความชื้นทราย
        const [sandAbsorp, setSandAbsorp] = useState(1.0); // % ดูดซึมน้ำทราย
        const [stoneMoist, setStoneMoist] = useState(1.0); // % ความชื้นหิน
        const [stoneAbsorp, setStoneAbsorp] = useState(0.5); // % ดูดซึมน้ำหิน

        // คำนวณปริมาตร
        const baseVol = w * l * t;
        const totalVol = baseVol * (1 + (sf / 100));

        // ประเมินสัดส่วนวัสดุ (สำหรับคอนกรีตผสมเสร็จหน้างาน สัดส่วน 1:2:4 โครงสร้างทั่วไป)
        // อ้างอิงน้ำหนักแห้งต่อ 1 คิว: ปูน 320kg (6.4 ถุง), ทราย ~830kg (0.52 คิว), หิน ~1600kg (1.04 คิว), น้ำ 180 ลิตร
        const cementType = env === 'marine' 
            ? 'ปูนซีเมนต์ประเภท 2 หรือ 5 (ทนซัลเฟต/สัมผัสน้ำทะเล)' 
            : 'ปูนซีเมนต์ประเภท 1 (งานโครงสร้างทั่วไป)';

        // การปรับแก้ปริมาณน้ำ (Water Adjustment) จากความชื้นมวลรวม
        const sandFreeWater = ((sandMoist - sandAbsorp) / 100) * 830; // ลิตร(หรือ kg)
        const stoneFreeWater = ((stoneMoist - stoneAbsorp) / 100) * 1600; 
        
        const adjWaterPerCube = 180 - sandFreeWater - stoneFreeWater; // น้ำสุทธิที่ต้องเติมเพิ่ม

        const cementBags = Math.ceil(totalVol * 6.4);
        const sand = (totalVol * 0.52).toFixed(2);
