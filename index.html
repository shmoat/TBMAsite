    @keyframes orbit-cw {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }
    @keyframes orbit-ccw {
      from { transform: translate(-50%, -50%) rotate(360deg); }
      to { transform: translate(-50%, -50%) rotate(0deg); }
    }
    @keyframes counter-rotate-cw {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(-360deg); }
    }
    @keyframes counter-rotate-ccw {
      from { transform: translate(-50%, -50%) rotate(-360deg); }
      to { transform: translate(-50%, -50%) rotate(0deg); }
    }
    .orbit-ring-1 { animation: orbit-cw 38s linear infinite; }
    .orbit-ring-2 { animation: orbit-ccw 55s linear infinite; }
    .orbit-ring-3 { animation: orbit-cw 75s linear infinite; }
    .counter-ring-1 { animation: counter-rotate-cw 38s linear infinite; }
    .counter-ring-2 { animation: counter-rotate-ccw 55s linear infinite; }
    .counter-ring-3 { animation: counter-rotate-cw 75s linear infinite; }
    .orbit-system:hover .orbit-ring-1,

    .orbit-system:hover .counter-ring-1,

    // ฟังก์ชันดึงค่าเวลาจาก Server Timestamp ของ Firebase (แก้ปัญหาเวลาเครื่องผู้ใช้ไม่ตรงกัน)
    function getOrderMillis(docData) {
      if (!docData) return 0;
      if (docData.serverCreatedAt && typeof docData.serverCreatedAt.toMillis === 'function') {
        return docData.serverCreatedAt.toMillis();
      }
      if (docData.serverCreatedAt && docData.serverCreatedAt.seconds) {
        return docData.serverCreatedAt.seconds * 1000;
      }
      return docData.timestamp || 0;
    }

    function getDisplayTime(docData) {
      if (!docData) return '';
      if (docData.serverCreatedAt && typeof docData.serverCreatedAt.toDate === 'function') {
        return docData.serverCreatedAt.toDate().toLocaleTimeString('th-TH', {
          hour: '2-digit',
          minute: '2-digit'
        });
      }
      return docData.time || '';
    }

    function getUserTags(user) {
      if (!user) return ['Others'];
      if (Array.isArray(user.memberTags) && user.memberTags.length > 0) return user.memberTags;
      if (user.memberTag) return [user.memberTag];
      return ['Others'];
    }

    function getSocialIcon(platform) {
      const found = SOCIAL_PLATFORMS.find((p) => p.id === platform);
      return found ? found.icon : '🔗';
    }

    function formatSafeUrl(url) {
      if (!url) return '#';
      const trimmed = url.trim();
      if (trimmed.startsWith('http://') || trimmed.startsWith('https://')) return trimmed;
      return 'https://' + trimmed;
    }

    function Avatar({ user, size = 'md', showStatus = false, className = '' }) {
      const sizeMap = {
        xs: 'w-6 h-6 text-[10px]',
        sm: 'w-8 h-8 text-xs',
        md: 'w-11 h-11 text-xs',
        lg: 'w-16 h-16 text-base',
        xl: 'w-20 h-20 text-lg'
      };
      const sc = sizeMap[size] || sizeMap.md;
      const isOnline = user && user.isOnline;

      return (
        <div className={'relative inline-flex shrink-0 ' + className}>
          {user && user.avatarUrl ? (
            <img
              src={user.avatarUrl}
              alt={user.displayName || 'Avatar'}
              className={sc + ' rounded-full object-cover border-2 border-white/40 bg-[#0F2547] shrink-0'}
            />
          ) : (
            <div className={sc + ' rounded-full bg-[#0F2547] border-2 border-white/30 flex items-center justify-center font-mono font-bold text-white shrink-0'}>
              {user && user.displayName ? user.displayName.charAt(0).toUpperCase() : '#'}

            />
          )}
        </div>
      );
    }

    function RoleBadge({ role }) {

      );

    function FormattedMessageText({ text, currentUser, isEdited }) {
      if (!text) return null;
      const regex = /(@\[[^\]]+\]|@[a-zA-Z0-9_&-]+)/g;
      const parts = text.split(regex);
      const myTags = currentUser ? getUserTags(currentUser) : [];

      return (
        <p className="text-sm text-slate-100 mt-1.5 whitespace-pre-line leading-relaxed break-words">
          {parts.map((part, idx) => {
            if (!part.startsWith('@')) return <span key={idx}>{part}</span>;

            const lower = part.toLowerCase();
            let highlightMe = false;
            if (currentUser) {
              const isGlobalTag = lower === '@everyone' || (lower === '@here' && currentUser.isOnline);
              const isMyCat = myTags.some((t) => part === '@[' + t + ']' || lower === '@' + t.toLowerCase());
              const isDirectMe =
                lower === '@' + String(currentUser.id).toLowerCase() ||
                (currentUser.username && lower === '@' + currentUser.username.toLowerCase());
              highlightMe = isGlobalTag || isMyCat || isDirectMe;
            }

            return (
              <span
                key={idx}
                className={
                  highlightMe
                    ? 'inline-block px-1.5 py-0.5 mx-0.5 rounded bg-amber-400 text-[#050811] font-mono text-xs font-bold shadow'
                    : 'inline-block px-1.5 py-0.5 mx-0.5 rounded bg-[#0F2547] border border-blue-400/50 text-blue-200 font-mono text-xs font-semibold'
                }
              >
                {part}
              </span>
            );
          })}
          {isEdited && (
            <span className="ml-2 text-[10px] italic text-slate-400 select-none">(แก้ไขแล้ว)</span>
          )}
        </p>
      );
    }

      const [deleteConfirmTarget, setDeleteConfirmTarget] = useState(null);

      // Notification Center States
      const [isNotifModalOpen, setIsNotifModalOpen] = useState(false);
      const [notifTab, setNotifTab] = useState('posts');
      const [toastList, setToastList] = useState([]);
      const [browserPushPermission, setBrowserPushPermission] = useState(
        typeof Notification !== 'undefined' ? Notification.permission : 'default'

      const prevNotifCountRef = useRef(0);
      const chatContainerRef = useRef(null);

      useEffect(() => {
        const closeMenu = () => setContextMenu(null);
        window.addEventListener('click', closeMenu);
        return () => window.removeEventListener('click', closeMenu);
      }, []);

      // ============================================================================
      // 1. REALTIME SYNC กับ FIREBASE FIRESTORE (เรียงด้วย Server Timestamp)
      // ============================================================================
      useEffect(() => {
        if (!db) return;

        const unsubUsers = db.collection('bma_users').onSnapshot(
          async (snapshot) => {
            setDbErrorBanner('');
            if (snapshot.empty) {
              try {
                await db.collection('bma_users').doc(INITIAL_OWNER_SEED.id).set(INITIAL_OWNER_SEED);
              } catch (e) {}
            } else {
              const allDocs = snapshot.docs.map((doc) => doc.data());
              const loadedUsers = allDocs.filter(
                (u) => u.id !== 'BMA-000' && u.password !== 'bma-root-password' && u.password !== 'moon-8842'
              );

              if (!loadedUsers.some((u) => u.id === 'M000')) {
                try {
                  await db.collection('bma_users').doc(INITIAL_OWNER_SEED.id).set(INITIAL_OWNER_SEED);
                } catch (e) {}
                return;
              }

              loadedUsers.sort((a, b) => String(a.id).localeCompare(String(b.id)));
              setUsers(loadedUsers);

              const maxNum = loadedUsers.reduce((max, u) => {
                const m = String(u.id).match(/^M(\d+)$/i);
                if (m) {
                  const num = parseInt(m[1], 10);
                  return num > max ? num : max;
                }
                return max;
              }, 0);
              setNewMemberId('M' + String(maxNum + 1).padStart(3, '0'));
            }
          },
          (err) => {
            setDbErrorBanner('แจ้งเตือน Firebase (' + err.code + '): กรุณาตรวจสอบว่าอัปเดต Firestore Rules เรียบร้อยแล้ว');
          }
        );

        const unsubPosts = db.collection('bma_posts').onSnapshot(
          (snapshot) => {
            const loadedPosts = snapshot.docs.map((doc) => doc.data());
            loadedPosts.sort((a, b) => getOrderMillis(b) - getOrderMillis(a));
            setPosts(loadedPosts);
          },
          (err) => console.error(err)
        );

        const unsubChannels = db.collection('bma_channels').onSnapshot(
          async (snapshot) => {
            if (snapshot.empty) {
              try {
                for (const ch of DEFAULT_GLOBAL_CHANNELS) {
                  await db.collection('bma_channels').doc(ch.id).set(ch);
                }
              } catch (e) {}
            } else {
              const loadedCh = snapshot.docs.map((d) => d.data());
              const hasLobby = loadedCh.some((c) => c.id === 'global-lobby');
              const hasAnnounce = loadedCh.some((c) => c.id === 'global-announce');
              if (!hasLobby) await db.collection('bma_channels').doc('global-lobby').set(DEFAULT_GLOBAL_CHANNELS[0]);
              if (!hasAnnounce) await db.collection('bma_channels').doc('global-announce').set(DEFAULT_GLOBAL_CHANNELS[1]);
              loadedCh.sort((a, b) => getOrderMillis(a) - getOrderMillis(b));
              setChannels(loadedCh);
            }
          },
          (err) => console.error(err)
        );

        const unsubGroups = db.collection('bma_groups').onSnapshot(
          (snapshot) => {
            const loadedGrp = snapshot.docs.map((d) => d.data());
            loadedGrp.sort((a, b) => getOrderMillis(b) - getOrderMillis(a));
            setGroups(loadedGrp);
          },
          (err) => console.error(err)
        );

        // เรียงข้อความแชตตามเวลาเซิร์ฟเวอร์ (getOrderMillis) เพื่อแก้ปัญหาเวลาเครื่องผู้ใช้ไม่ตรงกัน
        const unsubMessages = db.collection('bma_messages').onSnapshot(
          (snapshot) => {
            const loadedMsgs = snapshot.docs.map((d) => d.data());
            loadedMsgs.sort((a, b) => {
              const diff = getOrderMillis(a) - getOrderMillis(b);
              if (diff !== 0) return diff;
              return String(a.id).localeCompare(String(b.id));
            });
            setChatMessages(loadedMsgs);
          },
          (err) => console.error(err)
        );

        const unsubTyping = db.collection('bma_typing').onSnapshot(
          (snapshot) => {
            const activeTypers = snapshot.docs
              .map((d) => d.data())
              .filter((t) => t.isTyping);
            setTypingStatuses(activeTypers);
          },
          () => {}
        );

        const unsubNotifs = db.collection('bma_notifications').onSnapshot(
          (snapshot) => {
            const loadedNotifs = snapshot.docs.map((d) => d.data());
            loadedNotifs.sort((a, b) => getOrderMillis(b) - getOrderMillis(a));
            setNotifications(loadedNotifs);
          },
          () => {}
        );

        return () => {
          unsubUsers();
          unsubPosts();
          unsubChannels();
          unsubGroups();
          unsubMessages();
          unsubTyping();
          unsubNotifs();
        };
      }, []);

      // ตรวจสอบการล็อกอินค้างไว้ (Remember Me Session) โดยไม่บังคับเปลี่ยนหน้า currentView
      useEffect(() => {
        if (!currentUser && users.length > 0) {
          const savedId =
            localStorage.getItem('tbma_saved_user_id') ||
            sessionStorage.getItem('tbma_session_user_id');
          if (savedId) {
            const found = users.find((u) => u.id === savedId && u.isActivated);
            if (found) {
              setCurrentUser(found);
              if (db && !found.isOnline) {
                db.collection('bma_users').doc(found.id).update({ isOnline: true }).catch(() => {});
              }
            }
          }
        } else if (currentUser && users.length > 0) {
          const latestMe = users.find((u) => u.id === currentUser.id);
          if (latestMe) setCurrentUser(latestMe);
        }
      }, [users]);

      const getDmRoomKey = (id1, id2) => {
        const sorted = [id1, id2].sort();
        return 'dm_' + sorted[0] + '_' + sorted[1];
      };

      const currentRoomKey =
        currentUser && activeRoom.type === 'dm'
          ? getDmRoomKey(currentUser.id, activeRoom.id)
          : activeRoom.id;

      // อัปเดตสถานะ "อ่านแล้ว" อัตโนมัติเมื่อเปิดห้องแชต
      useEffect(() => {
        if (!currentUser || !db || currentView !== 'chat') return;
        const unreadInRoom = chatMessages.filter(
          (m) =>
            m.roomKey === currentRoomKey &&
            m.senderId !== currentUser.id &&
            !(m.readBy || []).includes(currentUser.id)
        );
        unreadInRoom.forEach((m) => {
          const nextReadBy = Array.from(new Set([...(m.readBy || []), currentUser.id]));
          db.collection('bma_messages').doc(m.id).update({ readBy: nextReadBy }).catch(() => {});
        });
      }, [chatMessages, currentRoomKey, currentView, currentUser]);

      // เลื่อนกล่องข้อความลงล่างสุดเฉพาะเวลาเปลี่ยนห้องแชต หรือมีข้อความใหม่เข้ามา
      const currentRoomMessages = chatMessages.filter((m) => m.roomKey === currentRoomKey);
      useEffect(() => {
        if (currentView === 'chat' && chatContainerRef.current) {
          chatContainerRef.current.scrollTop = chatContainerRef.current.scrollHeight;
        }
      }, [currentRoomKey, currentView, currentRoomMessages.length]);

      // ============================================================================
      // ระบบการแจ้งเตือน
      // ============================================================================
      const isNotificationMutedForMe = (notif) => {
        if (!currentUser) return true;
        const prefs = currentUser.notifPrefs || {};
        if (notif.category === 'posts') {
          if (prefs.muteOwnPosts && notif.subType !== 'new_post') return true;
          if (notif.targetPostId) {
            const p = posts.find((item) => item.id === notif.targetPostId);
            if (p && (p.mutedBy || []).includes(currentUser.id)) return true;
          }
        }
        if (notif.category === 'messages') {
          if (notif.subType === 'global_chat' && prefs.muteGlobalChat) return true;
          if ((notif.subType === 'group_chat' || notif.subType === 'dm_chat' || notif.subType === 'nudge') && prefs.mutePrivateChat) {
            return true;
          }
        }
        return false;
      };

      const myNotifications = currentUser
        ? notifications.filter(
            (n) =>
              (n.recipientId === currentUser.id || (n.recipientId === 'ALL' && n.actorId !== currentUser.id)) &&
              !isNotificationMutedForMe(n)
          )
        : [];

      const myUnreadNotifs = myNotifications.filter(
        (n) => !(n.readBy || []).includes(currentUser.id)
      );

      useEffect(() => {
        if (!currentUser) return;
        if (myUnreadNotifs.length > prevNotifCountRef.current && prevNotifCountRef.current !== 0) {
          const latest = myUnreadNotifs[0];
          if (latest) {
            try {
              const ctx = new (window.AudioContext || window.webkitAudioContext)();
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(587.33, ctx.currentTime);
              osc.frequency.setValueAtTime(880, ctx.currentTime + 0.08);
              gain.gain.setValueAtTime(0.06, ctx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start();
              osc.stop(ctx.currentTime + 0.25);
            } catch (e) {}

            setToastList((prev) => [latest, ...prev.slice(0, 2)]);
            setTimeout(() => {
              setToastList((prev) => prev.filter((t) => t.id !== latest.id));
            }, 4500);

            if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
              try {
                new Notification(latest.title || 'The Blue Moon Association', {
                  body: latest.body || ''
                });
              } catch (e) {}
            }
          }
        }
        prevNotifCountRef.current = myUnreadNotifs.length;
      }, [myUnreadNotifs.length, currentUser]);

      const requestDeviceNotificationPermission = async () => {
        if (typeof Notification === 'undefined') {
          alert('เบราว์เซอร์หรืออุปกรณ์ของคุณไม่รองรับ Web Notification API');
          return;
        }
        const perm = await Notification.requestPermission();
        setBrowserPushPermission(perm);
        if (perm === 'granted') {
          try {
            new Notification('The Blue Moon Association', {
              body: 'เปิดรับการแจ้งเตือนไปยังเดสก์ท็อปและอุปกรณ์เคลื่อนที่เรียบร้อยแล้ว!'
            });
          } catch (e) {}
        }
      };

      const dispatchNotification = async ({
        recipientId,
        actorId,
        category,
        subType,
        title,
        body,
        targetView,
        targetPostId,
        targetRoomType,
        targetRoomId
      }) => {

        const notifId = 'notif-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
        const notifObj = {
          id: notifId,
          recipientId,
          actorId,
          category,
          subType,

          targetRoomType: targetRoomType || null,

          readBy: [],

          serverCreatedAt: firebase.firestore.FieldValue.serverTimestamp()
        };
        try {
          await db.collection('bma_notifications').doc(notifId).set(notifObj);
        } catch (e) {}

      const handleMarkAllNotificationsRead = async () => {
        if (!currentUser || !db) return;
        const targetList = myUnreadNotifs.filter((n) =>
          notifTab === 'posts' ? n.category === 'posts' : notifTab === 'messages' ? n.category === 'messages' : true
        );
        for (const n of targetList) {

          await db.collection('bma_notifications').doc(n.id).update({ readBy: nextReadBy }).catch(() => {});
        }
      };

      const handleClickNotificationItem = async (notif) => {
        if (!currentUser) return;
        if (db && !(notif.readBy || []).includes(currentUser.id)) {
          const nextReadBy = Array.from(new Set([...(notif.readBy || []), currentUser.id]));
          db.collection('bma_notifications').doc(notif.id).update({ readBy: nextReadBy }).catch(() => {});

        setIsNotifModalOpen(false);
        if (notif.targetPostId) {

          setCurrentView('chat');
        } else if (notif.targetView) {
          setCurrentView(notif.targetView);
        }
      };

      const handleToggleNotifPref = async (prefKey) => {
        if (!currentUser || !db) return;
        const currentPrefs = currentUser.notifPrefs || {
          muteOwnPosts: false,
          muteGlobalChat: false,
          mutePrivateChat: false
        };
        const updatedPrefs = {
          ...currentPrefs,

        await db.collection('bma_users').doc(currentUser.id).update({ notifPrefs: updatedPrefs });

      const handleToggleMuteSpecificPost = async (post) => {
        if (!currentUser || !db) return;
        const mutedBy = post.mutedBy || [];
        const nextMuted = mutedBy.includes(currentUser.id)
          ? mutedBy.filter((id) => id !== currentUser.id)
          : [...mutedBy, currentUser.id];
        await db.collection('bma_posts').doc(post.id).update({ mutedBy: nextMuted });
      };

      // ============================================================================
      // 2. ระบบเข้าสู่ระบบ & เปิดใช้งาน ID
      // ============================================================================
      const saveLoginSession = (userObj, keepLoggedIn) => {
        if (keepLoggedIn) {
          localStorage.setItem('tbma_saved_user_id', userObj.id);
          sessionStorage.removeItem('tbma_session_user_id');
        } else {
          sessionStorage.setItem('tbma_session_user_id', userObj.id);
          localStorage.removeItem('tbma_saved_user_id');
        }
      };

      const handleLogout = async () => {
        if (currentUser && db) {
          try {
            await db.collection('bma_users').doc(currentUser.id).update({ isOnline: false });
          } catch (e) {}
        }
        localStorage.removeItem('tbma_saved_user_id');
        sessionStorage.removeItem('tbma_session_user_id');
        setCurrentUser(null);
        setCurrentView('home');
      };

      const handleSignIn = async (e) => {
        e.preventDefault();
        setAuthError('');
        const found = users.find(
          (u) =>
            u.isActivated &&
            u.username &&
            u.username.toLowerCase() === loginUsername.trim().toLowerCase() &&
            u.password === loginPassword
        );
        if (found) {
          const onlineUser = { ...found, isOnline: true };
          setCurrentUser(onlineUser);
          saveLoginSession(onlineUser, rememberMe);
          if (db) {
            try {
              await db.collection('bma_users').doc(found.id).update({ isOnline: true });
            } catch (err) {}
          }
          setLoginUsername('');
          setLoginPassword('');
          setShowLoginPassword(false);
          setCurrentView('feed');
        } else {
          setAuthError('Username หรือ Password ไม่ถูกต้อง (หากเพิ่งได้รับรหัส เช่น M000 หรือ M001 กรุณากดแท็บ "เปิดใช้งาน Member ID" ด้านบน)');
        }
      };

      const handleActivateMemberId = async (e) => {
        e.preventDefault();
        setAuthError('');
        const cleanId = activateIdInput.trim().toUpperCase();
        const cleanUser = activateUsername.trim();
        const cleanPass = activatePassword.trim();
        const cleanName = activateDisplayName.trim() || ('Member #' + cleanId);

        if (!cleanId || !cleanUser || !cleanPass) {
          setAuthError('กรุณากรอกข้อมูลให้ครบทุกช่อง');
          return;
        }

        const targetAccount = users.find((u) => String(u.id).toUpperCase() === cleanId);
        if (!targetAccount) {
          setAuthError('ไม่พบรหัสประจำตัว "' + cleanId + '" ในระบบ กรุณาติดต่อเจ้าของเว็บไซต์');
          return;
        }
        if (targetAccount.isActivated) {
          setAuthError('รหัส "' + cleanId + '" ถูกเปิดใช้งานไปแล้ว กรุณาเข้าสู่ระบบตามปกติ');
          return;
        }

        const usernameTaken = users.some(
          (u) => u.id !== targetAccount.id && u.username && u.username.toLowerCase() === cleanUser.toLowerCase()
        );
        if (usernameTaken) {
          setAuthError('Username นี้มีผู้ใช้งานแล้ว กรุณาตั้งชื่ออื่น');
          return;
        }

        const updatedAccount = {
          ...targetAccount,
          username: cleanUser,
          password: cleanPass,
          displayName: cleanName,
          isActivated: true,
          isOnline: true,
          socialLinks: targetAccount.socialLinks || [],
          usernameChangeHistory: [],
          notifPrefs: {
            muteOwnPosts: false,
            muteGlobalChat: false,
            mutePrivateChat: false
          },
          memberTags: getUserTags(targetAccount),
          memberTag: getUserTags(targetAccount)[0] || 'Others',
          joinedAt: new Date().toISOString().split('T')[0]
        };

        try {
          if (db) await db.collection('bma_users').doc(targetAccount.id).set(updatedAccount);
          setUsers(users.map((u) => (u.id === targetAccount.id ? updatedAccount : u)));
          setCurrentUser(updatedAccount);
          saveLoginSession(updatedAccount, rememberMe);
          setActivateIdInput('');
          setActivateUsername('');
          setActivatePassword('');
          setShowActivatePassword(false);
          setActivateDisplayName('');
          setCurrentView('feed');
        } catch (err) {
          setAuthError('บันทึกข้อมูลไม่สำเร็จ: ' + err.message);
        }
      };

      // ============================================================================
      // 3. ระบบโปรไฟล์ & การเปลี่ยน Username (จำกัด 2 ครั้งใน 14 วัน) และเปลี่ยนรหัสผ่าน
      // ============================================================================
      const getRecentUsernameChanges = (user) => {
        if (!user || !Array.isArray(user.usernameChangeHistory)) return [];
        const fourteenDaysMs = 14 * 24 * 60 * 60 * 1000;
        const now = Date.now();
        return user.usernameChangeHistory.filter((ts) => now - ts < fourteenDaysMs);
      };

      const openProfileEditor = () => {
        if (!currentUser) return;
        setEditDisplayName(currentUser.displayName);
        setEditBio(currentUser.bio || '');
        setEditAvatarUrl(currentUser.avatarUrl || '');
        setEditUsernameInput(currentUser.username || '');
        setEditPasswordInput(currentUser.password || '');
        setShowEditPassword(false);
        setProfileEditError('');
        setEditSocialLinks(Array.isArray(currentUser.socialLinks) ? currentUser.socialLinks : []);
        setNewSocialUrl('');
        setNewSocialLabel('');
        setIsEditingProfile(true);
      };

      const handleAddSocialLink = () => {
        if (!newSocialUrl.trim()) return;
        const newItem = {
          id: 'soc-' + Date.now(),
          platform: newSocialPlatform,
          label: newSocialLabel.trim() || newSocialPlatform,
          url: formatSafeUrl(newSocialUrl)
        };
        setEditSocialLinks([...editSocialLinks, newItem]);
        setNewSocialUrl('');
        setNewSocialLabel('');
      };

      const handleRemoveSocialLink = (socId) => {
        setEditSocialLinks(editSocialLinks.filter((s) => s.id !== socId));
      };

      const handleAvatarUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_SIZE = 300;
            let w = img.width;
            let h = img.height;
            if (w > h && w > MAX_SIZE) {
              h *= MAX_SIZE / w;
              w = MAX_SIZE;
            } else if (h > MAX_SIZE) {
              w *= MAX_SIZE / h;
              h = MAX_SIZE;
            }
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            setEditAvatarUrl(canvas.toDataURL('image/jpeg', 0.85));
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      const handleSaveProfile = async (e) => {
        e.preventDefault();
        setProfileEditError('');
        if (!editDisplayName.trim() || !currentUser) return;

        const cleanNewUser = editUsernameInput.trim();
        const cleanNewPass = editPasswordInput.trim();
        if (!cleanNewUser || !cleanNewPass) {
          setProfileEditError('Username และ Password ห้ามเว้นว่าง');
          return;
        }

        let updatedHistory = getRecentUsernameChanges(currentUser);
        const isUsernameChanged = cleanNewUser !== currentUser.username;

        if (isUsernameChanged) {
          const taken = users.some(
            (u) => u.id !== currentUser.id && u.username && u.username.toLowerCase() === cleanNewUser.toLowerCase()
          );
          if (taken) {
            setProfileEditError('Username "' + cleanNewUser + '" มีสมาชิกท่านอื่นใช้แล้ว กรุณาใช้ชื่ออื่น');
            return;
          }
          if (updatedHistory.length >= 2) {
            const oldestChange = Math.min(...updatedHistory);
            const nextAvailableDate = new Date(oldestChange + 14 * 24 * 60 * 60 * 1000).toLocaleDateString('th-TH');
            setProfileEditError(
              'คุณเปลี่ยน Username ครบ 2 ครั้งในรอบ 14 วันแล้ว สามารถเปลี่ยนได้อีกครั้งในวันที่ ' + nextAvailableDate
            );
            return;
          }
          updatedHistory = [...updatedHistory, Date.now()];
        }

        const updatedUser = {
          ...currentUser,
          displayName: editDisplayName.trim(),
          bio: editBio.trim(),
          avatarUrl: editAvatarUrl.trim(),
          username: cleanNewUser,
          password: cleanNewPass,
          usernameChangeHistory: updatedHistory,
          socialLinks: editSocialLinks
        };

        if (db) await db.collection('bma_users').doc(updatedUser.id).set(updatedUser);
        setCurrentUser(updatedUser);
        setIsEditingProfile(false);
      };

      // ============================================================================
      // 4. ระบบ ADMIN
      // ============================================================================
      const toggleNewMemberTagSelection = (tag) => {
        if (newMemberTags.includes(tag)) {
          if (newMemberTags.length > 1) setNewMemberTags(newMemberTags.filter((t) => t !== tag));
        } else {
          setNewMemberTags([...newMemberTags, tag]);
        }
      };

      const handleAddCustomNewTag = () => {
        const clean = customTagInput.trim();
        if (!clean) return;
        if (!newMemberTags.includes(clean)) setNewMemberTags([...newMemberTags, clean]);
        setCustomTagInput('');
      };

      const handleIssueNewId = async (e) => {
        e.preventDefault();
        if (!currentUser || currentUser.role !== 'admin') return;
        const cleanId = newMemberId.trim().toUpperCase();
        if (!cleanId || newMemberTags.length === 0) return;

        if (users.some((u) => String(u.id).toUpperCase() === cleanId)) {
          alert('รหัส ' + cleanId + ' มีอยู่ในระบบแล้ว');
          return;
        }

        const newSlot = {
          id: cleanId,
          memberTag: newMemberTags[0],
          memberTags: newMemberTags,
          role: 'member',
          isActivated: false,
          isOnline: false,
          username: '',
          password: '',
          displayName: 'รออนุมัติตัวตน (' + cleanId + ')',
          bio: 'สมาชิกใหม่ (รอเจ้าตัวเข้ามากำหนด Username และโปรไฟล์)',
          avatarUrl: '',
          socialLinks: [],
          usernameChangeHistory: [],
          notifPrefs: { muteOwnPosts: false, muteGlobalChat: false, mutePrivateChat: false },
          joinedAt: new Date().toISOString().split('T')[0]
        };

        if (db) await db.collection('bma_users').doc(cleanId).set(newSlot);
      };

      const openEditTagsModal = (targetUser) => {
        setEditingTagsUser(targetUser);
        setEditingTagsList(getUserTags(targetUser));
        setEditingCustomTag('');
      };

      const toggleEditingTagItem = (tag) => {
        if (editingTagsList.includes(tag)) {
          if (editingTagsList.length > 1) setEditingTagsList(editingTagsList.filter((t) => t !== tag));
        } else {
          setEditingTagsList([...editingTagsList, tag]);
        }
      };

        const clean = editingCustomTag.trim();
        if (!clean) return;
        if (!editingTagsList.includes(clean)) setEditingTagsList([...editingTagsList, clean]);
        setEditingCustomTag('');
      };

      const handleSaveEditedMemberTags = async (e) => {
        e.preventDefault();
        if (!editingTagsUser || editingTagsList.length === 0) return;
        if (db) {
          await db.collection('bma_users').doc(editingTagsUser.id).update({
            memberTags: editingTagsList,
            memberTag: editingTagsList[0]
          });
        }
        setEditingTagsUser(null);
      };

      const handleToggleModerator = async (targetUser) => {
        if (!currentUser || currentUser.role !== 'admin' || targetUser.role === 'admin') return;
        const nextRole = targetUser.role === 'mod' ? 'member' : 'mod';
        if (db) await db.collection('bma_users').doc(targetUser.id).update({ role: nextRole });
      };

      const handleDeleteUser = async (userId) => {
        if (!currentUser || currentUser.role !== 'admin' || userId === 'M000') return;
        if (!confirm('ยืนยันการลบบัญชีรหัส ' + userId + ' ?')) return;
        if (db) await db.collection('bma_users').doc(userId).delete();
      };

      const handleCopyInviteId = (user) => {
        const tagsStr = getUserTags(user).join(', ');
        const text =
          '[The Blue Moon Association]\nบัตรเชิญเข้าสู่สมาคมของคุณ:\n- Member ID: ' +

          tagsStr +
          '\n\nวิธีเข้าใช้งานครั้งแรก:\n1. กดปุ่ม "เข้าสู่ระบบ / เปิดใช้งาน ID"\n2. เลือกแท็บ "เปิดใช้งาน Member ID"\n3. กรอกรหัส ' +
          user.id +

        setCopiedId(user.id);

      };

      // ============================================================================
      // 5. ระบบสร้างโพสต์บล็อก + โพลล์สำรวจความคิดเห็น
      // ============================================================================
      const handlePostFileSelect = (e) => {
        const files = Array.from(e.target.files || []);
        files.forEach((file) => {
          if (file.size > 850 * 1024) {
            alert('ไฟล์ "' + file.name + '" มีขนาดเกิน 850KB กรุณาใช้ไฟล์ขนาดเล็กลง หรือแนบเป็นลิงก์ URL แทนครับ');

              ...prev,
              {
                id: 'att-' + Date.now() + Math.random().toString(36).slice(2, 6),

                type: fileType,

              }

      const handleAddUrlAttachment = () => {
        if (!attachmentUrlInput.trim()) return;
        setNewPostAttachments((prev) => [
          ...prev,

          return;
        }

        const updatedOptions = post.poll.options.map((opt) => {
          const cleanVotes = (opt.votes || []).filter((uid) => uid !== currentUser.id);
          if (opt.id === optionId) {
            return { ...opt, votes: [...cleanVotes, currentUser.id] };
          }
          return { ...opt, votes: cleanVotes };
        });

        const updatedPoll = { ...post.poll, options: updatedOptions };

          await db.collection('bma_posts').doc(post.id).update({ poll: updatedPoll });
          const voterLabel = post.poll.isAnonymous ? 'สมาชิกไม่ระบุตัวตน' : currentUser.displayName;

            recipientId: post.authorId,

        const list = [
          { token: '@everyone', label: '@everyone', sub: 'แจ้งเตือนสมาชิกทุกคนในห้อง', type: 'Global' },
          { token: '@here', label: '@here', sub: 'แจ้งเตือนเฉพาะคนที่ออนไลน์อยู่ตอนนี้', type: 'Online' }
        ];
        allAvailableTags.forEach((t) => {
          list.push({
            token: '@[' + t + ']',
            label: '@[' + t + ']',
            sub: 'แท็กสมาชิกทุกคนในหมวดหมู่ ' + t,
            type: 'หมวดหมู่ (Tag)'
          });
        });
        activatedMembers.forEach((m) => {
          list.push({
            token: '@' + m.id,
            label: '@' + m.id + ' (' + m.displayName + ')',
            sub: 'Username: @' + m.username + ' • ' + getUserTags(m).join(', '),
            type: 'Member ID',
            searchExtra: (m.username || '').toLowerCase() + ' ' + m.displayName.toLowerCase()
          });
          if (m.username) {
            list.push({
              token: '@' + m.username,
              label: '@' + m.username + ' (' + m.displayName + ')',
              sub: 'ID: ' + m.id + ' • ' + getUserTags(m).join(', '),
              type: 'Username',
              searchExtra: String(m.id).toLowerCase() + ' ' + m.displayName.toLowerCase()
            });
          }
        });
        if (!mentionFilter) return list;
        return list.filter(
          (item) =>
            item.label.toLowerCase().includes(mentionFilter) ||
            item.sub.toLowerCase().includes(mentionFilter) ||
            (item.searchExtra && item.searchExtra.includes(mentionFilter))
        );

      const handleChatFileSelect = (e) => {

          if (file.size > 850 * 1024) {
            alert('ไฟล์ "' + file.name + '" มีขนาดเกิน 850KB กรุณาใช้ไฟล์ขนาดเล็กลง หรือแนบเป็นลิงก์ URL แทนครับ');
            return;
          }
          const reader = new FileReader();
          reader.onloadend = () => {
            let fType = 'file';
            if (file.type.startsWith('image/')) fType = 'image';
            else if (file.type.startsWith('video/')) fType = 'video';
            setChatPendingAttachments((prev) => [
              ...prev,
              {
                id: 'att-' + Date.now() + Math.random().toString(36).slice(2, 5),
                name: file.name,
                type: fType,
                url: reader.result,
                size: (file.size / 1024).toFixed(1) + ' KB'
              }
            ]);
          };
          reader.readAsDataURL(file);
        });
        e.target.value = '';

                                    ✓✓ อ่านแล้ว {activeRoom.type !== 'dm' && otherReaders.length > 0 ? '(' + otherReaders.length + ')' : ''}
                                  </span>
                                ) : (
                                  <span className="text-[10px] font-semibold text-sky-300 bg-sky-950/50 border border-sky-500/30 px-1.5 py-0.5 rounded">
                                    ✓ ส่งแล้ว
                                  </span>
                                )
                              )}
                            </div>

                            {msg.isDeleted ? (
                              <p className="text-xs italic text-slate-500 mt-1.5 px-3 py-1.5 rounded-lg bg-[#0B1325]/50 border border-[#1E3A5F]/50 inline-block">
                                🚫 ข้อความนี้ถูกยกเลิกไปโดยผู้ส่ง
                              </p>
                            ) : (
                              <>
                                <FormattedMessageText
                                  text={msg.text}
                                  currentUser={currentUser}
                                  isEdited={msg.isEdited}
                                />

                                {msg.attachments && msg.attachments.length > 0 && (
                                  <div className="mt-2.5 space-y-2 max-w-md">
                                    {msg.attachments.map((att) => {
                                      if (att.type === 'image') {
                                        return (
                                          <div
                                            key={att.id}
                                            onContextMenu={(e) => handleOpenContextMenu(e, msg, att)}
                                            className="rounded-xl overflow-hidden border border-[#1E3A5F] bg-[#0B1325]"
                                          >
                                            <img src={att.url} alt={att.name} className="max-h-72 w-auto object-contain" />
                                          </div>
                                        );
                                      }
                                      if (att.type === 'video') {
                                        return (
                                          <div
                                            key={att.id}
                                            onContextMenu={(e) => handleOpenContextMenu(e, msg, att)}
                                            className="rounded-xl overflow-hidden border border-[#1E3A5F] bg-black"
                                          >
                                            <video src={att.url} controls className="max-h-72 w-full" />
                                          </div>
                                        );
                                      }
                                      return (
                                        <a
                                          key={att.id}
                                          href={att.url}
                                          download={att.name}
                                          target="_blank"
                                          rel="noreferrer"
                                          onContextMenu={(e) => handleOpenContextMenu(e, msg, att)}
                                          className="flex items-center justify-between p-3 rounded-xl bg-[#0B1325] hover:bg-[#0F2547] border border-[#1E3A5F] text-xs"
                                        >
                                          <span className="truncate font-semibold">📎 {att.name} ({att.size})</span>
                                          <span className="px-2.5 py-1 rounded bg-white text-[#050811] font-bold text-[10px] shrink-0 ml-2">ดาวน์โหลด</span>
                                        </a>
                                      );
                                    })}
                                  </div>
                                )}
                              </>
                            )}
                          </div>
                        </div>
                      );
                    })
                  )}

                  {/* สถานะกำลังพิมพ์ข้อความ ต่อจากข้อความล่าสุด */}

                    <div className="flex items-center gap-2 px-3 py-2 rounded-xl bg-[#0B1325] border border-sky-500/40 text-xs text-sky-300 animate-pulse w-fit">
                      <span>💬</span>
                      <span>
                        <strong>{currentRoomTypers.map((t) => t.displayName).join(', ')}</strong> กำลังพิมพ์ข้อความอยู่...
                      </span>
                    </div>
                  )}
                </div>

                {/* POPUP MENU: @Mention */}
                {showMentionMenu && (
                  <div className="absolute bottom-24 left-6 right-6 max-w-md bg-[#0B1325] border-2 border-white/40 rounded-2xl shadow-2xl p-3 z-40">
                    <div className="flex items-center justify-between pb-2 mb-2 border-b border-[#1E3A5F] text-xs">
                      <span className="font-bold text-white">@ เลือกแท็กแจ้งเตือน</span>
                      <button onClick={() => setShowMentionMenu(false)} className="text-slate-400 hover:text-white">✕</button>
                    </div>
                    <div className="max-h-56 overflow-y-auto space-y-1 pr-1">
                      {getMentionSuggestions().map((item, i) => (
                        <button
                          key={i}
                          type="button"
                          onClick={() => insertMentionTag(item.token)}
                          className="w-full flex items-center justify-between px-3 py-2 rounded-xl hover:bg-[#0F2547] text-left"
                        >
                          <div>
                            <div className="text-xs font-mono font-bold text-white">{item.label}</div>
                            <div className="text-[10px] text-slate-400">{item.sub}</div>
                          </div>
                          <span className="px-2 py-0.5 rounded bg-[#050811] border border-[#1E3A5F] text-[10px] text-blue-300">{item.type}</span>
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                {/* กล่องพิมพ์ข้อความ ล็อกอยู่ด้านล่างเสมอ (shrink-0) */}
                {activeChannelObj && activeChannelObj.isSystemReadOnly ? (
                  <div className="p-4 bg-[#0B1325] border-t border-[#1E3A5F] text-center shrink-0">
                    <div className="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-[#050811] border border-[#1E3A5F] text-xs text-slate-300">
                      <span>📢</span>
                      <span>ห้อง <strong className="text-white">#announcements</strong> สำหรับแจ้งเตือนโพสต์ใหม่อัตโนมัติเท่านั้น</span>
                    </div>
                  </div>
                ) : activeGroupObj && activeGroupObj.isArchived ? (
                  <div className="p-4 bg-[#0B1325] border-t border-[#1E3A5F] text-center shrink-0">
                    <div className="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-[#050811] border border-amber-400/40 text-xs text-amber-200">
                      <span>📦</span>
                      <span>กลุ่มแชตนี้ถูกเก็บเข้ากรุ (Archived - โหมดอ่านอย่างเดียว)</span>

                  </div>

                        <button
                          type="button"
                          onClick={() => {
                            setEditingChatMsg(null);
                            setChatInputText('');
                          }}
                          className="text-white font-bold ml-2"

                          ยกเลิกแก้ไข ✕
                        </button>
                      </div>
                    )}

                    {chatPendingAttachments.length > 0 && (
                      <div className="flex flex-wrap gap-2 pb-1">
                        {chatPendingAttachments.map((att) => (
                          <div key={att.id} className="flex items-center gap-2 px-3 py-1 rounded-lg bg-[#050811] border border-[#1E3A5F] text-xs">
                            <span className="truncate max-w-[180px]">[{att.type.toUpperCase()}] {att.name}</span>
                            <button
                              type="button"
                              onClick={() => setChatPendingAttachments(chatPendingAttachments.filter((a) => a.id !== att.id))}
                              className="text-red-400 font-bold"
                            >
                              ✕
                            </button>
                          </div>
                        ))}
                      </div>
                    )}

                          onChange={(e) => setChatAttachTypeInput(e.target.value)}

                        >
                          <option value="image">รูปภาพ (URL)</option>
                          <option value="video">วิดีโอ (MP4/URL)</option>
                          <option value="file">ไฟล์เอกสาร (URL)</option>
                        </select>
                        <input
                          type="text"
                          value={chatAttachUrlInput}
                          onChange={(e) => setChatAttachUrlInput(e.target.value)}
                          placeholder="วางลิงก์รูปภาพ, วิดีโอ หรือไฟล์..."
                          className="flex-1 bg-[#0B1325] border border-[#1E3A5F] rounded-lg px-3 py-1 text-xs text-white outline-none"
                        />
                        <button type="button" onClick={handleAddChatUrlAttachment} className="px-3 py-1 rounded-lg bg-white text-[#050811] text-xs font-bold">
                          แนบลิงก์
                        </button>
                      </div>
                    )}

                    <div className="flex flex-wrap items-center gap-1.5 text-xs">

                      <input
                        type="text"
                        value={chatInputText}
                        onChange={handleChatInputChange}

                      />
                      <button type="submit" className="px-6 py-3 rounded-xl bg-white text-[#050811] hover:bg-slate-200 font-bold text-sm shrink-0 shadow-lg">

                      </button>
                    </div>
                  </form>
                )}
              </main>

              {/* RIGHT COLLAPSIBLE DRAWER (ล็อกความสูงคงที่ เลื่อนดูสมาชิกแยกอิสระ) */}

                <aside className="w-72 md:w-80 bg-[#070C18] border-l border-[#1E3A5F] flex flex-col shrink-0 h-full overflow-hidden">

                  </div>

                  <div className="p-3 border-b border-[#1E3A5F] flex flex-wrap gap-1 shrink-0">

                        }
                      >
                        {tag === 'ALL' ? 'ทั้งหมด' : tag}
                      </button>
                    ))}
                  </div>

                  <div className="flex-1 min-h-0 overflow-y-auto p-3 space-y-2.5">
                    {filteredRightDrawerMembers.map((m) => (
                      <div
                        key={m.id}
                        onClick={() => setSelectedMemberModal(m)}
                        className="p-3 rounded-xl bg-[#0B1325] border border-[#1E3A5F] hover:border-white/50 cursor-pointer transition"
                      >
                        <div className="flex items-start gap-3">
                          <Avatar user={m} size="md" showStatus={true} />
                          <div className="min-w-0 flex-1">
                            <div className="flex items-center justify-between gap-1">
                              <span className="font-mono text-[11px] font-bold text-white">{m.id}</span>
                              <span className={'text-[10px] font-semibold ' + (m.isOnline ? 'text-emerald-400' : 'text-slate-500')}>
                                {m.isOnline ? '● Online' : '○ Offline'}
                              </span>
                            </div>
                            <div className="flex items-center gap-1.5 mt-0.5">
                              <span className="text-xs font-bold text-white truncate">{m.displayName}</span>
                              <RoleBadge role={m.role} />
                            </div>
                            <div className="text-[10px] font-mono text-slate-400 mb-1.5">@{m.username}</div>
                            <TagBadgesList user={m} />
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </aside>
              )}
            </div>
          )}

          {/* RIGHT-CLICK CONTEXT MENU */}
          {contextMenu && (
            <div
              style={{ top: contextMenu.y + 'px', left: contextMenu.x + 'px' }}
              onClick={(e) => e.stopPropagation()}
              className="fixed z-50 w-52 bg-[#0B1325] border-2 border-white/40 rounded-xl shadow-2xl py-1.5 text-xs overflow-hidden"
            >
              <button
                onClick={handleCopyFromContextMenu}
                className="w-full px-4 py-2 text-left hover:bg-[#0F2547] flex items-center gap-2 text-white"
              >
                <span>📋</span>
                <span>{contextMenu.mediaItem ? 'คัดลอกลิงก์ไฟล์/สื่อ' : 'คัดลอกข้อความ'}</span>
              </button>
              <button
                onClick={() => {
                  setForwardingMsg(contextMenu);
                  setContextMenu(null);
                }}
                className="w-full px-4 py-2 text-left hover:bg-[#0F2547] flex items-center gap-2 text-white"
              >
                <span>↪️</span>
                <span>ส่งต่อ (Forward)...</span>
              </button>
              {currentUser && contextMenu.message.senderId === currentUser.id && !contextMenu.mediaItem && (
                <button
                  onClick={handleStartEditMessage}
                  className="w-full px-4 py-2 text-left hover:bg-[#0F2547] flex items-center gap-2 text-amber-300 border-t border-[#1E3A5F]"
                >
                  <span>✎</span>
                  <span>แก้ไขข้อความ</span>
                </button>
              )}
              {currentUser && contextMenu.message.senderId === currentUser.id && (
                <button
                  onClick={handleCancelDeleteMessage}
                  className="w-full px-4 py-2 text-left hover:bg-red-950/80 flex items-center gap-2 text-red-400"
                >
                  <span>🚫</span>
                  <span>ยกเลิกข้อความ (ลบ)</span>
                </button>

            </div>
          )}

          {/* MODAL: Forward */}
          {forwardingMsg && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">

                <div className="flex items-center justify-between pb-3 border-b border-[#1E3A5F]">
                  <h3 className="text-base font-bold text-white">↪️ ส่งต่อข้อความ / ไฟล์ไปยัง...</h3>
                  <button onClick={() => setForwardingMsg(null)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <div className="max-h-72 overflow-y-auto space-y-2 pr-1">
                  <div className="text-[10px] font-bold uppercase text-slate-400">ห้องแชตรวม (Global Channels)</div>
                  {channels.filter((c) => !c.isSystemReadOnly).map((c) => (
                    <button
                      key={c.id}
                      onClick={() => handleForwardToTarget('channel', c.id)}
                      className="w-full flex items-center justify-between p-2.5 rounded-xl bg-[#050811] hover:bg-[#0F2547] border border-[#1E3A5F] text-xs"
                    >
                      <span>{c.icon} # {c.name}</span>
                      <span className="px-2 py-0.5 rounded bg-white text-[#050811] font-bold text-[10px]">ส่งต่อ</span>
                    </button>
                  ))}

                  {myGroups.filter((g) => !g.isArchived).length > 0 && (
                    <>
                      <div className="text-[10px] font-bold uppercase text-slate-400 pt-2">กลุ่มแชต (Groups)</div>
                      {myGroups.filter((g) => !g.isArchived).map((g) => (
                        <button
                          key={g.id}
                          onClick={() => handleForwardToTarget('group', g.id)}
                          className="w-full flex items-center justify-between p-2.5 rounded-xl bg-[#050811] hover:bg-[#0F2547] border border-[#1E3A5F] text-xs"
                        >
                          <span>👥 {g.name}</span>
                          <span className="px-2 py-0.5 rounded bg-white text-[#050811] font-bold text-[10px]">ส่งต่อ</span>
                        </button>
                      ))}
                    </>
                  )}

                  <div className="text-[10px] font-bold uppercase text-slate-400 pt-2">สมาชิก (Direct Messages)</div>
                  {activatedMembers
                    .filter((m) => currentUser && m.id !== currentUser.id)
                    .map((m) => (
                      <button
                        key={m.id}
                        onClick={() => handleForwardToTarget('dm', m.id)}
                        className="w-full flex items-center justify-between p-2.5 rounded-xl bg-[#050811] hover:bg-[#0F2547] border border-[#1E3A5F] text-xs"
                      >
                        <div className="flex items-center gap-2">
                          <Avatar user={m} size="xs" />
                          <span>{m.displayName} ({m.id})</span>
                        </div>
                        <span className="px-2 py-0.5 rounded bg-white text-[#050811] font-bold text-[10px]">ส่งต่อ</span>
                      </button>
                    ))}
                </div>
              </div>
            </div>
          )}

          {/* ================================================================= */}
          {/* VIEW 5 & 6: FEED & OWNER ADMIN                                    */}
          {/* ================================================================= */}
          {(currentView === 'feed' || currentView === 'bookmarks' || currentView === 'admin') && (
            <div className="max-w-7xl mx-auto w-full px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1">
              <aside className="lg:col-span-4 xl:col-span-3 space-y-6">
                {currentUser ? (
                  <div className="bg-[#0B1325] border border-[#1E3A5F] rounded-2xl overflow-hidden shadow-xl">
                    <div className="bg-gradient-to-r from-[#0F2547] to-[#081226] px-5 py-3.5 border-b border-[#1E3A5F] flex items-center justify-between gap-2">
                      <div className="flex items-center gap-2">
                        <span className="font-mono text-sm font-bold text-white">{currentUser.id}</span>
                        <RoleBadge role={currentUser.role} />
                      </div>
                      <TagBadgesList user={currentUser} />
                    </div>
                    <div className="p-5">
                      <div className="flex items-center gap-3.5">
                        <Avatar user={currentUser} size="lg" showStatus={true} />
                        <div className="min-w-0 flex-1">
                          <h2 className="text-base font-bold text-white truncate">{currentUser.displayName}</h2>
                          <p className="text-xs font-mono text-slate-400 truncate">@{currentUser.username}</p>
                          <button
                            onClick={openProfileEditor}
                            className="mt-2 px-3 py-1 rounded-lg bg-[#0F2547] hover:bg-white hover:text-[#050811] border border-white/20 text-[11px] font-semibold text-white"
                          >
                            ✎ ตั้งค่าโปรไฟล์ / รหัสผ่าน
                          </button>
                        </div>
                      </div>
                      <div className="mt-4 p-3 rounded-xl bg-[#050811] border border-[#1E3A5F] text-xs text-slate-200">
                        {currentUser.bio || 'ยังไม่ได้ระบุคำอธิบายตัวตน'}
                      </div>
                      {currentUser.socialLinks && currentUser.socialLinks.length > 0 && (
                        <div className="mt-3 flex flex-wrap gap-1.5">
                          {currentUser.socialLinks.map((soc) => (
                            <a
                              key={soc.id}
                              href={soc.url}
                              target="_blank"
                              rel="noreferrer"
                              className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-[#050811] hover:bg-[#0F2547] border border-[#1E3A5F] text-[11px] text-blue-200"
                            >
                              <span>{getSocialIcon(soc.platform)}</span>
                              <span className="truncate max-w-[120px]">{soc.label}</span>
                            </a>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                ) : (
                  <div className="bg-[#0B1325] border border-[#1E3A5F] rounded-2xl p-5 text-center space-y-3">
                    <div className="flex justify-center"><AssociationLogo size={42} /></div>
                    <h3 className="text-sm font-bold text-white">โหมดผู้มาเยือน (Guest Mode)</h3>
                    <p className="text-xs text-slate-300">หากได้รับ Member ID แล้ว กดปุ่มด้านล่างเพื่อเปิดใช้งานบัญชีและร่วมโพสต์หรือโหวตโพลล์ได้ทันที</p>
                    <button
                      onClick={() => { setAuthMode('signin'); setCurrentView('login'); }}
                      className="w-full py-2 rounded-xl bg-white text-[#050811] font-bold text-xs"
                    >
                      เข้าสู่ระบบ / เปิดใช้งาน ID
                    </button>
                  </div>
                )}

                <div className="bg-[#0B1325] border border-[#1E3A5F] rounded-2xl p-2 space-y-1">
                  <button
                    onClick={() => setCurrentView('feed')}
