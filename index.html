                    </div>
                    {myGroups.map((g) => (
                        <button key={g.id} onClick={() => { setActiveRoom({ type: 'group', id: g.id }); if(window.innerWidth<768)setLeftOpen(false); }} className={`w-full flex justify-between items-center px-3 py-2 mb-1 rounded-xl font-bold transition-all ${activeRoom.type === 'group' && activeRoom.id === g.id ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-300 hover:bg-[#0F2547] hover:text-white'}`}>

                    <div className="flex-1 overflow-y-auto no-scrollbar pt-1">

                    </div>

                            type="text" 
                            value={chatSearch}
                            onChange={(e) => setChatSearch(e.target.value)}

                            className="bg-[#050811] border border-[#1E3A5F] rounded-full py-1.5 pl-8 pr-7 text-xs text-sky-200 outline-none focus:border-sky-500 w-32 md:w-48 transition-all"

                            <button onClick={() => setChatSearch('')} className="absolute right-2 text-slate-500 hover:text-red-400">

                    </div>
                    
                    {/* ปุ่มตัวเลือกเสริม (ขวาบน) */}
                    {activeRoom.type === 'group' && activeGrp && !activeGrp.isArchived && (
                        <button onClick={() => setAddMemOpen(true)} className="w-8 h-8 rounded-full bg-sky-900/30 text-sky-300 hover:bg-sky-600 hover:text-white transition flex items-center justify-center shrink-0" title="แก้ไขสมาชิกกลุ่ม">
                            <i className="fas fa-user-edit"></i>
                        </button>
                    )}
                    {activeRoom.type === 'group' && activeGrp && currentUser?.id === activeGrp.createdBy && (
                      <>
                        <button onClick={() => db.collection('bma_groups').doc(activeGrp.id).update({ isArchived: !activeGrp.isArchived })} className="btn-b text-[10px] px-2" title="Archive กลุ่ม">
                            {activeGrp.isArchived ? '🔓 เปิด' : '📦'}
                        </button>
                        <button onClick={() => setDelTgt({ roomType: 'group', id: activeGrp.id, name: activeGrp.name })} className="w-8 h-8 rounded-full bg-red-950/50 text-red-400 hover:bg-red-900 hover:text-white transition flex items-center justify-center shrink-0">
                            <i className="fas fa-trash"></i>
                        </button>
                      </>
                    )}
                    
                    <button onClick={() => setRightOpen(!rightOpen)} className="w-8 h-8 md:w-auto md:px-3 md:py-1.5 rounded-full md:rounded-lg bg-white text-[#050811] font-bold flex items-center justify-center gap-2 hover:bg-slate-200 transition-colors shrink-0">
                        <i className="fas fa-users"></i>
                        <span className="hidden md:inline">สมาชิก</span>
                    </button>
                  </div>
                </div>
                
                {/* 📌 Pinned Message */}
                {pinnedMsg && (
                    <div className="bg-amber-950/30 border-b border-amber-900/50 p-2.5 px-4 flex items-center justify-between gap-3 shrink-0 cursor-pointer shadow-md z-10 hover:bg-amber-950/50 transition-colors" onClick={() => document.getElementById('msg-' + pinnedMsg.id)?.scrollIntoView({behavior: 'smooth', block: 'center'})}>
                        <div className="flex-1 min-w-0 text-xs text-slate-300 border-l-2 border-amber-500 pl-2.5">
                            <div className="font-bold text-amber-400 mb-0.5 flex items-center gap-1.5"><i className="fas fa-thumbtack text-[10px]"></i> ข้อความปักหมุด</div>
                            <div className="truncate text-slate-200">
                                {pinnedMsg.text || (pinnedMsg.attachments?.length > 0 ? `[${pinnedMsg.attachments[0].type === 'image' ? 'รูปภาพ' : pinnedMsg.attachments[0].type === 'video' ? 'วิดีโอ' : pinnedMsg.attachments[0].type === 'audio' ? 'ไฟล์เสียง' : 'ไฟล์แนบ'}]` : 'ข้อความ')}
                            </div>
                        </div>
                        <button onClick={(e) => { e.stopPropagation(); db.collection('bma_messages').doc(pinnedMsg.id).update({ isPinned: false }); }} className="text-slate-500 hover:text-red-400 w-8 h-8 rounded-full hover:bg-black/20 flex items-center justify-center transition-colors" title="เลิกปักหมุด">
                            <i className="fas fa-times"></i>
                        </button>
                    </div>
                )}

                <div ref={chatBoxRef} onScroll={(e) => { 
    		        if (e.target.scrollTop < 100 && visibleChatLimit < roomMsgs.length) { 
		                setVisibleChatLimit(v => v + 50); 
		            } 
		        }} className="flex-1 min-h-0 overflow-y-auto p-4 space-y-4 custom-scrollbar bg-gradient-to-b from-[#050811] to-[#030509]">
                    
                  {visibleChatLimit < roomMsgs.length && (
                      <div className="text-center py-2 text-[10px] text-sky-400 font-bold animate-pulse bg-sky-950/20 rounded-full w-max mx-auto px-4 border border-sky-900/50">
                          ⏳ กำลังโหลดข้อความเก่า...
                      </div>
                  )}

                  {roomMsgs.slice(Math.max(0, roomMsgs.length - visibleChatLimit)).map((msg) => {
                    const tStr = getTimeStr(msg);
                    if (msg.isSystemPostAlert) {
                      const pa = getAuthor(msg.senderId);
                      return <div key={msg.id} className="p-3.5 card flex items-center justify-between gap-3"><div className="flex items-center gap-3"><Avatar user={pa} size="sm" /><div><div className="text-[10px] text-blue-300 font-bold">📝 โพสต์ใหม่ • {tStr}</div><div className="text-xs font-bold">{msg.text}</div>{msg.postTitle && <div className="text-xs text-slate-300">"{msg.postTitle}"</div>}</div></div>{msg.linkedPostId && <button onClick={() => jumpToPost(msg.linkedPostId)} className="btn-w text-xs shrink-0">🔗 ดูโพสต์ →</button>}</div>;
                    }
                    if (msg.isGameInvite) {
                      const pa = getAuthor(msg.senderId);
                      return <div key={msg.id} className="p-3.5 card border-sky-400/50 flex flex-col gap-2 shadow-lg bg-[#0F2547]/50"><div className="flex items-center gap-3"><Avatar user={pa} size="sm" showStatus={true} /><div><div className="flex items-center gap-1.5"><span className="text-xs font-bold text-sky-300">{pa.displayName}</span><span className="text-[10px] text-slate-400">{tStr}</span></div><p className="text-sm mt-0.5 font-bold">🎮 ชวนเล่นเกม {msg.gameName}</p></div></div><button onClick={() => setActiveChatGameId(msg.gameId)} className="btn-w text-xs self-start ml-11 hover:scale-105 transition-transform">⚔️ เข้าร่วม / เปิดเกม</button></div>;
                    }
                    if (msg.isGameResult) {
                      const pa = getAuthor(msg.senderId);
                      const wName = msg.gameResultData.winner === 'draw' ? 'เสมอ' : getAuthor(msg.gameResultData.winner)?.displayName;
                      return <div key={msg.id} className="p-3.5 card border-amber-400/50 flex flex-col gap-2 shadow-lg bg-[#0F2547]/50"><div className="flex items-center gap-3"><Avatar user={pa} size="sm" showStatus={true} /><div><div className="flex items-center gap-1.5"><span className="text-xs font-bold text-amber-300">{pa.displayName}</span><span className="text-[10px] text-slate-400">{tStr}</span></div><p className="text-sm mt-0.5">🏆 ผลการแข่งขัน {msg.gameName}</p><p className="text-xs font-bold text-amber-400 mt-1">ผู้ชนะ: {wName}</p></div></div><button onClick={() => setActiveChatGameId(msg.gameId)} className="btn-b text-xs self-start ml-11 hover:scale-105 transition-transform text-amber-300 border-amber-500/50">👁️ ดูหน้ากระดานสรุป</button></div>;
                    }
                    if (msg.dailyGameShare) {
                      const pa = getAuthor(msg.senderId);
                      return <div key={msg.id} className="p-3.5 card border-amber-400/50 flex flex-col gap-2 shadow-lg"><div className="flex items-center gap-3"><Avatar user={pa} size="sm" showStatus={true} /><div><div className="flex items-center gap-1.5"><span className="text-xs font-bold text-amber-300">{pa.displayName}</span><span className="text-[10px] text-slate-400">{tStr}</span></div><p className="text-sm mt-0.5">{msg.text}</p></div></div><button onClick={() => { setActiveGameTab(msg.dailyGameShare.gameIndex); setCurrentView('daily_game'); }} className="btn-w text-xs self-start ml-11 hover:scale-105 transition-transform">🎮 ท้าดวลเกมนี้เลย</button></div>;
                    }
                     if (msg.isEventInvite) {
                      const pa = getAuthor(msg.senderId);
                      return (
                        <div key={msg.id} className="p-3.5 card border-emerald-400/50 flex flex-col gap-2 shadow-lg bg-[#0F2547]/50 w-full max-w-[280px]">
                           <div className="flex items-center gap-3">
                              <Avatar user={pa} size="sm" showStatus={true} />
                              <div>
                                 <div className="flex items-center gap-1.5"><span className="text-xs font-bold text-emerald-300">{pa.displayName}</span><span className="text-[10px] text-slate-400">{tStr}</span></div>
                                 <p className="text-xs mt-0.5 font-bold text-white">📅 ชวนเข้าร่วมกิจกรรม</p>
                              </div>
                           </div>
                           <div className="bg-[#050811] p-2.5 rounded-xl border border-[#1E3A5F] text-xs shadow-inner mt-1">
                              <div className="font-bold text-sky-200 mb-1.5 leading-snug">{msg.eventName}</div>
                              <div className="text-slate-400 text-[10px] flex items-center gap-1.5">
                                 <span className="bg-[#0B1325] px-1.5 py-0.5 rounded border border-[#1E3A5F]">📍 {msg.eventDate}</span>
                                 <span className="bg-[#0B1325] px-1.5 py-0.5 rounded border border-[#1E3A5F]">🕒 {msg.eventTime}</span>
                              </div>
                           </div>
                           	{/* ปุ่มตอบรับ (RSVP) */}
                           <div className="flex gap-1.5 mt-1.5">
                              <button onClick={() => updateEventRSVP(msg.eventId, 'going')} className="flex-1 btn-w text-[10px] py-1.5 shadow-md hover:bg-emerald-500 hover:text-white hover:border-transparent transition-colors">✓ ไป</button>
                              <button onClick={() => updateEventRSVP(msg.eventId, 'maybe')} className="flex-1 btn-d text-[10px] py-1.5 border-amber-500/50 text-amber-300 hover:bg-amber-900 transition-colors">🤷 อาจจะ</button>
                              <button onClick={() => updateEventRSVP(msg.eventId, 'decline')} className="flex-1 btn-d text-[10px] py-1.5 border-red-500/50 text-red-300 hover:bg-red-900 transition-colors">✕ ไม่ไป</button>
                           </div>
                        </div>
                      );
                    }
                    const s = getAuthor(msg.senderId), rdrs = (msg.readBy || []).filter((id) => id !== msg.senderId);
                    const isMe = currentUser && msg.senderId === currentUser.id; // เช็กว่าเป็นข้อความของเราหรือไม่

                    // --- ฟังก์ชันช่วยเหลือสำหรับ Highlight คำค้นหา ---
                    const highlightText = (text, highlight) => {
                        if (!highlight.trim()) return <FormattedText text={text} currentUser={currentUser} isEdited={msg.isEdited} />;
                        const parts = text.split(new RegExp(`(${highlight})`, 'gi'));
                        return (
                            <span className="break-words">
                                {parts.map((part, i) => 
                                    part.toLowerCase() === highlight.toLowerCase() ? 
                                        <span key={i} className="search-highlight">{part}</span> : part
                                )}
                                {msg.isEdited && <span className="ml-2 text-[10px] italic text-slate-400 opacity-70">(แก้ไขแล้ว)</span>}
                            </span>
                        );
                    };

                    // --- ฟังก์ชันช่วยเหลือสำหรับ Smart Media Grid ---
                    const renderMediaGrid = (attachments) => {
                        if (!attachments || attachments.length === 0) return null;
                        
                        // กรองเฉพาะรูปภาพเพื่อนำมาจัด Grid
                        const images = attachments.filter(a => a.type === 'image');
                        const others = attachments.filter(a => a.type !== 'image');
                        
                        let gridClass = '';
                        if (images.length === 2) gridClass = 'media-grid-2';
                        else if (images.length === 3) gridClass = 'media-grid-3';
                        else if (images.length >= 4) gridClass = 'media-grid-4';

                        return (
                            <div className="mt-2 space-y-2">
                                {/* แสดง Grid รูปภาพ */}
                                {images.length > 0 && (
                                    <div className={images.length > 1 ? `media-grid ${gridClass} w-full max-w-sm` : 'w-full max-w-sm'}>
                                        {images.slice(0, 4).map((att, idx) => (
                                            <div key={att.id} className="relative">
                                                <SmartMedia att={att} onContextMenu={(e) => { e.preventDefault(); e.stopPropagation(); setCtxMenu({ x: e.clientX, y: e.clientY, message: msg, mediaItem: att }); }} />
                                                {/* ถ้ามีรูปมากกว่า 4 รูป ให้แสดง +X บนรูปสุดท้าย */}
                                                {idx === 3 && images.length > 4 && (
                                                    <div className="absolute inset-0 bg-black/60 flex items-center justify-center text-white text-xl font-bold rounded-xl pointer-events-none">
                                                        +{images.length - 4}
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                )}
                                
                                {/* แสดงไฟล์อื่นๆ (Video, Audio, Link) แยกลงมาด้านล่าง */}
                                {others.length > 0 && (
                                    <div className="space-y-2 w-full max-w-sm">
                                        {others.map(att => (
                                            <SmartMedia key={att.id} att={att} onContextMenu={(e) => { e.preventDefault(); e.stopPropagation(); setCtxMenu({ x: e.clientX, y: e.clientY, message: msg, mediaItem: att }); }} />
                                        ))}
                                    </div>
                                )}
                            </div>
                        );
                    };

                    return (
                      <div id={'msg-' + msg.id} key={msg.id} 
                           onContextMenu={(e) => { e.preventDefault(); e.stopPropagation(); if (!msg.isDeleted) setCtxMenu({ x: Math.min(e.clientX, window.innerWidth - 200), y: Math.min(e.clientY, window.innerHeight - 220), message: msg, mediaItem: null }); }} 
                           className={`flex items-end gap-2.5 group/msg ${isMe ? 'msg-right self-end flex-row-reverse' : 'msg-left self-start'} ${chatSearch && (msg.text||'').toLowerCase().includes(chatSearch.toLowerCase()) ? 'ring-2 ring-amber-500/50 rounded-2xl p-1 bg-amber-900/10' : ''}`}
                      >
                        {/* Avatar */}
                        <div onClick={() => setMemberModal(s)} className="cursor-pointer shrink-0 mb-1 z-10">
                            <Avatar user={s} size="sm" showStatus={!isMe} />
                        </div>
                        
                        {/* Bubble Container */}
                        <div className={`msg-bubble flex flex-col ${isMe ? 'items-end' : 'items-start'}`}>
                            
                            {/* Meta Info (Name, Time, Read Status) */}
                            <div className={`text-[10px] text-slate-400 mb-1 flex items-center gap-2 ${isMe ? 'mr-1 flex-row-reverse' : 'ml-1'}`}>
                                {!isMe && (
                                    <div className="flex items-center gap-1.5 cursor-pointer hover:underline" onClick={() => setMemberModal(s)}>
                                        <span className="font-bold text-sky-300">{s.displayName}</span>
                                        <RoleBadge role={s.role} />
                                    </div>
                                )}
                                <span>{tStr}</span>
                                
                                {/* Read Receipt แบบใหม่มี Popover */}
                                {!msg.isDeleted && isMe && (
                                    <div className="relative group/read cursor-pointer flex items-center gap-1">
                                        {rdrs.length ? (
                                            <span className="font-bold text-emerald-400 hover:underline">✓✓ อ่านแล้ว {rdrs.length}</span>
                                        ) : (
                                            <span className="text-sky-300">✓ ส่งแล้ว</span>
                                        )}
                                        
                                        {/* Popover แสดงรายชื่อคนอ่าน (เฉพาะตอนมีคนอ่านและชี้เมาส์) */}
                                        {rdrs.length > 0 && (
                                            <div className="absolute bottom-full right-0 mb-2 w-max min-w-[150px] max-w-[200px] bg-[#0B1325] border border-[#1E3A5F] rounded-xl p-2 hidden group-hover/read:block z-50 shadow-2xl">
                                                <div className="text-[10px] text-slate-400 mb-1.5 font-bold border-b border-[#1E3A5F] pb-1">👀 อ่านแล้วโดย:</div>
                                                <div className="space-y-1.5 max-h-32 overflow-y-auto custom-scrollbar pr-1">
                                                    {rdrs.map(rId => {
                                                        const rUser = getAuthor(rId);
                                                        return (
                                                            <div key={rId} className="flex items-center gap-2">
                                                                <Avatar user={rUser} size="xs" /> 
                                                                <span className="text-[10px] text-white truncate">{rUser.displayName}</span>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}
                                {/* ป้ายบอกโหมด Silent */}
                                {msg.isSilent && <span className="text-[9px] bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded border border-slate-700" title="ข้อความนี้ถูกส่งมาแบบไม่แจ้งเตือน">🔕</span>}
                            </div>
                            
                            {/* Message Content Body */}
                            <div className={`msg-content text-sm p-3 rounded-2xl relative shadow-md ${isMe ? 'bg-sky-600 text-white rounded-tr-none' : 'bg-[#0F2547] border border-[#1E3A5F] text-slate-200 rounded-tl-none'} ${msg.isDeleted ? 'bg-slate-800 border-slate-700 text-slate-400' : ''}`}>
                                
                                {msg.isDeleted ? (
                                    <p className="text-xs italic">🚫 ข้อความนี้ถูกยกเลิกไปโดยผู้ส่ง</p>
                                ) : (
                                    <>
                                        {/* Reply Quote */}
                                        {msg.replyTo && (
                                            <div className={`mb-2 px-2.5 py-1.5 rounded-lg border-l-2 text-[11px] opacity-90 cursor-pointer ${isMe ? 'bg-sky-700 border-white text-sky-100' : 'bg-[#050811] border-sky-400 text-slate-300'}`} onClick={() => document.getElementById('msg-' + msg.replyTo.id)?.scrollIntoView({behavior: 'smooth', block: 'center'})}>
                                                <strong className={isMe ? 'text-white' : 'text-sky-300'}>↩️ {msg.replyTo.senderName}:</strong> 
                                                <div className="line-clamp-2 mt-0.5">{msg.replyTo.text}</div>
                                            </div>
                                        )}
                                        
                                        {/* Text Content with Highlight */}
                                        {msg.text && (
                                            <div className="whitespace-pre-line leading-relaxed">
                                                {highlightText(msg.text, chatSearch)}
                                            </div>
                                        )}
                                        
                                        {/* Smart Media Grid Attachments */}
                                        {renderMediaGrid(msg.attachments)}
                                    </>
                                )}
                            </div>
                            
                            {/* Action Buttons (Like & Reply) - Shows on Hover */}
                            {!msg.isDeleted && (
                                <div className={`flex gap-1 mt-1 opacity-0 group-hover/msg:opacity-100 transition-opacity ${isMe ? 'mr-2' : 'ml-2'}`}>
                                    <LikeButton likes={msg.likes} currentUser={currentUser} getAuthor={getAuthor} onLike={() => db.collection('bma_messages').doc(msg.id).update({ likes: (msg.likes||[]).includes(currentUser?.id) ? msg.likes.filter((i) => i !== currentUser.id) : [...(msg.likes || []), currentUser.id] })} />
                                    {!(msg.roomKey === 'happy-birthday-dear' && msg.targetUserId && Date.now() - msg.timestamp > 86400000) && (
                                        <button onClick={() => setRepMsg(msg)} className="px-2 py-0.5 rounded-full bg-[#0B1325] border border-[#1E3A5F] text-[9px] hover:bg-[#0F2547] text-slate-300 transition-colors">
                                            ↩️ ตอบ
                                        </button>
                                    )}
                                </div>
                            )}
                        </div>
                      </div>
                    );
                  })}
                  
                  {roomTypers.length > 0 && (
                      <div className="text-[10px] text-sky-300 animate-pulse bg-sky-950/30 w-max px-3 py-1.5 rounded-full border border-sky-900/50 self-start ml-2 mt-2 flex items-center gap-2">
                          <div className="flex gap-[2px] items-center h-2 waveform text-sky-400">
                             <span style={{animationDelay: '0s'}}></span>
                             <span style={{animationDelay: '0.2s'}}></span>
                             <span style={{animationDelay: '0.4s'}}></span>
                          </div>
                          <strong>{roomTypers.map((t) => t.displayName).join(', ')}</strong> กำลังพิมพ์...
                      </div>
                  )}
                </div>

                {/* Mention Dropdown */}
                {mentOpen && (
                  <div className="absolute bottom-24 left-4 max-w-sm w-full card p-2 z-40 max-h-48 overflow-y-auto space-y-1 text-xs shadow-[0_0_20px_rgba(0,0,0,0.8)] border border-sky-500/50">
                    <div className="text-[10px] text-slate-400 font-bold mb-1 px-2 border-b border-[#1E3A5F] pb-1">แท็กบุคคลหรือกลุ่ม</div>
                    {mentionList().map((m, i) => (
                        <button key={i} onClick={() => { const w = chatIn.split(/\s+/); if (w[w.length - 1]?.startsWith('@')) { w[w.length - 1] = m.token; setChatIn(w.join(' ') + ' '); } else setChatIn((chatIn ? chatIn + ' ' : '') + m.token + ' '); setMentOpen(false); }} className="w-full flex justify-between items-center px-3 py-2 rounded-lg hover:bg-sky-900/40 transition-colors">
                            <span className="font-mono font-bold text-sky-100">{m.label}</span>
                            <span className="text-slate-500 text-[10px]">{m.sub}</span>
                        </button>
                    ))}
                  </div>
                )}

                {/* Chat Input Area */}
                {activeCh?.isSystemReadOnly || activeGrp?.isArchived ? (
                  <div className="p-3 bg-[#0B1325] border-t border-[#1E3A5F] text-center text-xs text-slate-400 shrink-0">ห้องนี้อยู่ในโหมดอ่านอย่างเดียว</div>
                ) : (
                  <div className="p-3 bg-[#0B1325] border-t border-[#1E3A5F] shrink-0 z-20 relative">
                    
                    {/* ข้อมูล Edit / Reply / Upload (คงเดิม) */}
                    <div className="space-y-2 mb-2 text-xs">
                        {editMsg && <div className="flex justify-between px-2.5 py-1 rounded bg-amber-950/70 text-amber-200"><span>✎ แก้ไข: {editMsg.text}</span><button type="button" onClick={() => { setEditMsg(null); setChatIn(''); }}>✕</button></div>}
                        {repMsg && <div className="flex justify-between px-2.5 py-1 rounded bg-sky-950/70 text-sky-200"><span>↩️ ตอบกลับ {getAuthor(repMsg.senderId).displayName}: {repMsg.text || '[ไฟล์]'}</span><button type="button" onClick={() => setRepMsg(null)}>✕</button></div>}
                        {uploading && <div className="text-sky-300 animate-pulse">⏳ กำลังอัปโหลดไฟล์...</div>}
                        {chatAtts.length > 0 && <div className="flex flex-wrap gap-1">{chatAtts.map((a) => <span key={a.id} className="px-2 py-0.5 rounded bg-[#050811] border border-[#1E3A5F] text-white">{a.name} <button type="button" onClick={() => setChatAtts(chatAtts.filter((x) => x.id !== a.id))} className="text-red-400 font-bold ml-1 hover:text-red-300">✕</button></span>)}</div>}
                    </div>

                    {/* ช่องป้อน URL แนบลิงก์ */}
                    {cUrlOpen && (
                      <div className="flex gap-1.5 mb-2 text-xs animate-fade-in">
                        <select value={cAttType} onChange={(e) => setCAttType(e.target.value)} className="inp py-1"><option value="image">รูปภาพ/GIF</option><option value="video">วิดีโอ</option><option value="audio">เสียง</option><option value="file">ไฟล์</option></select>
                        <input type="text" value={cAttUrl} onChange={(e) => setCAttUrl(e.target.value)} placeholder="วางลิงก์ .gif, .png หรือลิงก์เว็บ..." className="flex-1 inp py-1" />
                        <button type="button" onClick={() => { if (cAttUrl.trim()) { setChatAtts([...chatAtts, { id: 'att-' + Date.now(), name: 'Link', type: cAttType, url: cAttUrl.trim(), size: 'URL' }]); setCAttUrl(''); setCUrlOpen(false); } }} className="btn-w py-1 px-3">แนบ</button>
                      </div>
                    )}

                    <form onSubmit={async (e) => { e.preventDefault(); await handleSendChat(e); }} className="flex items-end gap-2 bg-[#050811] rounded-2xl border border-[#1E3A5F] p-1 pr-1.5 focus-within:border-sky-500 transition-colors relative">
                        
                        <div className="flex items-center gap-1 pb-1 pl-1 shrink-0">
                            {/* 📌 ปุ่มเครื่องหมาย + (ปรับสีให้ชัดเจนขึ้น) */}
                            <div className="relative">
                                <button type="button" onClick={() => setCUrlOpen(!cUrlOpen)} className={`w-8 h-8 rounded-full transition flex items-center justify-center font-bold border shadow-md ${cUrlOpen ? 'bg-sky-500 text-white border-sky-400' : 'bg-[#0F2547] text-white border-white/20 hover:bg-sky-500 hover:border-sky-400'}`} title="แนบไฟล์ / ฟังก์ชันพิเศษ">
                                    <i className={`fas ${cUrlOpen ? 'fa-times' : 'fa-plus'} text-[14px]`}></i>
                                </button>
                                
                                {/* เมนูย่อยเมื่อกดปุ่ม + (ควบคุมด้วย cUrlOpen) */}
                                {cUrlOpen && (
                                    <div className="absolute bottom-full left-0 mb-3 w-max bg-[#0B1325] border border-[#1E3A5F] rounded-xl p-1.5 flex flex-col shadow-2xl z-50 text-xs text-left animate-fade-in">
                                        <input type="file" multiple ref={cFileRef} onChange={async (e) => { const fl = Array.from(e.target.files || []); e.target.value = ''; setUploading(true); for (const f of fl) { try { const a = await uploadChunked(f); setChatAtts((p) => [...p, a]); } catch (err) { alert(err.message); } } setUploading(false); setCUrlOpen(false); }} className="hidden" />
                                        
                                        <button type="button" onClick={() => { cFileRef.current?.click(); }} className="px-3 py-2.5 hover:bg-[#0F2547] rounded-lg text-slate-200 hover:text-white flex items-center gap-2.5 transition-colors text-left"><i className="fas fa-upload w-4 text-center text-slate-400"></i> อัปโหลดไฟล์จากเครื่อง</button>
                                        
                                        <button type="button" onClick={() => { const u = prompt("ใส่ลิงก์รูปภาพ, วิดีโอ หรือเว็บไซต์ (URL)"); if(u && u.trim()) { setChatAtts([...chatAtts, { id: 'att-' + Date.now(), name: 'Link', type: 'link', url: u.trim(), size: 'URL' }]); setCUrlOpen(false); } }} className="px-3 py-2.5 hover:bg-[#0F2547] rounded-lg text-slate-200 hover:text-white flex items-center gap-2.5 transition-colors text-left"><i className="fas fa-link w-4 text-center text-slate-400"></i> แนบลิงก์ (URL)</button>
                                        
                                        <button type="button" onClick={() => { setMentOpen(!mentOpen); setMentF(''); setCUrlOpen(false); }} className="px-3 py-2.5 hover:bg-[#0F2547] rounded-lg text-slate-200 hover:text-white flex items-center gap-2.5 transition-colors text-left"><i className="fas fa-at w-4 text-center text-slate-400"></i> แท็กบุคคล (@)</button>
                                        
                                        <div className="relative">
                                            <button type="button" onClick={(e) => { e.stopPropagation(); setCGameOpen(!cGameOpen); }} className="w-full px-3 py-2.5 hover:bg-amber-900/30 rounded-lg text-amber-300 flex items-center gap-2.5 transition-colors text-left font-bold">
                                                <i className="fas fa-gamepad w-4 text-center"></i> ชวนเล่นแชตเกม <i className={`fas fa-chevron-${cGameOpen ? 'down' : 'right'} ml-auto text-[10px]`}></i>
                                            </button>
                                            {cGameOpen && (
                                                <div className="mt-1 ml-6 space-y-1 border-l-2 border-[#1E3A5F] pl-2">
                                                    {[{id:'chess',n:'หมากรุก (ไม่จำกัดเวลา)',i:'♟️'}, {id:'chess_3',n:'หมากรุก (3 นาที)',i:'⏳'}, {id:'chess_5',n:'หมากรุก (5 นาที)',i:'⏳'}, {id:'checkers',n:'หมากฮอส',i:'🔴'},{id:'snl',n:'บันไดงู',i:'🐍'},{id:'connect4',n:'Connect 4',i:'🟡'},{id:'domino',n:'โดมิโน',i:'🁣'},{id:'sttt',n:'Super Tic-Tac-Toe',i:'✖️'}].map(g => (
                                                      <button key={g.id} type="button" onClick={async (e) => { 
                                                        e.stopPropagation(); setCGameOpen(false); setCUrlOpen(false);
                                                        const gid = 'cg-' + Date.now(); const realId = g.id.split('_')[0]; const timerSetting = g.id.includes('_') ? parseInt(g.id.split('_')[1]) * 60 : null;
                                                        await db.collection('bma_chat_games').doc(gid).set({ id: gid, type: realId, name: g.n, players: [currentUser.id], status: 'waiting', gameState: {}, timerSetting, rematch: [], timestamp: Date.now() }); 
                                                        const mid = 'msg-' + Date.now(); 
                                                        await db.collection('bma_messages').doc(mid).set({ id: mid, roomKey, senderId: currentUser.id, receiverId: activeRoom.type === 'dm' ? activeRoom.id : null, text: 'ชวนเล่นเกม ' + g.n, isGameInvite: true, gameId: gid, gameType: realId, gameName: g.n, readBy: [currentUser.id], isDeleted: false, time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }), timestamp: Date.now(), serverCreatedAt: svrTs() }); 
                                                        setActiveChatGameId(gid); 
                                                      }} className="w-full text-left px-2.5 py-1.5 hover:bg-[#0F2547] rounded-lg flex items-center gap-2 text-slate-300 hover:text-white transition-colors">
                                                          <span>{g.i}</span> <span>{g.n}</span>
                                                      </button>
                                                    ))}
                                                </div>
                                            )}
                                        </div>

                                        {activeRoom.type === 'dm' && (
                                            <button type="button" onClick={async () => { const now = Date.now(), id = 'msg-' + now; await db.collection('bma_messages').doc(id).set({ id, roomKey, senderId: currentUser.id, receiverId: activeRoom.id, text: '👋 สะกิดคุณ!', attachments: [], likes: [], readBy: [currentUser.id], isEdited: false, isDeleted: false, isSystemPostAlert: false, time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }), timestamp: now, serverCreatedAt: svrTs() }); await sendNotif({ recipientId: activeRoom.id, actorId: currentUser.id, category: 'messages', subType: 'dm_chat', title: '👋 ' + currentUser.displayName + ' สะกิดคุณ!', body: 'สะกิดคุณ!', targetView: 'chat', targetRoomType: 'dm', targetRoomId: currentUser.id }); setCUrlOpen(false); }} className="px-3 py-2.5 mt-1 border-t border-[#1E3A5F] hover:bg-fuchsia-900/30 rounded-lg text-fuchsia-300 flex items-center gap-2.5 transition-colors text-left font-bold"><i className="fas fa-hand-sparkles w-4 text-center"></i> สะกิดเตือน (Poke)</button>
                                        )}
                                    </div>
                                )}
                            </div>
                            
                            {/* ปุ่ม Emoji */}
                            <div className="relative">
                                <button type="button" onClick={() => { setEmoOpen(!emoOpen); setShowGifPanel(false); setCUrlOpen(false); }} className={`w-8 h-8 rounded-full transition flex items-center justify-center text-[16px] border shadow-sm ${emoOpen ? 'bg-amber-900/40 border-amber-500/50' : 'text-slate-200 bg-[#0F2547] border-white/20 hover:text-white hover:bg-amber-900/40 hover:border-amber-500/50'}`} title="ส่งอีโมจิ">
                                    🙂
                                </button>
                                {emoOpen && (
                                    <div className="absolute bottom-full left-0 mb-3 w-64 bg-[#0B1325] border border-[#1E3A5F] p-2 z-50 shadow-2xl rounded-xl text-xl grid grid-cols-6 gap-1 max-h-48 overflow-y-auto custom-scrollbar">
                                        {['😀','😂','🤣','😊','😍','😘','🥰','😜','😎','🤩','😭','😡','🤯','🥶','😱','🤡','👻','💀','👽','👾','💖','💔','💯','💥','💦','💨','👍','👎','👏','🙌','🤝','🙏','💪','🏆','🔥','✨','🎉','🎊','🎈','🧸'].map(em => (
                                            <button key={em} type="button" onClick={() => { setChatIn(chatIn + em); setEmoOpen(false); document.querySelector('textarea.max-h-24')?.focus(); }} className="hover:bg-[#0F2547] rounded p-1 transition-colors flex items-center justify-center h-8">{em}</button>
                                        ))}
                                    </div>
                                )}
                            </div>

                            {/* 📌 ปุ่ม GIF Panel (ปรับแก้แล้ว) */}
                            <div className="relative hidden sm:block">
                                <button type="button" onClick={() => { setShowGifPanel(!showGifPanel); setEmoOpen(false); setCUrlOpen(false); }} className={`w-8 h-8 rounded-full transition flex items-center justify-center text-[10px] font-bold border shadow-sm ${showGifPanel ? 'bg-purple-900/50 text-purple-300 border-purple-500/50' : 'bg-[#0F2547] text-purple-300 border-white/20 hover:bg-purple-900/50 hover:text-purple-200 hover:border-purple-500/50'}`} title="ส่ง GIF">
                                    GIF
                                </button>
                                {showGifPanel && (
                                    <div className="absolute bottom-full left-0 mb-3 w-72 bg-[#0B1325] border border-[#1E3A5F] p-3 z-50 shadow-[0_0_30px_rgba(0,0,0,0.8)] rounded-xl animate-fade-in">
                                        <div className="relative mb-2">
                                            <i className="fas fa-search absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                                            <input type="text" value={gifSearch} onChange={e => setGifSearch(e.target.value)} placeholder="ค้นหา GIF..." className="w-full bg-[#050811] border border-[#1E3A5F] rounded py-1.5 pl-8 pr-2 text-xs text-white outline-none focus:border-purple-500 transition-colors" />
                                        </div>
                                        
                                        {/* Grid รูปภาพ GIF */}
                                        <div className="grid grid-cols-2 gap-1.5 h-48 overflow-y-auto custom-scrollbar relative">
                                            {isGifLoading ? (
                                                <div className="col-span-2 flex flex-col items-center justify-center text-[10px] text-purple-400 font-bold py-10">
                                                    <i className="fas fa-circle-notch fa-spin text-2xl mb-2"></i>
                                                    กำลังค้นหา GIF...
                                                </div>
                                            ) : gifResults.length > 0 ? (
                                                gifResults.map((gif, idx) => (
                                                    <div 
                                                        key={idx} 
                                                        onClick={() => { 
                                                            setChatAtts([...chatAtts, { id: 'att-gif-' + Date.now(), name: 'GIF', type: 'image', url: gif, size: 'GIF' }]); 
                                                            setShowGifPanel(false); 
                                                            setGifSearch('');
                                                        }} 
                                                        className="bg-cover bg-center h-20 rounded cursor-pointer hover:ring-2 ring-purple-500 transition-all shadow-sm"
                                                        style={{ backgroundImage: `url('${gif}')` }}
                                                    ></div>
                                                ))
                                            ) : (
                                                <div className="col-span-2 text-center text-slate-500 text-[10px] py-10">ไม่พบ GIF ที่คุณค้นหา</div>
                                            )}
                                        </div>
                                        <div className="text-[8px] text-slate-500 text-right mt-1.5 font-bold tracking-widest">POWERED BY TENOR</div>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Input Field */}
                        <textarea 
                            rows={1} 
                            value={chatIn} 
                            onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSendChat(e); } }} 
                            onChange={(e) => { 
                                const v = e.target.value; 
                                setChatIn(v); 
                                setTyping(v.trim().length > 0); 
                                clearTimeout(typTimer.current); 
                                typTimer.current = setTimeout(() => setTyping(false), 3500); 
                                const lw = v.split(/\s+/).pop() || ''; 
                                if (lw.startsWith('@')) { setMentOpen(true); setMentF(lw.slice(1).toLowerCase()); } 
                                else setMentOpen(false); 
                            }} 
                            placeholder="พิมพ์ข้อความ... (ใช้ @ เพื่อแท็ก)" 
                            className="flex-1 bg-transparent text-sm text-white resize-none outline-none py-2.5 custom-scrollbar max-h-24 placeholder-slate-500" 
                        />
                        
                        {/* Right Actions */}
                        <div className="flex items-center gap-1 pb-1 pr-1 shrink-0">
                            {/* ปุ่มบันทึกเสียง (ใช้ Waveform icon ถ้ากำลังอัด) */}
                            <button type="button" onClick={isRecording ? stopRecording : startRecording} className={`w-8 h-8 rounded-full transition flex items-center justify-center ${isRecording ? 'bg-red-900/50 text-red-400 animate-pulse' : 'text-slate-400 hover:text-white hover:bg-[#0F2547]'}`} title={isRecording ? "หยุดบันทึกเสียง" : "ส่งข้อความเสียง"}>
                                {isRecording ? (
                                    <div className="flex gap-[2px] waveform text-red-400 h-3.5 items-center">
                                        <span style={{animationDelay: '0.1s'}}></span>
                                        <span style={{animationDelay: '0.3s'}}></span>
                                        <span style={{animationDelay: '0.2s'}}></span>
                                    </div>
                                ) : (
                                    <i className="fas fa-microphone"></i>
                                )}
                            </button>
                            
                            {/* ปุ่ม Silent Toggle */}
                            <button type="button" onClick={() => setIsSilentMsg(!isSilentMsg)} className={`w-8 h-8 rounded-full transition flex items-center justify-center ${isSilentMsg ? 'text-amber-400 bg-amber-900/30' : 'text-slate-400 hover:text-amber-400 hover:bg-[#0F2547]'}`} title={isSilentMsg ? "โหมดส่งข้อความ: ไม่แจ้งเตือน (Silent)" : "โหมดส่งข้อความ: แจ้งเตือนปกติ"}>
                                <i className={`fas ${isSilentMsg ? 'fa-bell-slash' : 'fa-bell'}`}></i>
                            </button>
                            
                            {/* ปุ่มส่งข้อความ */}
                            <button type="submit" className="w-8 h-8 rounded-full bg-sky-500 text-white hover:bg-sky-400 transition flex items-center justify-center shadow-md ml-0.5" title="ส่งข้อความ">
                                <i className="fas fa-paper-plane text-xs -ml-0.5"></i>
                            </button>
                        </div>
                    </form>

                    {/* Alert text for silent mode */}
                    {isSilentMsg && (
                        <div className="absolute -top-6 right-4 bg-amber-950/90 border border-amber-500/50 text-amber-300 text-[10px] px-3 py-1 rounded-full shadow-lg z-50 animate-fade-in font-bold">
                            🔕 ส่งแบบไม่แจ้งเตือน
                        </div>
                    )}
                  </div>
                )}
              </main>   

              {/* RIGHT SIDEBAR (Members Drawer) */}
              <aside className={`absolute md:relative z-40 w-64 md:w-64 bg-[#070C18] border-l border-[#1E3A5F] flex flex-col shrink-0 h-full overflow-hidden text-xs right-0 transition-transform duration-300 ${rightOpen ? 'translate-x-0 shadow-[-10px_0_20px_rgba(0,0,0,0.5)]' : 'translate-x-full md:translate-x-0'}`}>
                  <div className="p-3 border-b border-[#1E3A5F] flex justify-between items-center bg-[#050811]">
                      <span className="font-bold text-slate-200">👥 สมาชิกห้อง ({activeMembers.length})</span>
                      <button onClick={() => setRightOpen(false)} className="md:hidden w-7 h-7 rounded bg-[#0F2547] text-slate-400 hover:text-white flex items-center justify-center"><i className="fas fa-times"></i></button>
                  </div>
                  
                  <div className="p-3 border-b border-[#1E3A5F] relative z-20 bg-gradient-to-b from-[#050811] to-transparent">
                    <button onClick={() => setRightFilterMenuOpen(!rightFilterMenuOpen)} className={`w-full px-3 py-2 rounded-xl text-xs font-bold flex justify-between items-center border transition-colors shadow-sm ${rightTag !== 'ALL' || rightOnlineOnly ? 'bg-sky-600 border-sky-500 text-white' : 'bg-white text-[#050811] border-transparent hover:bg-slate-200'}`}>
                      <div className="flex items-center gap-2">
                          <i className="fas fa-sliders-h"></i> 
                          <span>คัดกรองสมาชิก</span>
                      </div>
                      {(rightTag !== 'ALL' || rightOnlineOnly) ? <span className="bg-[#050811] text-sky-400 px-1.5 py-0.5 rounded-md text-[10px]">เปิดอยู่</span> : <i className="fas fa-chevron-down text-[10px]"></i>}
                    </button>
                    
                    {rightFilterMenuOpen && (
                      <>
                        <div className="fixed inset-0 z-30" onClick={() => setRightFilterMenuOpen(false)}></div>
                        <div className="absolute top-full mt-2 left-3 right-3 bg-[#0B1325] p-3 z-40 shadow-[0_0_20px_rgba(0,0,0,0.8)] border border-[#1E3A5F] rounded-xl text-xs flex flex-col gap-3">
                          <div>
                            <div className="font-bold text-sky-300 mb-1.5 flex items-center gap-1.5"><i className="fas fa-tag"></i> หมวดหมู่สมาชิก</div>
                            <select value={rightTag} onChange={e => setRightTag(e.target.value)} className="w-full inp py-1.5 text-xs text-white bg-[#050811]">
                              <option value="ALL">ทั้งหมด (All Tags)</option>
                              {allTags.map(t => <option key={t} value={t}>{t}</option>)}
                            </select>
                          </div>
                          <label className="flex items-center gap-2 cursor-pointer border-t border-[#1E3A5F] pt-3 mt-1">
                            <input type="checkbox" checked={rightOnlineOnly} onChange={e => setRightOnlineOnly(e.target.checked)} className="rounded bg-[#050811] border-[#1E3A5F] w-4 h-4 accent-sky-500" />
                            <span className="font-bold text-slate-200">🟢 เฉพาะคนที่ออนไลน์ใน 24 ชม.</span>
                          </label>
                          {(rightTag !== 'ALL' || rightOnlineOnly) && (
                            <button onClick={() => { setRightTag('ALL'); setRightOnlineOnly(false); setRightFilterMenuOpen(false); }} className="mt-2 btn-d py-1.5 w-full text-red-300 hover:text-white hover:bg-red-950 font-bold border-red-900/50">
                              ✕ ล้างฟิลเตอร์
                            </button>
                          )}
                        </div>
                      </>
                    )}
                  </div>
                  
                  <div className="flex-1 overflow-y-auto p-3 space-y-2 custom-scrollbar">
                    {activeMembers.filter((m) => {
                       if (rightTag !== 'ALL' && !getTags(m).includes(rightTag)) return false;
                       if (rightOnlineOnly && (Date.now() - (m.lastActive || 0) > 86400000)) return false;
                       return true;
                    }).map((m) => {
                       const stat = getStatusInfo(m);
                       return (
                           <div key={m.id} onClick={() => setMemberModal(m)} className={`p-2 rounded-xl border cursor-pointer flex items-center gap-2.5 transition-colors ${stat.t === 'Online' ? 'bg-[#0B1325] border-emerald-900/40 hover:border-emerald-500/80' : 'bg-[#050811] border-[#1E3A5F] hover:bg-[#0F2547]'}`}>
                               <Avatar user={m} size="sm" showStatus={true} />
                               <div className="min-w-0 flex-1">
                                   <div className="font-bold truncate text-[12px] text-slate-100">{m.displayName}</div>
                                   <div className="flex items-center gap-1.5 mt-0.5">
                                       <span className="text-[9px] font-mono bg-black/40 px-1 rounded text-sky-400">{m.id}</span>
                                       <div className={`text-[9px] font-bold ${stat.t === 'Online' ? 'text-emerald-400' : stat.t === 'AFK' ? 'text-amber-400' : 'text-slate-500'}`}>{stat.t}</div>
                                   </div>
                               </div>
                           </div>
                       );
                    })}
                  </div>
              </aside>
            </div>
          )}

          {/* DAILY GAMES VIEW */}
          {currentView === 'daily_game' && (
            <div className="flex-1 flex overflow-hidden relative">
              <aside className={`absolute md:relative z-40 w-56 h-full bg-[#070C18] border-r border-[#1E3A5F] flex flex-col transition-transform duration-300 ${leftOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0 md:hidden md:w-0'}`}>
                <div className="p-4 border-b border-[#1E3A5F] font-bold text-slate-300 uppercase tracking-wider text-[11px] flex justify-between items-center">
                  <span>เลือกมินิเกมประจำวัน</span>
                  <button onClick={() => setLeftOpen(false)} className="md:hidden text-lg text-slate-400">✕</button>
                </div>
                <div className="flex-1 overflow-y-auto p-2.5 space-y-1.5 custom-scrollbar">
                  {GAMES.map((g, idx) => (
                    <button key={g.id} onClick={() => setActiveGameTab(idx)} className={`w-full flex items-center gap-3 p-3 rounded-xl transition-all ${activeGameTab === idx ? 'bg-white text-[#050811] shadow font-bold border border-white/20' : 'text-slate-400 hover:bg-[#0F2547]'}`}>
                      <span className="text-lg">{g.icon}</span> <span>{g.name}</span>
                    </button>
                  ))}
                </div>
              </aside>

              <main className="flex-1 flex flex-col h-full bg-[#050811] relative min-w-0">
                {leftOpen && <div className="absolute inset-0 bg-black/50 z-30 md:hidden" onClick={() => setLeftOpen(false)}></div>}
                {rightOpen && <div className="absolute inset-0 bg-black/50 z-30 md:hidden" onClick={() => setRightOpen(false)}></div>}
                
                <div className="h-14 px-4 bg-[#0B1325] border-b border-[#1E3A5F] flex items-center justify-between gap-2 shrink-0 text-xs z-20">
                  <button onClick={() => setLeftOpen(!leftOpen)} className="btn-d font-semibold">{leftOpen ? '◀ ซ่อนเมนูเกม' : '☰ เมนูเกม ▶'}</button>
                  <div className="font-bold text-sm text-amber-300 hidden sm:block">The Blue Moon Games</div>
                  <button onClick={() => setRightOpen(!rightOpen)} className="btn-w">{rightOpen ? '🏆 ซ่อนกระดาน →' : '← 🏆 กระดานคะแนน'}</button>
                </div>

                <div className="flex-1 overflow-y-auto p-4 md:p-6 flex flex-col relative custom-scrollbar">
                  <div className="max-w-xl mx-auto w-full flex-1 flex flex-col">
                    <div className="text-center mb-4">
                      <h2 className="text-xl md:text-2xl font-bold text-white">{GAMES[activeGameTab].icon} {GAMES[activeGameTab].name}</h2>
                      <p className="text-xs text-slate-400 mt-1">รีเซ็ตกระดานเวลา 6:00 AM (วันที่: {todayStr})</p>
                    </div>

                    <div className="card flex-1 flex flex-col p-4 relative shadow-2xl min-h-[460px]">
                      <div className="text-center font-mono text-3xl font-bold text-white mb-4 drop-shadow flex justify-center items-center gap-4">
                        <span>{fmtTime(currGameSt.time)}</span>
                        {currGameSt.isPlaying && !currGameSt.isPaused && currGameSt.status === 'pending' && (
                           <button onClick={() => setGameAppSt(p => ({...p, [activeGameTab]: {...(p[activeGameTab]||{}), isPaused: true}}))} className="text-sm bg-[#0F2547] border border-[#1E3A5F] px-3 py-1.5 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800 transition-colors font-sans">⏸ Pause</button>
                        )}
                      </div>

                    {!currGameSt.isPlaying && currGameSt.status === 'pending' ? (
                      <div className="flex-1 flex flex-col items-center justify-center">
                        <button onClick={() => setGameAppSt(p => ({...p, [activeGameTab]: {status: 'pending', time: 0, isPlaying: true, isPaused: false, score: 0, hasStartedMove: activeGameTab !== 1}}))} className="btn-w text-lg px-10 py-4 animate-pulse shadow-[0_0_20px_rgba(255,255,255,0.2)]">▶ เริ่มเกม</button>
                        <div className="mt-4 text-xs text-slate-400 bg-[#0F2547] px-4 py-2 rounded-lg">จำกัดสิทธิ์ 1 เกม เล่นได้แค่วันละ 1 ครั้งเท่านั้น</div>
                      </div>
                    ) : currGameSt.isPaused ? (
                      <div className="flex-1 flex flex-col items-center justify-center bg-[#050811] rounded-xl border border-dashed border-[#1E3A5F]">
                        <div className="text-2xl font-bold text-amber-300 mb-4">⏸ เกมหยุดพักชั่วคราว</div>
                        <button onClick={() => setGameAppSt(p => ({...p, [activeGameTab]: {...(p[activeGameTab]||{}), isPaused: false}}))} className="btn-w px-8 py-3">เล่นต่อ</button>
                      </div>
                    ) : (
                      <>
                          <div className={`flex-1 flex flex-col justify-center bg-[#050811] rounded-xl border border-[#1E3A5F] p-2 relative overflow-hidden ${currGameSt.status === 'viewing_board' || (currGameSt.status !== 'pending' && !currGameSt.isPlaying) ? 'opacity-80 pointer-events-none' : ''}`}>
                            {activeGameTab === 0 && <SudokuGame dateSeed={todayStr} onEnd={(res, p) => handleGameWinLose(res, p)} />}
                            {activeGameTab === 1 && <MinesweeperGame dateSeed={todayStr} onEnd={(res, p) => handleGameWinLose(res, p)} onFirstMove={handleFirstMove} />}
                            {activeGameTab === 2 && <FlagGuesserGame dateSeed={todayStr} onEnd={(res, p) => handleGameWinLose(res, p)} />}
                            {activeGameTab === 3 && <SolitaireGame dateSeed={todayStr} onEnd={(res, p) => handleGameWinLose(res, p)} />}
                            {activeGameTab === 4 && <WordleGame dateSeed={todayStr} onEnd={(res, p) => handleGameWinLose(res, p)} />}
                            {activeGameTab === 5 && <SnakeGame dateSeed={todayStr} isPlaying={currGameSt.isPlaying} isPaused={currGameSt.isPaused} onEnd={(res, p) => handleGameWinLose(res, p)} />}
                            {activeGameTab === 6 && <Game2048 dateSeed={todayStr} onEnd={(res, p) => handleGameWinLose(res, p)} />}
                            {activeGameTab === 7 && <Game24 dateSeed={todayStr} onEnd={(res, p) => handleGameWinLose(res, p)} />}
                            {activeGameTab === 8 && <ResistorGame dateSeed={todayStr} onEnd={(res, p) => handleGameWinLose(res, p)} />}
                          </div>
                          
                          {(currGameSt.status === 'viewing_board' || (!currGameSt.isPlaying && currGameSt.status !== 'pending')) && (
                              <div className="absolute top-2 left-1/2 -translate-x-1/2 z-50 bg-black/80 backdrop-blur border border-sky-500 text-sky-300 px-4 py-2 rounded-full font-bold text-sm shadow-xl flex items-center gap-3">
                                 <span>เกมวันนี้จบลงแล้ว 👏</span>
                                 <button onClick={() => setGameAppSt(p => ({...p, [activeGameTab]: {...p[activeGameTab], showModal: true}}))} className="btn-b text-xs py-1">ดูใบสรุปผล</button>
                              </div>
                          )}
                      </>
                    )}

                    {currGameSt.showModal && (() => {
                      const myScore = gameScores.find(x => x.userId === currentUser?.id);
                      const finalStatus = myScore ? myScore.status : currGameSt.status;
                      const finalScore = myScore ? myScore.score : currGameSt.score;
                      const finalTime = myScore ? myScore.timeMs : currGameSt.time;

                      return (
                      <Modal title={finalStatus === 'won' || (finalStatus === 'ended' && finalScore > 0) ? '🎉 ยินดีด้วย!' : '💥 จบเกมแล้ว!'} onClose={() => setGameAppSt(p => ({...p, [activeGameTab]: {...p[activeGameTab], showModal: false, status: 'viewing_board'}}))}>
                        <div className="space-y-4">
                          <p className="text-slate-300 text-sm">
                            {finalStatus === 'won' && activeGameTab === 2 ? `สุดยอด! คุณทายถูกทั้งหมด ${finalScore}/3 ประเทศ` : 
                             finalStatus === 'won' && activeGameTab === 4 ? `ยินดีด้วย! คุณทายคำศัพท์สำเร็จใน ${finalScore} ครั้ง` : 
                             finalStatus === 'won' || (finalStatus === 'ended' && activeGameTab < 4) ? `คุณเคลียร์เกม ${GAMES[activeGameTab].name} สำเร็จ` : 
                             finalStatus === 'lost_bomb' ? `น่าเสียดาย! คุณพลาดเหยียบระเบิด พรุ่งนี้เอาใหม่นะ` : 
                             finalStatus === 'lost' && activeGameTab === 2 ? `คุณตอบพลาด! ทายถูกไปแค่ ${finalScore}/3 ประเทศ` :
                             finalStatus === 'lost' && activeGameTab === 4 ? `คุณทายคำศัพท์ไม่ถูกต้อง พรุ่งนี้ค่อยมาแก้มือนะ` :
                             finalStatus === 'ended' && activeGameTab === 5 ? `เกมโอเวอร์! คุณกินแอปเปิลไปได้ ${finalScore} 🍎` :
                             finalStatus === 'ended' && activeGameTab === 6 ? `จบเกม! คุณทำคะแนนรวมไปได้ ${finalScore} คะแนน` :
                             `จบเกม! โควตาวันนี้ของคุณหมดแล้ว`}
                          </p>
                          <div className="text-3xl font-mono font-bold text-amber-300 my-2">
                            {finalStatus === 'lost_bomb' || (finalStatus === 'lost' && activeGameTab !== 2 && activeGameTab !== 4) ? 'GAME OVER' : fmtTime(finalTime)}
                          </div>
                          {currGameSt.answer && activeGameTab === 4 && (
                            <div className="text-lg font-bold text-sky-300 my-2 bg-[#0F2547] p-2 rounded-lg border border-[#1E3A5F]">
                              คำที่ถูกต้อง: {currGameSt.answer}
                            </div>
                          )}
                          <button onClick={shareGameResult} className="btn-b w-full py-3 shadow hover:scale-105 transition-transform">📤 แชร์สถิติลงกระดานโพสต์</button>
                        </div>
                      </Modal>
                      );
                    })()}
                  </div>
                </div>
                </div>
              </main>

              <aside className={`absolute md:relative z-40 w-72 h-full bg-[#070C18] border-l border-[#1E3A5F] flex flex-col transition-transform duration-300 right-0 ${rightOpen ? 'translate-x-0' : 'translate-x-full md:translate-x-0 md:hidden md:w-0'}`}>
                <div className="p-2 border-b border-[#1E3A5F] flex">
                  <button onClick={() => setLbTab('daily')} className={`flex-1 py-2 text-xs font-bold rounded-lg ${lbTab==='daily'?'bg-white text-[#050811]':'text-slate-400'}`}>ประจำวัน</button>
                  <button onClick={() => setLbTab('monthly')} className={`flex-1 py-2 text-xs font-bold rounded-lg ${lbTab==='monthly'?'bg-amber-400 text-[#050811]':'text-slate-400'}`}>ยอดเยี่ยมประจำเดือน</button>
                </div>
                <div className="p-3 border-b border-[#1E3A5F] font-bold text-amber-300 flex items-center justify-between text-xs">
                  <span>🏆 อันดับ {GAMES[activeGameTab].name}</span>
                  <button onClick={() => setRightOpen(false)} className="md:hidden text-lg text-slate-400">✕</button>
                </div>
                <div className="flex-1 overflow-y-auto p-3 space-y-2 custom-scrollbar">
                  {(lbTab === 'daily' ? gameScores : monthlyScores).length === 0 ? <div className="text-center text-slate-500 text-xs py-8 border border-dashed border-[#1E3A5F] rounded-xl">ยังไม่มีคนมีสถิติ</div> : 
                   (lbTab === 'daily' ? gameScores : monthlyScores).map((s, i) => {
                    const isBomb = s.status === 'lost_bomb' || s.timeMs === Infinity;
                    const isLost = s.status === 'lost';
                    return (
                      <div key={s.userId} className={`flex justify-between items-center p-3 rounded-xl border shadow-sm ${isBomb||isLost ? 'bg-red-950/20 border-red-900/30' : 'bg-[#050811] border-[#1E3A5F]'}`}>
                        <div className="flex items-center gap-2.5">
                          <span className={`font-bold w-6 text-center text-sm ${i===0&&!isBomb&&!isLost?'text-yellow-400':i===1&&!isBomb&&!isLost?'text-slate-300':i===2&&!isBomb&&!isLost?'text-amber-600':'text-slate-500'}`}>{i+1}</span>
                          <div className="flex flex-col">
                            <span className="font-bold text-[13px] truncate w-20" title={s.displayName}>{s.displayName}</span>
                            {activeGameTab === 2 && <span className="text-[10px] text-slate-400">ถูก {s.score||0}/3</span>}
                            {activeGameTab === 4 && <span className="text-[10px] text-slate-400">ทาย {s.score||0} ครั้ง</span>}
                            {activeGameTab === 5 && <span className="text-[10px] text-slate-400">ใช้เวลา {fmtTime(s.timeMs)}</span>}
                            {activeGameTab === 6 && <span className="text-[10px] text-slate-400">สูงสุด [{s.maxTile||0}] 🟨</span>}
                            {activeGameTab === 8 && <span className="text-[10px] text-slate-400">{s.score > 0 ? `ทายถูกใน ${4 - s.score/100} ครั้ง` : 'วงจรระเบิด'}</span>}
                            {lbTab === 'monthly' && <span className="text-[9px] text-slate-500">{s.date}</span>}
                          </div>
                        </div>
                        <span className={`font-mono font-bold text-[13px] px-2 py-1 rounded-lg ${isBomb||isLost ? 'bg-red-900/40 text-red-400' : 'bg-sky-900/30 text-sky-300'}`}>
                          {isBomb ? '💥 Bomb' : isLost ? '❌ แพ้' : (activeGameTab === 6 ? `${s.score||0} pt` : activeGameTab === 5 ? `${s.score||0} 🍎` : fmtTime(s.timeMs))}
                        </span>
                      </div>
                    );
                  })}
                </div>
              </aside>
            </div>
          )}
          {/* CONTEXT MENUS (Right-click or Long-press) */}
          {ctxMenu && (
            <div style={{ top: ctxMenu.y + 'px', left: ctxMenu.x + 'px' }} onClick={(e) => e.stopPropagation()} className="fixed z-50 w-48 card border-2 border-white/40 shadow-2xl py-1 text-xs">
              <button onClick={() => { setRepMsg(ctxMenu.message); setCtxMenu(null); }} className="w-full px-3.5 py-1.5 text-left hover:bg-[#0F2547] text-sky-300 font-bold">↩️ ตอบกลับ</button>
              <button onClick={() => { navigator.clipboard.writeText(ctxMenu.mediaItem ? ctxMenu.mediaItem.url : ctxMenu.message.text || ''); setCtxMenu(null); }} className="w-full px-3.5 py-1.5 text-left hover:bg-[#0F2547]">📋 คัดลอก</button>
              <button onClick={() => { setFwdMsg(ctxMenu); setCtxMenu(null); }} className="w-full px-3.5 py-1.5 text-left hover:bg-[#0F2547]">↪️ ส่งต่อ...</button>
              {currentUser?.id === ctxMenu.message.senderId && !ctxMenu.mediaItem && <button onClick={() => { setEditMsg(ctxMenu.message); setChatIn(ctxMenu.message.text || ''); setCtxMenu(null); }} className="w-full px-3.5 py-1.5 text-left hover:bg-[#0F2547] text-amber-300">✎ แก้ไข</button>}
              {currentUser?.id === ctxMenu.message.senderId && <button onClick={async () => { await db.collection('bma_messages').doc(ctxMenu.message.id).update({ isDeleted: true, text: '', attachments: [] }); setCtxMenu(null); }} className="w-full px-3.5 py-1.5 text-left hover:bg-red-950 text-red-400">🚫 ยกเลิกข้อความ</button>}
              {activeRoom.type === 'dm' && !ctxMenu.message.isPinned && <button onClick={async () => { const prevPins = roomMsgs.filter(m => m.isPinned); for(const pm of prevPins) await db.collection('bma_messages').doc(pm.id).update({ isPinned: false }); await db.collection('bma_messages').doc(ctxMenu.message.id).update({ isPinned: true }); setCtxMenu(null); }} className="w-full px-3.5 py-1.5 text-left hover:bg-[#0F2547] text-amber-300 border-t border-[#1E3A5F] mt-1 pt-2">📌 ปักหมุดข้อความ</button>}
              {activeRoom.type === 'dm' && ctxMenu.message.isPinned && <button onClick={async () => { await db.collection('bma_messages').doc(ctxMenu.message.id).update({ isPinned: false }); setCtxMenu(null); }} className="w-full px-3.5 py-1.5 text-left hover:bg-red-950 text-red-400 border-t border-[#1E3A5F] mt-1 pt-2">📍 เลิกปักหมุด</button>}
            </div>
          )}

          {commMenu && (
            <div style={{ top: commMenu.y + 'px', left: commMenu.x + 'px' }} onClick={(e) => e.stopPropagation()} className="fixed z-50 w-44 card border-2 border-white/40 shadow-2xl py-1 text-xs">
              <button onClick={() => { setRepComm({ ...repComm, [commMenu.postId]: { ...commMenu.comment, labelNum: commMenu.lbl } }); setCommMenu(null); }} className="w-full px-3.5 py-1.5 text-left hover:bg-[#0F2547] text-sky-300 font-bold">↩️ ตอบกลับ</button>
              <button onClick={() => { toggleCommLike(commMenu.postId, commMenu.comment.id); setCommMenu(null); }} className="w-full px-3.5 py-1.5 text-left hover:bg-[#0F2547]">♥ ถูกใจ</button>
              <button onClick={() => { navigator.clipboard.writeText(commMenu.comment.text || ''); setCommMenu(null); }} className="w-full px-3.5 py-1.5 text-left hover:bg-[#0F2547]">📋 คัดลอก</button>
            </div>
          )}

          {/* SHARED POST / SINGLE POST VIEW */}
          {currentView === 'single_post' && (
            <div className="max-w-3xl mx-auto w-full px-4 py-8 min-h-0 flex flex-col h-full overflow-y-auto">
              <div className="mb-6 flex justify-between items-center bg-[#070C18] p-3 rounded-2xl border border-[#1E3A5F]">
                <div className="flex items-center gap-3">
                  <Logo s={30} />
                  <div className="font-bold text-lg text-amber-300">โพสต์ที่แชร์</div>
                </div>
                <button onClick={() => { window.history.replaceState({}, document.title, window.location.pathname); setCurrentView('home'); }} className="btn-w text-xs shadow-lg hover:scale-105 transition-transform">กลับสู่หน้าหลัก / เข้าสู่ระบบ</button>
              </div>
              
              <div className="space-y-4 pb-10">
                {posts.filter(p => p.id === sharedPostId).map((post) => {
                  if (!post.isGuestAllowed && !currentUser) return <div className="card p-8 text-center text-red-400 font-bold">🔒 โพสต์นี้อนุญาตให้อ่านได้เฉพาะสมาชิกที่เข้าสู่ระบบแล้วเท่านั้น</div>;
                  
                  const author = getAuthor(post.authorId), isLiked = currentUser && (post.likes || []).includes(currentUser.id), isBm = currentUser && (post.bookmarks || []).includes(currentUser.id);
                  const isClosed = post.poll?.closesAt && Date.now() > post.poll.closesAt, totalVotes = post.poll ? (post.poll.options || []).reduce((s, o) => s + (o.votes?.length || 0), 0) : 0;
                  const canManage = (uid) => currentUser?.role === 'admin' || currentUser?.role === 'mod' || currentUser?.id === uid;
                  const allComm = post.comments || [], rootComm = allComm.filter((c) => { const pid = c.parentId || c.replyTo?.id; return !pid || !allComm.some((x) => x.id === pid); });

                  return (
                        <article id={'post-' + post.id} key={post.id} className={'card p-5 space-y-3.5 shadow-2xl border border-sky-900/50'}>
                          {post.isPinned && <div className="text-amber-300 text-xs font-bold -mt-1 mb-1 border-b border-amber-900/30 pb-2">📌 โพสต์ปักหมุด</div>}
                          <div className="flex justify-between items-start gap-2">
                            <div onClick={() => setMemberModal(author)} className="flex items-center gap-2.5 cursor-pointer"><Avatar user={author} size="md" showStatus={true} /><div><div className="flex flex-wrap items-center gap-1.5"><span className="font-bold text-sm hover:underline">{author.displayName}</span><span className={`px-1.5 py-0.5 rounded font-mono text-[10px] font-bold ${author.id.startsWith('F') ? 'bg-[#38BDF8] text-[#050811]' : 'bg-white text-[#050811]'}`}>{author.id}</span><TagBadges user={author} /><RoleBadge role={author.role} /></div><div className="text-[11px] text-slate-400">@{author.username} • {post.createdAt}</div></div></div>
                            <div className="flex items-center gap-2 relative">
                              {!canManage(post.authorId) && <span className="px-2 py-0.5 rounded-full bg-[#050811] text-[10px] text-slate-400">{post.isGuestAllowed ? '🌐 Guest' : '🔒 สมาชิก'}</span>}
                              {canManage(post.authorId) && (
                                <button onClick={() => setPostMenu(postMenu === post.id ? null : post.id)} className="text-slate-400 hover:text-white px-2 font-bold">⋮</button>
                              )}
                              {postMenu === post.id && (
                                <div className="absolute top-6 right-0 w-48 card border border-white/20 shadow-2xl py-1 z-30 flex flex-col text-left">
                                  <button onClick={() => { setPostMenu(null); db.collection('bma_posts').doc(post.id).update({ isGuestAllowed: !post.isGuestAllowed }); }} className="w-full px-4 py-2 text-left hover:bg-[#0F2547] flex justify-between items-center">
                                    <span>{post.isGuestAllowed ? '🔒 เปลี่ยนเป็นเฉพาะสมาชิก' : '🌐 ให้ Guest อ่านได้'}</span>
                                  </button>
                                  <button onClick={() => { setPostMenu(null); handleEditPostReq(post); }} className="w-full px-4 py-2 text-left hover:bg-[#0F2547] text-amber-300">✎ แก้ไขโพสต์</button>
                                  <button onClick={() => { setPostMenu(null); if(confirm('ต้องการลบโพสต์นี้ใช่หรือไม่?')) { db.collection('bma_posts').doc(post.id).delete(); window.history.replaceState({}, document.title, window.location.pathname); setCurrentView('home'); } }} className="w-full px-4 py-2 text-left hover:bg-red-950 text-red-400">🗑️ ลบโพสต์</button>
                                </div>
                              )}
                            </div>
                          </div>
                          {post.title && <h3 className="text-base font-bold">{post.title}</h3>}
                          {post.content && <FormattedText text={post.content} currentUser={currentUser} />}
                          {post.tags?.length > 0 && (
                              <div className="flex flex-wrap gap-1.5 mt-2">
                                  {post.tags.map(t => (
                                      <button key={t} onClick={() => { setSearchQ(t); setCurrentView('feed'); }} className="px-2 py-0.5 bg-sky-900/30 text-sky-300 hover:bg-sky-700/50 rounded text-[10px] border border-sky-800 transition-colors shadow-sm">
                                          #{t}
                                      </button>
                                  ))}
                              </div>
                          )}

                          {post.dailyGameShare && (
                            <div className="p-3.5 card border-amber-400/50 flex flex-col gap-2 shadow-lg bg-[#0F2547]/50">
                              <div className="text-amber-300 font-bold">🎯 {GAMES[post.dailyGameShare.gameIndex]?.name || 'Daily Game'}</div>
                              <div className="text-sm">ผู้โพสต์ทำสถิติได้: <span className="font-mono text-white font-bold bg-black/40 px-2 py-0.5 rounded">
                                {post.dailyGameShare.score ? `สถิติ ${post.dailyGameShare.score} / ${fmtTime(post.dailyGameShare.timeMs)}` : fmtTime(post.dailyGameShare.timeMs)}
                              </span></div>
                              <button onClick={() => { window.history.replaceState({}, document.title, window.location.pathname); setActiveGameTab(post.dailyGameShare.gameIndex); setCurrentView('daily_game'); }} className="btn-w text-xs self-start mt-1 hover:scale-105 transition-transform">🎮 ตามไปเล่นเกมนี้เลย</button>
                            </div>
                          )}

                          {post.poll && (
                            <div className="p-3.5 rounded-xl bg-[#050811] border border-[#1E3A5F] space-y-2">
                              <div className="flex justify-between text-xs"><span className="font-bold">📊 {post.poll.question}</span><span className="text-slate-400">{post.poll.isAnonymous ? '🕵️ ไม่ระบุชื่อ' : '👁️ แสดงชื่อในคอมเมนต์'}</span></div>
                              {(post.poll.options || []).map((opt) => {
                                const voted = currentUser && (opt.votes || []).includes(currentUser.id);
                                return <button key={opt.id} disabled={isClosed} onClick={async () => { if (!currentUser) return alert('กรุณาเข้าสู่ระบบก่อนโหวต!'); const opts = post.poll.options.map((o) => ({ ...o, votes: (o.votes || []).filter((u) => u !== currentUser.id).concat(o.id === opt.id ? [currentUser.id] : []) })); await db.collection('bma_posts').doc(post.id).update({ poll: { ...post.poll, options: opts } }); }} className={voted ? 'w-full flex justify-between px-3.5 py-2 rounded-xl bg-white text-[#050811] font-bold text-xs' : 'w-full flex justify-between px-3.5 py-2 rounded-xl bg-[#0B1325] border border-[#1E3A5F] text-xs'}><span>{voted ? '✓ ' + opt.text : opt.text}</span><span>โหวต</span></button>;
                              })}
                            </div>
                          )}

                          {post.attachments?.length > 0 && <div className="space-y-2">{post.attachments.map((att) => <SmartMedia key={att.id} att={att} />)}</div>}

                          <div className="flex justify-between pt-2.5 border-t border-[#1E3A5F] text-xs">
                            <LikeButton likes={post.likes} currentUser={currentUser} getAuthor={getAuthor} onLike={() => { if(!currentUser) return; db.collection('bma_posts').doc(post.id).update({ likes: (post.likes||[]).includes(currentUser.id) ? post.likes.filter((i) => i !== currentUser.id) : [...(post.likes || []), currentUser.id] }); }} />
                            <div className="flex gap-2">
                               <button onClick={() => { const u = window.location.origin + window.location.pathname + '?post=' + post.id; navigator.clipboard.writeText(u); alert('คัดลอกลิงก์โพสต์นี้แล้ว!\n' + u); }} className="px-2 py-0.5 rounded-full bg-[#0B1325] border border-[#1E3A5F] text-[10px]">🔗 คัดลอกลิงก์แชร์</button>
                               <button onClick={async () => { if (!currentUser) return alert('เข้าสู่ระบบก่อนบันทึกโพสต์'); const b = post.bookmarks || []; await db.collection('bma_posts').doc(post.id).update({ bookmarks: b.includes(currentUser.id) ? b.filter((i) => i !== currentUser.id) : [...b, currentUser.id] }); }} className={isBm ? 'px-3 py-1 rounded-lg font-bold bg-white text-[#050811]' : 'btn-d py-1'}>{isBm ? '★ บันทึกแล้ว' : '☆ บันทึก'}</button>
                            </div>
                          </div>

                          <div className="pt-2.5 border-t border-[#1E3A5F]/60 space-y-2">
                            {post.poll && (
                              <div className="p-3 rounded-xl bg-[#050811] border border-sky-500/40 space-y-1.5 text-xs">
                                <div className="font-bold text-sky-300">📊 ผลโพลล์ในคอมเมนต์ (รวม {totalVotes} โหวต)</div>
                                {(post.poll.options || []).map((o) => {
                                  const c = o.votes?.length || 0, pct = totalVotes ? Math.round((c / totalVotes) * 100) : 0;
                                  return <div key={o.id}><div className="flex justify-between"><span>{o.text}</span><span className="font-mono">{c} โหวต ({pct}%)</span></div>{!post.poll.isAnonymous && c > 0 && <div className="text-[10px] text-slate-400">ผู้โหวต: {o.votes.map((u) => getAuthor(u).displayName).join(', ')}</div>}</div>;
                                })}
                              </div>
                            )}

                            <div className="space-y-2">
                              {rootComm.map((c, idx) => (
                                <PantipThread key={c.id} c={c} all={allComm} lbl={'ความเห็นที่ ' + (idx + 1)} postId={post.id} me={currentUser} getAuthor={getAuthor} canManage={canManage} onDel={async (pid, cid) => { const p = posts.find((x) => x.id === pid); if (p) await db.collection('bma_posts').doc(pid).update({ comments: (p.comments || []).filter((x) => x.id !== cid) }); }} onLike={toggleCommLike} onReply={(pid, comm, lbl) => setRepComm({ ...repComm, [pid]: { ...comm, labelNum: lbl } })} onCtx={setCommMenu} />
