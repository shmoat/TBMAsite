    const CHUNK_LEN = 700 * 1024;
    function compressImg(file) {
      return new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const c = document.createElement('canvas');
            let w = img.width, h = img.height, m = 1400;
            if (w > h && w > m) { h *= m / w; w = m; } else if (h > m) { w *= m / h; h = m; }
            c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
            res(c.toDataURL('image/jpeg', 0.82));
          };
          img.onerror = rej; img.src = e.target.result;
        };
        r.onerror = rej; r.readAsDataURL(file);
      });
    }

    async function uploadFileChunked(file) {
      if (file.size > 10 * 1024 * 1024) throw new Error('ไฟล์ "' + file.name + '" เกิน 10MB กรุณาแนบเป็นลิงก์ URL แทนครับ');
      const type = file.type.startsWith('image/') ? 'image' : file.type.startsWith('video/') ? 'video' : 'file';
      const dataUrl = type === 'image' ? await compressImg(file) : await new Promise((res, rej) => {
        const r = new FileReader(); r.onloadend = () => res(r.result); r.onerror = rej; r.readAsDataURL(file);
      });
      const id = 'att-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
      const size = file.size > 1048576 ? (file.size / 1048576).toFixed(2) + ' MB' : (file.size / 1024).toFixed(1) + ' KB';
      if (dataUrl.length <= CHUNK_LEN) return { id, name: file.name, type, url: dataUrl, isChunked: false, size };
      const chunkIds = [];
      for (let i = 0; i < Math.ceil(dataUrl.length / CHUNK_LEN); i++) {
        const cId = id + '_p' + i;
        await db.collection('bma_file_chunks').doc(cId).set({ id: cId, parentId: id, index: i, data: dataUrl.slice(i * CHUNK_LEN, (i + 1) * CHUNK_LEN) });
        chunkIds.push(cId);
      }
      return { id, name: file.name, type, url: '', isChunked: true, chunkIds, size };
    }

    function SmartMedia({ att, onContextMenu }) {
      const [url, setUrl] = useState(att.url || '');
      const [loading, setLoading] = useState(false);
      useEffect(() => {
        let m = true;
        if (att.isChunked && !url && att.chunkIds?.length) {
          setLoading(true);
          Promise.all(att.chunkIds.map((id) => db.collection('bma_file_chunks').doc(id).get())).then((docs) => {
            if (!m) return;
            setUrl(docs.map((d) => d.data()).filter(Boolean).sort((a, b) => a.index - b.index).map((s) => s.data).join(''));
            setLoading(false);
          }).catch(() => m && setLoading(false));
        } else if (att.url) setUrl(att.url);
        return () => { m = false; };
      }, [att]);

      if (loading) return <div className="p-3 rounded-xl bg-[#0B1325] border border-[#1E3A5F] text-xs text-sky-300 animate-pulse">⏳ กำลังโหลดไฟล์ "{att.name}" ({att.size})...</div>;

      const ytId = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]+)/)?.[1];

                          <Avatar user={m} size="sm" showStatus={true} /><div className="min-w-0 flex-1"><div className="text-xs font-bold truncate">{m.displayName}</div><div className="text-[10px] font-mono opacity-75">{m.id}</div></div>
                        </button>
                      ))}
                    </div>
                  </div>
                </aside>

                        </div>
                      );

                    const sender = getAuthor(msg.senderId);

                      <div key={msg.id} onContextMenu={(e) => { e.preventDefault(); e.stopPropagation(); if (!msg.isDeleted) setCtxMenu({ x: Math.min(e.clientX, window.innerWidth - 220), y: Math.min(e.clientY, window.innerHeight - 240), message: msg, mediaItem: null }); }} className="flex items-start gap-3 p-2 -mx-2 rounded-xl hover:bg-[#0B1325]/60">

                              </div>
                            </>
                          )}
                        </div>
                      </div>
                    );
                  })}

                      <button key={i} onClick={() => { const w = chatInput.split(/\s+/); if (w[w.length - 1]?.startsWith('@')) { w[w.length - 1] = m.token; setChatInput(w.join(' ') + ' '); } else setChatInput((chatInput ? chatInput + ' ' : '') + m.token + ' '); setMentionOpen(false); }} className="w-full flex justify-between px-3 py-1.5 rounded-xl hover:bg-[#0F2547] text-left text-xs">
                        <span className="font-mono font-bold">{m.label}</span><span className="text-slate-400">{m.sub}</span>
                      </button>
                    ))}
                  </div>

                    {uploading && <div className="text-xs text-sky-300 animate-pulse">⏳ กำลังประมวลผลไฟล์ขนาดใหญ่...</div>}

                      <div className="flex gap-2">

                        <input type="text" value={chatAttUrl} onChange={(e) => setChatAttUrl(e.target.value)} placeholder="วางลิงก์ Google Drive / YouTube / URL..." className="flex-1 bg-[#050811] border border-[#1E3A5F] rounded-lg px-3 py-1 text-xs" />

                      <button type="button" onClick={() => chatFileRef.current?.click()} className="px-2.5 py-1 rounded-lg bg-[#050811] border border-[#1E3A5F]">📎 แนบไฟล์ (10MB)</button>

                    <div className="flex gap-2">
                      <input type="text" value={chatInput} onChange={(e) => { const v = e.target.value; setChatInput(v); setTyping(v.trim().length > 0); clearTimeout(typingTimer.current); typingTimer.current = setTimeout(() => setTyping(false), 3500); const lw = v.split(/\s+/).pop() || ''; if (lw.startsWith('@')) { setMentionOpen(true); setMentionFilter(lw.slice(1).toLowerCase()); } else setMentionOpen(false); }} placeholder="พิมพ์ข้อความ... (คลิกขวาที่ข้อความเพื่อตอบกลับ/จัดการ)" className="flex-1 bg-[#050811] border border-[#1E3A5F] rounded-xl px-4 py-2.5 text-sm outline-none" />

                  <div className="p-2.5 border-b border-[#1E3A5F] flex flex-wrap gap-1">
                    {['ALL', ...allTags].map((t) => <button key={t} onClick={() => setRightTag(t)} className={rightTag === t ? 'px-2 py-0.5 rounded-full text-[10px] font-bold bg-white text-[#050811]' : 'px-2 py-0.5 rounded-full text-[10px] bg-[#050811] border border-[#1E3A5F]'}>{t === 'ALL' ? 'ทั้งหมด' : t}</button>)}

                      </div>

              <button onClick={() => { setReplyingMsg(ctxMenu.message); setCtxMenu(null); }} className="w-full px-4 py-2 text-left hover:bg-[#0F2547] text-sky-300 font-bold">↩️ ตอบกลับข้อความนี้</button>
              <button onClick={() => { toggleMsgLike(ctxMenu.message); setCtxMenu(null); }} className="w-full px-4 py-2 text-left hover:bg-[#0F2547]">♥ ถูกใจ / ยกเลิกถูกใจ</button>
              <button onClick={() => { navigator.clipboard.writeText(ctxMenu.mediaItem ? ctxMenu.mediaItem.url : ctxMenu.message.text || ''); setCtxMenu(null); }} className="w-full px-4 py-2 text-left hover:bg-[#0F2547]">📋 คัดลอก</button>
              <button onClick={() => { setForwardingMsg(ctxMenu); setCtxMenu(null); }} className="w-full px-4 py-2 text-left hover:bg-[#0F2547]">↪️ ส่งต่อ (Forward)...</button>
              {currentUser?.id === ctxMenu.message.senderId && !ctxMenu.mediaItem && <button onClick={() => { setEditingMsg(ctxMenu.message); setChatInput(ctxMenu.message.text || ''); setCtxMenu(null); }} className="w-full px-4 py-2 text-left hover:bg-[#0F2547] text-amber-300">✎ แก้ไขข้อความ</button>}
              {currentUser?.id === ctxMenu.message.senderId && <button onClick={async () => { await db.collection('bma_messages').doc(ctxMenu.message.id).update({ isDeleted: true, text: '', attachments: [] }); setCtxMenu(null); }} className="w-full px-4 py-2 text-left hover:bg-red-950 text-red-400">🚫 ยกเลิกข้อความ (ลบ)</button>}
            </div>
          )}

          {commentMenu && (
            <div style={{ top: commentMenu.y + 'px', left: commentMenu.x + 'px' }} onClick={(e) => e.stopPropagation()} className="fixed z-50 w-48 bg-[#0B1325] border-2 border-white/40 rounded-xl shadow-2xl py-1 text-xs">
              <button onClick={() => { setReplyingToComment({ ...replyingToComment, [commentMenu.postId]: commentMenu.comment }); setCommentMenu(null); }} className="w-full px-4 py-2 text-left hover:bg-[#0F2547] text-sky-300 font-bold">↩️ ตอบกลับคอมเมนต์นี้</button>
              <button onClick={() => { toggleCommentLike(commentMenu.postId, commentMenu.comment.id); setCommentMenu(null); }} className="w-full px-4 py-2 text-left hover:bg-[#0F2547]">♥ ถูกใจคอมเมนต์</button>
              <button onClick={() => { navigator.clipboard.writeText(commentMenu.comment.text || ''); setCommentMenu(null); }} className="w-full px-4 py-2 text-left hover:bg-[#0F2547]">📋 คัดลอกข้อความ</button>
            </div>
          )}

          {/* VIEW 5 & 6: FEED & ADMIN */}
          {(currentView === 'feed' || currentView === 'bookmarks' || currentView === 'admin') && (
            <div className="max-w-7xl mx-auto w-full px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1">
              <aside className="lg:col-span-4 xl:col-span-3 space-y-4">
                <div className="bg-[#0B1325] border border-[#1E3A5F] rounded-2xl p-2 space-y-1">
                  <button onClick={() => setCurrentView('feed')} className={currentView === 'feed' ? 'w-full flex justify-between px-4 py-2.5 rounded-xl text-xs font-bold bg-white text-[#050811]' : 'w-full flex justify-between px-4 py-2.5 rounded-xl text-xs text-slate-200 hover:bg-[#0F2547]'}><span>📝 กระดานโพสต์</span><span>{posts.length}</span></button>
                  <button onClick={() => currentUser ? setCurrentView('chat') : setCurrentView('login')} className="w-full flex justify-between px-4 py-2.5 rounded-xl text-xs text-slate-200 hover:bg-[#0F2547]"><span>💬 ห้องแชตสมาคม</span><span>Comms</span></button>
                  {currentUser && <button onClick={() => setCurrentView('bookmarks')} className={currentView === 'bookmarks' ? 'w-full flex justify-between px-4 py-2.5 rounded-xl text-xs font-bold bg-white text-[#050811]' : 'w-full flex justify-between px-4 py-2.5 rounded-xl text-xs text-slate-200 hover:bg-[#0F2547]'}><span>★ โพสต์ที่บันทึกไว้</span><span>{posts.filter((p) => (p.bookmarks || []).includes(currentUser.id)).length}</span></button>}
                  {currentUser?.role === 'admin' && <button onClick={() => setCurrentView('admin')} className={currentView === 'admin' ? 'w-full flex justify-between px-4 py-2.5 rounded-xl text-xs font-bold bg-white text-[#050811]' : 'w-full flex justify-between px-4 py-2.5 rounded-xl text-xs text-slate-200 hover:bg-[#0F2547]'}><span>👑 จัดการรหัส (Owner)</span><span>Admin</span></button>}
                </div>
              </aside>

              <main className="lg:col-span-8 xl:col-span-9 space-y-5">
                {currentView === 'admin' && currentUser?.role === 'admin' ? (
                  <div className="space-y-6">
                    <div className="bg-[#0B1325] border border-[#1E3A5F] rounded-2xl p-6 space-y-4">
                      <h2 className="text-base font-bold">👑 ออกรหัสประจำตัวสมาชิกใหม่ (เลือกได้หลายหมวดหมู่)</h2>
                      <form onSubmit={async (e) => { e.preventDefault(); const id = newMemberId.trim().toUpperCase(); if (!id || users.some((u) => u.id === id)) return alert('รหัสซ้ำ'); await db.collection('bma_users').doc(id).set({ id, memberTag: newMemberTags[0], memberTags: newMemberTags, role: 'member', isActivated: false, isOnline: false, username: '', password: '', displayName: 'รออนุมัติ (' + id + ')', bio: '', avatarUrl: '', socialLinks: [], usernameChangeHistory: [], joinedAt: new Date().toISOString().split('T')[0] }); }} className="space-y-3">
                        <div className="flex gap-2">
                          <input type="text" value={newMemberId} onChange={(e) => setNewMemberId(e.target.value)} className="bg-[#050811] border border-[#1E3A5F] rounded-xl px-4 py-2 text-sm font-mono uppercase" required />
                          <input type="text" value={customTag} onChange={(e) => setCustomTag(e.target.value)} placeholder="เพิ่มแท็กใหม่..." className="flex-1 bg-[#050811] border border-[#1E3A5F] rounded-xl px-3 py-2 text-sm" />
                          <button type="button" onClick={() => { if (customTag.trim() && !newMemberTags.includes(customTag.trim())) setNewMemberTags([...newMemberTags, customTag.trim()]); setCustomTag(''); }} className="px-3 py-2 rounded-xl bg-[#0F2547] text-xs font-bold">+ แท็ก</button>
                        </div>
                        <div className="flex flex-wrap gap-1.5">
                          {Array.from(new Set([...PRESET_TAGS, ...newMemberTags])).map((t) => (
                            <button type="button" key={t} onClick={() => setNewMemberTags(newMemberTags.includes(t) ? (newMemberTags.length > 1 ? newMemberTags.filter((x) => x !== t) : newMemberTags) : [...newMemberTags, t])} className={newMemberTags.includes(t) ? 'px-3 py-1 rounded-xl text-xs bg-white text-[#050811] font-bold' : 'px-3 py-1 rounded-xl text-xs bg-[#050811] border border-[#1E3A5F]'}>{newMemberTags.includes(t) ? '✓ ' + t : '+ ' + t}</button>
                          ))}
                        </div>
                        <button type="submit" className="px-5 py-2 rounded-xl bg-white text-[#050811] font-bold text-xs">+ สร้างรหัส Member ID</button>
                      </form>

                          <div className="flex flex-wrap gap-1.5">
                            <button onClick={() => { setEditingTagsUser(u); setEditingTagsList(getUserTags(u)); }} className="px-2.5 py-1 rounded-lg bg-[#0B1325] border border-[#1E3A5F] text-xs text-blue-200">🏷️ แก้หมวดหมู่</button>
                            {!u.isActivated && <button onClick={() => { navigator.clipboard.writeText('Member ID: ' + u.id + ' (' + getUserTags(u).join(', ') + ')'); setCopiedId(u.id); setTimeout(() => setCopiedId(null), 2000); }} className="px-2.5 py-1 rounded-lg bg-white text-[#050811] text-xs font-bold">{copiedId === u.id ? '✓ คัดลอกแล้ว' : 'คัดลอก ID'}</button>}

                            {u.role !== 'admin' && <button onClick={() => confirm('ลบ ' + u.id + '?') && db.collection('bma_users').doc(u.id).delete()} className="px-2 py-1 rounded-lg bg-black border border-[#1E3A5F] text-xs text-red-400">ลบ</button>}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                ) : (
                  <>
                    <div className="bg-[#0B1325] border border-[#1E3A5F] rounded-2xl p-4 space-y-3">
                      <div className="flex gap-2">
                        <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="ค้นหาโพสต์, โพลล์, ชื่อสมาชิก..." className="flex-1 bg-[#050811] border border-[#1E3A5F] rounded-xl px-4 py-2 text-sm outline-none" />
                        {currentUser && <button onClick={() => setIsCreatingPost(true)} className="px-4 py-2 rounded-xl bg-white text-[#050811] font-bold text-xs shrink-0">+ เขียนโพสต์ / โพลล์</button>}
                      </div>
                      <div className="flex gap-1.5 overflow-x-auto pb-1">
                        {['ALL', ...allTags].map((t) => <button key={t} onClick={() => setSelectedTagFilter(t)} className={selectedTagFilter === t ? 'px-3 py-1 rounded-full text-xs font-bold bg-white text-[#050811] shrink-0' : 'px-3 py-1 rounded-full text-xs bg-[#050811] border border-[#1E3A5F] shrink-0'}>{t === 'ALL' ? 'ทั้งหมด' : t}</button>)}
                      </div>
                    </div>

                    {filteredPosts.map((post) => {
                      const author = getAuthor(post.authorId);
                      const isLiked = currentUser && (post.likes || []).includes(currentUser.id);
                      const isBm = currentUser && (post.bookmarks || []).includes(currentUser.id);
                      const isClosed = post.poll?.closesAt && Date.now() > post.poll.closesAt;
                      const totalVotes = post.poll ? (post.poll.options || []).reduce((s, o) => s + (o.votes?.length || 0), 0) : 0;

                      return (
                        <article id={'post-' + post.id} key={post.id} className={'bg-[#0B1325] rounded-2xl p-6 space-y-4 ' + (highlightedPostId === post.id ? 'border-2 border-sky-400' : 'border border-[#1E3A5F]')}>
                          <div className="flex justify-between items-start">
                            <div onClick={() => setSelectedMemberModal(author)} className="flex items-center gap-3 cursor-pointer">
                              <Avatar user={author} size="md" showStatus={true} />
                              <div><div className="flex items-center gap-2"><span className="font-bold text-sm hover:underline">{author.displayName}</span><span className="px-2 py-0.5 rounded bg-white text-[#050811] font-mono text-[10px] font-bold">{author.id}</span><TagBadges user={author} /><RoleBadge role={author.role} /></div><div className="text-xs text-slate-400">@{author.username} • {post.createdAt}</div></div>
                            </div>
                            <div className="flex gap-2">
                              {(currentUser?.role === 'admin' || currentUser?.role === 'mod' || currentUser?.id === post.authorId) && <button onClick={() => confirm('ลบโพสต์นี้?') && db.collection('bma_posts').doc(post.id).delete()} className="text-xs text-slate-400 hover:text-red-400">ลบโพสต์</button>}
                            </div>
                          </div>
                          {post.title && <h3 className="text-lg font-bold">{post.title}</h3>}
                          {post.content && <p className="text-sm text-slate-200 whitespace-pre-line">{post.content}</p>}

                          {post.poll && (
                            <div className="p-4 rounded-xl bg-[#050811] border border-[#1E3A5F] space-y-2.5">
                              <div className="flex justify-between text-xs"><span className="font-bold">📊 {post.poll.question}</span><span className="text-slate-400">{post.poll.isAnonymous ? '🕵️ ไม่ระบุชื่อ' : '👁️ แสดงชื่อในคอมเมนต์'}</span></div>
                              {(post.poll.options || []).map((opt) => {
                                const voted = currentUser && (opt.votes || []).includes(currentUser.id);
                                return (
                                  <button key={opt.id} disabled={isClosed} onClick={async () => { if (!currentUser) return setCurrentView('login'); const opts = post.poll.options.map((o) => ({ ...o, votes: (o.votes || []).filter((u) => u !== currentUser.id).concat(o.id === opt.id ? [currentUser.id] : []) })); await db.collection('bma_posts').doc(post.id).update({ poll: { ...post.poll, options: opts } }); }} className={voted ? 'w-full flex justify-between px-4 py-2 rounded-xl bg-white text-[#050811] font-bold text-xs' : 'w-full flex justify-between px-4 py-2 rounded-xl bg-[#0B1325] border border-[#1E3A5F] text-xs'}>
                                    <span>{voted ? '✓ ' + opt.text : opt.text}</span><span>โหวต</span>
                                  </button>
                                );
                              })}
                            </div>
                          )}

                          {post.attachments?.length > 0 && <div className="space-y-2">{post.attachments.map((att) => <SmartMedia key={att.id} att={att} />)}</div>}

                          <div className="flex justify-between pt-3 border-t border-[#1E3A5F]">
                            <button onClick={async () => { if (!currentUser) return setCurrentView('login'); const l = post.likes || []; await db.collection('bma_posts').doc(post.id).update({ likes: l.includes(currentUser.id) ? l.filter((i) => i !== currentUser.id) : [...l, currentUser.id] }); }} className={isLiked ? 'px-3 py-1 rounded-lg text-xs font-bold bg-white text-[#050811]' : 'px-3 py-1 rounded-lg text-xs bg-[#050811] border border-[#1E3A5F]'}>♥ ถูกใจ ({post.likes?.length || 0})</button>
                            <button onClick={async () => { if (!currentUser) return setCurrentView('login'); const b = post.bookmarks || []; await db.collection('bma_posts').doc(post.id).update({ bookmarks: b.includes(currentUser.id) ? b.filter((i) => i !== currentUser.id) : [...b, currentUser.id] }); }} className={isBm ? 'px-3 py-1 rounded-lg text-xs font-bold bg-white text-[#050811]' : 'px-3 py-1 rounded-lg text-xs bg-[#050811] border border-[#1E3A5F]'}>{isBm ? '★ บันทึกแล้ว' : '☆ บันทึก'}</button>
                          </div>

                          <div className="pt-3 border-t border-[#1E3A5F]/60 space-y-2">
                            {post.poll && (
                              <div className="p-3.5 rounded-xl bg-[#050811] border border-sky-500/40 space-y-2 text-xs">
                                <div className="font-bold text-sky-300">📊 ผลโพลล์ในคอมเมนต์ (รวม {totalVotes} โหวต)</div>
                                {(post.poll.options || []).map((o) => {
                                  const c = o.votes?.length || 0, pct = totalVotes ? Math.round((c / totalVotes) * 100) : 0;
                                  return (
                                    <div key={o.id}>
                                      <div className="flex justify-between"><span>{o.text}</span><span className="font-mono">{c} โหวต ({pct}%)</span></div>
                                      {!post.poll.isAnonymous && c > 0 && <div className="text-[10px] text-slate-400">ผู้โหวต: {o.votes.map((u) => getAuthor(u).displayName).join(', ')}</div>}
                                    </div>
                                  );
                                })}
                              </div>
                            )}

                            {(post.comments || []).map((c) => {
                              const ca = getAuthor(c.authorId);
                              const cLiked = currentUser && (c.likes || []).includes(currentUser.id);
                              return (
                                <div key={c.id} onContextMenu={(e) => { e.preventDefault(); e.stopPropagation(); setCommentMenu({ x: e.clientX, y: e.clientY, postId: post.id, comment: c }); }} className="p-3 rounded-xl bg-[#050811] border border-[#1E3A5F] text-xs flex items-start gap-2.5">
                                  <Avatar user={ca} size="xs" />
                                  <div className="flex-1 min-w-0">
                                    <div className="flex justify-between"><span className="font-bold">{ca.displayName}</span><span className="text-[10px] text-slate-500">{c.createdAt}</span></div>
                                    {c.replyTo && <div className="mt-1 px-2 py-0.5 rounded bg-[#0B1325] border-l-2 border-sky-400 text-[10px] text-slate-300"><strong className="text-sky-300">↩️ ตอบกลับ {c.replyTo.authorName}:</strong> {c.replyTo.text}</div>}
                                    <p className="text-slate-200 mt-1">{c.text}</p>
                                    <div className="flex gap-2 mt-1.5">
                                      <button onClick={() => toggleCommentLike(post.id, c.id)} className={cLiked ? 'px-2 py-0.5 rounded-full bg-white text-[#050811] text-[10px] font-bold' : 'px-2 py-0.5 rounded-full bg-[#0B1325] border border-[#1E3A5F] text-[10px]'}>♥ ถูกใจ {c.likes?.length ? '(' + c.likes.length + ')' : ''}</button>
                                      <button onClick={() => setReplyingToComment({ ...replyingToComment, [post.id]: c })} className="px-2 py-0.5 rounded-full bg-[#0B1325] border border-[#1E3A5F] text-[10px]">↩️ ตอบกลับ</button>
                                    </div>
                                  </div>
                                </div>
                              );
                            })}

                            {currentUser && (
                              <div className="space-y-1.5 pt-1">
                                {replyingToComment[post.id] && (
                                  <div className="flex justify-between px-3 py-1 rounded bg-sky-950/60 text-[11px] text-sky-200">
                                    <span>↩️ ตอบกลับ {getAuthor(replyingToComment[post.id].authorId).displayName}</span>
                                    <button onClick={() => setReplyingToComment({ ...replyingToComment, [post.id]: null })}>✕</button>
                                  </div>
                                )}
                                <div className="flex gap-2">
                                  <input type="text" value={commentInputs[post.id] || ''} onChange={(e) => setCommentInputs({ ...commentInputs, [post.id]: e.target.value })} onKeyDown={(e) => e.key === 'Enter' && handleAddComment(post.id)} placeholder="แสดงความคิดเห็น... (คลิกขวาที่คอมเมนต์เพื่อตอบกลับ)" className="flex-1 bg-[#050811] border border-[#1E3A5F] rounded-xl px-3.5 py-2 text-xs outline-none" />
                                  <button onClick={() => handleAddComment(post.id)} className="px-4 py-2 rounded-xl bg-[#0F2547] text-xs font-bold">ส่ง</button>
                                </div>
                              </div>
                            )}
                          </div>
                        </article>
                      );
                    })}
                  </>
                )}
              </main>
            </div>
          )}

          {/* MODALS */}
          {forwardingMsg && (
            <Modal title="↪️ ส่งต่อข้อความ / ไฟล์ไปยัง..." onClose={() => setForwardingMsg(null)}>
              <div className="max-h-72 overflow-y-auto space-y-2">
                {channels.filter((c) => !c.isSystemReadOnly).map((c) => (
                  <button key={c.id} onClick={async () => { const now = Date.now(), id = 'msg-' + now; await db.collection('bma_messages').doc(id).set({ id, roomKey: c.id, senderId: currentUser.id, text: forwardingMsg.mediaItem ? '↪️ [ส่งต่อไฟล์]' : '↪️ ' + forwardingMsg.message.text, attachments: forwardingMsg.mediaItem ? [forwardingMsg.mediaItem] : (forwardingMsg.message.attachments || []), likes: [], readBy: [currentUser.id], time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }), timestamp: now, serverCreatedAt: svrTs() }); setForwardingMsg(null); setActiveRoom({ type: 'channel', id: c.id }); }} className="w-full flex justify-between p-2.5 rounded-xl bg-[#050811] border border-[#1E3A5F] text-xs">
                    <span>{c.icon} # {c.name}</span><span className="font-bold">ส่งต่อ</span>
                  </button>
                ))}
                {activeMembers.filter((m) => m.id !== currentUser?.id).map((m) => (
                  <button key={m.id} onClick={async () => { const now = Date.now(), id = 'msg-' + now; await db.collection('bma_messages').doc(id).set({ id, roomKey: dmKey(currentUser.id, m.id), senderId: currentUser.id, receiverId: m.id, text: forwardingMsg.mediaItem ? '↪️ [ส่งต่อไฟล์]' : '↪️ ' + forwardingMsg.message.text, attachments: forwardingMsg.mediaItem ? [forwardingMsg.mediaItem] : (forwardingMsg.message.attachments || []), likes: [], readBy: [currentUser.id], time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }), timestamp: now, serverCreatedAt: svrTs() }); setForwardingMsg(null); setActiveRoom({ type: 'dm', id: m.id }); }} className="w-full flex justify-between p-2.5 rounded-xl bg-[#050811] border border-[#1E3A5F] text-xs">
                    <span>{m.displayName} ({m.id})</span><span className="font-bold">ส่งต่อ</span>
                  </button>
                ))}
              </div>
            </Modal>
          )}

          {notifOpen && currentUser && (
            <Modal title="🔔 ศูนย์จัดการการแจ้งเตือนทั้งหมด" onClose={() => setNotifOpen(false)} maxW="max-w-xl">
              <div className="space-y-4">
                <div className="flex justify-between items-center p-3 rounded-xl bg-[#050811] border border-[#1E3A5F] text-xs">
                  <span>📱 แจ้งเตือนเดสก์ท็อป/มือถือ: {pushPerm === 'granted' ? '✓ เปิดแล้ว' : 'ยังไม่เปิด'}</span>
                  {pushPerm !== 'granted' && <button onClick={async () => { if (typeof Notification !== 'undefined') setPushPerm(await Notification.requestPermission()); }} className="px-3 py-1 rounded-lg bg-white text-[#050811] font-bold">ขออนุญาตแจ้งเตือน</button>}
                </div>
                <div className="flex justify-between">
                  <div className="flex gap-1">
                    {[['posts', '📝 โพสต์'], ['messages', '💬 ข้อความ'], ['settings', '🔕 ตั้งค่าปิดเสียง']].map(([k, l]) => (
                      <button key={k} onClick={() => setNotifTab(k)} className={notifTab === k ? 'px-3 py-1.5 rounded-lg text-xs font-bold bg-white text-[#050811]' : 'px-3 py-1.5 rounded-lg text-xs bg-[#050811]'}>{l}</button>
                    ))}
                  </div>
                  {notifTab !== 'settings' && <button onClick={() => unreadNotifs.forEach((n) => db.collection('bma_notifications').doc(n.id).update({ readBy: Array.from(new Set([...(n.readBy || []), currentUser.id])) }))} className="text-xs text-sky-300 font-bold">✓ อ่านแล้วทั้งหมด</button>}
                </div>
                {notifTab === 'settings' ? (
                  <div className="space-y-2 text-xs">
                    {[['muteOwnPosts', 'ปิดแจ้งเตือนโพสต์ของตนเอง'], ['muteGlobalChat', 'ปิดแจ้งเตือนช่องหลัก (Global)'], ['mutePrivateChat', 'ปิดแจ้งเตือนแชตกลุ่ม/ส่วนตัว']].map(([k, label]) => (
                      <div key={k} className="p-3 rounded-xl bg-[#050811] border border-[#1E3A5F] flex justify-between items-center">
                        <span>{label}</span>
                        <button onClick={() => db.collection('bma_users').doc(currentUser.id).update({ notifPrefs: { ...(currentUser.notifPrefs || {}), [k]: !currentUser.notifPrefs?.[k] } })} className={currentUser.notifPrefs?.[k] ? 'px-3 py-1 rounded bg-red-600 font-bold' : 'px-3 py-1 rounded bg-[#0F2547]'}>{currentUser.notifPrefs?.[k] ? '🔕 ปิดอยู่' : '🔔 เปิดอยู่'}</button>
                      </div>
                    ))}
                  </div>
                ) : (
                  <div className="max-h-72 overflow-y-auto space-y-2">
                    {myNotifs.filter((n) => n.category === notifTab).map((n) => (
                      <div key={n.id} onClick={() => { db.collection('bma_notifications').doc(n.id).update({ readBy: Array.from(new Set([...(n.readBy || []), currentUser.id])) }); setNotifOpen(false); if (n.targetPostId) jumpToPost(n.targetPostId); else if (n.targetRoomType) { setActiveRoom({ type: n.targetRoomType, id: n.targetRoomId }); setCurrentView('chat'); } }} className="p-3 rounded-xl bg-[#050811] border border-[#1E3A5F] cursor-pointer flex justify-between items-center text-xs">
                        <div><div className="font-bold">{n.title}</div><div className="text-slate-300">{n.body}</div></div><span className="text-sky-400 shrink-0">เปิดดู →</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </Modal>
          )}

          {selectedMemberModal && (
            <Modal title={'โปรไฟล์สมาชิก: ' + selectedMemberModal.id} onClose={() => setSelectedMemberModal(null)}>
              <div className="text-center space-y-4">
                <div className="flex justify-center"><Avatar user={selectedMemberModal} size="xl" showStatus={true} /></div>
                <div className="flex justify-center"><TagBadges user={selectedMemberModal} /></div>
                <div><h3 className="text-lg font-bold">{selectedMemberModal.displayName}</h3><p className="text-xs font-mono text-slate-400">@{selectedMemberModal.username}</p></div>
                <p className="text-xs bg-[#050811] p-3.5 rounded-xl border border-[#1E3A5F] text-left">{selectedMemberModal.bio || 'ยังไม่ได้ระบุคำอธิบายตัวตน'}</p>
                {selectedMemberModal.socialLinks?.length > 0 && (
                  <div className="flex flex-wrap gap-2">
                    {selectedMemberModal.socialLinks.map((s) => (
                      <a key={s.id} href={s.url} target="_blank" rel="noreferrer" className="px-3 py-1.5 rounded-xl bg-[#050811] border border-[#1E3A5F] text-xs">{SOCIALS.find((x) => x.id === s.platform)?.icon || '🔗'} {s.label} ↗</a>
                    ))}
                  </div>
                )}
                {currentUser?.id !== selectedMemberModal.id && (
                  <button onClick={() => { if (!currentUser) return setCurrentView('login'); if (!openedDms.includes(selectedMemberModal.id)) setOpenedDms([...openedDms, selectedMemberModal.id]); setSelectedMemberModal(null); setActiveRoom({ type: 'dm', id: selectedMemberModal.id }); setCurrentView('chat'); }} className="w-full py-2.5 rounded-xl bg-white text-[#050811] font-bold text-xs">💬 ส่งข้อความส่วนตัว (DM)</button>
                )}
              </div>
            </Modal>
          )}

          {isEditingProfile && currentUser && (
            <Modal title="ตั้งค่าโปรไฟล์, Username, รหัสผ่าน & โซเชียล" onClose={() => setIsEditingProfile(false)} maxW="max-w-lg">
              <form onSubmit={handleSaveProfile} className="space-y-3.5 text-xs">
                <div className="flex items-center gap-4 p-3 rounded-xl bg-[#050811] border border-[#1E3A5F]">
                  <Avatar user={{ ...currentUser, displayName: editName, avatarUrl: editAvatar }} size="lg" />
                  <input type="file" accept="image/*" ref={avatarRef} onChange={async (e) => { const f = e.target.files?.[0]; if (f) setEditAvatar(await compressImg(f)); }} className="hidden" />
                  <button type="button" onClick={() => avatarRef.current?.click()} className="px-3 py-1.5 rounded-lg bg-white text-[#050811] font-bold">📁 เปลี่ยนรูปโปรไฟล์</button>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div><label className="block mb-1">ชื่อที่แสดง *</label><input type="text" value={editName} onChange={(e) => setEditName(e.target.value)} className="w-full bg-[#050811] border border-[#1E3A5F] rounded-xl px-3 py-2" required /></div>
                  <div><label className="block mb-1">Username (เหลือ {Math.max(0, 2 - recentNameChanges(currentUser).length)}/2 ครั้งใน 14 วัน)</label><input type="text" value={editUser} onChange={(e) => setEditUser(e.target.value)} className="w-full bg-[#050811] border border-[#1E3A5F] rounded-xl px-3 py-2 font-mono" required /></div>
                </div>
                <div>
                  <label className="block mb-1">รหัสผ่าน *</label>
                  <div className="relative flex items-center">
                    <input type={showPass ? 'text' : 'password'} value={editPass} onChange={(e) => setEditPass(e.target.value)} className="w-full bg-[#050811] border border-[#1E3A5F] rounded-xl pl-3 pr-20 py-2 font-mono" required />
                    <button type="button" onClick={() => setShowPass(!showPass)} className="absolute right-2 px-2 py-1 rounded bg-[#0B1325]">{showPass ? '🙈 ซ่อน' : '👁️ ดูรหัส'}</button>
                  </div>
                </div>
                <textarea rows={2} value={editBio} onChange={(e) => setEditBio(e.target.value)} placeholder="Bio..." className="w-full bg-[#050811] border border-[#1E3A5F] rounded-xl p-3" />
                <div className="p-3 rounded-xl bg-[#050811] border border-[#1E3A5F] space-y-2">
                  <div className="font-bold">🔗 ลิงก์ Social Media</div>
                  <div className="flex gap-1.5">
                    <select value={socPlat} onChange={(e) => setSocPlat(e.target.value)} className="bg-[#0B1325] border border-[#1E3A5F] rounded-lg px-2 py-1">{SOCIALS.map((s) => <option key={s.id} value={s.id}>{s.icon} {s.id}</option>)}</select>
                    <input type="text" value={socLabel} onChange={(e) => setSocLabel(e.target.value)} placeholder="ชื่อปุ่ม..." className="w-28 bg-[#0B1325] border border-[#1E3A5F] rounded-lg px-2 py-1" />
                    <input type="text" value={socUrl} onChange={(e) => setSocUrl(e.target.value)} placeholder="URL..." className="flex-1 bg-[#0B1325] border border-[#1E3A5F] rounded-lg px-2 py-1" />
                    <button type="button" onClick={() => { if (socUrl.trim()) { setEditSocials([...editSocials, { id: 's-' + Date.now(), platform: socPlat, label: socLabel.trim() || socPlat, url: safeUrl(socUrl) }]); setSocUrl(''); setSocLabel(''); } }} className="px-3 py-1 rounded-lg bg-white text-[#050811] font-bold">เพิ่ม</button>
                  </div>
                  {editSocials.map((s) => <div key={s.id} className="flex justify-between px-2 py-1 rounded bg-[#0B1325]"><span>{s.label}: {s.url}</span><button type="button" onClick={() => setEditSocials(editSocials.filter((x) => x.id !== s.id))} className="text-red-400">ลบ</button></div>)}
                </div>
                {profErr && <div className="p-2.5 rounded-xl bg-red-950 text-red-200">{profErr}</div>}
                <button type="submit" className="w-full py-2.5 rounded-xl bg-white text-[#050811] font-bold">บันทึกโปรไฟล์</button>
              </form>
            </Modal>
          )}

          {editingTagsUser && (
            <Modal title={'🏷️ แก้ไขหมวดหมู่: ' + editingTagsUser.displayName} onClose={() => setEditingTagsUser(null)}>
              <div className="space-y-4">
                <div className="flex flex-wrap gap-2">
                  {allTags.map((t) => (
                    <button key={t} onClick={() => setEditingTagsList(editingTagsList.includes(t) ? (editingTagsList.length > 1 ? editingTagsList.filter((x) => x !== t) : editingTagsList) : [...editingTagsList, t])} className={editingTagsList.includes(t) ? 'px-3 py-1.5 rounded-xl text-xs bg-white text-[#050811] font-bold' : 'px-3 py-1.5 rounded-xl text-xs bg-[#050811] border border-[#1E3A5F]'}>{editingTagsList.includes(t) ? '✓ ' + t : '+ ' + t}</button>
                  ))}
                </div>
                <button onClick={async () => { await db.collection('bma_users').doc(editingTagsUser.id).update({ memberTags: editingTagsList, memberTag: editingTagsList[0] }); setEditingTagsUser(null); }} className="w-full py-2.5 rounded-xl bg-white text-[#050811] font-bold text-xs">บันทึกหมวดหมู่</button>
              </div>
            </Modal>
          )}

          {isCreatingPost && (
            <Modal title="เขียนโพสต์ใหม่ / สร้างโพลล์" onClose={() => setIsCreatingPost(false)} maxW="max-w-xl">
              <form onSubmit={handleCreatePost} className="space-y-3.5 text-xs">
                <input type="text" value={postTitle} onChange={(e) => setPostTitle(e.target.value)} placeholder="หัวข้อเรื่อง (ไม่บังคับ)..." className="w-full bg-[#050811] border border-[#1E3A5F] rounded-xl px-3.5 py-2 text-sm" />
                <textarea rows={3} value={postContent} onChange={(e) => setPostContent(e.target.value)} placeholder="เนื้อหาโพสต์..." className="w-full bg-[#050811] border border-[#1E3A5F] rounded-xl p-3.5 text-sm" />
                <div className="p-3.5 rounded-xl bg-[#050811] border border-[#1E3A5F] space-y-2.5">
                  <div className="flex justify-between items-center"><span className="font-bold">📊 โพลล์สำรวจความคิดเห็น</span><button type="button" onClick={() => setHasPoll(!hasPoll)} className="px-2.5 py-1 rounded bg-[#0F2547]">{hasPoll ? '✓ เปิดโพลล์แล้ว' : '+ เพิ่มโพลล์'}</button></div>
                  {hasPoll && (
                    <div className="space-y-2 pt-2 border-t border-[#1E3A5F]">
                      <input type="text" value={pollQ} onChange={(e) => setPollQ(e.target.value)} placeholder="คำถามโพลล์ *" className="w-full bg-[#0B1325] border border-[#1E3A5F] rounded-lg px-3 py-1.5" />
                      {pollOpts.map((o, i) => <input key={i} type="text" value={o} onChange={(e) => { const n = [...pollOpts]; n[i] = e.target.value; setPollOpts(n); }} placeholder={'ตัวเลือกที่ ' + (i + 1)} className="w-full bg-[#0B1325] border border-[#1E3A5F] rounded-lg px-3 py-1.5" />)}
                      <button type="button" onClick={() => setPollOpts([...pollOpts, ''])} className="px-2.5 py-1 rounded bg-[#0F2547]">+ เพิ่มตัวเลือก</button>
                      <div className="flex justify-between items-center pt-1">
                        <input type="datetime-local" value={pollClose} onChange={(e) => setPollClose(e.target.value)} className="bg-[#0B1325] border border-[#1E3A5F] rounded-lg px-2 py-1" />
                        <label className="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" checked={pollAnon} onChange={(e) => setPollAnon(e.target.checked)} /> 🕵️ โหวตไม่แสดงชื่อ</label>
                      </div>
                    </div>
                  )}
                </div>
                <div className="p-3.5 rounded-xl bg-[#050811] border border-[#1E3A5F] space-y-2">
                  <div className="flex justify-between items-center">
                    <span>📎 แนบไฟล์ (สูงสุด 10MB) หรือวางลิงก์วิดีโอ</span>
                    <input type="file" multiple ref={postFileRef} onChange={async (e) => { const fl = Array.from(e.target.files || []); e.target.value = ''; setUploading(true); for (const f of fl) { try { const a = await uploadFileChunked(f); setPostAtts((p) => [...p, a]); } catch (err) { alert(err.message); } } setUploading(false); }} className="hidden" />
                    <button type="button" onClick={() => postFileRef.current?.click()} className="px-3 py-1 rounded bg-[#0F2547] font-bold">+ เลือกไฟล์จากเครื่อง</button>
                  </div>
                  {uploading && <div className="text-sky-300 animate-pulse">⏳ กำลังประมวลผลไฟล์ขนาดใหญ่...</div>}
                  <div className="flex gap-1.5">
                    <select value={attType} onChange={(e) => setAttType(e.target.value)} className="bg-[#0B1325] border border-[#1E3A5F] rounded-lg px-2 py-1"><option value="image">รูปภาพ</option><option value="video">วิดีโอ (Drive/YouTube)</option><option value="file">ไฟล์</option></select>
                    <input type="text" value={attUrl} onChange={(e) => setAttUrl(e.target.value)} placeholder="วางลิงก์ Google Drive / YouTube / URL..." className="flex-1 bg-[#0B1325] border border-[#1E3A5F] rounded-lg px-2.5 py-1" />
                    <button type="button" onClick={() => { if (attUrl.trim()) { setPostAtts([...postAtts, { id: 'att-' + Date.now(), name: 'Media Link', type: attType, url: attUrl.trim(), size: 'Link' }]); setAttUrl(''); } }} className="px-3 py-1 rounded bg-white text-[#050811] font-bold">เพิ่มลิงก์</button>
                  </div>
                  {postAtts.map((a) => <div key={a.id} className="flex justify-between px-2 py-1 rounded bg-[#0B1325]"><span>{a.name} ({a.size})</span><button type="button" onClick={() => setPostAtts(postAtts.filter((x) => x.id !== a.id))} className="text-red-400">ลบ</button></div>)}
                </div>
                <button type="submit" className="w-full py-2.5 rounded-xl bg-white text-[#050811] font-bold">เผยแพร่โพสต์</button>
              </form>
            </Modal>
          )}

          {createChOpen && (
            <Modal title="🛡️ สร้างห้อง Global Chat ใหม่" onClose={() => setCreateChOpen(false)}>
              <form onSubmit={async (e) => { e.preventDefault(); const n = chName.trim().toLowerCase().replace(/\s+/g, '-'); if (!n) return; const id = 'global-' + Date.now(); await db.collection('bma_channels').doc(id).set({ id, name: n, icon: chIcon || '💬', desc: chDesc.trim() || 'ห้องสนทนากลาง', createdBy: currentUser.id, isProtected: false, isSystemReadOnly: false, timestamp: Date.now(), serverCreatedAt: svrTs() }); setActiveRoom({ type: 'channel', id }); setChName(''); setChDesc(''); setCreateChOpen(false); }} className="space-y-3 text-xs">
                <div className="flex gap-2">
                  <input type="text" value={chIcon} onChange={(e) => setChIcon(e.target.value)} className="w-16 bg-[#050811] border border-[#1E3A5F] rounded-xl p-2 text-center" />
                  <input type="text" value={chName} onChange={(e) => setChName(e.target.value)} placeholder="ชื่อห้อง..." className="flex-1 bg-[#050811] border border-[#1E3A5F] rounded-xl px-3 py-2" required />
                </div>
                <input type="text" value={chDesc} onChange={(e) => setChDesc(e.target.value)} placeholder="คำอธิบายห้อง..." className="w-full bg-[#050811] border border-[#1E3A5F] rounded-xl px-3 py-2" />
                <button type="submit" className="w-full py-2.5 rounded-xl bg-white text-[#050811] font-bold">สร้างห้องแชตรวม</button>
              </form>
            </Modal>
          )}

          {createGrpOpen && currentUser && (
            <Modal title="👥 สร้างกลุ่มแชตใหม่" onClose={() => setCreateGrpOpen(false)}>
              <form onSubmit={async (e) => { e.preventDefault(); if (!grpName.trim() || !grpMembers.length) return alert('กรุณาตั้งชื่อและเลือกสมาชิก'); const id = 'grp-' + Date.now(); await db.collection('bma_groups').doc(id).set({ id, name: grpName.trim(), members: Array.from(new Set([currentUser.id, ...grpMembers])), createdBy: currentUser.id, isArchived: false, timestamp: Date.now(), serverCreatedAt: svrTs() }); setActiveRoom({ type: 'group', id }); setGrpName(''); setGrpMembers([]); setCreateGrpOpen(false); }} className="space-y-3 text-xs">
                <input type="text" value={grpName} onChange={(e) => setGrpName(e.target.value)} placeholder="ชื่อกลุ่มแชต *" className="w-full bg-[#050811] border border-[#1E3A5F] rounded-xl px-3.5 py-2" required />
                <div className="max-h-52 overflow-y-auto space-y-1.5 p-2 rounded-xl bg-[#050811] border border-[#1E3A5F]">
                  {activeMembers.filter((m) => m.id !== currentUser.id).map((m) => (
                    <div key={m.id} onClick={() => setGrpMembers(grpMembers.includes(m.id) ? grpMembers.filter((i) => i !== m.id) : [...grpMembers, m.id])} className={grpMembers.includes(m.id) ? 'p-2 rounded-xl bg-[#0F2547] border border-white flex justify-between cursor-pointer' : 'p-2 rounded-xl bg-[#0B1325] flex justify-between cursor-pointer'}>
                      <span>{m.displayName} ({m.id})</span><span className="font-bold">{grpMembers.includes(m.id) ? '✓ เลือกแล้ว' : '+ เลือก'}</span>
                    </div>
                  ))}
                </div>
                <button type="submit" className="w-full py-2.5 rounded-xl bg-white text-[#050811] font-bold">สร้างกลุ่มแชต</button>
              </form>
            </Modal>
          )}

          {delTarget && (
            <Modal title="⚠️ ยืนยันการลบห้องแชต?" onClose={() => setDelTarget(null)} maxW="max-w-sm">
              <div className="space-y-4 text-center text-xs">
                <p>ยืนยันการลบห้อง <strong className="text-white">"{delTarget.name}"</strong> อย่างถาวรหรือไม่?</p>
                <div className="flex gap-2">
                  <button onClick={() => setDelTarget(null)} className="flex-1 py-2 rounded-xl bg-[#050811] border border-[#1E3A5F]">ยกเลิก</button>
                  <button onClick={async () => { if (delTarget.roomType === 'channel') await db.collection('bma_channels').doc(delTarget.id).delete(); else await db.collection('bma_groups').doc(delTarget.id).delete(); setActiveRoom({ type: 'channel', id: 'global-lobby' }); setDelTarget(null); }} className="flex-1 py-2 rounded-xl bg-red-600 font-bold">🗑️ ยืนยันการลบ</button>
                </div>
              </div>
            </Modal>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
