<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กิจกรรม 4 ฐาน: คุณคือเหี้ยอะไร?</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #030712;
            --card-bg: #0f172a;
            --accent: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            line-height: 1.6;
        }

        .container {
            background-color: var(--card-bg);
            max-width: 700px;
            width: 100%;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            padding: 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 { font-size: 24px; margin: 0 0 10px 0; color: #ffffff; }
        .subtitle { color: var(--text-muted); font-size: 14px; margin: 0; }

        /* Tracker Styles */
        .station-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .station-card {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s;
        }

        .station-card.completed {
            border-color: var(--success);
            background-color: rgba(16, 185, 129, 0.05);
        }

        .station-icon { font-size: 30px; margin-bottom: 10px; }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        .status-waiting { background: #334155; color: #cbd5e1; }
        .status-scanned { background: var(--warning); color: #fff; }
        .status-completed { background: var(--success); color: #fff; }

        .btn {
            display: block;
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-family: 'Prompt', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: #fff;
        }

        .btn-play { background-color: var(--accent); }
        .btn-play:hover { background-color: #2563eb; }
        .btn-play:disabled { background-color: #475569; color: #94a3b8; cursor: not-allowed; }

        .btn-sim {
            background-color: transparent;
            border: 1px dashed var(--text-muted);
            color: var(--text-muted);
            margin-top: 10px;
            font-size: 12px;
        }
        .btn-sim:hover { border-color: var(--text-main); color: var(--text-main); }

        .btn-unlock {
            background-color: var(--success);
            padding: 16px;
            font-size: 18px;
            border-radius: 12px;
            margin-top: 10px;
            display: none;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { transform: scale(1.02); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Modal & Mini-games */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid var(--border-color);
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content h2 { margin-top: 0; color: #fff; }
        .modal-content p { color: var(--text-muted); margin-bottom: 20px; font-size: 14px; }
        
        .game-area {
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            min-height: 200px;
            position: relative;
        }

        /* Game 1: Hidden Object */
        .h-obj { font-size: 24px; position: absolute; cursor: pointer; transition: transform 0.2s; user-select: none; }
        .h-obj:hover { transform: scale(1.2); }
        .found-count { font-weight: 600; color: var(--accent); }

        /* Game 2: Sorting */
        .food-items { display: flex; justify-content: center; gap: 15px; margin-top: 20px; flex-wrap: wrap; }
        .food-btn { font-size: 24px; padding: 10px 15px; background: #1e293b; border: 2px solid transparent; border-radius: 8px; cursor: pointer; }
        .food-btn:hover { background: #334155; border-color: var(--accent); }
        .lizard-mouth { font-size: 60px; margin: 10px 0; }

        /* Game 3: Quiz */
        .quiz-q { font-size: 18px; margin-bottom: 20px; font-weight: 600; color: #fff; }
        .quiz-btns { display: flex; gap: 10px; justify-content: center; }
        .btn-true { background: var(--success); }
        .btn-false { background: var(--danger); }

        /* Game 4: Fill word */
        .word-inputs { display: flex; justify-content: center; gap: 5px; margin: 20px 0; }
        .char-box { width: 40px; height: 40px; text-align: center; font-size: 20px; font-family: 'Prompt', sans-serif; background: #1e293b; border: 1px solid var(--accent); color: #fff; border-radius: 8px; }

        .toast { padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; display: none; }
        .toast.success { background: rgba(16, 185, 129, 0.2); color: var(--success); border: 1px solid var(--success); display: block; }
        .toast.error { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); display: block; }

    </style>
</head>
<body>

    <div class="container" id="tracker-container">
        <div class="header">
            <h1>ปลดล็อกแบบทดสอบบุคลิกภาพ</h1>
            <p class="subtitle">สแกน QR Code และเล่นมินิเกมให้ครบทั้ง 4 ฐาน</p>
        </div>

        <div class="station-grid" id="stations-grid"></div>

        <button class="btn btn-unlock" id="btn-unlock-quiz">🔓 เข้าสู่แบบทดสอบ</button>
        
        <div style="margin-top: 30px; padding: 15px; background: rgba(59, 130, 246, 0.1); border-radius: 8px; border: 1px solid var(--accent); font-size: 12px; color: var(--text-muted);">
            <strong>💡 Dev Mode:</strong> ใช้ปุ่มจำลองการสแกนด้านล่างเพื่อทดสอบระบบแต่ละฐาน
        </div>
    </div>

    <div class="modal" id="activity-modal">
        <div class="modal-content">
            <h2 id="modal-title">กิจกรรมฐาน</h2>
            <p id="modal-desc">คำอธิบาย</p>
            <div id="toast-msg" class="toast"></div>
            <div id="game-container" class="game-area"></div>
            <button class="btn btn-play" id="btn-finish-activity" style="display: none; background: var(--success);">✅ ผ่านด่าน! กลับไปหน้าหลัก</button>
        </div>
    </div>

    <!-- Quiz Container (Hidden initially) -->
    <div class="container" id="quiz-container" style="display:none;">
        <div class="header">
            <h1>แบบทดสอบบุคลิกภาพ: คุณคล้ายเหี้ยอะไร?</h1>
        </div>
        <div style="text-align:center; padding: 50px; color: var(--text-muted);">
            (ส่วนของแบบทดสอบ 12 ข้อที่ทำไว้ก่อนหน้าจะอยู่ที่นี่)<br><br>
            <button class="btn btn-play" onclick="location.reload()">เริ่มกิจกรรมใหม่ทั้งหมด</button>
        </div>
    </div>

    <script>
        let stationData = JSON.parse(localStorage.getItem('lizardFullStations')) || {
            1: { name: 'ฐาน 1: สัญชาตญาณนักสู้', icon: '🌿', scanned: false, played: false },
            2: { name: 'ฐาน 2: เทศบาลประจำเมือง', icon: '🗑️', scanned: false, played: false },
            3: { name: 'ฐาน 3: เกราะป้องกันตัว', icon: '🛡️', scanned: false, played: false },
            4: { name: 'ฐาน 4: สมดุลป่าคอนกรีต', icon: '🏙️', scanned: false, played: false }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const scanId = urlParams.get('scan');
        if(scanId && stationData[scanId]) {
            stationData[scanId].scanned = true;
            saveData();
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        let currentActiveStation = null;

        function saveData() { localStorage.setItem('lizardFullStations', JSON.stringify(stationData)); }

        function renderStations() {
            const grid = document.getElementById('stations-grid');
            grid.innerHTML = '';
            let allCompleted = true;

            for(let i = 1; i <= 4; i++) {
                const s = stationData[i];
                if (!s.played) allCompleted = false;

                let statusHtml = s.played ? '<span class="status-badge status-completed">✅ ผ่านด่านแล้ว</span>' 
                               : s.scanned ? '<span class="status-badge status-scanned">📱 พร้อมเล่น</span>' 
                               : '<span class="status-badge status-waiting">⏳ รอสแกน QR Code</span>';
                
                let btnHtml = s.played ? `<button class="btn btn-play" disabled>ทำกิจกรรมแล้ว</button>`
                            : s.scanned ? `<button class="btn btn-play" onclick="openActivity(${i})">เริ่มมินิเกม</button>`
                            : `<button class="btn btn-play" disabled>ต้องสแกนก่อน</button>
                               <button class="btn btn-sim" onclick="simulateScan(${i})">[Dev] จำลองสแกน QR ฐาน ${i}</button>`;

                grid.innerHTML += `
                    <div class="station-card ${s.played ? 'completed' : ''}">
                        <div class="station-icon">${s.icon}</div>
                        <h3 style="margin: 10px 0; font-size: 16px;">${s.name}</h3>
                        ${statusHtml} ${btnHtml}
                    </div>`;
            }
            document.getElementById('btn-unlock-quiz').style.display = allCompleted ? 'block' : 'none';
        }

        function simulateScan(id) { stationData[id].scanned = true; saveData(); renderStations(); }

        function showToast(msg, type) {
            const t = document.getElementById('toast-msg');
            t.className = `toast ${type}`;
            t.innerText = msg;
        }

        function winGame() {
            showToast("ยอดเยี่ยม! คุณผ่านการทดสอบด่านนี้แล้ว", "success");
            document.getElementById('btn-finish-activity').style.display = 'block';
        }

        function openActivity(id) {
            currentActiveStation = id;
            const s = stationData[id];
            document.getElementById('modal-title').innerText = s.name;
            document.getElementById('btn-finish-activity').style.display = 'none';
            document.getElementById('toast-msg').className = 'toast';
            
            const gameContainer = document.getElementById('game-container');
            gameContainer.innerHTML = '';

            if(id === 1) renderGame1(gameContainer);
            if(id === 2) renderGame2(gameContainer);
            if(id === 3) renderGame3(gameContainer);
            if(id === 4) renderGame4(gameContainer);

            document.getElementById('activity-modal').style.display = 'flex';
        }

        // --- Game 1: Hidden Object ---
        let foundCount = 0;
        function renderGame1(container) {
            foundCount = 0;
            document.getElementById('modal-desc').innerHTML = "วิถีชีวิต: ปรับตัวเก่ง ปีนต้นไม้ได้ ดำน้ำทน<br>ประโยชน์: รักษาสมดุลแหล่งน้ำในเมือง<br><br><b>ภารกิจ: หาตัวเงินตัวทองที่ซ่อนอยู่ในสวนสาธารณะให้ครบ 3 ตัว!</b>";
            container.innerHTML = `
                <div style="width:100%; height:100%; min-height:200px; background: #0f172a; position:relative; border-radius:8px; overflow:hidden;">
                    <span style="position:absolute; bottom:10px; left:10px; font-size:40px;">🌳</span>
                    <span style="position:absolute; bottom:10px; right:30px; font-size:30px;">🕳️</span>
                    <span style="position:absolute; top:20px; left:40px; font-size:35px;">☁️</span>
                    
                    <div class="h-obj" style="top:70%; left:20%;" onclick="findObj(this, 'เนียนอยู่หลังต้นไม้! น้องปีนต้นไม้เก่งช่วยคุมประชากรนกได้นะ')">🦎</div>
                    <div class="h-obj" style="top:25%; left:60%; opacity:0.6;" onclick="findObj(this, 'ซ่อนในพุ่มไม้! สีผิวช่วยพรางตัวในธรรมชาติได้ดีเยี่ยม')">🦎</div>
                    <div class="h-obj" style="top:75%; right:25%; transform: scaleX(-1);" onclick="findObj(this, 'มุดท่อระบายน้ำ! ทางสัญจรหลักของน้องในป่าคอนกรีต')">🦎</div>
                </div>
                <div style="margin-top:15px;">เจอแล้ว: <span class="found-count" id="g1-score">0</span> / 3</div>
            `;
        }
        window.findObj = function(el, msg) {
            if(el.style.display === 'none') return;
            el.style.display = 'none';
            foundCount++;
            document.getElementById('g1-score').innerText = foundCount;
            showToast(`✅ ${msg}`, "success");
            if(foundCount >= 3) winGame();
        }

        // --- Game 2: Feeding ---
        let feedCount = 0;
        function renderGame2(container) {
            feedCount = 0;
            document.getElementById('modal-desc').innerHTML = "วิถีชีวิต: กินซากสัตว์และสัตว์เล็ก กรดในกระเพาะย่อยแบคทีเรียได้ดีมาก<br>ประโยชน์: เป็น 'เทศบาล' คอยกำจัดซากเน่าและคุมประชากรหนู<br><br><b>ภารกิจ: เลือกของกินที่มีประโยชน์ให้น้อง (2 ชิ้น)</b>";
            container.innerHTML = `
                <div class="lizard-mouth" id="lizard-emoji">🦖</div>
                <div style="font-size:12px; color:var(--text-muted);">เลือกอาหารที่ถูกต้องเพื่อป้อน</div>
                <div class="food-items">
                    <button class="food-btn" onclick="feed(true, 'ซากปลา')">🐟</button>
                    <button class="food-btn" onclick="feed(true, 'หนู')">🐀</button>
                    <button class="food-btn" onclick="feed(false, 'ถุงพลาสติก')">🛍️</button>
                    <button class="food-btn" onclick="feed(false, 'ขวดแก้ว')">🍾</button>
                </div>
            `;
        }
        window.feed = function(isGood, name) {
            const lizard = document.getElementById('lizard-emoji');
            if(isGood) {
                feedCount++;
                lizard.innerText = "😋";
                showToast(`✅ ถูกต้อง! ${name} เป็นอาหารตามธรรมชาติ ช่วยกำจัดขยะชีวภาพให้เมือง`, "success");
                setTimeout(() => lizard.innerText = "🦖", 1000);
                if(feedCount >= 2) winGame();
            } else {
                lizard.innerText = "🤮";
                showToast(`❌ ผิด! ขยะของมนุษย์อย่าง ${name} ทำให้น้องตายได้ ช่วยกันทิ้งขยะให้เป็นที่นะ`, "error");
                setTimeout(() => lizard.innerText = "🦖", 1500);
            }
        }

        // --- Game 3: True/False ---
        let qIndex = 0;
        const qs = [
            { q: "ถ้าตัวเงินตัวทองแลบลิ้นใส่ แปลว่ามันเตรียมตัวจะพุ่งเข้ามากัดเรา?", a: false, exp: "การแลบลิ้นคือการ 'ดมกลิ่น' ค้นหาทิศทางหรืออาหาร ไม่ใช่การขู่กัด" },
            { q: "พฤติกรรมการพองคอและส่งเสียงขู่ฟ่อๆ แปลว่ามันบอกให้เราถอยไป?", a: true, exp: "ถูกต้อง! พวกมันขี้อายและกลัวคน เสียงขู่คือการสร้างเกราะป้องกันเพื่อบอกให้เราอยู่ห่างๆ" },
            { q: "เมื่อเจอตัวเงินตัวทองในเขตชุมชน วิธีที่ดีที่สุดคือตีให้ตาย?", a: false, exp: "ไม่ควรตี! แค่อยู่ห่างๆ ปล่อยให้มันเดินไปเอง หรือแจ้งกู้ภัยหากเข้าบ้าน พวกมันมีประโยชน์ต่อระบบนิเวศเมือง" }
        ];
        function renderGame3(container) {
            qIndex = 0;
            document.getElementById('modal-desc').innerHTML = "วิถีชีวิต: ขี้อาย รักสงบ มักจะหนีมากกว่าสู้<br>ประโยชน์: เข้าใจพฤติกรรมเพื่ออยู่ร่วมกันอย่างปลอดภัย ลดการทำร้ายสัตว์<br><br><b>ภารกิจ: ตอบคำถามถูก-ผิด ให้ผ่านทั้ง 3 ข้อ</b>";
            showQuestion3(container);
        }
        function showQuestion3(container) {
            if(qIndex >= qs.length) {
                container.innerHTML = `<div class="quiz-q">🎉 คุณมีความเข้าใจที่ถูกต้องเกี่ยวกับตัวเงินตัวทอง!</div>`;
                winGame();
                return;
            }
            container.innerHTML = `
                <div style="font-size:14px; margin-bottom:10px; color:var(--text-muted);">ข้อ ${qIndex+1} / 3</div>
                <div class="quiz-q">${qs[qIndex].q}</div>
                <div class="quiz-btns">
                    <button class="btn btn-play btn-true" onclick="checkQ3(true)">✅ ใช่</button>
                    <button class="btn btn-play btn-false" onclick="checkQ3(false)">❌ ไม่ใช่</button>
                </div>
            `;
        }
        window.checkQ3 = function(ans) {
            if(ans === qs[qIndex].a) {
                showToast(`✅ ถูกต้อง! ${qs[qIndex].exp}`, "success");
                qIndex++;
                setTimeout(() => showQuestion3(document.getElementById('game-container')), 1500);
            } else {
                showToast(`❌ ยังไม่ถูกนะ ลองคิดดูใหม่!`, "error");
            }
        }

        // --- Game 4: Fill in the word ---
        function renderGame4(container) {
            document.getElementById('modal-desc').innerHTML = "บทสรุป: ถ้าไม่มีพวกเขา กรุงเทพฯ และเมืองใหญ่จะเต็มไปด้วยซากเน่าเหม็นและหนูท่อแพร่กระจายโรค<br><br><b>ภารกิจ: เติมคำในช่องว่างให้ถูกต้อง</b>";
            container.innerHTML = `
                <div class="quiz-q">ตัวเงินตัวทองเปรียบเสมือนพนักงานอะไรในระบบนิเวศเมือง? (ท_ศ_า_)</div>
                <div class="word-inputs">
                    <input type="text" class="char-box" value="เ" readonly>
                    <input type="text" class="char-box" id="c1" maxlength="1">
                    <input type="text" class="char-box" id="c2" maxlength="1">
                    <input type="text" class="char-box" value="บ" readonly>
                    <input type="text" class="char-box" value="า" readonly>
                    <input type="text" class="char-box" id="c3" maxlength="1">
                </div>
                <button class="btn btn-play" onclick="checkWord()">ตรวจคำตอบ</button>
            `;
            
            // Auto focus
            const inputs = ['c1', 'c2', 'c3'];
            inputs.forEach((id, i) => {
                document.getElementById(id).addEventListener('input', function() {
                    if(this.value.length === 1 && i < inputs.length - 1) document.getElementById(inputs[i+1]).focus();
                });
            });
        }
        window.checkWord = function() {
            const w = document.getElementById('c1').value + document.getElementById('c2').value + document.getElementById('c3').value;
            if(w === "ทศล") {
                showToast("✅ ถูกต้อง! พวกมันคือ 'เทศบาล' ป่าคอนกรีตตัวจริง", "success");
                winGame();
            } else {
                showToast("❌ ยังไม่ถูกนะ ลองดูคำใบ้ดีๆ (ท_ศ_า_)", "error");
            }
        }

        // --- Modal Actions ---
        document.getElementById('btn-finish-activity').addEventListener('click', () => {
            if(currentActiveStation) {
                stationData[currentActiveStation].played = true;
                saveData();
                document.getElementById('activity-modal').style.display = 'none';
                renderStations();
            }
        });

        document.getElementById('btn-unlock-quiz').addEventListener('click', () => {
            document.getElementById('tracker-container').style.display = 'none';
            document.getElementById('quiz-container').style.display = 'block';
        });

        // Init
        renderStations();
    </script>
</body>
</html>
