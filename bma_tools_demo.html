<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BMA Tools Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: sans-serif; background: #050811; color: #fff; }
    .card { background: #0B1325; border: 1px solid #1E3A5F; border-radius: 1rem; }
    .btn-b { background: #0F2547; color: #fff; border: 1px solid rgba(255,255,255,0.2); font-weight: 600; border-radius: 0.75rem; padding: 0.5rem 1rem; cursor: pointer; transition: all 0.2s; }
    .btn-b:hover { background: #1E3A5F; }
    .inp { background: #050811; border: 1px solid #1E3A5F; border-radius: 0.75rem; padding: 0.5rem; color: #fff; outline: none; width: 100%; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { useState, useEffect, useRef } = React;

  // Tool 1: BPM Tapper
  const BPMTapper = () => {
    const [bpm, setBpm] = useState(0);
    const [taps, setTaps] = useState([]);
    
    const handleTap = () => {
      const now = Date.now();
      const newTaps = [...taps, now].slice(-5); // Keep last 5 taps
      setTaps(newTaps);
      
      if (newTaps.length > 1) {
        const diffs = [];
        for (let i = 1; i < newTaps.length; i++) {
          diffs.push(newTaps[i] - newTaps[i-1]);
        }
        const avg = diffs.reduce((a, b) => a + b, 0) / diffs.length;
        setBpm(Math.round(60000 / avg));
      }
    };

    const reset = () => { setTaps([]); setBpm(0); };

    return (
      <div className="flex flex-col items-center gap-6 py-10">
        <div className="text-6xl font-bold text-sky-400">{bpm} <span className="text-xl text-slate-400">BPM</span></div>
        <button onClick={handleTap} className="w-48 h-48 rounded-full bg-[#1E3A5F] border-4 border-sky-500 shadow-[0_0_20px_rgba(14,165,233,0.5)] active:scale-95 transition-transform text-xl font-bold">TAP HERE</button>
        <button onClick={reset} className="text-sm text-red-400 mt-4">Reset</button>
      </div>
    );
  };

  // Tool 2: Resistor
  const ResistorCalc = () => {
    const colors = [
      { n: 'Black', v: 0, m: 1, c: '#000', t: '#fff' }, { n: 'Brown', v: 1, m: 10, c: '#8B4513', t: '#fff' },
      { n: 'Red', v: 2, m: 100, c: '#FF0000', t: '#fff' }, { n: 'Orange', v: 3, m: 1000, c: '#FFA500', t: '#000' },
      { n: 'Yellow', v: 4, m: 10000, c: '#FFFF00', t: '#000' }, { n: 'Green', v: 5, m: 100000, c: '#008000', t: '#fff' },
      { n: 'Blue', v: 6, m: 1000000, c: '#0000FF', t: '#fff' }, { n: 'Violet', v: 7, m: 10000000, c: '#EE82EE', t: '#000' },
      { n: 'Gray', v: 8, m: 100000000, c: '#808080', t: '#fff' }, { n: 'White', v: 9, m: 1000000000, c: '#FFFFFF', t: '#000' }
    ];
    const [b1, setB1] = useState(colors[1]);
    const [b2, setB2] = useState(colors[0]);
    const [mult, setMult] = useState(colors[2]);

    const formatVal = (v) => {
      if(v >= 1000000) return (v/1000000) + ' MΩ';
      if(v >= 1000) return (v/1000) + ' kΩ';
      return v + ' Ω';
    };

    const val = ((b1.v * 10) + b2.v) * mult.m;

    return (
      <div className="flex flex-col items-center gap-6 p-4">
        <div className="text-3xl font-bold text-amber-400 bg-[#0F2547] p-6 rounded-xl border border-[#1E3A5F]">{formatVal(val)}</div>
        <div className="flex gap-4">
          <div className="flex flex-col gap-1 w-24">
            <span className="text-xs text-center text-slate-400">Band 1</span>
            {colors.map(c => <button key={'b1'+c.n} onClick={()=>setB1(c)} style={{background: c.c, color: c.t}} className={`py-1 text-xs border ${b1.n===c.n?'border-white scale-110 z-10':'border-transparent'}`}>{c.n}</button>)}
          </div>
          <div className="flex flex-col gap-1 w-24">
            <span className="text-xs text-center text-slate-400">Band 2</span>
            {colors.map(c => <button key={'b2'+c.n} onClick={()=>setB2(c)} style={{background: c.c, color: c.t}} className={`py-1 text-xs border ${b2.n===c.n?'border-white scale-110 z-10':'border-transparent'}`}>{c.n}</button>)}
          </div>
          <div className="flex flex-col gap-1 w-24">
            <span className="text-xs text-center text-slate-400">Multiplier</span>
            {colors.map(c => <button key={'m'+c.n} onClick={()=>setMult(c)} style={{background: c.c, color: c.t}} className={`py-1 text-xs border ${mult.n===c.n?'border-white scale-110 z-10':'border-transparent'}`}>{c.n}</button>)}
          </div>
        </div>
      </div>
    );
  };

  // Tool 3: Lunar Splitter
  const LunarSplitter = () => {
    const [subtotal, setSubtotal] = useState('');
    const [vat, setVat] = useState(7);
    const [sc, setSc] = useState(10);
    const [people, setPeople] = useState(1);

    const st = parseFloat(subtotal) || 0;
    const serv = st * (sc/100);
    const v = (st + serv) * (vat/100);
    const total = st + serv + v;
    const perPerson = total / Math.max(1, people);

    return (
      <div className="max-w-md mx-auto space-y-4">
        <div><label className="text-xs text-slate-400">ค่าอาหารรวม (ก่อน VAT/Service)</label><input type="number" value={subtotal} onChange={e=>setSubtotal(e.target.value)} className="inp text-xl" placeholder="0.00" /></div>
        <div className="flex gap-4">
          <div className="flex-1"><label className="text-xs text-slate-400">Service Charge (%)</label><input type="number" value={sc} onChange={e=>setSc(e.target.value)} className="inp" /></div>
          <div className="flex-1"><label className="text-xs text-slate-400">VAT (%)</label><input type="number" value={vat} onChange={e=>setVat(e.target.value)} className="inp" /></div>
        </div>
        <div><label className="text-xs text-slate-400">จำนวนคนหาร</label><input type="number" value={people} onChange={e=>setPeople(e.target.value)} className="inp" min="1" /></div>
        <div className="bg-[#0F2547] p-4 rounded-xl border border-[#1E3A5F] space-y-2 mt-4">
          <div className="flex justify-between text-sm"><span>ยอดรวมทั้งหมด:</span> <span className="font-bold">{total.toFixed(2)} บาท</span></div>
          <div className="flex justify-between text-lg text-emerald-400"><span>หารคนละ:</span> <span className="font-bold">{perPerson.toFixed(2)} บาท</span></div>
        </div>
      </div>
    );
  };

  // Tool 4: Randomizer
  const Randomizer = () => {
    const [names, setNames] = useState("สมาชิก A\nสมาชิก B\nสมาชิก C\nสมาชิก D");
    const [result, setResult] = useState(null);
    const [spinning, setSpinning] = useState(false);

    const handleSpin = () => {
      const list = names.split('\n').map(n=>n.trim()).filter(Boolean);
      if(list.length === 0) return;
      setSpinning(true); setResult(null);
      let count = 0;
      const interval = setInterval(() => {
        setResult(list[Math.floor(Math.random() * list.length)]);
        count++;
        if(count > 15) {
          clearInterval(interval);
          setSpinning(false);
          setResult(list[Math.floor(Math.random() * list.length)]);
        }
      }, 100);
    };

    return (
      <div className="max-w-md mx-auto space-y-4">
        <div><label className="text-xs text-slate-400">ใส่รายชื่อ (1 ชื่อต่อ 1 บรรทัด)</label><textarea rows="5" value={names} onChange={e=>setNames(e.target.value)} className="inp resize-none"></textarea></div>
        <button onClick={handleSpin} disabled={spinning} className="w-full btn-b py-3 text-lg bg-sky-600 hover:bg-sky-500 border-sky-400">🎲 สุ่มผู้โชคดี</button>
        {result && (
           <div className={`mt-6 p-6 text-center rounded-xl border border-amber-500 ${spinning ? 'bg-[#0F2547]' : 'bg-amber-500/20 animate-bounce'}`}>
             <div className="text-xs text-slate-300 mb-2">ผู้ที่ถูกเลือกคือ:</div>
             <div className="text-3xl font-bold text-amber-400">{result}</div>
           </div>
        )}
      </div>
    );
  };

  const App = () => {
    const [activeTool, setActiveTool] = useState(null);

    const TOOLS = [
      { id: 'bpm', name: 'BPM Tapper', icon: '⏱️', desc: 'เคาะเพื่อหาความเร็วเพลง (BPM)' },
      { id: 'resistor', name: 'Resistor Calc', icon: '🔌', desc: 'คำนวณค่าตัวต้านทานจากแถบสี' },
      { id: 'splitter', name: 'Lunar Splitter', icon: '💸', desc: 'หารบิลคำนวณ VAT/Service Charge' },
      { id: 'randomizer', name: 'Randomizer', icon: '🎲', desc: 'สุ่มรายชื่อสมาชิกหรือหัวข้อ' },
    ];

    const renderTool = () => {
      switch(activeTool) {
        case 'bpm': return <BPMTapper />;
        case 'resistor': return <ResistorCalc />;
        case 'splitter': return <LunarSplitter />;
        case 'randomizer': return <Randomizer />;
        default: return null;
      }
    };

    return (
      <div className="min-h-screen flex flex-col items-center py-10 px-4">
        <div className="w-full max-w-4xl text-center mb-8">
          <h1 className="text-3xl font-bold text-sky-400 mb-2">BMA Community Tools</h1>
          <p className="text-slate-400 text-sm">เครื่องมืออำนวยความสะดวกสำหรับสมาชิก The Blue Moon Association</p>
        </div>

        {activeTool === null ? (
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full max-w-3xl">
            {TOOLS.map(t => (
              <div key={t.id} onClick={() => setActiveTool(t.id)} className="card p-6 cursor-pointer hover:border-sky-400 transition-colors flex items-start gap-4">
                <div className="text-4xl">{t.icon}</div>
                <div>
                  <h3 className="font-bold text-lg text-white">{t.name}</h3>
                  <p className="text-sm text-slate-400 mt-1">{t.desc}</p>
                </div>
              </div>
            ))}
          </div>
        ) : (
          <div className="w-full max-w-2xl card p-6">
            <div className="flex justify-between items-center mb-6 border-b border-[#1E3A5F] pb-4">
               <h2 className="text-xl font-bold flex items-center gap-2">
                 <span>{TOOLS.find(t=>t.id===activeTool)?.icon}</span>
                 {TOOLS.find(t=>t.id===activeTool)?.name}
               </h2>
               <button onClick={() => setActiveTool(null)} className="btn-b text-xs py-1.5">← กลับหน้ารวมเครื่องมือ</button>
            </div>
            {renderTool()}
          </div>
        )}
      </div>
    );
  };

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>
</body>
</html>
