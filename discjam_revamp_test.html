<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BMA Dual Deck Auto-DJ Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #050811; color: #fff; font-family: sans-serif; }
    .card { background-color: #0B1325; border: 1px solid #1E3A5F; border-radius: 1rem; }
    .fader-track { -webkit-appearance: none; appearance: none; height: 8px; background: #1E3A5F; border-radius: 4px; outline: none; box-shadow: inset 0 0 5px rgba(0,0,0,0.5); }
    .fader-track::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 30px; height: 50px; background: #38BDF8; border-radius: 4px; cursor: ew-resize; border: 2px solid #fff; box-shadow: 0 0 15px rgba(56,189,248,0.5); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [mode, setMode] = useState('auto'); // 'auto' หรือ 'manual'
      const [queue, setQueue] = useState([
        { id: 'jfKfPfyJRdk', title: 'lofi hip hop radio - beats to relax/study to' },
        { id: '4xDzrIxC4JI', title: 'chill lofi beats to code/relax to' },
        { id: '7NOSDKb0HlU', title: 'dark academia relaxing music' }
      ]);
      const [crossfade, setCrossfade] = useState(0); // 0 = แผ่น A ดังสุด, 100 = แผ่น B ดังสุด
      const [activeDeck, setActiveDeck] = useState('A'); // ใช้ในโหมด Auto เพื่อรู้ว่าใครคือแผ่นหลัก
      const [fadeDuration, setFadeDuration] = useState(5); // ตั้งค่าเวลา Fade (วินาที)
      
      const [deckA, setDeckA] = useState({ id: 'jfKfPfyJRdk', title: 'lofi hip hop radio' });
      const [deckB, setDeckB] = useState({ id: null, title: 'ไม่มีเพลง' });
      
      const ytA = useRef(null);
      const ytB = useRef(null);
      const isFading = useRef(false);

      // เริ่มต้น YouTube IFrame 2 ตัว
      useEffect(() => {
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.body.appendChild(tag);
        
        window.onYouTubeIframeAPIReady = () => {
          ytA.current = new window.YT.Player('yt-player-a', { height: '0', width: '0', videoId: deckA.id, playerVars: { autoplay: 1 } });
          ytB.current = new window.YT.Player('yt-player-b', { height: '0', width: '0', videoId: '', playerVars: { autoplay: 0 } });
        };
      }, []);

      // จัดการระดับเสียงแผ่น A และ B ตามค่า Crossfader
      useEffect(() => {
         if (!ytA.current?.setVolume || !ytB.current?.setVolume) return;
         // สูตรคำนวณ Crossfader: กึ่งกลาง (50) เสียงดัง 100% ทั้งคู่
         const volA = crossfade < 50 ? 100 : 100 - ((crossfade - 50) * 2);
         const volB = crossfade > 50 ? 100 : crossfade * 2;
         ytA.current.setVolume(Math.max(0, volA));
         ytB.current.setVolume(Math.max(0, volB));
      }, [crossfade]);

      // 🤖 ระบบ AUTO-DJ (ตรวจสอบเวลาและเฟดอัตโนมัติ)
      useEffect(() => {
         if (mode !== 'auto') return;
         const timer = setInterval(() => {
             if (isFading.current) return; // ถ้ากำลังเฟดอยู่ ห้ามรบกวน
             
             const mainPlayer = activeDeck === 'A' ? ytA.current : ytB.current;
             const standbyPlayer = activeDeck === 'A' ? ytB.current : ytA.current;
             
             if (!mainPlayer?.getCurrentTime) return;
             
             const currentTime = mainPlayer.getCurrentTime();
             const duration = mainPlayer.getDuration();
             
             // ถ้าเพลงใกล้จบแล้ว (เหลือเวลา <= ค่า Fade ที่ตั้งไว้) และมีคิวรออยู่
             if (duration > 0 && (duration - currentTime <= fadeDuration) && queue.length > 0) {
                 isFading.current = true;
                 const nextSong = queue[0];
                 
                 // 1. นำเพลงจากคิวไปโหลดในแผ่นที่ว่าง
                 if (activeDeck === 'A') setDeckB(nextSong);
                 else setDeckA(nextSong);
                 
                 standbyPlayer.loadVideoById(nextSong.id);
                 standbyPlayer.playVideo();
                 
                 // 2. เคลื่อน Crossfader อัตโนมัติ แบบเนียนๆ
                 const steps = 50; // ความถี่ในการขยับเฟดเดอร์
                 const intervalMs = (fadeDuration * 1000) / steps;
                 let currentStep = 0;
                 
                 const fadeInt = setInterval(() => {
                     currentStep++;
                     const progress = currentStep / steps;
                     // ถ้าย้ายจาก A ไป B ค่าคือ 0 -> 100, ถ้า B ไป A ค่าคือ 100 -> 0
                     const newValue = activeDeck === 'A' ? (progress * 100) : 100 - (progress * 100);
                     setCrossfade(newValue);
                     
                     if (currentStep >= steps) {
                         clearInterval(fadeInt);
                         mainPlayer.stopVideo(); // หยุดแผ่นเดิม
                         setQueue(q => q.slice(1)); // ลบคิวออก 1 เพลง
                         setActiveDeck(activeDeck === 'A' ? 'B' : 'A'); // สลับป้ายแผ่นหลัก
                         isFading.current = false;
                     }
                 }, intervalMs);
             }
         }, 1000);
         
         return () => clearInterval(timer);
      }, [mode, activeDeck, queue, fadeDuration, crossfade]);

      // --- ฟังก์ชันช่วยเหลือสำหรับโหมด Manual ---
      const loadToDeck = (deckType, songId, title) => {
         const p = deckType === 'A' ? ytA.current : ytB.current;
         if (deckType === 'A') setDeckA({ id: songId, title }); else setDeckB({ id: songId, title });
         p.loadVideoById(songId);
         p.playVideo();
      };

      return (
        <div className="max-w-4xl mx-auto py-10 px-4">
          <div className="text-center mb-8">
             <h1 className="text-3xl font-bold text-sky-400">BMA Dual Deck Simulator</h1>
             <p className="text-slate-400 mt-2">ทดสอบระบบ Auto-DJ Crossfade + Manual Control</p>
          </div>

          <div className="flex justify-center gap-4 mb-8">
             <button onClick={() => setMode('auto')} className={`px-6 py-2 rounded-full font-bold transition-all ${mode === 'auto' ? 'bg-emerald-500 text-[#050811] shadow-[0_0_15px_rgba(16,185,129,0.5)]' : 'bg-[#0B1325] text-slate-400 border border-[#1E3A5F]'}`}>🤖 โหมด Auto DJ</button>
             <button onClick={() => setMode('manual')} className={`px-6 py-2 rounded-full font-bold transition-all ${mode === 'manual' ? 'bg-fuchsia-500 text-[#050811] shadow-[0_0_15px_rgba(217,70,239,0.5)]' : 'bg-[#0B1325] text-slate-400 border border-[#1E3A5F]'}`}>🎧 โหมด Manual Pro</button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
             {/* ซ้าย: เครื่อง Mixer */}
             <div className="card p-6 bg-[#0a0210] border-fuchsia-900/50 shadow-2xl space-y-6">
                <div className="flex gap-4">
                   <div className={`flex-1 p-4 rounded-xl border-2 flex flex-col items-center text-center ${crossfade < 50 ? 'border-sky-500 bg-sky-900/20' : 'border-slate-800 bg-black'}`}>
                      <div className="text-sky-400 font-bold mb-2">DECK A</div>
                      <div className={`text-4xl mb-4 ${crossfade < 50 ? 'animate-spin' : ''}`}>💿</div>
                      <div className="text-xs text-slate-300 font-bold h-8 line-clamp-2">{deckA.title}</div>
                      {mode === 'manual' && <button onClick={() => ytA.current?.playVideo()} className="mt-4 bg-sky-600 px-4 py-1 rounded text-xs">Play A</button>}
                   </div>
                   
                   <div className={`flex-1 p-4 rounded-xl border-2 flex flex-col items-center text-center ${crossfade > 50 ? 'border-amber-500 bg-amber-900/20' : 'border-slate-800 bg-black'}`}>
                      <div className="text-amber-400 font-bold mb-2">DECK B</div>
                      <div className={`text-4xl mb-4 ${crossfade > 50 ? 'animate-spin' : ''}`}>💿</div>
                      <div className="text-xs text-slate-300 font-bold h-8 line-clamp-2">{deckB.title}</div>
                      {mode === 'manual' && <button onClick={() => ytB.current?.playVideo()} className="mt-4 bg-amber-600 px-4 py-1 rounded text-xs">Play B</button>}
                   </div>
                </div>

                <div className="bg-[#110419] p-4 rounded-xl border border-slate-700">
                   <div className="flex justify-between text-xs text-slate-400 font-bold mb-2">
                      <span>Deck A</span>
                      {mode === 'auto' ? <span className="text-emerald-400">🤖 Auto Crossfade Control</span> : <span className="text-fuchsia-400">🎧 Manual Fade</span>}
                      <span>Deck B</span>
                   </div>
                   <input 
                      type="range" min="0" max="100" 
                      value={crossfade} 
                      onChange={(e) => { if(mode === 'manual') setCrossfade(parseInt(e.target.value)); }} 
                      className={`w-full fader-track ${mode === 'auto' ? 'opacity-50 cursor-not-allowed' : ''}`}
                      disabled={mode === 'auto'}
                   />
                </div>

                {mode === 'auto' && (
                   <div className="text-xs flex items-center justify-between bg-slate-900 p-3 rounded border border-slate-700">
                      <span className="text-slate-300">ความยาว Fade สลับแผ่น (วินาที)</span>
                      <input type="number" min="1" max="15" value={fadeDuration} onChange={e => setFadeDuration(e.target.value)} className="bg-black border border-slate-600 rounded w-16 text-center text-white outline-none" />
                   </div>
                )}
             </div>

             {/* ขวา: ระบบคิว / Track Pool */}
             <div className="card p-4 space-y-3">
                <h3 className="font-bold text-lg text-white border-b border-[#1E3A5F] pb-2">
                   {mode === 'auto' ? 'คิวเพลง (Auto Queue)' : 'กล่องเก็บเพลง (Track Pool)'}
                </h3>
                <div className="space-y-2 max-h-[300px] overflow-y-auto">
                   {queue.length === 0 && <div className="text-center text-slate-500 py-6 text-sm">ไม่มีเพลงในระบบ</div>}
                   {queue.map((q, idx) => (
                      <div key={idx} className="flex justify-between items-center bg-[#050811] p-3 rounded border border-[#1E3A5F]">
                         <div className="text-xs truncate mr-2">{q.title}</div>
                         {mode === 'manual' ? (
                            <div className="flex gap-1 shrink-0">
                               <button onClick={() => loadToDeck('A', q.id, q.title)} className="bg-sky-900/50 hover:bg-sky-600 text-sky-200 px-2 py-1 text-[10px] rounded border border-sky-700 transition">เข้า A</button>
                               <button onClick={() => loadToDeck('B', q.id, q.title)} className="bg-amber-900/50 hover:bg-amber-600 text-amber-200 px-2 py-1 text-[10px] rounded border border-amber-700 transition">เข้า B</button>
                            </div>
                         ) : (
                            idx === 0 && <span className="text-[10px] bg-emerald-900/50 text-emerald-400 px-2 py-0.5 rounded animate-pulse shrink-0">คิวถัดไป</span>
                         )}
                      </div>
                   ))}
                </div>
             </div>
          </div>

          <div className="hidden"><div id="yt-player-a"></div><div id="yt-player-b"></div></div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
